let draggedItem=null,selectedCard=null,pointerDrag=null,longPressTimer=null;

function getCard(source,index){
  if(!UT) return null;
  if(source==='pitch')return UT.squad[index];
  if(source==='bench')return UT.bench[index];
  if(source==='collection')return UT.cards.find(c=>c.id===index);
  return null;
}
function performMove(srcType,srcIndex,dstType,dstIndex){
  if(!UT || (srcType===dstType&&srcIndex===dstIndex))return false;
  if(dstType==='collection'){if(srcType==='pitch')UT.squad[srcIndex]=null;else if(srcType==='bench')UT.bench[srcIndex]=null;else return false;saveUT();screenUTSquad();return true}
  const srcCard=getCard(srcType,srcIndex);if(!srcCard)return false;
  if(dstType==='pitch'){const dc=UT.squad[dstIndex];UT.squad[dstIndex]=srcCard;if(srcType==='pitch')UT.squad[srcIndex]=dc;else if(srcType==='bench')UT.bench[srcIndex]=dc}
  else if(dstType==='bench'){const dc=UT.bench[dstIndex];UT.bench[dstIndex]=srcCard;if(srcType==='pitch')UT.squad[srcIndex]=dc;else if(srcType==='bench')UT.bench[srcIndex]=dc}
  saveUT();screenUTSquad();return true;
}
window.removeFromSquad=(source,index,event)=>{if(event)event.stopPropagation();if(!UT)return;if(source==='pitch')UT.squad[index]=null;else if(source==='bench')UT.bench[index]=null;saveUT();screenUTSquad()};

window.dragStart=(e,source,index)=>{const c=getCard(source,index);if(!c){e.preventDefault();return}draggedItem={source,index,card:c};try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x')}catch(err){}setTimeout(()=>{if(e.target&&e.target.classList)e.target.classList.add('dragging')},0)};
window.dragEnd=e=>{if(e.target&&e.target.classList)e.target.classList.remove('dragging')};
window.dragOver=e=>{e.preventDefault();if(e.currentTarget)e.currentTarget.classList.add('drag-active')};
window.dragLeave=e=>{if(e.currentTarget)e.currentTarget.classList.remove('drag-active')};
window.drop=(e,targetType,targetIndex)=>{e.preventDefault();if(e.currentTarget)e.currentTarget.classList.remove('drag-active');if(!draggedItem)return;performMove(draggedItem.source,draggedItem.index,targetType,targetIndex);draggedItem=null};
window.cardPointerDown=(e,source,index)=>{if(e.button!==undefined&&e.button!==0&&e.pointerType==='mouse')return;const c=getCard(source,index);if(!c)return;pointerDrag={source,index,cardId:c.id,startX:e.clientX,startY:e.clientY,element:e.currentTarget,dragging:false};longPressTimer=setTimeout(()=>{if(pointerDrag&&!pointerDrag.dragging){window.showPlayerStats(pointerDrag.cardId);pointerDrag=null}},600)};
window.cardPointerMove=e=>{if(!pointerDrag)return;if(Math.hypot(e.clientX-pointerDrag.startX,e.clientY-pointerDrag.startY)>8){clearTimeout(longPressTimer);pointerDrag.dragging=true;if(pointerDrag.element)pointerDrag.element.style.opacity='0.4';document.querySelectorAll('.spot,.bench-spot').forEach(el=>el.classList.add('drag-active'))}};
window.cardPointerUp=e=>{clearTimeout(longPressTimer);if(!pointerDrag)return;const pd=pointerDrag;pointerDrag=null;if(pd.element)pd.element.style.opacity='';document.querySelectorAll('.drag-active').forEach(el=>el.classList.remove('drag-active'));if(pd.dragging){const elem=document.elementFromPoint(e.clientX,e.clientY);const target=elem&&elem.closest('[data-drop-type]');if(target)performMove(pd.source,pd.index,target.dataset.dropType,parseInt(target.dataset.dropIndex))}else{handleSelectCard(pd.source,pd.index)}};
window.handleSelectCard=function(source,index){const c=getCard(source,index);if(!c)return;if(selectedCard&&selectedCard.source===source&&selectedCard.index===index){selectedCard=null}else if(selectedCard){performMove(selectedCard.source,selectedCard.index,source,index);selectedCard=null;return}else{selectedCard={source,index,cardId:c.id}}screenUTSquad()};

// ═══ DRAG & DROP v2 (un solo sistema: mouse + táctil) ═══
(function(){
  let pd=null,ghost=null,timer=null,hover=null;
  const clear=()=>{clearTimeout(timer);if(ghost){ghost.remove();ghost=null}if(pd&&pd.element)pd.element.style.opacity='';document.querySelectorAll('.drag-active').forEach(el=>el.classList.remove('drag-active'));document.body.classList.remove('is-dragging');pd=null;hover=null;draggedItem=null};
  const dropAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-drop-type]'):null};
  window.dragStart=e=>{e.preventDefault()};
  window.dragEnd=window.dragOver=window.dragLeave=()=>{};
  window.drop=e=>{e.preventDefault()};
  window.cardPointerMove=()=>{};window.cardPointerUp=()=>{};
  window.cardPointerDown=(e,source,index)=>{
    if(e.target.closest&&e.target.closest('.spot-remove'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const c=getCard(source,index);if(!c)return;clear();
    pd={source,index,cardId:c.id,sx:e.clientX,sy:e.clientY,element:e.currentTarget,dragging:false,pid:e.pointerId};
    timer=setTimeout(()=>{if(pd&&!pd.dragging){const id=pd.cardId;clear();window.showPlayerStats(id)}},600);
  };
  document.addEventListener('pointermove',e=>{
    if(!pd||e.pointerId!==pd.pid)return;
    if(!pd.dragging){
      if(Math.hypot(e.clientX-pd.sx,e.clientY-pd.sy)<8)return;
      clearTimeout(timer);pd.dragging=true;const r=pd.element.getBoundingClientRect();
      ghost=pd.element.cloneNode(true);ghost.removeAttribute('id');ghost.classList.add('drag-ghost');ghost.classList.remove('selected','dragging','drag-active');
      ghost.querySelectorAll('.spot-remove,.chem-dot').forEach(n=>n.remove());
      ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.opacity='';
      document.body.appendChild(ghost);pd.element.style.opacity='.3';document.body.classList.add('is-dragging');
    }
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';ghost.style.transform='translate(-50%,-50%) scale(1.1)';
    let t=dropAt(e.clientX,e.clientY);if(t===pd.element)t=null;
    if(t!==hover){if(hover)hover.classList.remove('drag-active');if(t)t.classList.add('drag-active');hover=t}
  });
  document.addEventListener('pointerup',e=>{
    if(!pd||e.pointerId!==pd.pid)return;
    const d=pd,wasDrag=d.dragging;const t=wasDrag?dropAt(e.clientX,e.clientY):null;clear();
    if(wasDrag){if(t&&t!==d.element)performMove(d.source,d.index,t.dataset.dropType,t.dataset.dropType==='collection'?0:parseInt(t.dataset.dropIndex))}
    else handleSelectCard(d.source,d.index);
  });
  document.addEventListener('pointercancel',e=>{if(pd&&e.pointerId===pd.pid)clear()});
  window.addEventListener('blur',clear);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pd)clear()});
})();

function calculateChemistry(squad,formName){
  if(!squad) return {playerChems:{},teamChem:0};
  const form=FORMATIONS[formName]||FORMATIONS['4-3-3'];let total=0;const pcs={};
  squad.forEach((p,i)=>{
    if(!p)return;let chem=0;
    if(p.nation==='Icon'){pcs[p.id]={total:10};total+=10;return}
    const sr=form.slots[i].role;
    if(p.pos.split('/').includes(sr))chem+=5;else{const pz=p.pos.split('/').map(getZone);if(pz.includes(getZone(sr)))chem+=3;else chem+=1}
    squad.forEach(o=>{if(o&&o.id!==p.id){if(o.nation===p.nation)chem+=1;if(o.league===p.league)chem+=1}});
    chem=Math.min(10,chem);pcs[p.id]={total:chem};total+=chem;
  });
  return{playerChems:pcs,teamChem:squad.filter(p=>p).length>0?Math.round(total/squad.filter(p=>p).length*10):0};
}

// ═══ TIENDA DE SOBRES ═══
const PACK_TIERS=[
 {id:'silver',name:'Plata',cost:2000,n:3,stars:1,icon:'⚪',a:'#e6ebee',b:'#7f8c93',ink:'#1c2427',w:[['silver',55],['gold',45]],gtxt:'Cartas de plata y oro',g:null},
 {id:'gold',name:'Oro',cost:5000,n:3,stars:2,icon:'🥇',a:'#f7e08a',b:'#b88a1c',ink:'#2d1f00',w:[['gold',100]],gtxt:'Solo cartas de oro',g:null},
 {id:'season',name:'Temporada',cost:12000,n:4,stars:3,icon:'⭐',a:'#5eead4',b:'#0b4a5a',ink:'#ffffff',w:[['gold',100]],sp:[['donna',2.5],['yamal',1.5],['dembele',1],['haaland',.5],['mbappe',.3],['kane',.15]],gtxt:'Las estrellas de la temporada',g:null},
];
const PK_NAMES={silver:'Plata',gold:'Oro','tots/toty':'TOTS/TOTY',icon:'Ícono',totw:'TOTW'};
const pkPool=k=>DB_UT.filter(p=>k==='tots/toty'?(p.type==='tots'||p.type==='toty'):p.type===k);
function pkRoll(t){
  const tot=t.w.reduce((a,x)=>a+x[1],0);const out=[];
  for(let i=0;i<t.n;i++){
    if(t.sp){let r=Math.random()*100,hit=null;for(const [k,pr] of t.sp){if(r<pr){hit=k;break}r-=pr}if(hit){out.push({...EVT_CARDS[hit]});continue}}
    let r=Math.random()*tot,k=t.w[0][0];for(const [kk,w] of t.w){if(r<w){k=kk;break}r-=w}const pool=pkPool(k);out.push({...randItem(pool.length?pool:DB_UT)})}
  if(t.g&&!out.some(t.g)){const pool=DB_UT.filter(t.g);if(pool.length)out[out.length-1]={...randItem(pool)}}
  const st=Date.now();return out.sort((a,b)=>a.rating-b.rating).map((c,i)=>({...c,id:c.id+'_'+st+'_'+i}))}
function pkOdds(t){const sp=(t.sp||[]),spT=sp.reduce((a,x)=>a+x[1],0),tot=t.w.reduce((a,x)=>a+x[1],0);
  return [...sp.map(([k,p])=>`<span>${EVT_CARDS[k].name.split(' ').pop()} ${EVT_CARDS[k].rating} · ${p}%</span>`),...t.w.map(([k,w])=>`<span>${PK_NAMES[k]} ${Math.round(w/tot*(100-spT)*10)/10}%</span>`)].join('')}
// ═══ SOBRES CON TIER (inventario) ═══
function utNorm(){if(!UT)return;const I=UT.packInv||(UT.packInv={silver:0,gold:0});if(UT.packs>0){I.gold=(I.gold||0)+UT.packs;UT.packs=0}
  [['premium',2],['elite',4],['legend',6]].forEach(([k,m])=>{if(I[k])I.gold=(I.gold||0)+I[k]*m;delete I[k]});I.silver=I.silver||0;I.gold=I.gold||0;
  if(!UT.evt){let st={};try{st=getStats()||{}}catch(e){}UT.evt={claimed:{},opened:0,base:{m:st.totalMatches||0,w:st.totalWins||0,g:st.totalGoals||0}}}}
function packCount(){utNorm();return UT?Object.values(UT.packInv).reduce((a,b)=>a+b,0):0}
function addPacks(n,tier){utNorm();n=Number(n)||0;if(!UT||n<=0)return;if(!tier){tier='gold';if(n>=10)n=Math.ceil(n/2)}UT.packInv[tier]=(UT.packInv[tier]||0)+n}
const PK_XP={silver:5,gold:10,season:25};
function pkFinish(t,pulled){UT.cards.push(...pulled);utNorm();UT.evt.opened=(UT.evt.opened||0)+1;window._pkTier=t;saveUT();if(window.unlockAchievement)window.unlockAchievement('first_pack');playPackAnimation(pulled,()=>{if(window.addBPXP&&BP)window.addBPXP(PK_XP[t.id]);screenPacks()})}
function buyTier(id){const t=PACK_TIERS.find(x=>x.id===id);if(!t||!UT)return;
  if(UT.coins<t.cost){window.showAlert(`Te faltan ${(t.cost-UT.coins).toLocaleString()} 🪙 para este sobre.`);return}
  UT.coins-=t.cost;pkFinish(t,pkRoll(t))}
function openTier(id){utNorm();const t=PACK_TIERS.find(x=>x.id===id);if(!t||!UT||!UT.packInv[id]){window.showAlert('No tenés ese sobre.');return}UT.packInv[id]--;pkFinish(t,pkRoll(t))}
const cardValue=p=>({silver:300,gold:800,tots:3000,toty:3000,icon:6000,totw:9000}[p.type]||500)+Math.max(0,p.rating-80)*100;
function recycleDupes(){utNorm();const used=new Set([...UT.squad,...UT.bench].filter(Boolean).map(p=>p.id));const seen=new Set([...UT.squad,...UT.bench].filter(Boolean).map(p=>p.name+'|'+p.type));const sell=[];
  UT.cards.forEach(p=>{const k=p.name+'|'+p.type;if(used.has(p.id))return;if(seen.has(k))sell.push(p);else seen.add(k)});
  if(!sell.length){window.showAlert('No tenés cartas duplicadas.');return}
  const tot=sell.reduce((a,p)=>a+cardValue(p),0);if(!confirm(`¿Reciclar ${sell.length} carta(s) repetida(s) por ${tot.toLocaleString()} 🪙? Te quedás con una de cada jugador.`))return;
  const ids=new Set(sell.map(p=>p.id));UT.cards=UT.cards.filter(p=>!ids.has(p.id));UT.coins+=tot;saveUT();screenPacks()}
function screenPacks(){
  if(!UT)return;utNorm();
  const card=t=>{const tot=t.w.reduce((a,x)=>a+x[1],0);const can=UT.coins>=t.cost;const own=UT.packInv[t.id]||0;
    return `<div class="card pk-card" style="--a:${t.a};--b:${t.b};--ink:${t.ink}"><div class="pk"><div class="pk-in"><span>${t.icon}</span><b>${t.name}</b><i>${'★'.repeat(t.stars)}</i></div></div>
    <div><h3 style="margin:0">Sobre ${t.name}</h3><div class="pk-meta">${t.n} cartas · ${t.gtxt}<br>+${PK_XP[t.id]} XP del pase</div></div>
    <div class="pk-odds">${pkOdds(t)}</div>
    ${own?`<button class="btn btn-green btn-block" onclick="openTier('${t.id}')">🎁 Abrir (tenés ${own})</button>`:''}
    <button class="btn ${can?'btn-gold':'btn-outline'} btn-block" ${can?'':'disabled'} onclick="buyTier('${t.id}')">${can?`Comprar y abrir · 🪙 ${t.cost.toLocaleString()}`:`Te faltan ${(t.cost-UT.coins).toLocaleString()} 🪙`}</button></div>`};
  $('#app').innerHTML=`<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenUT()">← Volver</button><div class="card card-gold"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">🎁 Tienda de sobres</h2><div class="dim">Cuanto mejor el sobre, mejores cartas y garantías. Tenés ${packCount()} guardado${packCount()===1?'':'s'}.</div></div><div style="font-size:1.3rem;font-weight:800;color:var(--gold)">🪙 ${UT.coins.toLocaleString()}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn btn-outline btn-sm" onclick="recycleDupes()">♻️ Reciclar repetidas</button><button class="btn btn-outline btn-sm" onclick="screenWheel()">🎡 Ruleta diaria</button></div></div>
  <div class="pk-grid">${PACK_TIERS.map(card).join('')}</div></div>`}

const WHEEL=[{l:'1.000 🪙',w:24,c:1000,col:'#1e3a2a'},{l:'2.500 🪙',w:18,c:2500,col:'#2b5a3d'},{l:'Sobre Plata',w:18,t:'silver',col:'#5b6a72'},{l:'5.000 🪙',w:14,c:5000,col:'#2b5a3d'},{l:'Sobre Oro',w:12,t:'gold',col:'#8a6a12'},{l:'+50 XP pase',w:8,x:50,col:'#3d2a7a'},{l:'2 Sobres Oro',w:4,t:'gold',n:2,col:'#0b4a8f'},{l:'25.000 🪙',w:2,c:25000,col:'#9b1c3a'}];
const wheelKey=()=>`mfc_wheel_${window.onlineUser.uid}`;
const wheelReady=()=>localStorage.getItem(wheelKey())!==new Date().toDateString();
function screenWheel(){if(!UT)return;const ready=wheelReady();
  const grad=WHEEL.map((p,i)=>`${p.col} ${i*45}deg ${(i+1)*45}deg`).join(',');
  $('#app').innerHTML=`<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Menú</button><div class="card card-gold center"><h2>🎡 Ruleta diaria</h2><p class="muted">Un giro gratis por día. ¿Querés otro? Cuesta 3.000 🪙.</p><div class="wh"><div class="wh-ptr"></div><div class="wh-cap"></div><div class="wh-disc" id="wh-disc" style="background:conic-gradient(from 0deg,${grad})">${WHEEL.map((p,i)=>`<span style="transform:rotate(${i*45+22.5}deg) translateY(-98px)">${p.l}</span>`).join('')}</div></div>
  <button class="btn ${ready?'btn-gold':'btn-outline'} btn-block" id="wh-btn" onclick="wheelSpin(${ready?0:1})">${ready?'🎡 ¡Girar gratis!':'🎡 Girar de nuevo · 3.000 🪙'}</button></div></div>`}
function wheelSpin(paid){if(paid&&UT.coins<3000){window.showAlert('Necesitás 3.000 🪙.');return}
  const btn=document.getElementById('wh-btn');btn.disabled=true;if(paid){UT.coins-=3000}else localStorage.setItem(wheelKey(),new Date().toDateString());
  const tot=WHEEL.reduce((a,p)=>a+p.w,0);let r=Math.random()*tot,idx=0;for(let i=0;i<WHEEL.length;i++){if(r<WHEEL[i].w){idx=i;break}r-=WHEEL[i].w}
  const d=document.getElementById('wh-disc');d.style.transition='transform 4.2s cubic-bezier(.12,.7,.1,1)';d.style.transform=`rotate(${360*6+360-(idx*45+22.5)}deg)`;
  setTimeout(()=>{const p=WHEEL[idx];if(p.c)UT.coins+=p.c;if(p.t)addPacks(p.n||1,p.t);saveUT();if(p.x&&window.addBPXP&&BP)window.addBPXP(p.x);
    window.showAlert(`¡Ganaste <b class="gold">${p.l}</b>!`,'🎡 RULETA');screenWheel()},4400)}

function screenChronicle(id){const c=CHRONICLES.find(x=>x.id===id),d=chDone(id),pk=PACK_TIERS.find(t=>t.id===c.pack).name;

  ${c.m.map((m,i)=>{const st=i<d?'done':i===d?'cur':'lock';return `<div class="ch-row ${st}"><div class="ch-n">${i<d?'✓':i+1}</div><div style="flex:1;min-width:0"><b>${m[0]}</b><div class="dim">Rival ${m[1]} GRL · ${CH_OBJ[m[2]][0]}</div><div class="dim">Premio: ${(500+i*150).toLocaleString()} 🪙 · +10 XP</div></div>${st==='cur'?`<button class="btn btn-green btn-sm" onclick="chPlay('${id}',${i})">⚽ Jugar</button>`:''}</div>`}).join('')}</div>`}

  window.startMatchSimulation('Mi UT',rival,my,genBotTeam(m[1]),(a,b,mm)=>{const ok=CH_OBJ[m[2]][1](a,b);let ex='';
    if(ok){const co=500+i*150;if(!UT.chron)UT.chron={};UT.chron[id]=d+1;UT.coins+=co;ex=`<p class="gold">✅ Objetivo cumplido · +${co.toLocaleString()} 🪙 · +10 XP</p>`;

function albumSets(){utNorm();const cnt=f=>{const q=new Set();UT.cards.forEach(c=>{if(f(c))q.add(c.name)});return q.size};const sets=[];
  const nat={},cl={};DB_UT.forEach(p=>{if(p.type!=='icon'){(nat[p.nation]=nat[p.nation]||new Set()).add(p.name)}if(p.club!=='Icon'){(cl[p.club]=cl[p.club]||new Set()).add(p.name)}});
  Object.entries(nat).filter(([n,q])=>q.size>=4).forEach(([n,q])=>sets.push({id:'n_'+n,name:n,vis:flagSVG(n).replace('class="flag"','class="flag" style="width:46px;height:30px"'),need:3,have:cnt(c=>c.nation===n&&c.type!=='icon'),coins:1500}));
  Object.entries(cl).filter(([n,q])=>q.size>=3).forEach(([n,q])=>sets.push({id:'c_'+n,name:n,vis:crestSVG(n,34),need:3,have:cnt(c=>c.club===n),coins:1000,pack:'silver'}));
  sets.push({id:'estrellas',name:'Estrellas de la temporada',vis:'⭐',need:3,have:cnt(c=>c.type==='evento'),coins:3000,pack:'gold'});return sets}

  <div class="pk-grid">${sets.map(x=>{const ok=x.have>=x.need,got=al[x.id];return `<div class="card pk-card" style="margin:0"><div class="al-top">${x.vis}</div><h3 style="margin:0">${utEsc(x.name)}</h3><div class="progress" style="width:100%"><div class="progress-fill" style="width:${Math.min(100,x.have/x.need*100)}%"></div></div><div class="dim">${Math.min(x.have,x.need)}/${x.need} jugadores distintos</div><div class="pk-meta">${x.coins.toLocaleString()} 🪙${x.pack?` + sobre ${PACK_TIERS.find(t=>t.id===x.pack).name}`:''}</div><button class="btn ${got?'btn-outline':ok?'btn-gold':'btn-outline'} btn-block btn-sm" ${got||!ok?'disabled':''} onclick="albumClaim('${x.id}')">${got?'Cobrado ✓':ok?'Cobrar':'Incompleto'}</button></div>`}).join('')}</div></div>`}

const pkAC=()=>window._pkAC||(window._pkAC=new (window.AudioContext||window.webkitAudioContext)());
function pkTone(f0,f1,d,v,ty='sine'){try{const A=pkAC(),t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function pkNoise(d,f0,f1,v){try{const A=pkAC(),t=A.currentTime,n=A.createBuffer(1,Math.max(1,Math.floor(A.sampleRate*d)),A.sampleRate),c=n.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=A.createBufferSource();s.buffer=n;const f=A.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);const g=A.createGain();g.gain.setValueAtTime(v,t);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(A.destination);s.start()}catch(e){}}
const POS_NAMES={GK:'Portero',CB:'Defensa central',LB:'Lateral izquierdo',RB:'Lateral derecho',CDM:'Pivote',CM:'Mediocampista',CAM:'Mediapunta',LW:'Extremo izquierdo',RW:'Extremo derecho',ST:'Delantero'};
function pkWalkout(p,host,done){
  const wo=document.createElement('div');wo.className='wo';host.appendChild(wo);const pos=String(p.pos).split('/')[0];
  const ph=[
    ()=>`<div class="wo-slide"><div class="wo-flag">${flagSVG(p.nation)}</div><div class="wo-big">${utEsc(p.nation==='Icon'?'Leyenda':p.nation)}</div></div>`,
    ()=>`<div class="wo-slide"><div class="wo-pos">${utEsc(pos)}</div><div class="wo-big">${POS_NAMES[pos]||''}</div></div>`,
    ()=>`<div class="wo-slide">${crestSVG(p.club,170)}<div class="wo-big">${utEsc(p.club==='Icon'?'Ícono':p.club)}</div></div>`,
    ()=>{const w=Math.min(innerWidth*.62,300);return `<div class="wo-slide"><div class="wo-card" style="width:${w}px;height:${Math.round(w*164/116)}px"><div class="ut-card ${p.type} ut-xl" style="font-size:${w/10}px">${utCardInner(p)}</div></div><div class="wo-big">${utEsc(p.name)}</div><div class="dim">Tocá para continuar</div></div>`}];
  let i=-1,fin=false,timer,tFin=0;
  const end=()=>{wo.remove();done()};
  const next=()=>{clearTimeout(timer);i++;wo.innerHTML='<div class="wo-flash"></div>'+ph[i]();pkTone(150+i*80,40,.5,.5);pkNoise(.5,300+i*300,3000,.35);
    if(i===3){fin=true;tFin=performance.now();pkTone(660,1320,.9,.22,'triangle');pkNoise(1,400,6000,.4)}else timer=setTimeout(next,1500)};
  wo.addEventListener('click',()=>{if(!fin){clearTimeout(timer);i=2;next()}else if(performance.now()-tFin>700)end()});
  wo.addEventListener('pointermove',e=>{const c=wo.querySelector('.ut-card');if(c&&fin){const r=wo.getBoundingClientRect();c.style.transform=`rotateY(${(e.clientX-r.width/2)/r.width*24}deg) rotateX(${-(e.clientY-r.height/2)/r.height*18}deg)`}});
  next()}
function playPackAnimation(pulled,onComplete){
  const t=window._pkTier||PACK_TIERS[PACK_TIERS.length-1];window._pkTier=null;const list=[...pulled].sort((a,b)=>a.rating-b.rating);
  const root=document.createElement('div');root.className='rip-root';document.body.appendChild(root);const N=14;
  const segs=Array.from({length:N},(_,i)=>`<u class="rip-seg" style="background-position:${i/(N-1)*100}% 0;--r:${(-8-Math.random()*22).toFixed(1)}deg;--x:${Math.round((Math.random()-.5)*260)}px;--r2:${Math.round((Math.random()-.5)*900)}deg"></u>`).join('');
  const pw=100/N,top=['0% 21%'];for(let i=0;i<N;i++)top.push(`${(i*pw).toFixed(2)}% 21%`,`${((i+.5)*pw).toFixed(2)}% 17.2%`);top.push('100% 21%');const bot=[];for(let i=0;i<=16;i++)bot.push(`${(100-i*100/16).toFixed(2)}% ${i%2?'97.5%':'100%'}`);
  root.innerHTML=`<div class="rip-bg"></div><div class="rip-stage" style="--a:${t.a};--b:${t.b};--ink:${t.ink}"><div class="rip-glow"></div><div class="rip-float"><div class="rip-pack"><div class="rip-body" style="clip-path:polygon(${top.join(',')},${bot.join(',')})"><span>${t.icon}</span><b>${t.name}</b><i>${'★'.repeat(t.stars)}</i></div><div class="rip-strip">${segs}</div></div></div><div class="rip-hint">›››&nbsp;Deslizá para rasgar&nbsp;›››</div></div><button class="rip-skip" aria-label="Saltar">⏭</button>`;
  const pack=root.querySelector('.rip-pack'),stage=root.querySelector('.rip-stage'),glow=root.querySelector('.rip-glow'),su=[...root.querySelectorAll('.rip-seg')],strip=root.querySelector('.rip-strip');
  let prog=0,drag=false,sx=0,moved=0,torn=false,raf=0;
  const set=p=>{prog=Math.max(0,Math.min(1,p));su.forEach((u,i)=>u.classList.toggle('up',prog*(N+1)>i+.6));glow.style.opacity=(prog*.95).toFixed(2);pack.style.transform=`rotate(${(prog*-3).toFixed(2)}deg) scale(${(1+prog*.04).toFixed(3)})`};
  const cleanup=()=>{document.removeEventListener('keydown',key);root.remove();if(onComplete)onComplete()};
  function summary(){torn=true;root.innerHTML=`<div class="rip-bg"></div><div class="rip-sum"><h2>Contenido del sobre</h2><div class="rip-grid">${list.map((p,i)=>`<div class="rip-c" style="--d:${(i*.16).toFixed(2)}s"><div class="ut-card ${p.type} ut-lg">${utCardInner(p)}</div></div>`).join('')}</div><button class="btn btn-gold" id="rip-ok">Continuar</button></div>`;
    list.forEach((p,i)=>setTimeout(()=>pkTone(500+i*90,900+i*90,.25,.18,'triangle'),i*160));root.querySelector('#rip-ok').onclick=cleanup}
  const afterTear=()=>{const hits=list.filter(p=>p.rating>=90);const run=k=>{if(k>=hits.length){summary();return}pkWalkout(hits[k],root,()=>run(k+1))};run(0)};
  const finish=()=>{if(torn)return;torn=true;set(1);strip.classList.add('off');pkNoise(.5,2000,8000,.5);pkTone(220,60,.5,.5,'sawtooth');setTimeout(()=>{stage.classList.add('burst');pkTone(880,1760,.8,.28,'triangle')},350);setTimeout(afterTear,1300)};
  const auto=()=>{if(torn||raf)return;const p0=prog,t0=performance.now();pkNoise(.7,500,6000,.4);const step=n=>{const k=Math.min(1,(n-t0)/650);set(p0+(1-p0)*k);if(k<1)raf=requestAnimationFrame(step);else{raf=0;finish()}};raf=requestAnimationFrame(step)};
  pack.addEventListener('pointerdown',e=>{if(torn)return;drag=true;moved=0;sx=e.clientX;try{pack.setPointerCapture(e.pointerId)}catch(x){}pkNoise(.25,800,3000,.2)});
  pack.addEventListener('pointermove',e=>{if(!drag||torn)return;moved=Math.max(moved,Math.abs(e.clientX-sx));const o=prog;set(Math.abs(e.clientX-sx)/(pack.offsetWidth*.85));if(prog>o+.05)pkNoise(.12,1500,5000,.15)});
  pack.addEventListener('pointerup',()=>{if(!drag||torn)return;drag=false;if(moved<8)auto();else if(prog>.55)finish();else set(0)});
  pack.addEventListener('pointercancel',()=>{drag=false;if(!torn)set(0)});
  function key(e){if(!torn&&(e.key==='Enter'||e.key===' ')){e.preventDefault();auto()}}document.addEventListener('keydown',key);
  root.querySelector('.rip-skip').onclick=summary}

t:800">🪙 ${m.price.toLocaleString()}</span><button class="btn btn-sm btn-green" onclick="buyMarketCard('${m.id}')">Comprar</button></div></div>`}).join('')}</div></div>`;

function renderPitchDraft(squad,form){let h=`<div class="pitch">`;for(let i=0;i<11;i++){const p=squad[i];const s=form.slots[i];if(!s)continue;if(p)h+=`<div class="spot ${p.type}" style="left:${s.x}%;top:${s.y}%"><div class="spot-rating">${p.rating}</div><div class="spot-pos">${s.role}</div><div class="spot-name">${p.name.split(' ')[0]}</div></div>`;else h+=`<div class="spot empty" style="left:${s.x}%;top:${s.y}%"><div class="spot-pos">${s.role}</div></div>`}return h+'</div>'}
function generateDraftOptions(){const form=FORMATIONS[window.DRAFT.formation];const slot=form.slots[window.DRAFT.currentPick];const rz=getZone(slot.role);let pool=DB_UT.filter(p=>p.pos.split('/').some(pos=>getZone(pos)===rz||pos===slot.role));if(pool.length===0)pool=DB_UT;window.DRAFT.options=[];const used=new Set(window.DRAFT.squad.filter(p=>p).map(p=>p.id));let safety=0;while(window.DRAFT.options.length<3&&pool.length>0&&safety<100){safety++;const p=randItem(pool);if(!used.has(p.id)&&!window.DRAFT.options.find(o=>o.id===p.id))window.DRAFT.options.push({...p})}}
function pickDraftPlayer(i){if(!window.DRAFT||!window.DRAFT.options[i])return;window.DRAFT.squad[window.DRAFT.currentPick]=window.DRAFT.options[i];window.DRAFT.currentPick++;if(window.DRAFT.currentPick<11)generateDraftOptions();screenUTDraft()}

const _SH={shield:'M4 3h32v21c0 10-8 17-16 21C12 41 4 34 4 24z',round:'M20 5a19 19 0 1 0 .01 0z'};
const CRESTS={'Real Madrid':['shield','#fff','#4b2e83','band','#d4af37'],'Barcelona':['shield','#004d98','#a50044','vs','#edbb00'],'Man City':['round','#6cabdd','#fff','ring','#1c2c5b'],'Liverpool':['shield','#c8102e','#f6eb61','dot','#f6eb61'],'PSG':['round','#004170','#da291c','band','#fff'],'Bayern Múnich':['round','#0066b2','#fff','ring','#dc052d'],'Arsenal':['shield','#ef0107','#fff','dot','#9c824a'],'AC Milan':['shield','#fb090b','#000','vs','#fff'],'Aston Villa':['shield','#670e36','#95bfe5','split','#f1bf00'],'Atlético Madrid':['shield','#cb3524','#fff','vs','#272e61'],'Benfica':['round','#e83030','#fff','dot','#000'],'Chelsea':['round','#034694','#fff','ring','#dba111'],'Inter Miami':['shield','#f7b5cd','#231f20','band','#fff'],'Napoli':['round','#12a0d7','#fff','dot','#fff'],'Boca':['shield','#103f91','#f4b92c','band','#f4b92c'],'Lyon':['shield','#0b3a8c','#e30613','split','#fff'],'Tottenham':['shield','#fff','#132257','dot','#132257'],'Man United':['round','#da291c','#fbe122','dot','#000'],'Bayer Leverkusen':['round','#e32221','#000','cross','#fff'],'Al-Hilal':['round','#0b3b8c','#fff','ring','#fff'],'Athletic Bilbao':['shield','#ee2523','#fff','vs','#000'],'Inter':['round','#0068a8','#000','vs','#fff'],'Trabzonspor':['shield','#7c1d3a','#2a6fb0','vs','#fff'],'Galatasaray':['shield','#e63a1f','#fcb613','split','#fcb613'],'Fenerbahçe':['shield','#10245c','#ffd400','hs','#ffd400'],'Santos':['round','#ffffff','#111111','ring','#111111'],'Rosario Central':['shield','#1f4fa3','#f6c900','band','#f6c900'],'Girona':['shield','#ce1126','#ffffff','vs','#ffffff'],'Getafe':['shield','#0b5aa8','#0b2e5e','hs','#ffffff'],'Burnley':['shield','#6c1d45','#99d6ea','split','#ffffff'],'Icon':['shield','#e0b93e','#fff3b0','dot','#7a5a00']};
let _CRN=0;
function crestSVG(club,w){
  let c=CRESTS[club];if(!c){let h=0;for(const ch of String(club||'?'))h=(h*31+ch.charCodeAt(0))%360;c=['shield',`hsl(${h},60%,40%)`,`hsl(${(h+40)%360},70%,80%)`,'band','#fff']}
  const [sh,c1,c2,pt,c3]=c;const id='cp'+(++_CRN);const d=_SH[sh];let b=_R(0,0,40,48,c1);
  if(pt==='vs')for(let i=1;i<5;i+=2)b+=_R(i*8,0,8,48,c2);
  else if(pt==='hs')for(let i=1;i<6;i+=2)b+=_R(0,i*8,40,8,c2);
  else if(pt==='band')b+=_R(0,18,40,11,c2);
  else if(pt==='split')b+=_R(20,0,20,48,c2);
  else if(pt==='cross')b+=_R(16,0,8,48,c2)+_R(0,18,40,8,c2);
  else if(pt==='ring')b+=`<circle cx="20" cy="24" r="11" fill="none" stroke="${c2}" stroke-width="3"/>`;
  else b+=_C(20,25,8,c2);
  if(club==='Real Madrid')b+=`<path d="M13 12l3 4 4-7 4 7 3-4v6H13z" fill="${c3}"/>`;
  const sz=w?` width="${w}" height="${Math.round(w*1.2)}"`:'';
  return `<svg class="crest" viewBox="0 0 40 48"${sz} aria-hidden="true"><clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${b}<path d="${d}" fill="url(#cg)" opacity="0"/></g><path d="${d}" fill="none" stroke="${c3||'#fff'}" stroke-width="2.4"/></svg>`;
}

  for(let i=0;sq.length<18;i++)sq.push({id:`b${ci}_${i}`,name:`${String.fromCharCode(65+i%26)}. ${MGR_NAMES[(i+ci)%10]}`,rating:Math.round(avg-6+rand(-3,2)),pos:MGR_POS[i%MGR_POS.length],type:'silver',nation:nat[(i+ci)%5],club});return sq}
function mgrXI(sq){const used=new Set();return MGR_ROLES.map((role,i)=>{const pool=sq.filter(p=>!used.has(p.id));const c=pool.filter(p=>p.pos.split('/').includes(role)).sort((a,b)=>b.rating-a.rating)[0]||pool.filter(p=>role==='GK'||p.pos!=='GK').sort((a,b)=>b.rating-a.rating)[0]||pool[0];used.add(c.id);return {...c,pos:role,dorsal:i+1}})}
const mgrRating=sq=>Math.round(mgrXI(sq).reduce((a,p)=>a+p.rating,0)/11);
function mgrRounds(){const t=[...MGR_CLUBS],n=t.length,R=[];for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++)rd.push([t[i],t[n-1-i]]);R.push(rd);t.splice(1,0,t.pop())}return R}
function mgrMarket(M){const pool=DB_UT.filter(p=>!M.squad.some(s=>s.id===p.id));const m=[];while(m.length<8&&pool.length){const p=pool.splice(Math.floor(Math.random()*pool.length),1)[0];m.push({...p})}M.market=m}
function mgrSeason(M){M.table={};MGR_CLUBS.forEach(c=>M.table[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});M.rounds=mgrRounds();M.week=0;M.form=[];mgrMarket(M)}
function mgrSorted(M){return Object.entries(M.table).map(([c,r])=>({c,...r})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function mgrApply(M,a,b,ga,gb){const A=M.table[a],B=M.table[b];A.p++;B.p++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;if(ga>gb){A.w++;B.l++;A.pts+=3}else if(ga<gb){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}}
function mgrPois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function mgrStart(i){const club=MGR_CLUBS[i];const M={club,season:1,budget:30,squad:mgrBase(club),ratings:{}};MGR_CLUBS.forEach(c=>M.ratings[c]=mgrRating(mgrBase(c)));mgrSeason(M);window.MGR=M;mgrSave();screenManager('inicio')}
function screenMgrPick(){const rs=MGR_CLUBS.map(c=>mgrRating(mgrBase(c)));

function mgrHome(M){
  if(M.week>=M.rounds.length){const pos=mgrSorted(M).findIndex(r=>r.c===M.club)+1;const rw=[[50000,3],[25000,1],[10000,1]][pos-1]||[2000,0];

  const f=M.rounds[M.week].find(x=>x.includes(M.club));const rv=f[0]===M.club?f[1]:f[0];const col={W:'#4ade80',D:'#facc15',L:'#f87171'};
  return `<div class="card center"><h3>Jornada ${M.week+1} de ${M.rounds.length}</h3><div style="display:flex;justify-content:center;align-items:center;gap:28px;margin:14px 0">${crestSVG(M.club,64)}<b style="font-size:1.6rem">VS</b>${crestSVG(rv,64)}</div><p class="muted">${rv} · Rating ${M.ratings[rv]}</p><div class="mgr-form mt">${M.form.map(r=>`<span style="background:${col[r]}">${r}</span>`).join('')||'<span class="dim">Sin partidos aún</span>'}</div><button class="btn btn-green mt" onclick="mgrPlay()">⚽ Jugar partido</button></div>`}
function mgrPlay(){const M=window.MGR;const f=M.rounds[M.week].find(x=>x.includes(M.club));const rv=f[0]===M.club?f[1]:f[0];
  window.startMatchSimulation(M.club,rv,mgrXI(M.squad),mgrXI(mgrBase(rv)),(a,b,m)=>{
    mgrApply(M,M.club,rv,a,b);
    M.rounds[M.week].forEach(([x,y])=>{if(x===M.club||y===M.club)return;const d=(M.ratings[x]-M.ratings[y])/22;mgrApply(M,x,y,mgrPois(1.25*Math.exp(d)),mgrPois(1.25*Math.exp(-d)))});
    const r=a>b?'W':a<b?'L':'D';M.form=[...M.form,r].slice(-5);const inc=r==='W'?3:r==='D'?1.5:.5;M.budget=Math.round((M.budget+inc)*10)/10;M.week++;mgrMarket(M);mgrSave();
    window.renderMatchResult('FIN',M.club,rv,a,b,`<p class="gold">+${inc} M€ de ingresos</p>`,()=>screenManager('inicio'),m)})}
function mgrNewSeason(){const M=window.MGR;const pos=mgrSorted(M).findIndex(r=>r.c===M.club)+1;const rw=[[50000,3],[25000,1],[10000,1]][pos-1]||[2000,0];

function mgrSquadTab(M){return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px"><h3 style="margin:0">Plantilla (${M.squad.length}/24)</h3><button class="btn btn-outline btn-sm" onclick="mgrTrain()">🏋️ Entrenar · 2 M€</button></div><div class="mgr-sq">${[...M.squad].sort((a,b)=>b.rating-a.rating).map(p=>`<div><div class="ut-card ${p.type}">${utCardInner(p)}</div><button class="btn btn-outline btn-sm" onclick="mgrSell('${p.id}')">Vender ${Math.max(.3,mgrPrice(p)*.6).toFixed(1)} M</button></div>`).join('')}</div></div>`}

<script>

const pcnMine=c=>c.slots.findIndex(x=>x&&x.uid===pcnMe());

function pcnErr(r){window.showAlert(r.error==='permission-denied'?PCN_RULE:utEsc(r.error),'❌ Clubs Pro')}
function pcnBadge(c,sz){const ok=c.photo&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(c.photo);return ok?`<img class="pc-photo" style="width:${sz}px;height:${sz}px" src="${c.photo}" alt="">`:`<div class="pc-photo" style="width:${sz}px;height:${sz}px;background:linear-gradient(135deg,${pcnCol(c.c1)},${pcnCol(c.c2)});display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:${sz*.34}px;color:#fff">${utEsc(c.tag)}</div>`}
function pcnImg(inp,cb){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const q=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,160,160);cb(c.toDataURL('image/jpeg',.8))};im.onerror=()=>window.showAlert('No pude leer esa imagen.');im.src=r.result};r.readAsDataURL(f)}
function pcnAttach(init){PCN.club=init;PCN.seenMatch=init.lastMatch?init.lastMatch.id:null;if(PCN.unsub)PCN.unsub();
  PCN.unsub=ProNet.sub(init.id,c=>{if(!c){PCN.club=null;if(PCN.unsub)PCN.unsub();PCN.unsub=null;if(pcnLive()){window.showAlert('El club fue disuelto.');screenProClubs()}return}
    PCN.club=c;const lm=c.lastMatch;if(lm&&lm.id!==PCN.seenMatch){PCN.seenMatch=lm.id;if(lm.byUid!==pcnMe()&&pcnLive())window.showAlert(`${utEsc(lm.by)} jugó: <b>${utEsc(c.name)} ${lm.a} - ${lm.b} ${utEsc(lm.rival)}</b>`,'⚽ Resultado del club')}
    if(pcnLive()&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))pcnRender()},e=>{if(pcnLive())pcnErr({error:e.code||e.message})});
  clearInterval(PCN.hb);const beat=()=>{const c=PCN.club;if(!c||!pcnLive())return;const i=pcnMine(c);if(i<0)return;ProNet.mutate(c.id,d=>{const sl=[...d.slots];if(!sl[i]||sl[i].uid!==pcnMe())return null;sl[i]={...sl[i],seen:Date.now()};return{slots:sl}})};beat();PCN.hb=setInterval(beat,30000)}

function pcnWelcome(){window._pcnPhoto=null;
  const posSel=id=>`<select id="${id}">${PCN_LBL.map((l,i)=>`<option value="${i}">${l}${i>0&&PCN_LBL[i-1]===l?' 2':i<4&&PCN_LBL[i+1]===l?' 1':''}</option>`).join('')}</select>`;
  $('#app').innerHTML=`<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Menú</button><div class="card card-gold center"><h2>🤝 Clubs Pro Online 5v5</h2><p class="muted">Creá un club, pasale el código a tus amigos y jueguen juntos: cada uno controla y entrena a su jugador.</p></div>
  <div class="card"><h3>Unirme con código</h3><div class="field"><label>Código del club</label><input id="pcn-code" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;text-align:center;font-family:monospace;letter-spacing:5px;font-size:1.4rem" onkeydown="if(event.key==='Enter')pcnJoin()"></div><div class="field"><label>Tu puesto preferido</label>${posSel('pcn-jpos')}</div><button class="btn btn-green btn-block mt" onclick="pcnJoin()">Unirme</button></div>

function pcnSlot(){const gt=(window.onlineProfile&&window.onlineProfile.gamertag)||'Jugador';return{uid:pcnMe(),gt,name:gt.slice(0,16),grl:60,tp:5,seen:Date.now()}}
async function pcnCreate(){const name=(document.getElementById('pcn-name').value||'').trim().slice(0,22);if(!name){window.showAlert('Poné un nombre al club.');return}
  const tag=((document.getElementById('pcn-tag').value||name.slice(0,3)).toUpperCase()).slice(0,4);const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='',tries=0;
  do{code=Array.from({length:6},()=>AL[Math.floor(Math.random()*AL.length)]).join('');const ex=await ProNet.byCode(code);if(ex&&ex.error){pcnErr(ex);return}if(!ex)break}while(++tries<6);

  if(r.error){pcnErr(r);return}PCN.club=null;screenProClubs('plantel')}

  const avg=Math.round(mine.reduce((a,p)=>a+p.rating,0)/5);const nm=PC_RIVALS[Math.floor(Math.random()*PC_RIVALS.length)];

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, serverTimestamp, query, where, getDocs } from "firebase/firestore";

const firebaseConfig = { apiKey: "AIzaSyBxAz4QGPmp8TFHNefsVlND2YFV_I3Ju6Q", authDomain: "potro-55a5b.firebaseapp.com", projectId: "potro-55a5b", storageBucket: "potro-55a5b.firebasestorage.app", messagingSenderId: "179726326235", appId: "1:179726326235:web:6a0e9a2d0770c0c4d9effe" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let _authReady=false;let _authCbs=[];

async function loadProfile(uid){try{const s=await getDoc(doc(db,'users',uid));return s.exists()?s.data():null}catch(e){return null}}
async function saveProfile(uid,data){try{await setDoc(doc(db,'users',uid),{...data,uid,updatedAt:serverTimestamp()},{merge:true});return true}catch(e){return false}}

onAuthStateChanged(auth, async user => {
  if(user){
    window.onlineUser=user;
    let p=await loadProfile(user.uid);
    if(!p)p={gamertag:user.email.split('@')[0],email:user.email,isAdmin:false};
    window.onlineProfile=p;
    window.Firebase.user=user;window.Firebase.profile=p;

    // ═══ CARGAR DATOS DEL USUARIO (Aislamiento por UID) ═══
    if (window.loadUserData) window.loadUserData(user.uid);

    if(window.screenInicio) screenInicio();
  } else {
    window.onlineUser=null;window.onlineProfile=null;
    window.Firebase.user=null;window.Firebase.profile=null;

    // ═══ LIMPIAR DATOS GLOBALES ═══
    if (window.clearUserData) window.clearUserData();

    if(window.screenAuthGate) screenAuthGate();
  }
  _authReady=true;
  _authCbs.forEach(cb=>{try{cb()}catch(e){}});
  _authCbs=[];
});

window.Firebase={
  user:null,profile:null,
  isAdmin:()=>window.onlineProfile?.isAdmin===true,
  signIn:async(email,pass)=>{try{await signInWithEmailAndPassword(auth,email,pass);return{success:true}}catch(e){return{success:false,error:'Email o contraseña incorrectos.'}}},
  signUp:async(gamertag,email,pass,isAdmin)=>{
    try{const q=query(collection(db,'users'),where('gamertag','==',gamertag));const snap=await getDocs(q);if(!snap.empty)return{success:false,error:'Gamertag ya en uso.'}}catch(e){}
    try{const c=await createUserWithEmailAndPassword(auth,email,pass);await saveProfile(c.user.uid,{gamertag,email,isAdmin:!!isAdmin});return{success:true}}
    catch(e){let msg='Error';if(e.code==='auth/email-already-in-use')msg='Ese email ya está registrado.';else if(e.code==='auth/invalid-email')msg='Email inválido.';else if(e.code==='auth/weak-password')msg='Contraseña débil.';return{success:false,error:msg}}
  },
  signOut:async()=>{try{await signOut(auth);location.reload()}catch(e){}},
  createCodes:async(itemId,quantity)=>{
    try{
      const prefixes={coins_small:'C5K',coins_medium:'C25K',coins_large:'C100K',coins_mega:'C500K',packs_small:'P5',packs_large:'P20',super_pack:'EPIC',bp_vip:'BPVIP',vip_pass:'VIP'};
      const prefix=prefixes[itemId]||'GEN';
      const r=()=>Math.random().toString(36).substring(2,6).toUpperCase();
      const codes=[];
      for(let i=0;i<quantity;i++){const code=`${prefix}-${r()}-${r()}`;await addDoc(collection(db,'redemption_codes'),{code,itemId,used:false,createdAt:serverTimestamp(),usedAt:null,createdBy:window.onlineUser?.uid||null});codes.push(code)}
      return{success:true,codes};
    }catch(e){return{success:false,error:e.message}}
  },
  getAllCodes:async()=>{try{const snap=await getDocs(collection(db,'redemption_codes'));const codes=[];snap.forEach(d=>codes.push({id:d.id,...d.data(),createdAt:d.data().createdAt?.toMillis()||Date.now()}));return codes.sort((a,b)=>b.createdAt-a.createdAt)}catch(e){return[]}},
  checkCode:async(code)=>{try{const q=query(collection(db,'redemption_codes'),where('code','==',code.toUpperCase()));const snap=await getDocs(q);if(snap.empty)return{found:false};return{found:true,id:snap.docs[0].id,...snap.docs[0].data()}}catch(e){return{found:false,error:e.message}}},
  useCode:async(codeId)=>{try{await updateDoc(doc(db,'redemption_codes',codeId),{used:true,usedAt:serverTimestamp()});return true}catch(e){return false}},
  getMarketCards:async()=>{let cards=[];try{const snap=await getDocs(collection(db,'market_cards'));snap.forEach(d=>cards.push({id:d.id,...d.data()}))}catch(e){}try{const l=JSON.parse(localStorage.getItem('local_market')||'[]');cards=[...cards,...l]}catch(e){}return cards}
};

window.waitForAuth=function(cb){if(_authReady)cb();else _authCbs.push(cb)};
</script>
<script type="module">
import { getApp } from "firebase/app";
import { getFirestore, doc, addDoc, collection, query, where, getDocs, onSnapshot, runTransaction, deleteDoc, serverTimestamp } from "firebase/firestore";
const db=getFirestore(getApp());const C='pro_clubs';const er=e=>({error:e.code||e.message||'error'});
window.ProNet={
  async myClub(uid){try{const s=await getDocs(query(collection(db,C),where('members','array-contains',uid)));return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()}}catch(e){return er(e)}},
  async byCode(code){try{const s=await getDocs(query(collection(db,C),where('code','==',code)));return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()}}catch(e){return er(e)}},
  async create(data){try{const r=await addDoc(collection(db,C),{...data,createdAt:serverTimestamp()});return{id:r.id}}catch(e){return er(e)}},
  async mutate(id,fn){try{await runTransaction(db,async t=>{const ref=doc(db,C,id);const sn=await t.get(ref);if(!sn.exists())throw new Error('El club ya no existe.');const ch=fn(sn.data());if(ch)t.update(ref,ch)});return{ok:true}}catch(e){return er(e)}},
  sub(id,cb,ecb){return onSnapshot(doc(db,C,id),s=>cb(s.exists()?{id:s.id,...s.data()}:null),e=>ecb&&ecb(e))},
  async del(id){try{await deleteDoc(doc(db,C,id));return{ok:true}}catch(e){return er(e)}}
};
</script>
