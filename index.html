  const form = FORMATIONS['4-3-3']; const startingXI = [];
  for (let i = 0; i < 11; i++) { const bp = generatePlayer('bronze'); bp.pos = form.slots[i].role; startingXI.push(bp); }
  MGR = { teamName: 'Deportivo Morón', budget: 150000, startingXI, bench: [null, null, null, null, null], matchDay: 0, points: 0, season: 1, formation: '4-3-3', news: ["Bienvenido al club. La directiva espera buenos resultados."] };
  saveMGR(); screenManager();
}
function screenManager() {
  if (!MGR) { initManager(); return; }
  const form = FORMATIONS[MGR.formation] || FORMATIONS['4-3-3'];
  let totalOvr = 0; for (let i = 0; i < 11; i++) if (MGR.startingXI[i]) totalOvr += (MGR.startingXI[i].rating - getPenalty(MGR.startingXI[i].pos, form.slots[i].role));
  const ovr = Math.round(totalOvr / 11);
  const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)];
  const avgMorale = allP.length > 0 ? Math.round(allP.reduce((s,p)=>s+p.morale,0)/allP.length) : 50;
  const expiring = allP.filter(p => p.contractWeeks <= 5).length;
  $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><h2 style="margin:0;">${MGR.teamName}</h2><span class="pill pill-gold">Semana ${MGR.matchDay + 1}</span></div><div class="grid-3"><div class="center"><div class="dim">Presupuesto</div><div style="font-size:1.1rem; font-weight:800; color:var(--green);">${fmtMoney(MGR.budget)}</div></div><div class="center"><div class="dim">Media</div><div style="font-size:1.5rem; font-weight:800; color:var(--gold);">${ovr}</div></div><div class="center"><div class="dim">Puntos</div><div style="font-size:1.5rem; font-weight:800; color:var(--blue);">${MGR.points}</div></div></div><div style="margin-top:15px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;"><div class="pill ${avgMorale > 70 ? 'pill-green' : (avgMorale < 40 ? 'pill-gold' : '')}" style="border:1px solid var(--border-2);">Moral: ${avgMorale}%</div><div class="pill ${expiring > 0 ? 'pill-gold' : ''}" style="border:1px solid var(--border-2);">Contratos por vencer: ${expiring}</div><div class="pill" style="border:1px solid var(--border-2);">Formación: ${form.name}</div></div></div>
    <div class="card" style="background:var(--bg-2); padding: 10px; display:flex; justify-content:center; flex-direction:column; gap:10px;"><div style="text-align:center;"><button class="btn btn-gold btn-sm" onclick="openFormationPicker('mgr')">⚙️ Cambiar Formación</button></div>${renderPitch(MGR.startingXI, 'mgr', form, {})}</div>
    <div class="card"><h3>Banca</h3>${renderBench(MGR.bench, 'mgr')}<p class="dim center mt" style="font-size:0.75rem;">Arrastra jugadores aquí para guardarlos.</p></div>
    <div class="card"><h3>Noticias</h3><div style="max-height:100px; overflow-y:auto; font-size:0.85rem; padding:5px;">${MGR.news.map(n => `<div style="border-bottom:1px solid var(--border); padding:5px 0;">🔹 ${n}</div>`).join('')}</div></div>
    <div class="card"><div class="grid-2 mb"><button class="btn btn-green" onclick="playManagerMatch()">⚽ Jugar Partido</button><button class="btn btn-blue" onclick="screenSearchPlayers()">🔍 Mercado</button></div><div class="grid-2"><button class="btn btn-gold" onclick="screenMGRTraining()">🏋️ Entrenar</button><button class="btn btn-outline" onclick="screenMGRContracts()">📝 Contratos</button></div></div>
    <div class="card center"><button class="btn btn-outline btn-block" onclick="screenInicio()">← Volver al menú</button><button class="btn btn-outline btn-block mt" onclick="window.showConfirm('¿Reiniciar?', () => { localStorage.removeItem('mgr_v7'); MGR=null; screenManager(); }, null, 'Reiniciar Carrera')" style="color:var(--red);">Reiniciar Carrera</button></div></div>`;
}
function playManagerMatch() {
  const form = FORMATIONS[MGR.formation] || FORMATIONS['4-3-3']; 
  const starting = MGR.startingXI.map(p => p ? { ...p, morale: p.morale } : null); 
  const bench = MGR.bench.filter(p => p).map(p => ({ ...p, morale: p.morale }));
  const teamForSim = [...starting, ...bench];
  const bots = genBotTeam(70);
  
  window.startMatchSimulation(MGR.teamName, 'Rival FC', teamForSim, bots, (scoreA, scoreB, motm) => {
    if (scoreA > scoreB) MGR.points += 3; else if (scoreA === scoreB) MGR.points += 1;
    MGR.matchDay++; let totalSalary = 0; const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)];
    allP.forEach(p => { totalSalary += p.salary; p.contractWeeks--; }); MGR.budget -= totalSalary;
    MGR.startingXI.forEach(p => { if (!p) return; if (scoreA > scoreB) p.morale = clamp(p.morale + 10, 0, 100); else if (scoreA < scoreB) p.morale = clamp(p.morale - 10, 0, 100); });
    MGR.bench.forEach(p => { if (!p) return; p.morale = clamp(p.morale - 5, 0, 100); });
    const news = []; const chk = (arr) => { for (let i = 0; i < arr.length; i++) { if (arr[i] && arr[i].contractWeeks <= 0) { news.push(`🚨 ${arr[i].name} se fue libre.`); arr[i] = null; } } };
    chk(MGR.startingXI); chk(MGR.bench); if (news.length) MGR.news.unshift(...news);
    saveMGR();
    window.renderMatchResult(scoreA > scoreB ? '¡VICTORIA!' : scoreA < scoreB ? 'DERROTA' : 'EMPATE', MGR.teamName, 'Rival FC', scoreA, scoreB, `<div class="stat-row" style="border-top:1px solid var(--border); padding-top:15px; border-bottom:none;"><span class="lbl">Salarios pagados</span><span class="val" style="color:var(--red);">-${fmtMoney(totalSalary)}</span></div>`, () => screenManager(), motm);
  }, false, false, false, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })));
}
function screenMGRTraining() {
  const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)];
  $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><h2>Entrenamiento</h2></div><div class="card">${allP.map(p => `<div class="stat-row"><div><div style="font-weight:800;">${p.name} <span class="pill">${p.rating} GRL</span></div><div class="dim">${p.pos} · Moral: ${p.morale}%</div></div><button class="btn btn-sm btn-gold" onclick="doMGRTraining('${p.id}')">Entrenar</button></div>`).join('')}</div><div class="card center"><button class="btn btn-outline btn-block" onclick="screenManager()">← Volver</button></div></div>`;
}
function doMGRTraining(id) { const p = [...MGR.startingXI, ...MGR.bench].filter(x=>x).find(x => x.id === id); if (!p) return; window.startTrainingGame(() => { p.rating = Math.min(99, p.rating + 1); p.morale = clamp(p.morale + 15, 0, 100); saveMGR(); window.showAlert(`¡${p.name} entrenó! +1 GRL, +15 Moral.`); screenMGRTraining(); }, () => { p.morale = clamp(p.morale - 10, 0, 100); saveMGR(); window.showAlert(`${p.name} falló. -10 Moral.`); screenMGRTraining(); }); }
function screenMGRContracts() {
  const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)]; const exp = allP.filter(p => p.contractWeeks <= 10).sort((a,b) => a.contractWeeks - b.contractWeeks);
  $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><h2>Renovaciones</h2><p class="muted">Presupuesto: ${fmtMoney(MGR.budget)}</p></div><div class="card">${exp.length === 0 ? '<p class="dim center">No hay contratos por vencer.</p>' : exp.map(p => `<div class="stat-row"><div><div style="font-weight:800;">${p.name} <span class="pill">${p.rating} GRL</span></div><div class="dim">${p.pos} · Restan: <strong style="color:${p.contractWeeks < 3 ? 'var(--red)' : 'var(--orange)'};">${p.contractWeeks}</strong> · Sueldo: ${fmtMoney(p.salary)}/sem</div></div><button class="btn btn-sm btn-green" onclick="renewMGRContract('${p.id}')">Renovar</button></div>`).join('')}</div><div class="card center"><button class="btn btn-outline btn-block" onclick="screenManager()">← Volver</button></div></div>`;
}
function renewMGRContract(id) {
  const p = [...MGR.startingXI, ...MGR.bench].filter(x=>x).find(x => x.id === id); if (!p) return;
  const baseDemand = Math.round(p.price * 0.05); const moraleMod = p.morale > 70 ? 0.8 : (p.morale < 40 ? 1.3 : 1.0);
  const newSalary = Math.round(baseDemand * moraleMod); const signOn = Math.round(newSalary * 2);
  if (MGR.budget < signOn) { window.showAlert(`Necesitás ${fmtMoney(signOn)} para la prima.`); return; }
  window.showConfirm(`Renovar a ${p.name}?\nSueldo: ${fmtMoney(newSalary)}/sem\nPrima: ${fmtMoney(signOn)}\n+25 semanas.`, () => { MGR.budget -= signOn; p.salary = newSalary; p.contractWeeks += 25; p.morale = clamp(p.morale + 20, 0, 100); saveMGR(); window.showAlert(`¡${p.name} renovó!`); screenMGRContracts(); });
}

function screenSearchPlayers() {
  const market = []; for(let i=0; i<4; i++) market.push(generatePlayer('bronze')); for(let i=0; i<3; i++) market.push(generatePlayer('silver')); for(let i=0; i<2; i++) market.push(generatePlayer('gold')); for(let i=0; i<1; i++) market.push(generatePlayer('special'));
  market.sort((a,b) => b.rating - a.rating);
  $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><h2>Mercado de Manager</h2><p class="muted">Presupuesto: <strong class="green">${fmtMoney(MGR.budget)}</strong></p></div><div class="card">${market.map(p => `<div class="stat-row"><div><div style="font-weight:800;">${p.name} <span class="pill" style="font-size:0.6rem;">${p.tier.toUpperCase()}</span></div><div class="dim">${p.pos} · Valor: ${fmtMoney(p.price)} · Sueldo: ${fmtMoney(p.salary)}/sem</div></div><div style="text-align:right;"><div style="font-weight:900; font-size:1.2rem; color:var(--gold);">${p.rating}</div><button class="btn btn-sm btn-gold" onclick='openManagerNegotiation(${JSON.stringify(p)})'>Negociar</button></div></div>`).join('')}</div><div class="card center"><button class="btn btn-outline btn-block" onclick="screenManager()">← Volver</button></div></div>`;
}
let mgrNeg = null;
function openManagerNegotiation(player) { if (MGR.budget < player.price * 0.5) { window.showAlert('No tienes presupuesto.'); return; } mgrNeg = { player, offer: Math.round(player.price * 0.6), pacienciaClub: 100, pacienciaPlayer: 100, salary: Math.round(player.price * 0.05) }; renderMGRNegotiation(); }

function renderMGRNegotiation() {
  const n = mgrNeg; const p = n.player; const canAfford = MGR.budget >= n.offer;
  const minOffer = Math.round(p.price * 0.5); const maxOffer = Math.round(p.price * 1.5);
  if (n.offer < minOffer) n.offer = minOffer; if (n.offer > maxOffer) n.offer = maxOffer;
  const minSalary = Math.max(1000, Math.round(p.price * 0.02)); const maxSalary = Math.max(minSalary + 5000, Math.round(p.price * 0.1)); 
  if (n.salary < minSalary) n.salary = minSalary; if (n.salary > maxSalary) n.salary = maxSalary;
  $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><h2>Negociación</h2><div style="display:flex; gap:10px; align-items:center;"><div class="ut-card ${p.tier}" style="width:60px;height:80px;padding:4px;font-size:0.6rem;"><div class="rating" style="font-size:1.2rem;">${p.rating}</div><div class="pos">${p.pos}</div></div><div><div style="font-weight:800;font-size:1.1rem;">${p.name}</div><div class="dim">${p.tier.toUpperCase()} · ${p.pos}</div></div></div></div>
    <div class="card"><h3>Puja al Club</h3><div class="neg-slider"><div class="neg-slider-head" style="display:flex; justify-content:space-between; margin-bottom:5px;"><span class="lbl">Oferta de traspaso</span><span class="val" id="offer-val">${fmtMoney(n.offer)}</span></div><input type="range" min="${minOffer}" max="${maxOffer}" step="1000" value="${n.offer}" oninput="mgrNeg.offer=+this.value; document.getElementById('offer-val').textContent=fmtMoney(mgrNeg.offer);" style="width:100%; accent-color:var(--gold);"><div style="display:flex;justify-content:space-between;margin-top:5px;" class="dim"><span>Valor: ${fmtMoney(p.price)}</span><span>Tu Presupuesto: ${fmtMoney(MGR.budget)}</span></div></div>
      <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;"><span class="lbl">Paciencia del Club:</span> <strong style="color:${n.pacienciaClub > 50 ? 'var(--green)' : 'var(--red)'};">${n.pacienciaClub}%</strong></div>
      <h3 class="mt">Sueldo Semanal</h3><div class="neg-slider"><div class="neg-slider-head" style="display:flex; justify-content:space-between; margin-bottom:5px;"><span class="lbl">Sueldo ofrecido</span><span class="val" id="salary-val">${fmtMoney(n.salary)}</span></div><input type="range" min="${minSalary}" max="${maxSalary}" step="100" value="${n.salary}" oninput="mgrNeg.salary=+this.value; document.getElementById('salary-val').textContent=fmtMoney(mgrNeg.salary);" style="width:100%; accent-color:var(--gold);"></div>
      <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;"><span class="lbl">Paciencia del Jugador:</span> <strong style="color:${n.pacienciaPlayer > 50 ? 'var(--green)' : 'var(--red)'};">${n.pacienciaPlayer}%</strong></div>
    </div>
    <div class="card">${!canAfford ? '<p class="red mb">No tienes presupuesto.</p>' : ''}<button class="btn btn-gold btn-block" ${!canAfford?'disabled':''} onclick="submitMGRNegotiation()">Enviar Oferta</button><button class="btn btn-outline btn-block mt" onclick="screenSearchPlayers()">Cancelar</button></div></div>`;
}
function submitMGRNegotiation() {
  const n = mgrNeg; const p = n.player; const offerPct = n.offer / p.price; const salaryPct = n.salary / (p.price * 0.1);
  n.pacienciaClub = clamp(n.pacienciaClub - Math.round(offerPct < 0.8 ? (0.8 - offerPct) * 150 : 0), 0, 100); n.pacienciaPlayer = clamp(n.pacienciaPlayer - Math.round(salaryPct < 0.8 ? (0.8 - salaryPct) * 150 : 0), 0, 100);
  if (n.pacienciaClub <= 0) { window.showAlert('El club rompió la negociación.'); screenSearchPlayers(); return; }
  if (n.pacienciaPlayer <= 0) { window.showAlert('El jugador se ofendió.'); screenSearchPlayers(); return; }
  const clubOK = Math.random() < (offerPct >= 0.9 ? 0.9 : offerPct >= 0.75 ? 0.5 : 0.1); const playerOK = Math.random() < (salaryPct >= 0.9 ? 0.9 : salaryPct >= 0.75 ? 0.5 : 0.1);
  if (clubOK && playerOK) { MGR.budget -= n.offer; p.salary = n.salary; p.contractWeeks = 25; p.morale = 80; const emptyIdx = MGR.bench.findIndex(s => s === null); if (emptyIdx !== -1) MGR.bench[emptyIdx] = p; else { let w = 0, wr = 999; MGR.bench.forEach((b, i) => { if (b.rating < wr) { wr = b.rating; w = i; } }); MGR.bench[w] = p; } saveMGR(); window.showAlert(`¡Fichaje exitoso! ${p.name} se une al club.`); screenManager(); }
  else { window.showAlert('Oferta rechazada.'); renderMGRNegotiation(); }
}

const PC_NAMES = ["ElMatador99","Lucas10","xX_FifaKing_Xx","Bryan_Fut","ElProfe22","Tomi_Gol","ElTano","Crack_De_Barrio","La_Pulga","Pipa22","Matias_El7","Fede_La10","Rulo_99","Chino_Crack","Oli_FC"];
let PC = null;
function loadPC() { try { const d = localStorage.getItem('proClubs_v1'); if (d) { const p = JSON.parse(d); if (p && p.player && p.club && p.teammates) { PC = p; return true; } } } catch(e) {} return false; }
function savePC() { localStorage.setItem('proClubs_v1', JSON.stringify(PC)); }
function screenPCSetup() { $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><h2>Pro Clubs Offline (5v5)</h2></div><div class="card"><div class="field"><label>Gamertag</label><input id="pc-nombre" type="text" maxlength="20"></div><div class="field"><label>Posición</label><select id="pc-pos"><option value="ST">⚽ Delantero</option><option value="CM">🎯 Mediocampista</option><option value="CB">🛡️ Defensor</option><option value="GK">🧤 Arquero</option></select></div><div class="field"><label>Dorsal (1-99)</label><input id="pc-dorsal" type="number" min="1" max="99" value="10"></div><div class="field"><label>Nombre del club</label><input id="pc-club" type="text" maxlength="25" value="Los Pibes del Barrio"></div><button class="btn btn-gold btn-block" onclick="pcCreate()">Crear club</button><button class="btn btn-outline btn-block mt" onclick="screenInicio()">← Volver</button></div></div>`; }
function pcCreate() { const name = $('#pc-nombre').value.trim() || 'MiJugador'; const pos = $('#pc-pos').value; const dorsal = parseInt($('#pc-dorsal').value) || 10; const clubName = $('#pc-club').value.trim() || 'Mi Club FC'; const used = new Set([name]); const teammates = []; const roles = ['CB', 'CB', 'ST', 'ST']; for (let i = 0; i < 4; i++) { let n; do { n = randItem(PC_NAMES); } while (used.has(n)); used.add(n); teammates.push({ name: n, position: roles[i], rating: 50, dorsal: rand(1, 99) }); } PC = { player: { name, position: pos, rating: 50, dorsal }, club: { name: clubName, color: '#0a2a5e', division: 10, wins: 0, draws: 0, losses: 0 }, teammates, tp: 1 }; savePC(); screenPCLobby(); }
function screenPCLobby() { if (!PC) { screenPCSetup(); return; } $('#app').innerHTML = `<div id="app-inner"><div class="card card-gold"><div style="display:flex;align-items:center;gap:14px;"><div style="width:64px;height:64px;border-radius:16px;background:${PC.club.color};display:flex;align-items:center;justify-content:center;font-size:1.8rem;border:3px solid var(--gold);">🛡️</div><div style="flex:1;"><h2 style="margin:0;">${PC.club.name}</h2><div class="dim">División ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][PC.club.division-1]}</div></div><div style="text-align:right;"><div class="grl-big" style="color:var(--gold-2);">${PC.player.rating}</div><div class="grl-label">#${PC.player.dorsal} · TU GRL</div></div></div></div><div class="card"><h3>Entrenamiento</h3><p class="dim mb">Puntos: <strong class="gold">${PC.tp}</strong></p><button class="btn btn-blue btn-block" onclick="pcTrain()" ${PC.tp <= 0 ? 'disabled' : ''}>🏋️ Entrenar</button></div><div class="card center"><button class="btn btn-green btn-block" onclick="pcFindMatch()">🔍 Jugar 5v5</button><button class="btn btn-outline btn-block mt" onclick="screenInicio()">← Volver</button></div></div>`; }
function pcTrain() { if (PC.tp > 0) window.startTrainingGame(() => { PC.tp--; PC.player.rating = Math.min(99, PC.player.rating + 1); savePC(); screenPCLobby(); }, () => { PC.tp--; savePC(); screenPCLobby(); }); }
function pcFindMatch() { 
    const myTeam = [PC.player, ...PC.teammates]; 
    const bots = genBotTeam(); 
    const form = FORMATIONS['4-3-3'];
    window.startMatchSimulation('Mi Club', 'Rival FC', myTeam, bots, (a, b, motm) => { 
        if (a > b) PC.club.wins++; else if (a === b) PC.club.draws++; else PC.club.losses++; 
        PC.tp += 1; savePC(); 
        window.renderMatchResult(a>b?'¡GANAMOS!':a<b?'PERDIMOS':'EMPATE', 'Mi Club', 'Rival FC', a, b, `<p class="green">+1 Punto de Entrenamiento</p>`, () => screenPCLobby(), motm); 
    }, false, false, false, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); 
}

window.CoperoUI = { screenInicio, startOnline: () => { try { if (!window.FirebaseOnline) { window.showAlert('Online no disponible.'); return; } window.FirebaseOnline.openOnlinePortal(); } catch(e) { window.showAlert('Error: ' + e.message); } } };

if (localStorage.getItem('proClubs_v1')) loadPC();
screenInicio();
</script>
</body>
