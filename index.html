<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFC 2027 - Next Gen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f0d;--bg-2:#0f1712;--surface:#142019;--surface-2:#1a2a20;--surface-3:#213428;--border:#21362a;--border-2:#2d4534;--gold:#e0b93e;--gold-2:#f5d76e;--gold-soft:rgba(224,185,62,.12);--green:#4ade80;--green-2:#22c55e;--red:#f87171;--red-2:#ef4444;--orange:#fb923c;--blue:#60a5fa;--purple:#a78bfa;--text:#eef4f0;--text-2:#a8bfb3;--text-3:#6b8478}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:linear-gradient(-45deg,#050a08,#0f1712,#0d1f14,#142019);background-size:400% 400%;animation:gradientBG 15s ease infinite}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#app{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
#loading-screen{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s ease;pointer-events:none}
#loading-screen.active{opacity:1;pointer-events:auto}
.spinner-large{width:60px;height:60px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.fc-menu-container{display:flex;width:100vw;height:100vh;position:relative;overflow:hidden}
.fc-sidebar{width:320px;background:linear-gradient(90deg,rgba(5,10,8,.98) 0%,rgba(5,10,8,.8) 80%,transparent 100%);padding:40px 20px;display:flex;flex-direction:column;z-index:10;border-right:1px solid rgba(255,255,255,.05);backdrop-filter:blur(10px);overflow-y:auto}
.fc-logo-area{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-left:10px;cursor:pointer;user-select:none;transition:transform .2s}
.fc-logo-area:active{transform:scale(.95)}
.fc-logo-icon{background:linear-gradient(135deg,var(--surface-3),var(--surface));border:1px solid var(--border-2);border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 15px rgba(0,0,0,.6)}
.fc-logo-text{font-size:1.8rem;font-weight:900;font-style:italic;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.fc-nav{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;padding-right:5px}
.fc-nav::-webkit-scrollbar{width:4px}.fc-nav::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.fc-btn{background:transparent;border:none;color:rgba(255,255,255,.6);text-align:left;padding:12px 18px;font-size:.95rem;font-weight:800;font-style:italic;text-transform:uppercase;cursor:pointer;border-radius:6px;transition:all .25s;letter-spacing:.5px}
.fc-btn:hover,.fc-btn.active{color:#fff;background:linear-gradient(90deg,rgba(74,222,128,.25) 0%,transparent 100%);border-left:4px solid #4ade80;transform:translateX(4px)}
.fc-settings-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text-2);padding:12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.9rem;transition:all .3s;margin-top:10px}
.fc-settings-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:var(--gold)}
.fc-content-area{flex:1;padding:60px;display:flex;flex-direction:column;justify-content:center;z-index:10;max-width:800px;position:relative}
.page-transition{animation:pageFadeIn .5s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes pageFadeIn{0%{opacity:0;transform:scale(.95) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.page-transition-out{animation:pageFadeOut .3s ease-in forwards}
@keyframes pageFadeOut{0%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(1.05) translateY(-20px)}}
.fc-title{font-size:4rem;font-weight:900;font-style:italic;text-transform:uppercase;color:#fff;margin-bottom:15px;line-height:1.05;text-shadow:0 10px 30px rgba(0,0,0,.8);letter-spacing:-2px}
.fc-desc{font-size:1.2rem;color:rgba(255,255,255,.7);margin-bottom:40px;max-width:600px;line-height:1.6;font-weight:500}
.fc-play-btn{background:linear-gradient(135deg,#4ade80 0%,#22c55e 100%);color:#052e16;border:none;padding:18px 50px;font-size:1.2rem;font-weight:900;font-style:italic;text-transform:uppercase;border-radius:8px;cursor:pointer;align-self:flex-start;transition:all .3s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 10px 25px rgba(74,222,128,.4),inset 0 -4px 0 rgba(0,0,0,.2);letter-spacing:1px;position:relative;overflow:hidden}
.fc-play-btn:hover{transform:scale(1.05) translateY(-3px);box-shadow:0 15px 35px rgba(74,222,128,.6)}
#app-inner{max-width:1050px;margin:0 auto;padding:20px 16px 60px;width:100%;position:relative;z-index:5}
.top-back-btn{position:fixed;top:20px;left:20px;z-index:100;background:rgba(20,32,25,.8);border:1px solid var(--border-2);color:var(--text);padding:10px 20px;border-radius:30px;font-weight:800;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .3s;backdrop-filter:blur(10px);box-shadow:0 4px 15px rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:1px}
.top-back-btn:hover{background:var(--gold);color:#000;border-color:var(--gold);transform:translateY(-3px)}
.card{background:rgba(20,32,25,.85);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.6);backdrop-filter:blur(15px);transition:transform .2s}
.card-gold{border-color:var(--gold);background:linear-gradient(180deg,rgba(224,185,62,.1) 0%,rgba(20,32,25,.95) 100%);box-shadow:0 0 0 1px rgba(224,185,62,.2),0 10px 40px rgba(224,185,62,.1)}
h1{font-size:1.6rem;color:var(--gold);font-weight:800;line-height:1.15}
h2{font-size:1.25rem;color:var(--gold-2);font-weight:800;margin-bottom:12px;font-style:italic;text-transform:uppercase;letter-spacing:1px}
h3{font-size:.8rem;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
p{font-size:.95rem;color:var(--text)}
.muted{color:var(--text-2)}.dim{color:var(--text-3);font-size:.82rem}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.purple{color:var(--purple)}.orange{color:var(--orange)}
.center{text-align:center}.mt{margin-top:12px}.mb{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border:none;border-radius:8px;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;transition:all .2s;text-align:center;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,var(--gold-2) 0%,var(--gold) 100%);color:#1a1200;box-shadow:0 4px 15px rgba(224,185,62,.3),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn-gold:hover{box-shadow:0 6px 20px rgba(224,185,62,.5);transform:translateY(-2px)}
.btn-green{background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);color:#052e16;box-shadow:0 4px 15px rgba(74,222,128,.3),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn-green:hover{box-shadow:0 6px 20px rgba(74,222,128,.5);transform:translateY(-2px)}
.btn-red{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);color:#fff;box-shadow:0 4px 15px rgba(239,68,68,.3),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn-blue{background:linear-gradient(135deg,#60a5fa 0%,#3b82f6 100%);color:#fff;box-shadow:0 4px 15px rgba(96,165,250,.3)}
.btn-purple{background:linear-gradient(135deg,#a78bfa 0%,#8b5cf6 100%);color:#fff}
.btn-outline{background:rgba(255,255,255,.03);border:1px solid var(--border-2);color:var(--text);backdrop-filter:blur(5px)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.btn-block{display:flex;width:100%}.btn-sm{padding:8px 16px;font-size:.8rem}
input,select,textarea{width:100%;padding:12px 16px;background:rgba(0,0,0,.4);border:1px solid var(--border-2);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem;transition:all .2s;box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(224,185,62,.3)}
label{display:block;font-size:.85rem;color:var(--text-2);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:16px}
.grid-1{display:grid;grid-template-columns:1fr;gap:10px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.progress{width:100%;height:8px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .5s}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.95rem}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:800;background:rgba(255,255,255,.1);color:var(--text-2);text-transform:uppercase;letter-spacing:.5px}
.pill-gold{background:rgba(224,185,62,.15);color:var(--gold);border:1px solid rgba(224,185,62,.3)}.pill-green{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal-content{background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);border:1px solid var(--border-2);border-radius:20px;padding:26px;max-width:520px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.9)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.modal-close{background:transparent;border:none;color:var(--text-2);font-size:1.8rem;cursor:pointer;line-height:1}.modal-close:hover{color:var(--red)}
.card-pack{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}
.ut-card{width:110px;height:154px;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:all .3s;box-shadow:0 15px 25px rgba(0,0,0,.6);cursor:pointer;user-select:none}
.ut-card:hover{transform:translateY(-10px) scale(1.05);z-index:10}
.ut-card.gold{background:linear-gradient(135deg,#f5d76e,#b8860b);color:#000;border:2px solid #fff}.ut-card.toty{background:linear-gradient(135deg,#001f3f,#0074D9,#7FDBFF);color:#fff;border:2px solid #7FDBFF}.ut-card.tots{background:linear-gradient(135deg,#FF4136,#FF851B,#FFDC00);color:#fff;border:2px solid #FFDC00}.ut-card.icon{background:linear-gradient(135deg,#85144b,#F012BE,#B10DC9);color:#fff;border:2px solid #fff}.ut-card.totw{background:linear-gradient(135deg,#111,#333);color:#ffd700;border:2px solid #ffd700}.ut-card.bronze{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff;border:2px solid #e6b17e}.ut-card.silver{background:linear-gradient(135deg,#bdc3c7,#7f8c8d);color:#000;border:2px solid #ecf0f1}
.ut-card .rating{font-size:1.8rem;font-weight:900;line-height:1;pointer-events:none}.ut-card .pos{font-size:.7rem;font-weight:800;margin-bottom:4px;pointer-events:none}.ut-card .name{font-size:.75rem;font-weight:900;text-transform:uppercase;text-align:center;line-height:1.1;margin-top:6px;pointer-events:none}
@keyframes cardFlipIn{0%{transform:rotateY(90deg) scale(.5);opacity:0}100%{transform:rotateY(0) scale(1);opacity:1}}.card-flip{animation:cardFlipIn .6s cubic-bezier(.175,.885,.32,1.275) forwards}
.pitch{position:relative;width:100%;max-width:480px;height:620px;background:linear-gradient(180deg,#1b5e20 0%,#0f3d14 100%);border-radius:12px;border:3px solid rgba(255,255,255,.8);margin:0 auto 20px auto;box-shadow:inset 0 0 50px rgba(0,0,0,.5)}
.spot{position:absolute;transform:translate(-50%,-50%);width:60px;height:82px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-align:center;cursor:grab;box-shadow:0 6px 10px rgba(0,0,0,.6);z-index:10;transition:all .15s;touch-action:none;border:2px solid #fff;user-select:none;-webkit-user-select:none}
.spot:hover{transform:translate(-50%,-50%) scale(1.15);z-index:20}.spot.dragging{opacity:.4}.spot.drag-active{border-color:var(--green);box-shadow:0 0 25px var(--green);transform:translate(-50%,-50%) scale(1.1)}.spot.selected{border-color:#ffd700;box-shadow:0 0 25px #ffd700;transform:translate(-50%,-50%) scale(1.15);z-index:25}.spot.out-of-position{border-color:var(--red)}
.spot.gold{background:linear-gradient(180deg,#f5d76e,#b8860b);color:#000}.spot.toty{background:linear-gradient(180deg,#7FDBFF,#0074D9);color:#fff}.spot.tots{background:linear-gradient(180deg,#FFDC00,#FF4136);color:#fff}.spot.icon{background:linear-gradient(180deg,#F012BE,#85144b);color:#fff}.spot.totw{background:linear-gradient(180deg,#333,#111);color:#ffd700;border-color:#ffd700}.spot.bronze{background:linear-gradient(180deg,#e6b17e,#8b4513);color:#fff}.spot.silver{background:linear-gradient(180deg,#ecf0f1,#7f8c8d);color:#000}
.spot.empty{background:rgba(0,0,0,.3);border:2px dashed rgba(255,255,255,.4);color:rgba(255,255,255,.6);cursor:default}.spot.empty.drag-active{border-color:var(--green);box-shadow:0 0 20px var(--green);background:rgba(74,222,128,.2)}
.spot-rating{font-size:18px;line-height:1;font-weight:900;pointer-events:none}.spot-pos{font-size:9px;line-height:1;margin-top:2px;font-weight:900;text-transform:uppercase;pointer-events:none}.spot-name{font-size:10px;line-height:1;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:54px;font-weight:800;pointer-events:none}
.spot-remove{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#ef4444;color:#fff;border:2px solid #fff;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:30}
.spot:hover .spot-remove,.bench-spot:hover .spot-remove{display:flex}
.chem-dot{position:absolute;top:-4px;left:-4px;width:12px;height:12px;border-radius:50%;border:2px solid rgba(0,0,0,.5)}
.bench-container{display:flex;gap:12px;justify-content:center;padding:16px;background:rgba(0,0,0,.3);border-radius:12px;border:1px solid var(--border);overflow-x:auto}
.bench-spot{width:60px;height:82px;border-radius:10px;border:2px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;position:relative;user-select:none}
.bench-spot.filled{border:2px solid #fff;cursor:grab;box-shadow:0 4px 8px rgba(0,0,0,.6)}.bench-spot.selected{border-color:#ffd700;box-shadow:0 0 20px #ffd700}.bench-spot.drag-active{border-color:var(--green);box-shadow:0 0 20px var(--green);background:rgba(74,222,128,.2)}
#tooltip{position:fixed;background:rgba(10,15,13,.95);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:.85rem;pointer-events:none;opacity:0;transition:opacity .2s;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,.8);transform:translate(-50%,-120%)}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto}
.train-container{position:relative;width:100%;height:36px;background:rgba(0,0,0,.6);border-radius:18px;margin:24px 0;overflow:hidden;border:1px solid var(--border)}.train-target{position:absolute;top:0;bottom:0;background:rgba(74,222,128,.3);border-left:3px solid var(--green);border-right:3px solid var(--green)}.train-cursor{position:absolute;top:0;bottom:0;width:6px;background:var(--gold);box-shadow:0 0 15px var(--gold);z-index:2;border-radius:3px}
.grl-big{font-size:3.5rem;font-weight:900;color:var(--gold);line-height:1;text-shadow:0 5px 15px rgba(224,185,62,.3)}
#sim-canvas{display:block;width:100%;height:auto;aspect-ratio:1000/660;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.8);cursor:default;background:#000}#sim-canvas.ended{cursor:pointer}
.match-modal{position:absolute;inset:0;background:rgba(3,7,5,.85);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;border-radius:16px}.match-modal-content{background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);border:1px solid var(--gold);border-radius:20px;padding:24px;width:90%;max-width:600px;max-height:90%;overflow-y:auto}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:4px;overflow-x:auto}.tab{background:transparent;border:none;color:var(--text-3);padding:10px 20px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}.tab.active{color:var(--gold);background:rgba(224,185,62,.1);border-bottom:3px solid var(--gold)}
.market-row{display:grid;grid-template-columns:50px 1fr 80px 100px 100px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}.market-row:hover{background:rgba(255,255,255,.02)}.market-row .grl-badge{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;font-weight:900;padding:6px;border-radius:8px;text-align:center;font-size:1rem}
.filter-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
.rare-overlay{position:fixed;inset:0;background:#000;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center}.rare-overlay.hidden{display:none}.rare-spinner{width:100px;height:100px;border:4px solid #333;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
.switch{position:relative;display:inline-block;width:50px;height:26px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:rgba(0,0,0,.6);border:1px solid var(--border-2);transition:.4s;border-radius:26px}.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:var(--text-2);transition:.4s;border-radius:50%}input:checked+.slider{background-color:var(--green-2);border-color:var(--green)}input:checked+.slider:before{transform:translateX(24px);background-color:#fff}
.stat-bar-container{display:flex;align-items:center;gap:10px;margin-bottom:8px}.stat-bar-label{width:40px;font-size:.75rem;font-weight:800;color:var(--text-2)}.stat-bar-bg{flex:1;height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden}.stat-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:4px}.stat-bar-val{width:25px;text-align:right;font-size:.8rem;font-weight:900;color:var(--text)}
.fc-barrio-card{background:linear-gradient(135deg,rgba(74,222,128,.15),rgba(224,185,62,.1));border:1px solid rgba(74,222,128,.3);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.fc-barrio-icon{font-size:1.8rem}.fc-barrio-info{flex:1;min-width:0}.fc-barrio-name{font-weight:800;font-size:.95rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc-barrio-level{font-size:.72rem;color:var(--gold);text-transform:uppercase;font-weight:700}
.fc-tano-tip{font-size:.72rem;color:var(--text-2);padding:8px 10px;background:rgba(0,0,0,.25);border-left:2px solid var(--gold);border-radius:4px;margin-bottom:10px;font-style:italic;line-height:1.35}.fc-tano-tip::before{content:'🎙️ El Tano: ';color:var(--gold);font-weight:800;font-style:normal}
.bp-reward-row{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;padding:8px;border-bottom:1px solid rgba(255,255,255,.05);align-items:stretch}
.bp-reward-row.current{background:rgba(224,185,62,.18);border-radius:8px;box-shadow:0 0 0 1px var(--gold)}

.pack-stage { position: fixed; inset: 0; background: #050a08; z-index: 50000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.pack-lights { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(224,185,62,0.4) 0%, transparent 60%); opacity: 0; transition: opacity 0.5s; }
.pack-lights.rare { animation: flashRare 1.5s infinite alternate; }
@keyframes flashRare { 0% { opacity: 0.2; transform: scale(1); } 100% { opacity: 1; transform: scale(1.2); background: radial-gradient(circle at center, rgba(224,185,62,0.8) 0%, transparent 70%); } }
.pack-envelope { width: 220px; height: 300px; background: linear-gradient(135deg, #1a2a20, #0f1712); border: 4px solid var(--gold); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(224,185,62,0.2); position: relative; cursor: pointer; transition: all 0.4s; display: flex; align-items: center; justify-content: center; }
.pack-envelope:hover { transform: scale(1.05) translateY(-10px); box-shadow: 0 30px 60px rgba(224,185,62,0.4); }
.pack-envelope::before { content: '🎁'; font-size: 5rem; position: absolute; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
.pack-envelope.opened { opacity: 0; transform: scale(0.5) translateY(100px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
.pack-hint { margin-top: 30px; color: var(--gold); font-weight: 800; animation: introPulse 1.5s infinite; letter-spacing: 2px; }
.pack-cards-wrapper { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; perspective: 1000px; }
.reveal-card { width: 180px; height: 260px; position: relative; opacity: 0; transform: translateY(50px) scale(0.8); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.reveal-card.show { opacity: 1; transform: translateY(0) scale(1); }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; cursor: pointer; }
.flip-inner.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; width: 100%; height: 100%; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 3px solid #fff; }
.card-back-face { background: linear-gradient(135deg, #1a2a20, #0f1712); border-color: var(--gold); }
.card-back-face::before { content: '⚽'; font-size: 4rem; opacity: 0.5; }
.card-front-face { transform: rotateY(180deg); padding: 15px; }
.card-front-face.gold { background: linear-gradient(135deg, #f5d76e, #b8860b); color: #000; border-color: #fff; }
.card-front-face.toty { background: linear-gradient(135deg, #001f3f, #0074D9, #7FDBFF); color: #fff; border-color: #7FDBFF; }
.card-front-face.tots { background: linear-gradient(135deg, #FF4136, #FF851B, #FFDC00); color: #fff; border-color: #FFDC00; }
.card-front-face.icon { background: linear-gradient(135deg, #85144b, #F012BE, #B10DC9); color: #fff; border-color: #fff; }
.card-front-face.totw { background: linear-gradient(135deg, #111, #333); color: #ffd700; border-color: #ffd700; }
.card-front-face.silver { background: linear-gradient(135deg, #bdc3c7, #7f8c8d); color: #000; border-color: #ecf0f1; }
.card-front-face.bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; border-color: #e6b17e; }
.card-front-face .rating { font-size: 3rem; font-weight: 900; line-height: 1; }
.card-front-face .pos { font-size: 1rem; font-weight: 800; margin-bottom: 5px; }
.card-front-face .name { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.1; margin-top: 10px; }
.card-front-face .nation { font-size: 2rem; margin-top: 10px; }
.pack-continue-btn { margin-top: 40px; padding: 15px 40px; font-size: 1.2rem; display: none; opacity: 0; transition: opacity 0.5s; }
.pack-continue-btn.show { display: inline-flex; opacity: 1; }

/* ═══ v3: banderas, escudos, manager ═══ */
.uc-nat{padding-top:.4em}.uc-nat .flag{width:1.7em;height:1.1em;border-radius:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.35);display:block;margin:0 auto}
.uc-crest{margin-top:.35em}.uc-crest .crest{width:1.6em;height:1.9em;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.crest{display:inline-block;vertical-align:middle}.flag{vertical-align:middle}
.mgr-sq{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}.mgr-sq>div{display:flex;flex-direction:column;align-items:center;gap:8px}
.mgr-club{cursor:pointer;text-align:center;transition:transform .2s,border-color .2s}.mgr-club:hover{transform:translateY(-4px);border-color:var(--gold)}
.mgr-tab{display:grid;grid-template-columns:28px 1fr 34px 40px 44px;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.9rem}
.mgr-tab.me{background:rgba(224,185,62,.14);border-radius:8px;font-weight:800}.mgr-tab.hd{color:var(--text-3);font-size:.75rem}
.mgr-form span{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:6px;text-align:center;font-weight:900;font-size:.8rem;margin:0 2px;color:#07130c}

.pc-photo{border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex-shrink:0;display:block}
.pc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pc-pl{display:flex;flex-direction:column;gap:8px}
.pc-grl{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1;color:var(--gold)}
input[type=color]{padding:2px;height:42px;cursor:pointer}

/* ═══ Pase v2 ═══ */
.bp2{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:stretch}
.bp2-side{background:linear-gradient(180deg,rgba(26,42,32,.95),rgba(10,16,13,.95));border:1px solid var(--border-2);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.bp2-feat{padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;background:radial-gradient(120% 80% at 50% 0%,rgba(224,185,62,.28),transparent 70%)}
.bp2-feat .ut-card{width:150px;height:212px;font-size:15px}
.bp2-buy{width:100%;border:none;border-radius:8px;padding:11px;font-family:var(--display);font-size:1.25rem;font-weight:800;letter-spacing:.06em;cursor:pointer;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1a1200;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.bp2-buy.on{background:rgba(167,139,250,.2);color:#c4b5fd;cursor:default;box-shadow:none}
.bp2-info{padding:14px 14px 16px;background:rgba(0,0,0,.35);font-size:.82rem;color:var(--text-2);display:flex;flex-direction:column;gap:10px;flex:1}
.bp2-lvl{display:flex;align-items:center;gap:12px}
.bp2-hex{width:46px;height:46px;transform:rotate(45deg);border:3px solid var(--green);background:#0b1410;display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0}
.bp2-hex b{transform:rotate(-45deg);font-family:var(--display);font-size:1.5rem;color:#fff}
.bp2-main{background:rgba(8,14,11,.7);border:1px solid var(--border);border-radius:14px;padding:10px 0 12px;min-width:0;display:flex;flex-direction:column}
.bp2-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 8px;flex-wrap:wrap}
.bp2-rail{display:flex;overflow-x:auto;scroll-behavior:smooth;padding:0 6px 6px}
.bp2-rail::-webkit-scrollbar{height:6px}.bp2-rail::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.bp2-col{flex:0 0 112px;padding:6px;display:flex;flex-direction:column;gap:0;border-radius:10px}
.bp2-col.cur{background:linear-gradient(180deg,rgba(224,185,62,.28),rgba(224,185,62,.08))}
.bp2-tile{position:relative;height:150px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.78rem;font-weight:800;line-height:1.35;overflow:hidden}
.bp2-vip{background:linear-gradient(180deg,rgba(124,92,230,.3),rgba(40,30,80,.55));border:1px solid rgba(167,139,250,.35)}
.bp2-free{background:linear-gradient(180deg,rgba(74,222,128,.22),rgba(20,60,36,.5));border:1px solid rgba(74,222,128,.3)}
.bp2-ico{font-size:2.6rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.ut-card.ut-mini{width:62px;height:88px;font-size:6.2px;cursor:default}
.ut-card.ut-mini:hover{transform:none}
.bp2-tile.locked{opacity:.5}
.bp2-tile.claimed>*{opacity:.35}
.bp2-tile.claimed::after,.bp2-tile.vlock::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:1;background:rgba(0,0,0,.25)}
.bp2-tile.claimed::after{content:'✓';color:var(--green);font-weight:900}
.bp2-tile.vlock::after{content:'🔒';font-size:1.5rem;align-items:flex-end;padding-bottom:8px;background:none}
.bp2-tile.ready{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(224,185,62,.35)}
.bp2-node{height:50px;display:flex;align-items:center;justify-content:center;position:relative}
.bp2-node::before{content:'';position:absolute;left:-6px;right:-6px;top:50%;height:3px;margin-top:-1px;background:#2d4534}
.bp2-col.reached .bp2-node::before{background:var(--gold)}
.bp2-dia{position:relative;width:28px;height:28px;transform:rotate(45deg);background:#16241b;border:2px solid #4b6b57;display:flex;align-items:center;justify-content:center;border-radius:3px}
.bp2-dia b{transform:rotate(-45deg);font-size:.78rem;color:#cfe3d6}
.bp2-col.reached .bp2-dia{background:var(--gold);border-color:#fff3b0}.bp2-col.reached .bp2-dia b{color:#1a1200}
.bp2-col.cur .bp2-dia{width:34px;height:34px;box-shadow:0 0 18px var(--gold)}
.bp2-col.mile .bp2-dia{border-color:var(--gold-2)}
.bp2-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:8px 14px 0;flex-wrap:wrap}
.bp2-collect{font-family:var(--display);font-size:1.2rem;font-weight:800;letter-spacing:.06em;padding:10px 28px;border-radius:24px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--green),var(--green-2));color:#07130c}
.bp2-collect:disabled{background:#2a3a30;color:#6b8478;cursor:not-allowed}
.bp2-arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-2);background:rgba(255,255,255,.05);color:#fff;font-size:1.1rem;cursor:pointer}
.bp2-arrow:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:768px){.bp2{grid-template-columns:1fr}.bp2-feat .ut-card{width:120px;height:170px;font-size:12px}}
@media(prefers-reduced-motion:reduce){.bp2-rail{scroll-behavior:auto}}

[onpointerdown]{touch-action:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.drag-ghost{position:fixed;margin:0!important;pointer-events:none!important;z-index:99999;opacity:.95;transition:none!important;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
.ut-card.selected{transform:translateY(-6px);filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 10px #ffd700)}
[data-drop-type=collection].drag-active{outline:2px dashed var(--green);background:rgba(74,222,128,.08)}

/* ═══ UI global v3 ═══ */
*{scrollbar-width:thin;scrollbar-color:#2d4534 transparent}
body{-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em}
h2{font-size:1.75rem}h3{font-size:1.35rem}
.card:not(.card-gold){border-radius:16px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 8px 30px rgba(0,0,0,.28)}
.card.card-gold{border-radius:16px}
.btn{border-radius:10px;font-family:var(--display);letter-spacing:.06em;font-size:1.1rem;transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:focus-visible,.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{font-size:1rem}
.tabs{gap:6px;padding:5px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.tab{border-radius:10px;font-family:var(--display);font-size:1.1rem;letter-spacing:.05em}
input:not([type=color]):not([type=file]):not([type=checkbox]),select,textarea{border-radius:10px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(224,185,62,.2)}
.top-back-btn{border-radius:999px;font-family:var(--display);letter-spacing:.06em;backdrop-filter:blur(8px)}
.modal-overlay{backdrop-filter:blur(8px);animation:uiFade .2s ease-out}
.modal-content{border-radius:18px;animation:uiPop .28s cubic-bezier(.2,.9,.3,1.2)}
.page-transition{animation:uiRise .35s ease-out both}
@keyframes uiFade{from{opacity:0}to{opacity:1}}
@keyframes uiPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes uiRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Clubs Pro online */
.pcn-code{font-family:monospace;font-size:2.1rem;letter-spacing:6px;font-weight:900;color:var(--gold);text-align:center}
.pcn-slot{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin:0}
.pcn-slot.free{opacity:.7;border-style:dashed!important}
.pcn-slot.mine{border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold),0 8px 30px rgba(0,0,0,.28)!important}
.pcn-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#52645a;margin-right:6px}
.pcn-dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}

/* ═══ Tienda de sobres ═══ */
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pk-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:0;transition:transform .2s,border-color .2s}
.pk-card:hover{transform:translateY(-4px)}
.pk{position:relative;width:132px;height:184px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pk-card:hover .pk{transform:rotate(-3deg) scale(1.06)}
.pk::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,var(--a),var(--b));clip-path:polygon(0 4%,8% 0,16% 4%,24% 0,32% 4%,40% 0,48% 4%,56% 0,64% 4%,72% 0,80% 4%,88% 0,96% 4%,100% 0,100% 96%,92% 100%,84% 96%,76% 100%,68% 96%,60% 100%,52% 96%,44% 100%,36% 96%,28% 100%,20% 96%,12% 100%,4% 96%,0 100%)}
.pk::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 48%,transparent 60%);clip-path:inset(4% 0);mix-blend-mode:overlay}
.pk-in{position:absolute;inset:14% 10%;z-index:2;border:2px solid color-mix(in srgb,var(--ink) 55%,transparent);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-family:var(--display);font-weight:800;line-height:1}
.pk-in b{font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase}
.pk-in i{font-style:normal;font-size:1.05rem;letter-spacing:.2em}
.pk-in span{font-size:2.3rem}
.pk-odds{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.pk-odds span{font-size:.72rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--text-2)}
.pk-meta{font-size:.82rem;color:var(--text-2);min-height:2.4em}

/* ═══ Ruleta ═══ */
.wh{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:26px auto 18px}
.wh-disc{position:absolute;inset:0;border-radius:50%;border:6px solid var(--gold);box-shadow:0 0 44px rgba(224,185,62,.3);transform:rotate(0deg)}
.wh-disc span{position:absolute;left:50%;top:50%;width:96px;margin:-10px 0 0 -48px;text-align:center;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.05;color:#fff;text-shadow:0 1px 3px #000}
.wh-ptr{position:absolute;left:50%;top:-16px;margin-left:-14px;border:14px solid transparent;border-top:28px solid #fff;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.wh-cap{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold));z-index:2;box-shadow:0 0 0 4px #0b1410}

/* ═══ Intro, hub y login v4 ═══ */
.intro-btn{position:absolute;border-radius:50%;cursor:pointer;display:grid;place-items:center;border:3px solid #e0b93e;background:rgba(2,8,5,.55);backdrop-filter:blur(6px);padding:0}
#intro-play{left:50%;top:50%;width:clamp(84px,15vmin,132px);height:clamp(84px,15vmin,132px);margin:calc(clamp(84px,15vmin,132px)/-2) 0 0 calc(clamp(84px,15vmin,132px)/-2);animation:introRing 1.8s ease-in-out infinite}
#intro-skip{right:22px;bottom:22px;width:46px;height:46px;border-width:2px;opacity:.7;display:none}
#intro-skip:hover{opacity:1}
@keyframes introRing{0%,100%{box-shadow:0 0 0 0 rgba(224,185,62,.5)}50%{box-shadow:0 0 0 22px rgba(224,185,62,0)}}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.hub-tile{--ac:#4ade80;position:relative;overflow:hidden;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;min-height:118px;padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.1);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);background:#0c130f;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,#0c130f),#0a100d 75%);transition:transform .2s,box-shadow .2s;font:inherit}
.hub-tile.wide{grid-column:1/-1;min-height:104px}
.hub-tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 1px var(--ac)}
.hub-tile:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hub-ico{position:absolute;right:14px;top:8px;font-size:4.2rem;opacity:.28;line-height:1;transition:transform .3s,opacity .3s}
.hub-tile:hover .hub-ico{transform:scale(1.12) rotate(-6deg);opacity:.45}
.hub-t{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.03em;line-height:1;color:var(--ac)}
.hub-s{font-size:.82rem;color:var(--text-2)}
.auth-gate{position:relative;overflow:hidden;background:radial-gradient(90% 60% at 50% 0%,rgba(74,222,128,.12),transparent 70%)}
.auth-gate::before{content:'';position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border:2px solid rgba(255,255,255,.04);border-radius:50%;pointer-events:none}
.auth-gate::after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.04);pointer-events:none}
.auth-box{position:relative;z-index:1}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .fc-logo-text{font-size:4rem;justify-content:center}
.auth-brand p{margin:8px 0 0;color:var(--text-2)}
.card.card-gold{background:linear-gradient(135deg,rgba(224,185,62,.16),rgba(10,16,13,.96) 60%);position:relative;overflow:hidden}
.card.card-gold::after{content:'';position:absolute;right:-70px;top:-70px;width:210px;height:210px;border:2px solid rgba(224,185,62,.14);border-radius:50%;pointer-events:none}
.card[onclick]{cursor:pointer}
.card[onclick]:hover{border-color:rgba(224,185,62,.5)!important}
@media(max-width:480px){.hub-t{font-size:1.4rem}.hub-ico{font-size:3.4rem}.auth-brand .fc-logo-text{font-size:3.2rem}}

/* ═══ Menú v5: layout "hub" (barra superior + escenario + dock) ═══ */
.hb{--gap:14px;min-height:100vh;max-width:1500px;margin:0 auto;padding:16px 22px 20px;display:flex;flex-direction:column;gap:var(--gap)}
.hb-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;background:rgba(8,14,11,.78);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.hb-top .fc-logo-text{font-size:2.2rem;cursor:pointer}
.hb-sp{flex:1}
.hb-chip{display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1}
.hb-chip small{font-family:inherit;font-size:.8rem;color:var(--text-3);font-weight:600}
.hb-me{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.hb-me .fc-avatar{width:34px;height:34px;font-size:1.15rem}
.hb-me b{font-size:.9rem;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-ib{height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-family:var(--display);font-size:1.05rem;letter-spacing:.05em;cursor:pointer;transition:background .2s,border-color .2s}
.hb-ib:hover{border-color:var(--gold);background:rgba(224,185,62,.12)}
.hb-ib.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1a1200;border:none;font-weight:800}
.hb-strip{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.hb-strip>*{flex:1;min-width:240px;margin:0!important}
.hb-stage{display:flex;gap:var(--gap);flex:1;min-height:440px}
.hb-panel{--ac:#4ade80;--accent:var(--ac);position:relative;flex:1;min-width:0;border-radius:22px;overflow:hidden;cursor:pointer;outline:none;border:1px solid rgba(255,255,255,.1);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);background:#0b120e;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 28%,#0b120e),#070b09 72%);transition:flex .5s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.hb-panel.focus{flex:2.5;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--ac)}
.hb-panel:focus-visible{box-shadow:0 0 0 3px #fff}
.hb-wm{position:absolute;right:-10px;top:-6px;font-size:9rem;line-height:1;opacity:.12;transition:opacity .4s,transform .5s;pointer-events:none}
.hb-panel.focus .hb-wm{opacity:.05;transform:scale(1.2)}
.hb-art{position:absolute;left:16px;right:16px;top:16px;bottom:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:translateY(14px);transition:opacity .4s .1s,transform .5s .1s;pointer-events:none}
.hb-panel.focus .hb-art{opacity:1;transform:none}
.hb-body{position:absolute;inset:auto 0 0 0;padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.hb-title{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(1.9rem,2.6vw,2.9rem);line-height:.95;color:#fff}
.hb-title::after{content:'';display:block;width:56px;height:5px;margin-top:10px;background:var(--ac);transform:skewX(-20deg);transition:width .4s}
.hb-panel.focus .hb-title::after{width:96px}
.hb-more{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s,opacity .35s}
.hb-panel.focus .hb-more{max-height:260px;opacity:1}
.hb-more .fc-desc{margin:6px 0 16px;font-size:1rem}.hb-more .fc-actions{margin:0}
.hb-art .fc-fan{padding:0}.hb-art .fc-fan .ut-card.ut-hero{width:140px;height:198px;font-size:14px;margin-left:-26px;pointer-events:auto}
.hb-art .fc-fan .ut-card.ut-hero:first-child{margin-left:0}
.hb-art .fc-ring{width:180px;height:180px}.hb-art .fc-ring-in{width:146px;height:146px}.hb-art .fc-ring-in b{font-size:4rem}
.hb-art .fc-teams{max-width:380px;gap:8px}.hb-art .fc-team{padding:8px 12px}.hb-art .fc-team b{font-size:1.7rem}
.hb-dock{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.hb-tile{--ac:#4ade80;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:var(--display);font-size:1.02rem;letter-spacing:.05em;text-align:center;line-height:1.1;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.hb-tile .ic{font-size:1.8rem;line-height:1}
.hb-tile:hover,.hb-tile:focus-visible{transform:translateY(-3px);border-color:var(--ac);background:rgba(255,255,255,.07);box-shadow:0 10px 24px rgba(0,0,0,.35);outline:none}

<script>
const $ = s => document.querySelector(s);
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const randItem = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

const ADMIN_REG_CODE = 'MFC-ADMIN-2027-SECRET';
let currentLang = 'es';

// ═══ VARIABLES GLOBALES (Se inicializan vacías, dependen del usuario) ═══
let UT = null;
let BP = null;

window.MFCMusic = {
  menuAudio:null,goalAudio:null,crowdGain:null,ctx:null,_menuPlaying:false,_menuEnabled:true,
  init(){this.menuAudio=document.getElementById('menu-music');this.goalAudio=document.getElementById('goal-cheer-audio');if(this.menuAudio)this.menuAudio.volume=.32;if(this.goalAudio)this.goalAudio.volume=.6;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.crowdGain=this.ctx.createGain();this.crowdGain.gain.value=0;this.crowdGain.connect(this.ctx.destination);if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
  playMenu(){this._menuPlaying=true;if(this._menuEnabled&&this.menuAudio){this.menuAudio.currentTime=0;this.menuAudio.play().catch(e=>{})}},
  stopMenu(){this._menuPlaying=false;if(this.menuAudio)this.menuAudio.pause()},
  fadeMenu(fadeOut=true,duration=1.5){if(!this.menuAudio)return;const s=this.menuAudio.volume;const e=fadeOut?0:.32;const t0=performance.now();const f=()=>{const el=(performance.now()-t0)/1000;if(el>=duration){this.menuAudio.volume=e;if(fadeOut)this.stopMenu();else if(this._menuPlaying)this.menuAudio.play().catch(e=>{});return}this.menuAudio.volume=s+(e-s)*(el/duration);requestAnimationFrame(f)};f()},
  startCrowd(){if(!this.ctx)return;const t=this.ctx.currentTime;this.crowdGain.gain.cancelScheduledValues(t);this.crowdGain.gain.setValueAtTime(.02,t);this.crowdGain.gain.linearRampToValueAtTime(.06,t+2)},
  crowdCheer(){if(this.goalAudio){this.goalAudio.currentTime=0;this.goalAudio.play().catch(e=>{});setTimeout(()=>{if(this.goalAudio)this.goalAudio.pause()},3000)}},
  stopCrowd(){if(!this.crowdGain)return;const t=this.ctx.currentTime;this.crowdGain.gain.cancelScheduledValues(t);this.crowdGain.gain.setValueAtTime(this.crowdGain.gain.value,t);this.crowdGain.gain.linearRampToValueAtTime(0,t+1)}
};

window.showAlert = (msg,title="Aviso") => { document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width:400px"><h2 class="gold mb">${title}</h2><p class="mb" style="color:var(--text-2)">${msg}</p><button class="btn btn-gold btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">Aceptar</button></div></div>`; };
window.showConfirm = (msg,onConfirm,onCancel=null,title="Confirmar") => { window._confirmCallback=onConfirm;window._cancelCallback=onCancel;document.getElementById('modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-content center" style="max-width:400px"><h2 class="gold mb">${title}</h2><p class="mb" style="color:var(--text-2)">${msg}</p><div class="grid-2 mt"><button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML='';if(window._cancelCallback)window._cancelCallback()">Cancelar</button><button class="btn btn-green" onclick="document.getElementById('modal-root').innerHTML='';if(window._confirmCallback)window._confirmCallback()">Aceptar</button></div></div></div>`; };
window.renderMatchResult = (title,teamA,teamB,scoreA,scoreB,extraHTML,onContinue,motm=null) => { document.getElementById('app').innerHTML = `<div id="app-inner" class="page-transition"><div class="card card-gold center" style="max-width:500px;margin:40px auto;padding:40px 20px"><div style="font-size:5rem;margin-bottom:10px">${scoreA>scoreB?'🏆':scoreA<scoreB?'😔':'🤝'}</div><h2 style="color:${scoreA>scoreB?'var(--green)':scoreA<scoreB?'var(--red)':'var(--gold)'};font-size:2rem;margin-bottom:24px">${title}</h2><div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:24px"><div style="font-size:1.1rem;font-weight:800;flex:1;text-align:right">${teamA}</div><div style="font-size:3rem;font-weight:900;color:var(--gold);background:rgba(0,0,0,.4);padding:8px 20px;border-radius:16px;border:2px solid var(--border-2)">${scoreA} - ${scoreB}</div><div style="font-size:1.1rem;font-weight:800;flex:1;text-align:left">${teamB}</div></div>${motm?`<div class="pill pill-gold mb" style="font-size:.9rem">⭐ MVP: ${motm.name} (${motm.goals} Goles, ${motm.assists} Asist.)</div>`:''}${extraHTML?`<div style="margin-bottom:24px">${extraHTML}</div>`:''}<button class="btn btn-gold btn-block mt" style="padding:16px;font-size:1.2rem" id="result-continue">Continuar</button></div></div>`; document.getElementById('result-continue').onclick = onContinue; };

window.showTrainResult = (success,onSuccess,onFail,extraMsg='') => { const icon=success?'🎉':'😔';const color=success?'var(--green)':'var(--red)';$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem;margin-bottom:10px">${icon}</div><h2 style="color:${color};font-size:1.8rem">${success?'¡Superado!':'Fallaste.'}</h2>${extraMsg?`<p class="dim mt">${extraMsg}</p>`:''}<button class="btn btn-gold btn-block mt" id="train-done" style="padding:14px">Continuar</button></div></div>`;document.getElementById('train-done').onclick=()=>{document.getElementById('modal-root').innerHTML='';if(success)onSuccess();else onFail()}; };
function trainBar(onSuccess,onFail){$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-content center"><h2>🎯 Precisión</h2><p class="mb">Frená la barra en la zona verde.</p><div class="train-container"><div class="train-target" style="left:40%;width:20%"></div><div class="train-cursor" id="train-cursor" style="left:0%"></div></div><button class="btn btn-gold btn-block" id="train-btn" style="padding:14px">¡AHORA!</button></div></div>`;let cp=0,dir=1,act=true;window._trainInterval=setInterval(()=>{if(!act)return;cp+=dir*4;if(cp>=100){cp=100;dir=-1}if(cp<=0){cp=0;dir=1}const c=document.getElementById('train-cursor');if(c)c.style.left=cp+'%'},16);document.getElementById('train-btn').onclick=()=>{act=false;clearInterval(window._trainInterval);window.showTrainResult(cp>=40&&cp<=60,onSuccess,onFail)}}
function trainReaction(onSuccess,onFail){$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-content center"><h2>⚡ Reflejos</h2><p class="mb">Clic SOLO cuando se ponga verde.</p><button id="react-btn" class="btn btn-outline btn-block" style="height:120px;font-size:1.8rem;pointer-events:none;border-radius:16px">ESPERA...</button></div></div>`;setTimeout(()=>{const btn=document.getElementById('react-btn');if(!btn)return;btn.textContent='¡AHORA!';btn.style.background='var(--green)';btn.style.color='#000';btn.style.pointerEvents='auto';const st=Date.now();btn.onclick=()=>window.showTrainResult(Date.now()-st<600,onSuccess,onFail,`Reaccionaste en ${Date.now()-st}ms`)},1500+Math.random()*2000)}
window.renderPenaltyGame = () => { const ps=window._penState;$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-content center"><h2>⚽ Penales</h2><p class="mb">Anota 2 de 3.</p><p>Anotados: <strong class="gold" style="font-size:1.5rem">${ps.goals}</strong> / 3</p><div style="display:flex;justify-content:space-around;margin:24px 0"><button class="btn btn-outline" style="padding:20px;font-size:1.2rem" onclick="window.kickPenalty('left')">←</button><button class="btn btn-outline" style="padding:20px;font-size:1.2rem" onclick="window.kickPenalty('center')">↑</button><button class="btn btn-outline" style="padding:20px;font-size:1.2rem" onclick="window.kickPenalty('right')">→</button></div></div></div>`; };
window.kickPenalty = dir => { const ps=window._penState;const gd=['left','center','right'][Math.floor(Math.random()*3)];if(dir!==gd)ps.goals++;ps.round++;if(ps.round>=3)window.showTrainResult(ps.goals>=2,ps.onSuccess,ps.onFail,`Anotaste ${ps.goals}/3`);else window.renderPenaltyGame(); };
window.startTrainingGame = (onSuccess,onFail) => { const g=Math.random();if(g<.33)trainBar(onSuccess,onFail);else if(g<.66)trainReaction(onSuccess,onFail);else{window._penState={round:0,goals:0,onSuccess,onFail};window.renderPenaltyGame()} };

  function computeTarget(p,bx,by){

  function computeGKTarget(p,isRed){const ownGoalX=isRed?F.x:F.r;const dir=isRed?1:-1;const lineX=ownGoalX+dir*22;if(!ball.owner){const tG=isRed?ball.vx<-120:ball.vx>120;if(tG){const dL=Math.abs(ownGoalX-ball.x);const sX=Math.abs(ball.vx)||1;const t=dL/sX;if(t>0&&t<1.3){const py=ball.y+ball.vy*t;if(Math.abs(py-F.cy)<GOAL_HALF+45)return{x:lineX,y:clamp2(py,F.cy-GOAL_HALF-25,F.cy+GOAL_HALF+25),speedMult:2.0}}}}const prox=clamp2(1-Math.abs(ball.x-ownGoalX)/460,0,1);let ty=F.cy+(ball.y-F.cy)*prox;ty=clamp2(ty,F.cy-GOAL_HALF-12,F.cy+GOAL_HALF+12);return{x:lineX,y:ty,speedMult:1.0}}

  function steer(p,dt){const dx=p.tx-p.x;const dy=p.ty-p.y;const d=Math.hypot(dx,dy);if(d<3){p.vx*=.80;p.vy*=.80;p.x+=p.vx*dt;p.y+=p.vy*dt;return}const mult=p.speedMult||1;let sp=p.speed*mult;if(ball.owner===p)sp*=.88;const desired=Math.min(sp,d*3.6);const ux=dx/d,uy=dy/d;const k=Math.min(1,dt*6);p.vx+=(ux*desired-p.vx)*k;p.vy+=(uy*desired-p.vy)*k;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp2(p.x,F.x+10,F.r-10);p.y=clamp2(p.y,F.y-25,F.b+25)}
  function separate(){const minD=21;for(let i=0;i<players.length;i++){const a=players[i];if(a.sentOff)continue;for(let j=i+1;j<players.length;j++){const b=players[j];if(b.sentOff)continue;let dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);if(d<minD&&d>.01){const push=(minD-d)*.5;dx/=d;dy/=d;a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push}}}}

  const GOAL_X_TOL=5.5;const GOAL_Y_TOL=2.5;
  function checkGoal(px,py,bx,by){const gh=GOAL_HALF+GOAL_Y_TOL;if(bx<F.x+GOAL_X_TOL&&Math.abs(by-F.cy)<gh)return 'blue';if(bx>F.r-GOAL_X_TOL&&Math.abs(by-F.cy)<gh)return 'red';return null}

  function updateBall(dt){
    if(ball.owner){const o=ball.owner;const gx=o.team==='red'?F.r:F.x;const ang=Math.atan2(F.cy-o.y,gx-o.x);ball.x=o.x+Math.cos(ang)*11;ball.y=o.y+Math.sin(ang)*11;ball.vx=0;ball.vy=0;return}
    const px=ball.x,py=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    const k=Math.exp(-1.1*dt);ball.vx*=k;ball.vy*=k;
    if(Math.hypot(ball.vx,ball.vy)<10){ball.vx=0;ball.vy=0}
    const gt=checkGoal(px,py,ball.x,ball.y);if(gt){scoreGoal(gt);return}
    if(ball.x<F.x){ball.x=F.x+20;ball.vx=-ball.vx*.7}if(ball.x>F.r){ball.x=F.r-20;ball.vx=-ball.vx*.7}
    if(ball.y<F.y){ball.y=F.y+20;ball.vy=-ball.vy*.7}if(ball.y>F.b){ball.y=F.b-20;ball.vy=-ball.vy*.7}
    checkControl(px,py);
  }
  function checkControl(px,py){if(ball.owner)return;let best=null,bd=Infinity;for(const p of players){if(p.sentOff)continue;if(p===ball.ignore&&ball.ignoreTimer>0)continue;const d=distToSeg(p.x,p.y,px,py,ball.x,ball.y);const rad=p.isGK?16:14;if(d<rad&&d<bd){bd=d;best=p}}if(best){if(best.isGK)narrateGK();takePossession(best)}}
  function takePossession(p){const prev=ball.lastTouch;if(prev&&prev.team!==p.team){if(Math.random()<.3)narrateTackle(p,prev)}ball.owner=p;ball.lastTouch=p;ball.ignore=p;ball.ignoreTimer=.25;ball.vx=0;ball.vy=0;p.decideTimer=rnd(.15,.35)}

  function decide(o){
    const isRed=o.team==='red';const goalX=isRed?F.r:F.x;const gd=Math.hypot(goalX-o.x,F.cy-o.y);
    if(o.isGK){const t=findBestPass(o);if(t)doPass(o,t);else kickBall(o,F.cx,F.cy+rnd(-100,100));return}
    let nearD=999;for(const q of players){if(q.team===o.team||q.sentOff)continue;const d=Math.hypot(q.x-o.x,q.y-o.y);if(d<nearD)nearD=d}
    let shootProb=0;if(gd<100)shootProb=.85;else if(gd<160)shootProb=.6;else if(gd<240)shootProb=.3;
    if(Math.random()<shootProb){shoot(o,goalX);return}
    const target=findBestPass(o);
    if(target&&Math.random()<.7){doPass(o,target);return}
    o.decideTimer=rnd(.5,1);
  }
  function findBestPass(o){const dir=o.team==='red'?1:-1;let best=null,bs=.1;for(const t of players){if(t===o||t.team!==o.team||t.sentOff)continue;const dx=t.x-o.x,dy=t.y-o.y;const d=Math.hypot(dx,dy);if(d<55||d>460)continue;const fwd=dx*dir;const sc=(fwd>0?fwd*.03:fwd*.05)-d*.002+rnd(0,.3);if(sc>bs){bs=sc;best=t}}return best}
  function doPass(o,t){const d=Math.hypot(t.x-o.x,t.y-o.y);const lead=Math.min(.45,d/700);let tx=t.x+t.vx*lead;let ty=t.y+t.vy*lead;kickBall(o,tx,ty)}
  function kickBall(o,tx,ty){const dx=tx-o.x,dy=ty-o.y;const d=Math.hypot(dx,dy)||1;const ang=Math.atan2(dy,dx);let speed=clamp2(d*1.4,160,360);if(arcadeMode)speed*=1.5;if(potroMode)speed*=2;ball.owner=null;ball.x=o.x+Math.cos(ang)*11;ball.y=o.y+Math.sin(ang)*11;ball.vx=Math.cos(ang)*speed;ball.vy=Math.sin(ang)*speed;ball.lastTouch=o;ball.ignore=o;ball.ignoreTimer=.30;playKick(.85)}
  function shoot(o,goalX){matchStats[o.team].shots++;const rf=(o.rating||60)/100;const spread=GOAL_HALF*(1.05-rf*.5);const ty=F.cy+rnd(-spread,spread);const ot=Math.abs(ty-F.cy)<GOAL_HALF;if(ot)matchStats[o.team].onTarget++;narrateShot(o,ot);const dx=goalX-o.x,dy=ty-o.y;const ang=Math.atan2(dy,dx);let pw=400+rf*200;if(arcadeMode)pw*=1.4;if(potroMode)pw*=1.8;ball.owner=null;ball.x=o.x+Math.cos(ang)*11;ball.y=o.y+Math.sin(ang)*11;ball.vx=Math.cos(ang)*pw;ball.vy=Math.sin(ang)*pw;ball.lastTouch=o;ball.ignore=o;ball.ignoreTimer=.30;playKick(1.2);spawnParticles(o.x,o.y,'#ffd700',8);screenShake=.4}
  function scoreGoal(team){if(replayBuffer.length>20&&!secretMode&&!arcadeMode&&!potroMode&&!rushMode&&!diosMode&&!goatMode){replayActive=true;replayFrame=0}score[team]++;const scorer=ball.lastTouch;if(scorer&&scorer.team===team)scorer.goals=(scorer.goals||0)+1;celebration={team,concedingTeam:team==='red'?'blue':'red',scorer,timer:4+(replayActive?1.6:0)};ball.owner=null;ball.vx=0;ball.vy=0;playWhistle();window.MFCMusic.crowdCheer();screenShake=1.5;goalFlash=1;spawnParticles(ball.x,ball.y,team==='red'?'#e63946':'#2b7fe0',60,'spark');spawnParticles(ball.x,ball.y,'#ffd700',80,'confetti');state='celebrate';updateMatchUI()}

  function update(dt){
    if(state==='ended'||isPaused||matchEnded)return;
    globalT+=dt;updateParticles(dt);
    if(subtitle.timer>0)subtitle.timer-=dt;
    for(const p of players)if(p.cardShowTimer>0)p.cardShowTimer-=dt;
    if(isRaining)for(let r of rainDrops){r.y+=r.speed;if(r.y>H){r.y=-10;r.x=Math.random()*W}}
    if(state==='celebrate'){if(replayActive){replayFrame+=dt*30;if(replayFrame>=replayBuffer.length){replayActive=false;replayBuffer=[]}}else{celebration.timer-=dt;if(celebration.timer<=0)resetPositions(celebration.concedingTeam)}return}
    gameTime+=dt*TIME_MULTIPLIER;
    if(gameTime>=90+extraTime){endMatch();return}
    if(ball.ignoreTimer>0)ball.ignoreTimer-=dt;
    if(ball.owner)matchStats[ball.owner.team].possession+=dt;
    assignPressers();assignMarkings();
    const bx=(ball.x-F.x)/F.w;const by=(ball.y-F.y)/F.h;
    for(const p of players){if(p.sentOff)continue;computeTarget(p,bx,by)}
    for(const p of players){if(p.sentOff)continue;steer(p,dt)}
    separate();
    if(state!=='play')return;
    updateBall(dt);
    if(ball.owner){const o=ball.owner;o.decideTimer-=dt;if(o.decideTimer<=0){o.decideTimer=rnd(.25,.45);decide(o)}}
    if(state==='play'&&!replayActive&&!secretMode&&!arcadeMode&&!potroMode&&!rushMode&&!diosMode&&!goatMode){replayBuffer.push({bx:ball.x,by:ball.y,ballColor:ball.owner?getBodyColor(ball.owner):'#ffffff',players:players.map(p=>({x:p.x,y:p.y,color:getBodyColor(p),isGK:p.isGK}))});if(replayBuffer.length>90)replayBuffer.shift()}
  }

  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

    const sx=screenShake>0?(Math.random()-.5)*screenShake*15:0;const sy=screenShake>0?(Math.random()-.5)*screenShake*15:0;
    ctx.save();ctx.translate(sx,sy);
    const bg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,W*.8);bg.addColorStop(0,'#0d1a14');bg.addColorStop(1,'#030806');ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
    const n=16;for(let i=0;i<n;i++){ctx.fillStyle=`hsl(130,55%,${i%2?32:38}%)`;ctx.fillRect(F.x+i*F.w/n,F.y,F.w/n+.6,F.h)}
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.5;
    ctx.strokeRect(F.x,F.y,F.w,F.h);ctx.beginPath();ctx.moveTo(F.cx,F.y);ctx.lineTo(F.cx,F.b);ctx.stroke();
    ctx.beginPath();ctx.arc(F.cx,F.cy,68,0,Math.PI*2);ctx.stroke();

    const paW=132,paH=300;ctx.strokeRect(F.x,F.cy-paH/2,paW,paH);ctx.strokeRect(F.r-paW,F.cy-paH/2,paW,paH);
    ctx.strokeStyle='#ffd700';ctx.lineWidth=3;

    ctx.beginPath();ctx.moveTo(F.r,F.cy-GOAL_HALF);ctx.lineTo(F.r+20,F.cy-GOAL_HALF);ctx.lineTo(F.r+20,F.cy+GOAL_HALF);ctx.lineTo(F.r,F.cy+GOAL_HALF);ctx.stroke();

  function drawPlayer(p){
    if(p.sentOff)return;

};

function loadUserData(uid) {
  // Cargar UT
  try {
    const saved = localStorage.getItem(`ut_v15_${uid}`);
    if (saved) {
      UT = JSON.parse(saved);
    } else {
      UT = { coins: 5000, cards: [], squad: Array(11).fill(null), bench: Array(7).fill(null), packs: 0, packInv: {silver:0,gold:5}, formation: '4-3-3', champsDiv: 10, champsPts: 0 };
    }
  } catch(e) {
    UT = { coins: 5000, cards: [], squad: Array(11).fill(null), bench: Array(7).fill(null), packs: 0, packInv: {silver:0,gold:5}, formation: '4-3-3', champsDiv: 10, champsPts: 0 };
  }

  // Cargar Battle Pass
  try {
    const saved = localStorage.getItem(`mfc_bp_${uid}`);
    if (saved) {
      BP = JSON.parse(saved);
    } else {
      BP = { level: 1, xp: 0, lastFreeClaimed: 0, lastVIPClaimed: 0 };
    }
  } catch(e) {
    BP = { level: 1, xp: 0, lastFreeClaimed: 0, lastVIPClaimed: 0 };
  }

  // Cargar VIP
  window._userVip = parseInt(localStorage.getItem(`mfc_vip_${uid}`) || '0') || 0;
  window._userBpVip = parseInt(localStorage.getItem(`mfc_bp_vip_${uid}`) || '0') || 0;
  window._userBarrio = JSON.parse(localStorage.getItem(`mfc_barrio_${uid}`) || 'null');
  utNorm();
}

function clearUserData() {
  UT = null;
  BP = null;
  window._userVip = 0;
  window._userBpVip = 0;
  window._userBarrio = null;
}

function saveUT() {
  if (!window.onlineUser) return;
  try { localStorage.setItem(`ut_v15_${window.onlineUser.uid}`, JSON.stringify(UT)); } catch(e) {}
}

function saveBP() {
  if (!window.onlineUser) return;
  try { localStorage.setItem(`mfc_bp_${window.onlineUser.uid}`, JSON.stringify(BP)); } catch(e) {}
}

function isBPVIP() { return window._userBpVip > Date.now(); }
function getBPVIPDays() { const t = window._userBpVip; return t > Date.now() ? Math.ceil((t - Date.now()) / 86400000) : 0; }
function activateBPVIP(days=30) {
  if (!window.onlineUser) return;
  const b = Math.max(Number(window._userBpVip)||0, Date.now());
  window._userBpVip = b + days * 86400000;
  localStorage.setItem(`mfc_bp_vip_${window.onlineUser.uid}`, window._userBpVip);
  if (BP && (BP.lastVIPClaimed||0) < BP.level) {
    for (let l = (BP.lastVIPClaimed||0) + 1; l <= BP.level; l++) deliverBPReward(getBPReward(l, 'vip'));
    BP.lastVIPClaimed = BP.level;
    saveBP();
  }
}

function playPackAnimation(pulled, onComplete) {
  const root = document.createElement('div');
  root.className = 'pack-stage';
  const hasRare = pulled.some(p => ['icon', 'toty', 'tots', 'totw'].includes(p.type));
  
  root.innerHTML = `
    <div class="pack-lights ${hasRare ? 'rare' : ''}"></div>
    <div class="pack-envelope" id="pack-env"></div>
    <div class="pack-hint" id="pack-hint">Haz click para abrir</div>
    <div class="pack-cards-wrapper" id="pack-cards"></div>
    <button class="btn btn-gold pack-continue-btn" id="pack-continue" onclick="this.closest('.pack-stage').remove()">Continuar</button>
  `;
  document.body.appendChild(root);

  const cardsContainer = document.getElementById('pack-cards');
  cardsContainer.innerHTML = pulled.map((p, i) => `
    <div class="reveal-card" id="rc-${i}">
      <div class="flip-inner" onclick="this.classList.toggle('flipped')">
        <div class="card-face card-back-face"></div>
        <div class="card-face card-front-face ut-front">
          <div class="ut-card ${p.type} ut-xl">${utCardInner(p)}</div>
        </div>
      </div>
    </div>
  `).join('');

  let opened = false;
  const env = document.getElementById('pack-env');
  const hint = document.getElementById('pack-hint');
  const continueBtn = document.getElementById('pack-continue');

  env.onclick = () => {
    if (opened) return;
    opened = true;
    
    if (window.MFCMusic && window.MFCMusic.ctx) {
      const osc = window.MFCMusic.ctx.createOscillator();
      const gain = window.MFCMusic.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, window.MFCMusic.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, window.MFCMusic.ctx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.1, window.MFCMusic.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, window.MFCMusic.ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(window.MFCMusic.ctx.destination);
      osc.start(); osc.stop(window.MFCMusic.ctx.currentTime + 0.5);
    }

    env.classList.add('opened');
    hint.style.opacity = '0';
    
    setTimeout(() => {
      hint.remove();
      pulled.forEach((p, i) => {
        setTimeout(() => {
          const cardEl = document.getElementById(`rc-${i}`);
          cardEl.classList.add('show');
          
          setTimeout(() => {
            const flip = cardEl.querySelector('.flip-inner');
            flip.classList.add('flipped');
            
            if (window.MFCMusic && window.MFCMusic.ctx) {
              const osc = window.MFCMusic.ctx.createOscillator();
              const gain = window.MFCMusic.ctx.createGain();
              osc.type = 'sine';
              const isSpecial = ['icon', 'toty', 'tots', 'totw'].includes(p.type);
              osc.frequency.setValueAtTime(isSpecial ? 600 : 400, window.MFCMusic.ctx.currentTime);
              gain.gain.setValueAtTime(0.1, window.MFCMusic.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, window.MFCMusic.ctx.currentTime + 0.3);
              osc.connect(gain); gain.connect(window.MFCMusic.ctx.destination);
              osc.start(); osc.stop(window.MFCMusic.ctx.currentTime + 0.3);
            }
          }, 300);
        }, i * 800);
      });

      setTimeout(() => {
        continueBtn.classList.add('show');
        continueBtn.onclick = () => {
          root.remove();
          if (onComplete) onComplete();
        };
      }, pulled.length * 800 + 800);

    }, 600);
  };
}

const BP_MAX_LEVEL=60;const BP_XP_PER_LEVEL=100;const BP_XP_PER_CHAMPS_WIN=100;

function getBPReward(level,track){
  if(level===BP_MAX_LEVEL){if(track==='vip')return{coins:500000,packs:20,season:3,specialCard:null,specialName:null};return{coins:50000,packs:5,specialCard:null}}
  if(track==='free')return{coins:500+level*150,packs:level%5===0?1:0,specialCard:null};
  const coins=2000+level*500;let packs=2,season=0;
  if(level%20===0)season=1;else if(level%10===0)packs=4;else if(level%5===0)packs=3;
  return{coins,packs,season,specialCard:null,specialName:null};
}
function deliverBPReward(r){
  if(!UT) return;
  if(r.coins)UT.coins+=r.coins;
  if(r.packs)addPacks(r.packs);
  if(r.season)addPacks(r.season,'season');
  if(r.specialCard){const pool=DB_UT.filter(p=>p.type===r.specialCard);if(pool.length>0){const c=randItem(pool);UT.cards.push({...c,id:c.id+'_bp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)})}}
  saveUT();
}
window.addBPXP=function(amount){
  if(!BP || BP.level>=BP_MAX_LEVEL)return;
  BP.xp+=amount;let lg=0;
  while(BP.xp>=BP_XP_PER_LEVEL&&BP.level<BP_MAX_LEVEL){BP.xp-=BP_XP_PER_LEVEL;BP.level++;lg++;deliverBPReward(getBPReward(BP.level,'free'));BP.lastFreeClaimed=BP.level;if(isBPVIP()){deliverBPReward(getBPReward(BP.level,'vip'));BP.lastVIPClaimed=BP.level}}
  saveBP();
  if(lg>0)setTimeout(()=>window.showAlert(`¡SUBISTE ${lg} NIVEL${lg>1?'ES':''}!<br><br>Nivel: <strong style="color:var(--gold);font-size:1.3rem">${BP.level}/${BP_MAX_LEVEL}</strong><br>${isBPVIP()?'🎁 FREE + VIP':'🎁 FREE'}<br><br>${!isBPVIP()?'<span class="dim">💡 Comprá el Pase VIP</span>':''}`,'🏆 BATTLE PASS'),800);
};

function renderBPRewardHTML(r){const p=[];if(r.coins)p.push(`🪙 ${r.coins.toLocaleString()}`);if(r.packs)p.push(`🎁 ${r.packs} Sobre${r.packs>1?'s':''}`);if(r.season)p.push(`⭐ ${r.season} Sobre Temporada`);if(r.specialCard)p.push(`⭐ ${r.specialName||r.specialCard.toUpperCase()}`);return p.join('<br>')}

const BP_END=new Date('2027-01-31T23:59:59');
const bpFmt=n=>n>=1000?(n%1000?(n/1000).toFixed(1):n/1000)+'K':String(n);
const bpSample=t=>DB_UT.filter(p=>p.type===t).sort((a,b)=>b.rating-a.rating)[0];
function bpTile(r,state){
  const sp=r.specialCard?bpSample(r.specialCard):null;
  const vis=sp?`<div class="ut-card ${r.specialCard} ut-mini">${utCardInner(sp)}</div>`:`<div class="bp2-ico">${r.season?'⭐':r.packs>=2?'🎁':'🪙'}</div>`;
  return `<div class="bp2-tile ${state}">${vis}<div>${r.coins?`🪙 ${bpFmt(r.coins)}`:''}${r.coins&&r.packs?'<br>':''}${r.packs?`🎁 ×${r.packs}`:''}${r.season?`<br>⭐ ×${r.season}`:''}</div></div>`}
function bpPending(){const vip=isBPVIP();const f=Math.max(0,BP.level-(BP.lastFreeClaimed||0));const v=vip?Math.max(0,BP.level-(BP.lastVIPClaimed||0)):0;return{f,v}}
function bpCollectAll(){const vip=isBPVIP();let n=0,c=0,pk=0;
  for(let i=(BP.lastFreeClaimed||0)+1;i<=BP.level;i++){const r=getBPReward(i,'free');deliverBPReward(r);n++;c+=r.coins||0;pk+=r.packs||0}BP.lastFreeClaimed=Math.max(BP.lastFreeClaimed||0,BP.level);
  if(vip){for(let i=(BP.lastVIPClaimed||0)+1;i<=BP.level;i++){const r=getBPReward(i,'vip');deliverBPReward(r);n++;c+=r.coins||0;pk+=r.packs||0}BP.lastVIPClaimed=Math.max(BP.lastVIPClaimed||0,BP.level)}
  saveBP();window.showAlert(`Cobraste ${n} recompensa${n!==1?'s':''}.<br><b class="gold">+${c.toLocaleString()} 🪙 · +${pk} sobres</b>`,'🏆 PASE');screenBP()}
function bpDaily(){const k=`bp_daily_${window.onlineUser.uid}`;const d=new Date().toDateString();if(localStorage.getItem(k)===d){window.showAlert('Ya reclamaste la XP de hoy. Volvé mañana.');return}localStorage.setItem(k,d);window.addBPXP(50);screenBP()}
function bpBuyLevel(){if(BP.level>=BP_MAX_LEVEL)return;if(!UT||UT.coins<10000){window.showAlert('Necesitás 10.000 🪙 para comprar un nivel.');return}UT.coins-=10000;saveUT();window.addBPXP(BP_XP_PER_LEVEL-BP.xp);screenBP()}

async function redeemCode(){
  const input=document.getElementById('redeem-input');
  const code=(input.value||'').replace(/[\u2010-\u2015\u2212]/g,'-').replace(/[\s\u200b]/g,'').toUpperCase();
  const close=()=>{document.getElementById('modal-root').innerHTML=''};
  if(!code)return;
  if(!UT||!BP){window.showAlert('Tu perfil todavía no cargó. Recargá la página e intentá de nuevo.','❌');return}
  $('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-content center"><div class="spinner"></div><h2>Verificando...</h2></div></div>`;
  let result;try{result=await window.Firebase.checkCode(code)}catch(e){result={found:false,error:e.message}}
  if(result.error){close();window.showAlert('No pude consultar el código: '+utEsc(result.error)+'<br><br>Si menciona permisos, hay que permitir la lectura de <strong>redemption_codes</strong> en las reglas de Firestore.','❌ ERROR');return}
  if(!result.found){close();window.showAlert('Código inválido. Revisá que esté completo (ej: BPVIP-A1B2-C3D4).<br><br>Contactá a <strong>'+PAYMENT_CONFIG.emailContact+'</strong>.','❌ INVÁLIDO');return}
  if(result.used){close();window.showAlert('Ese código ya fue usado.','❌');return}
  const PFX={C5K:'coins_small',C25K:'coins_medium',C100K:'coins_large',C500K:'coins_mega',P5:'packs_small',P20:'packs_large',EPIC:'super_pack',BPVIP:'bp_vip',VIP:'vip_pass'};
  const item=STORE_ITEMS.find(i=>i.id===result.itemId)||STORE_ITEMS.find(i=>i.id===PFX[code.split('-')[0]]);
  if(!item){close();window.showAlert('Este código es de un artículo que ya no existe. No se gastó.<br>Contactá a <strong>'+PAYMENT_CONFIG.emailContact+'</strong>.','❌');return}
  const ok=await window.Firebase.useCode(result.id);
  if(!ok){close();window.showAlert('No pude marcar el código como usado, así que no se entregó nada. Si pasa siempre, revisá el permiso de <strong>update</strong> sobre redemption_codes en Firestore.','❌');return}
  deliverItem(item);close();
  window.showAlert(`¡Canjeado!<br><br>${item.icon} <strong>${item.name}</strong>${item.bpVip?'<br><br>👑 Pase VIP activo por 30 días':''}`,'✅ VÁLIDO');
  if(item.bpVip)screenBP();else screenStore();
}
