<style>

<script>
const $ = (s) => document.querySelector(s);
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const randItem = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtMoney = (n) => { if (n >= 1_000_000) return `$${(n/1_000_000).toFixed(1)}M`; if (n >= 1_000) return `$${(n/1_000).toFixed(0)}k`; return `$${n}`; };

// ═══ MÚSICA ═══
window.MFCMusic = {
  menuAudio: null, goalAudio: null, crowdGain: null, ctx: null, _menuPlaying: false, _menuEnabled: true,
  init() {
    this.menuAudio = document.getElementById('menu-music');
    this.goalAudio = document.getElementById('goal-cheer-audio');
    if (this.menuAudio) this.menuAudio.volume = 0.32;
    if (this.goalAudio) this.goalAudio.volume = 0.6;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.crowdGain = this.ctx.createGain();
      this.crowdGain.gain.value = 0;
      this.crowdGain.connect(this.ctx.destination);
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch(e) {}
  },
  playMenu() {
    this._menuPlaying = true;
    if (this._menuEnabled && this.menuAudio) {
      this.menuAudio.currentTime = 0;
      this.menuAudio.play().catch(e => {});
    }
  },
  stopMenu() { this._menuPlaying = false; if (this.menuAudio) this.menuAudio.pause(); },
  fadeMenu(fadeOut = true, duration = 1.5) {
    if (!this.menuAudio) return;
    const startVol = this.menuAudio.volume;
    const endVol = fadeOut ? 0 : 0.32;
    const startTime = performance.now();
    const fade = () => {
      const elapsed = (performance.now() - startTime) / 1000;
      if (elapsed >= duration) { this.menuAudio.volume = endVol; if (fadeOut) this.stopMenu(); else if (this._menuPlaying) this.menuAudio.play().catch(e => {}); return; }
      this.menuAudio.volume = startVol + (endVol - startVol) * (elapsed / duration);
      requestAnimationFrame(fade);
    };
    fade();
  },
  startCrowd() { if (!this.ctx) return; const t = this.ctx.currentTime; this.crowdGain.gain.cancelScheduledValues(t); this.crowdGain.gain.setValueAtTime(0.02, t); this.crowdGain.gain.linearRampToValueAtTime(0.06, t + 2); },
  crowdCheer() { if (this.goalAudio) { this.goalAudio.currentTime = 0; this.goalAudio.play().catch(e => {}); setTimeout(() => { if (this.goalAudio) this.goalAudio.pause(); }, 3000); } if (!this.ctx) return; const t = this.ctx.currentTime; this.crowdGain.gain.cancelScheduledValues(t); this.crowdGain.gain.setValueAtTime(this.crowdGain.gain.value, t); this.crowdGain.gain.linearRampToValueAtTime(0.35, t + 0.3); this.crowdGain.gain.linearRampToValueAtTime(0.06, t + 4); },
  stopCrowd() { if (!this.crowdGain) return; const t = this.ctx.currentTime; this.crowdGain.gain.cancelScheduledValues(t); this.crowdGain.gain.setValueAtTime(this.crowdGain.gain.value, t); this.crowdGain.gain.linearRampToValueAtTime(0, t + 1); }
};

window.showAlert = (msg, title = "Aviso") => { document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 400px;"><h2 class="gold mb">${title}</h2><p class="mb" style="color:var(--text-2);">${msg}</p><button class="btn btn-gold btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">Aceptar</button></div></div>`; };
window.showConfirm = (msg, onConfirm, onCancel = null, title = "Confirmar") => { window._confirmCallback = onConfirm; window._cancelCallback = onCancel; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 400px;"><h2 class="gold mb">${title}</h2><p class="mb" style="color:var(--text-2);">${msg}</p><div class="grid-2 mt"><button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''; if(window._cancelCallback) window._cancelCallback();">Cancelar</button><button class="btn btn-green" onclick="document.getElementById('modal-root').innerHTML=''; if(window._confirmCallback) window._confirmCallback();">Aceptar</button></div></div></div>`; };
window.renderMatchResult = (title, teamA, teamB, scoreA, scoreB, extraHTML, onContinue, motm = null) => { document.getElementById('app').innerHTML = `<div id="app-inner" class="page-transition"><div class="card card-gold center" style="max-width: 500px; margin: 40px auto; padding: 40px 20px;"><div style="font-size: 5rem; margin-bottom: 10px;">${scoreA > scoreB ? '🏆' : scoreA < scoreB ? '😔' : '🤝'}</div><h2 style="color:${scoreA > scoreB ? 'var(--green)' : scoreA < scoreB ? 'var(--red)' : 'var(--gold)'}; font-size: 2rem; margin-bottom: 24px;">${title}</h2><div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:24px;"><div style="font-size:1.1rem; font-weight:800; flex:1; text-align:right;">${teamA}</div><div style="font-size:3rem; font-weight:900; color:var(--gold); background:rgba(0,0,0,0.4); padding:8px 20px; border-radius:16px; border:2px solid var(--border-2);">${scoreA} - ${scoreB}</div><div style="font-size:1.1rem; font-weight:800; flex:1; text-align:left;">${teamB}</div></div>${motm ? `<div class="pill pill-gold mb" style="font-size:0.9rem;">⭐ MVP: ${motm.name} (${motm.goals} Goles, ${motm.assists} Asist.)</div>` : ''}${extraHTML ? `<div style="margin-bottom:24px;">${extraHTML}</div>` : ''}<button class="btn btn-gold btn-block mt" style="padding:16px; font-size:1.2rem;" id="result-continue">Continuar</button></div></div>`; document.getElementById('result-continue').onclick = onContinue; };

window.showTrainResult = (success, onSuccess, onFail, extraMsg = '') => { const icon = success ? '🎉' : '😔'; const color = success ? 'var(--green)' : 'var(--red)'; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem; margin-bottom:10px;">${icon}</div><h2 style="color:${color}; font-size:1.8rem;">${success ? '¡Entrenamiento Superado!' : 'Fallaste.'}</h2>${extraMsg ? `<p class="dim mt">${extraMsg}</p>` : ''}<button class="btn btn-gold btn-block mt" id="train-done" style="padding:14px;">Continuar</button></div></div>`; document.getElementById('train-done').onclick = () => { document.getElementById('modal-root').innerHTML = ''; if (success) onSuccess(); else onFail(); }; };
function trainBar(onSuccess, onFail) { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>🎯 Precisión</h2><p class="mb">Frená la barra en la zona verde.</p><div class="train-container"><div class="train-target" style="left:40%; width:20%;"></div><div class="train-cursor" id="train-cursor" style="left:0%;"></div></div><button class="btn btn-gold btn-block" id="train-btn" style="padding:14px;">¡AHORA!</button></div></div>`; let cursorPos = 0, direction = 1, gameActive = true; window._trainInterval = setInterval(() => { if (!gameActive) return; cursorPos += direction * 4; if (cursorPos >= 100) { cursorPos = 100; direction = -1; } if (cursorPos <= 0) { cursorPos = 0; direction = 1; } const cursor = document.getElementById('train-cursor'); if (cursor) cursor.style.left = cursorPos + '%'; }, 16); document.getElementById('train-btn').onclick = () => { gameActive = false; clearInterval(window._trainInterval); window.showTrainResult(cursorPos >= 40 && cursorPos <= 60, onSuccess, onFail); }; }
function trainReaction(onSuccess, onFail) { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>⚡ Reflejos</h2><p class="mb">Clic SOLO cuando se ponga verde.</p><button id="react-btn" class="btn btn-outline btn-block" style="height:120px; font-size:1.8rem; pointer-events:none; border-radius:16px;">ESPERA...</button></div></div>`; setTimeout(() => { const btn = document.getElementById('react-btn'); if (!btn) return; btn.textContent = "¡AHORA!"; btn.style.background = "var(--green)"; btn.style.color = "#000"; btn.style.pointerEvents = "auto"; const startTime = Date.now(); btn.onclick = () => window.showTrainResult(Date.now() - startTime < 600, onSuccess, onFail, `Reaccionaste en ${Date.now() - startTime}ms`); }, 1500 + Math.random() * 2000); }
window.renderPenaltyGame = () => { const ps = window._penState; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>⚽ Penales</h2><p class="mb">Anota 2 de 3.</p><p>Anotados: <strong class="gold" style="font-size:1.5rem;">${ps.goals}</strong> / 3</p><div style="display:flex; justify-content:space-around; margin:24px 0;"><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('left')">← Izq</button><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('center')">↑ Centro</button><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('right')">Der →</button></div></div></div>`; };
window.kickPenalty = (dir) => { const ps = window._penState; const goalieDir = ['left', 'center', 'right'][Math.floor(Math.random()*3)]; if (dir !== goalieDir) ps.goals++; ps.round++; if (ps.round >= 3) window.showTrainResult(ps.goals >= 2, ps.onSuccess, ps.onFail, `Anotaste ${ps.goals}/3`); else window.renderPenaltyGame(); };
window.startTrainingGame = (onSuccess, onFail) => { const game = Math.random(); if (game < 0.33) trainBar(onSuccess, onFail); else if (game < 0.66) trainReaction(onSuccess, onFail); else { window._penState = { round: 0, goals: 0, onSuccess, onFail }; window.renderPenaltyGame(); } };

function genBotTeam(baseRating = 70) { const roles = ['GK', 'LB', 'CB', 'CB', 'RB', 'CM', 'CM', 'CM', 'LW', 'ST', 'RW']; return roles.map((r, i) => ({ name: `Bot ${i+1}`, rating: baseRating + rand(-5, 5), position: r, dorsal: r === 'GK' ? 1 : rand(2, 30) })); }

const rndPick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const AI_NAMES = ["ElMatador99","Lucas10","xX_FifaKing_Xx","Bryan_Fut","ElProfe22","Tomi_Gol","ElTano","Crack_De_Barrio","La_Pulga","Pipa22","Matias_El7","Fede_La10","Rulo_99","Chino_Crack","Oli_FC"];
const SHIELDS = ['🦁','🐯','🦅','🐺','🐻','🦊','🦄','🐉','⚡','🔥','⭐','👑','💎','🎯','⚽','🏆','🛡️','🎖️','⚔️','🌟'];
const CLUB_COLORS = ['#e30613','#004d98','#0d6b3a','#f5c518','#6CABDD','#DC052D','#004170','#ef4444','#a78bfa','#fbbf24','#000000','#ffffff'];

function generateInviteCode() { let c = ''; const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)]; return c; }
function genAIFillers(existingCount) { const roles = ['CB', 'CM', 'ST']; const used = new Set(); const result = []; const needed = 5 - existingCount; for (let i = 0; i < needed; i++) { let n; do { n = rndPick(AI_NAMES); } while (used.has(n)); used.add(n); result.push({ uid: 'ai_' + Math.random().toString(36).slice(2, 9), name: n, position: roles[i % roles.length], rating: rndInt(60, 70), isAI: true, dorsal: rndInt(2, 99) }); } return result; }
function genBotTeamFB() { const roles = ['GK', 'CB', 'CB', 'ST', 'ST']; return roles.map(r => ({ uid: 'bot_' + Math.random().toString(36).slice(2, 9), name: rndPick(AI_NAMES), position: r, rating: rndInt(65, 75), isAI: true, dorsal: rndInt(1, 99) })); }
function posEmoji(pos) { if (pos === 'GK' || pos === 'Arquero') return '🧤'; if (pos === 'CB' || pos === 'LB' || pos === 'RB') return '🛡️'; if (pos === 'CM' || pos === 'CDM' || pos === 'CAM') return '🎯'; return '⚽'; }
async function loadProfile(uid) { const s = await getDoc(doc(db, 'users', uid)); return s.exists() ? s.data() : null; }
async function saveProfile(uid, data) { await setDoc(doc(db, 'users', uid), { ...data, uid, updatedAt: serverTimestamp() }, { merge: true }); }

async function createClubFull(shield, color) {

async function loadMyClub() { 
  if (!onlineProfile?.clubId) { myClub = null; return; } 
  myClubId = onlineProfile.clubId; 
  const snap = await getDoc(doc(db, 'clubs', myClubId)); 
  if (!snap.exists()) { myClub = null; await saveProfile(onlineUser.uid, { clubId: null }); return; }
  myClub = { id: snap.id, ...snap.data() };
  if (!myClub.shield) { myClub.shield = '🛡️'; await updateDoc(doc(db, 'clubs', myClubId), { shield: '🛡️' }); }
  if (!myClub.inviteCode) { const code = generateInviteCode(); myClub.inviteCode = code; await updateDoc(doc(db, 'clubs', myClubId), { inviteCode: code }); }
  if (!myClub.stats) { myClub.stats = { wins: 0, draws: 0, losses: 0, division: 10 }; await updateDoc(doc(db, 'clubs', myClubId), { stats: myClub.stats }); }
  if (!myClub.members.find(m => m.uid === onlineUser.uid)) { myClub = null; await saveProfile(onlineUser.uid, { clubId: null }); }
}

function showJoinByCode() { $g('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>🔑 Unirse con código</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><p class="muted mb">Pedile el código al dueño del club.</p><input id="join-code-input" type="text" maxlength="6" style="text-transform:uppercase; font-size:1.8rem; text-align:center; font-family:monospace; letter-spacing:4px; font-weight:900;" placeholder="ABC123"><div class="modal-actions"><button class="btn btn-gold" onclick="window.FirebaseOnline.joinByCode()">Unirse</button></div></div></div>`; }
async function joinByCode() {
  const code = $g('#join-code-input').value.trim().toUpperCase();
  if (code.length !== 6) { window.showAlert('Código inválido (6 caracteres).'); return; }
  $g('#modal-root').innerHTML = '';
  $g('#app').innerHTML = `<div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Buscando club...</h2></div>`;
  try {
    const q = query(collection(db, 'clubs'), where('inviteCode', '==', code));
    const snap = await getDocs(q);
    if (snap.empty) { window.showAlert('Club no encontrado.'); screenCreateClubScreen(); return; }
    const clubDoc = snap.docs[0];
    const club = { id: clubDoc.id, ...clubDoc.data() };
    if (club.members.find(m => m.uid === onlineUser.uid)) { await saveProfile(onlineUser.uid, { clubId: club.id }); onlineProfile = await loadProfile(onlineUser.uid); myClubId = club.id; await loadMyClub(); screenClubHub(); return; }
    const humans = club.members.filter(m => !m.isAI);
    if (humans.length >= 5) { window.showAlert('Club lleno (máx 5 humanos).'); screenCreateClubScreen(); return; }
    const newMember = { uid: onlineUser.uid, name: onlineProfile.gamertag, position: onlineProfile.position || 'CM', rating: 50, goals: 0, assists: 0, mvps: 0, isAI: false, dorsal: onlineProfile.dorsal || 10, joinedAt: serverTimestamp() };
    const newMembers = [...club.members, newMember];
    const aiIdx = newMembers.findIndex(m => m.isAI);
    if (newMembers.filter(m => !m.isAI).length <= 5 && aiIdx !== -1) newMembers.splice(aiIdx, 1);
    await updateDoc(doc(db, 'clubs', club.id), { members: newMembers, updatedAt: serverTimestamp() });
    await saveProfile(onlineUser.uid, { clubId: club.id });
    onlineProfile = await loadProfile(onlineUser.uid);
    myClubId = club.id; await loadMyClub(); screenClubHub();
    window.showAlert(`¡Bienvenido a ${club.name}!`, '¡CLUB UNIDO!');
  } catch (e) { window.showAlert('Error: ' + e.message); screenCreateClubScreen(); }
}

async function sendInviteByGamertag() {
  const gamertag = $g('#invite-gamertag').value.trim();
  if (!gamertag) return;
  if (!myClub) return;
  if (gamertag.toLowerCase() === onlineProfile.gamertag.toLowerCase()) { window.showAlert('No podés invitarte a vos mismo.'); return; }
  try {
    const q = query(collection(db, 'users'), where('gamertag', '==', gamertag));
    const snap = await getDocs(q);
    if (snap.empty) { window.showAlert(`No existe "${gamertag}".`); return; }
    const targetDoc = snap.docs[0];
    const targetUid = targetDoc.id;
    const targetProfile = targetDoc.data();
    if (targetProfile.clubId === myClub.id) { window.showAlert('Ya está en tu club.'); return; }
    const q2 = query(collection(db, 'invites'), where('toUid', '==', targetUid), where('clubId', '==', myClub.id), where('status', '==', 'pending'));
    const snap2 = await getDocs(q2);
    if (!snap2.empty) { window.showAlert('Ya le enviaste una invitación pendiente.'); return; }
    await addDoc(collection(db, 'invites'), { clubId: myClub.id, clubName: myClub.name, clubShield: myClub.shield || '🛡️', clubColor: myClub.color || '#e30613', fromUid: onlineUser.uid, fromName: onlineProfile.gamertag, toUid: targetUid, toName: targetProfile.gamertag, status: 'pending', createdAt: serverTimestamp() });
    $g('#modal-root').innerHTML = '';
    window.showAlert(`¡Invitación enviada a ${targetProfile.gamertag}!`, '¡ENVIADA!');
  } catch (e) { window.showAlert('Error: ' + e.message); }
}

// ═══ INVITACIONES ═══
async function loadPendingInvites() {
  if (!onlineUser) return [];
  try { const q = query(collection(db, 'invites'), where('toUid', '==', onlineUser.uid), where('status', '==', 'pending')); const snap = await getDocs(q); return snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { return []; }
}
async function screenPendingInvites() {
  const invites = await loadPendingInvites();
  $g('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="${myClub ? 'screenClubHub()' : 'screenCreateClubScreen()'}">← Volver</button><div class="card card-gold center"><div style="font-size:3rem;">📬</div><h2>Invitaciones Pendientes</h2><p class="muted">${invites.length} invitación${invites.length !== 1 ? 'es' : ''}</p></div>${invites.length === 0 ? `<div class="card center"><p class="dim">No tenés invitaciones pendientes.</p></div>` : invites.map(inv => `<div class="card" style="background:linear-gradient(135deg, ${inv.clubColor || '#e30613'}33, rgba(20,32,25,0.95)); border-color:${inv.clubColor || '#e30613'};"><div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;"><div style="width:60px; height:60px; border-radius:16px; background:${inv.clubColor || '#e30613'}33; border:2px solid ${inv.clubColor || '#e30613'}; display:flex; align-items:center; justify-content:center; font-size:2rem;">${inv.clubShield || '🛡️'}</div><div style="flex:1; min-width:150px;"><div style="font-weight:800; font-size:1.1rem;">${inv.clubName}</div><div class="dim">Invitado por <strong style="color:var(--gold);">${inv.fromName}</strong></div></div></div><div class="grid-2 mt"><button class="btn btn-red btn-sm" onclick="window.FirebaseOnline.rejectInvite('${inv.id}')">❌ Rechazar</button><button class="btn btn-green btn-sm" onclick="window.FirebaseOnline.acceptInvite('${inv.id}')">✅ Aceptar</button></div></div>`).join('')}</div>`;
}
async function acceptInvite(inviteId) {
  try {
    const invSnap = await getDoc(doc(db, 'invites', inviteId));
    if (!invSnap.exists()) { window.showAlert('Invitación no existe.'); screenPendingInvites(); return; }
    const inv = invSnap.data();
    if (inv.toUid !== onlineUser.uid) { window.showAlert('Esta invitación no es tuya.'); return; }
    const clubSnap = await getDoc(doc(db, 'clubs', inv.clubId));
    if (!clubSnap.exists()) { await updateDoc(doc(db, 'invites', inviteId), { status: 'rejected' }); window.showAlert('El club ya no existe.'); screenPendingInvites(); return; }
    const club = clubSnap.data();
    const humans = club.members.filter(m => !m.isAI);
    if (humans.length >= 5) { window.showAlert('Club lleno.'); await updateDoc(doc(db, 'invites', inviteId), { status: 'rejected' }); screenPendingInvites(); return; }
    if (onlineProfile.clubId && onlineProfile.clubId !== inv.clubId) { try { const oldSnap = await getDoc(doc(db, 'clubs', onlineProfile.clubId)); if (oldSnap.exists()) { const oldMembers = oldSnap.data().members.filter(m => m.uid !== onlineUser.uid); await updateDoc(doc(db, 'clubs', onlineProfile.clubId), { members: oldMembers }); } } catch(e) {} }
    const newMember = { uid: onlineUser.uid, name: onlineProfile.gamertag, position: onlineProfile.position || 'CM', rating: 50, goals: 0, assists: 0, mvps: 0, isAI: false, dorsal: onlineProfile.dorsal || 10, joinedAt: serverTimestamp() };
    const newMembers = [...club.members, newMember];
    const aiIdx = newMembers.findIndex(m => m.isAI);
    if (newMembers.filter(m => !m.isAI).length <= 5 && aiIdx !== -1) newMembers.splice(aiIdx, 1);
    await updateDoc(doc(db, 'clubs', inv.clubId), { members: newMembers, updatedAt: serverTimestamp() });
    await saveProfile(onlineUser.uid, { clubId: inv.clubId });
    onlineProfile = await loadProfile(onlineUser.uid); window.onlineProfile = onlineProfile;
    await updateDoc(doc(db, 'invites', inviteId), { status: 'accepted' });
    const others = await loadPendingInvites();
    for (const o of others) await updateDoc(doc(db, 'invites', o.id), { status: 'rejected' });
    myClubId = inv.clubId; await loadMyClub(); screenClubHub();
    window.showAlert(`¡Bienvenido a ${club.name}!`, '¡CLUB UNIDO!');
  } catch (e) { window.showAlert('Error: ' + e.message); }
}
async function rejectInvite(inviteId) { try { await updateDoc(doc(db, 'invites', inviteId), { status: 'rejected' }); screenPendingInvites(); } catch (e) { window.showAlert('Error: ' + e.message); } }

    <div class="grid-2">
      <button class="btn btn-gold" onclick="window.FirebaseOnline.saveClubSettings('${selectedShield}', '${selectedColor}')">💾 Guardar</button>

}
async function saveClubSettings(shield, color) {
  try { const name = $g('#cs-name').value.trim() || myClub.name; await updateDoc(doc(db, 'clubs', myClubId), { name, shield, color, updatedAt: serverTimestamp() }); $g('#modal-root').innerHTML = ''; await loadMyClub(); screenClubHub(); window.showAlert('Club actualizado.', '¡LISTO!'); } catch (e) { window.showAlert('Error: ' + e.message); }
}
async function regenerateCode() {
  try { const newCode = generateInviteCode(); await updateDoc(doc(db, 'clubs', myClubId), { inviteCode: newCode }); await loadMyClub(); window.showAlert(`Nuevo código: <strong style="color:var(--gold); font-size:1.4rem; letter-spacing:3px;">${newCode}</strong>`, '¡CÓDIGO REGENERADO!'); $g('#modal-root').innerHTML = ''; screenClubHub(); } catch (e) { window.showAlert('Error: ' + e.message); }
}

// ═══ KICK / LEAVE / DELETE ═══
function confirmKick(uid, name) {
  window.showConfirm(`¿Expulsar a ${name} del club?`, async () => {
    try { const newMembers = myClub.members.filter(m => m.uid !== uid); await updateDoc(doc(db, 'clubs', myClubId), { members: newMembers }); await updateDoc(doc(db, 'users', uid), { clubId: null }); await loadMyClub(); screenClubHub(); window.showAlert(`${name} fue expulsado.`, 'EXPULSADO'); } catch (e) { window.showAlert('Error: ' + e.message); }
  });
}
async function leaveClub() {
  window.showConfirm('¿Salir del club?', async () => {
    try {
      if (myClub.ownerUid === onlineUser.uid) { const humans = myClub.members.filter(m => !m.isAI && m.uid !== onlineUser.uid); if (humans.length > 0) await updateDoc(doc(db, 'clubs', myClubId), { ownerUid: humans[0].uid, ownerName: humans[0].name }); else await deleteDoc(doc(db, 'clubs', myClubId)); }
      const newMembers = myClub.members.filter(m => m.uid !== onlineUser.uid);
      if (newMembers.length > 0) await updateDoc(doc(db, 'clubs', myClubId), { members: newMembers });

      myClub = null; myClubId = null;
      screenCreateClubScreen();
      window.showAlert('Saliste del club.', 'ADIÓS');
    } catch (e) { window.showAlert('Error: ' + e.message); }
  });
}
async function deleteClub() {
  window.showConfirm('¿Eliminar el club PERMANENTEMENTE?', async () => {
    try { const humans = myClub.members.filter(m => !m.isAI); for (const m of humans) { try { await updateDoc(doc(db, 'users', m.uid), { clubId: null }); } catch(e) {} } await deleteDoc(doc(db, 'clubs', myClubId)); myClub = null; myClubId = null; onlineProfile = await loadProfile(onlineUser.uid); window.onlineProfile = onlineProfile; screenCreateClubScreen(); window.showAlert('Club eliminado.', 'ADIÓS'); } catch (e) { window.showAlert('Error: ' + e.message); }
  });
}

// ═══ JUGAR / ENTRENAR ═══
async function startClubMatch() {
  if (!myClub) { screenClubHub(); return; }
  const humans = myClub.members.filter(m => !m.isAI);
  const needed = 5 - humans.length;
  const fillers = needed > 0 ? genAIFillers(4).slice(0, needed) : [];
  const teamMembers = [...humans, ...fillers];
  const bots = genBotTeamFB();
  window.startMatchSimulation(myClub.name, 'Bots United', teamMembers, bots, async (scoreA, scoreB, motm) => {
    const res = scoreA > scoreB ? '¡GANAMOS!' : scoreA < scoreB ? 'PERDIMOS' : 'EMPATE';
    try {
      const newStats = { ...(myClub.stats || { wins: 0, draws: 0, losses: 0, division: 10 }) };
      if (scoreA > scoreB) newStats.wins++; else if (scoreA < scoreB) newStats.losses++; else newStats.draws++;
      await updateDoc(doc(db, 'clubs', myClubId), { stats: newStats, updatedAt: serverTimestamp() });
      if (motm && motm.name === onlineProfile.gamertag) {
        const updatedMembers = myClub.members.map(m => m.uid === onlineUser.uid ? { ...m, goals: (m.goals || 0) + (motm.goals || 0), assists: (m.assists || 0) + (motm.assists || 0), mvps: (m.mvps || 0) + (motm.goals > 0 ? 1 : 0) } : m);
        await updateDoc(doc(db, 'clubs', myClubId), { members: updatedMembers });
      }
      await loadMyClub();
    } catch (e) { console.warn(e); }
    window.renderMatchResult(res, myClub.name, 'Bots United', scoreA, scoreB, '', () => screenClubHub(), motm);
  });
}
function openTraining() {
  window.startTrainingGame(async () => {
    try { const updatedMembers = myClub.members.map(m => m.uid === onlineUser.uid ? { ...m, rating: Math.min(99, m.rating + 1) } : m); await updateDoc(doc(db, 'clubs', myClubId), { members: updatedMembers }); await loadMyClub(); screenClubHub(); window.showAlert('¡Entrenamiento superado! +1 GRL', '¡BUEN TRABAJO!'); } catch (e) { window.showAlert('Error: ' + e.message); }
  }, () => { screenClubHub(); });
}

// ═══ PORTAL / API ═══
function openOnlinePortal() { window._inCoopFlow = true; if (onlineUser) { if (!onlineProfile || !onlineProfile.clubId) screenCreateClubScreen(); else { loadMyClub().then(() => screenClubHub()); } } else { screenAuthMenu(); } }

window.FirebaseOnline = { 
  openOnlinePortal, showLoginForm, loginUser, showRegisterForm, registerUser, logoutUser, 
  createClubFull, showJoinByCode, joinByCode, showInviteFriends, sendInviteByGamertag, 
  screenPendingInvites, acceptInvite, rejectInvite, showClubSettings, saveClubSettings, regenerateCode,
  confirmKick, leaveClub, deleteClub, startClubMatch, openTraining,
  saveUTTeam: async (uid, squad) => { try { await setDoc(doc(db, 'ut_teams', uid), { squad, updatedAt: serverTimestamp() }); return true; } catch (e) { return false; } }, 
  getRandomUTTeams: async (count) => { try { const snap = await getDocs(collection(db, 'ut_teams')); const teams = []; snap.forEach(d => teams.push({ uid: d.id, ...d.data() })); const available = teams.filter(t => onlineUser ? t.uid !== onlineUser.uid : true); return available.sort(() => 0.5 - Math.random()).slice(0, count); } catch (e) { return []; } }, 
  getMarketCards: async () => { let cards = []; try { const snap = await getDocs(collection(db, 'market_cards')); snap.forEach(d => { cards.push({ id: d.id, ...d.data() }); }); } catch (e) {} try { const local = JSON.parse(localStorage.getItem('local_market') || '[]'); cards = [...cards, ...local]; } catch(e) {} return cards.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); }, 
  postMarketCard: async (card, price, seller) => { try { await addDoc(collection(db, 'market_cards'), { card, price, seller, sellerUid: onlineUser?.uid || null, createdAt: serverTimestamp() }); return true; } catch (e) { try { let lm = JSON.parse(localStorage.getItem('local_market') || '[]'); lm.push({ id: 'local_' + Date.now(), card, price, seller: seller + " (Local)", createdAt: { seconds: Math.floor(Date.now()/1000) } }); localStorage.setItem('local_market', JSON.stringify(lm)); return 'local'; } catch(err) { return false; } } }, 
  deleteMarketCard: async (docId) => { try { await deleteDoc(doc(db, 'market_cards', docId)); return true; } catch (e) { return false; } }, 
  buyMarketCard: async (docId, buyerUid, sellerUid, price, card) => { try { await runTransaction(db, async (tx) => { tx.delete(doc(db, 'market_cards', docId)); tx.set(doc(collection(db, 'transactions')), { type: 'market_purchase', marketDocId: docId, buyerUid, sellerUid, price, cardName: card.name, createdAt: serverTimestamp() }); }); return true; } catch (e) { return false; } }
};

window.FirebaseSocial = {
  saveStats: async (stats) => { if (!onlineUser) return false; try { await setDoc(doc(db, 'leaderboard', onlineUser.uid), { ...stats, uid: onlineUser.uid, name: (onlineProfile && onlineProfile.gamertag) || 'Anónimo', updatedAt: serverTimestamp() }); return true; } catch(e) { return false; } },
  getTop: async (field = 'coins', limit = 30) => { try { const snap = await getDocs(collection(db, 'leaderboard')); const arr = snap.docs.map(d => ({ id: d.id, ...d.data() })); arr.sort((a, b) => (b[field] || 0) - (a[field] || 0)); return arr.slice(0, limit); } catch(e) { return []; } },
  getRivals: async (uids) => { if (!uids.length) return []; try { const out = []; for (const uid of uids) { const s = await getDoc(doc(db, 'leaderboard', uid)); if (s.exists()) out.push({ id: s.id, ...s.data() }); } return out; } catch(e) { return []; } }
};

window.FirebaseOnline._ready = true;
</script>

     PARTE 3B: ULTIMATE TEAM LOGIC

<script>
function screenUT() { $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold"><div style="display:flex; justify-content:space-between; align-items:center;"><h2 style="margin:0;">Ultimate Team</h2><div style="font-size:1.2rem; font-weight:800; color:var(--gold);">🪙 ${UT.coins.toLocaleString()}</div></div></div><div class="grid-2 mb"><div class="card center" onclick="openPack()" style="cursor:pointer;"><div style="font-size:2.5rem;">🎁</div><h3 style="color:var(--gold);">Abrir Sobre</h3><p class="dim">Sobres: ${UT.packs}</p></div><div class="card center" onclick="buyPack()" style="cursor:pointer;"><div style="font-size:2.5rem;">🛒</div><h3 style="color:var(--green);">Comprar Sobre</h3><p class="dim">Costo: 5000 🪙</p></div></div><div class="grid-2 mb"><div class="card center" onclick="screenUTSquad()" style="cursor:pointer;"><div style="font-size:2.5rem;">⚽</div><h3 style="color:var(--blue);">Mi Plantilla</h3></div><div class="card center" onclick="screenUTDraft()" style="cursor:pointer;"><div style="font-size:2.5rem;">📝</div><h3 style="color:var(--purple);">Modo Draft</h3></div></div><div class="grid-2 mb"><div class="card center" onclick="screenUTMarket()" style="cursor:pointer;"><div style="font-size:2.5rem;">💱</div><h3 style="color:var(--green);">Mercado</h3></div><div class="card center" onclick="screenUTTournament()" style="cursor:pointer;"><div style="font-size:2.5rem;">🤖</div><h3 style="color:var(--green);">Torneo Offline</h3><p class="dim">Contra bots</p></div></div><div class="grid-2 mb"><div class="card center" onclick="screenUTTournamentOnline()" style="cursor:pointer;"><div style="font-size:2.5rem;">🌐</div><h3 style="color:var(--gold);">Torneo Online</h3><p class="dim">Contra usuarios</p></div><div class="card center" onclick="screenUTChampions()" style="cursor:pointer; border-color: #d4af37;"><div style="font-size:2.5rem;">👑</div><h3 style="color:#d4af37;">FUT Champions</h3><p class="dim">Div ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][UT.champsDiv-1]} · ${UT.champsPts} Pts</p></div></div>`; }

function screenUTChampions() { const divNames = ['I','II','III','IV','V','VI','VII','VIII','IX','X']; const divIndex = UT.champsDiv - 1; $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenUT()">← Volver</button><div class="card card-gold" style="border-color:#d4af37;"><h2 style="color:#d4af37;">👑 FUT Champions</h2><div style="text-align:center;"><div style="font-size:2rem; font-weight:900; color:#d4af37;">DIV ${divNames[divIndex]}</div><div class="dim">${UT.champsPts} / 3 Pts</div></div></div><div class="card center" style="display:flex; flex-direction:column; gap:10px;"><button class="btn btn-gold btn-block" onclick="playChampsMatch(false)">⚽ Jugar vs Bot (Rápido)</button><button class="btn btn-green btn-block" onclick="screenChampsOfflineTournament()">🤖 Torneo Offline Champions</button><button class="btn btn-blue btn-block" onclick="playChampsMatch(true)">🌐 Buscar Rival (Online)</button></div></div>`; }

async function playChampsMatch(isOnline) { 
  if (!UT.squad.filter(p=>p).length) { window.showAlert('Necesitás 1 jugador.'); return; } 
  let oppName = "Bot Champions"; 
  let oppSquad = genBotTeam(65 + (10 - UT.champsDiv) * 3); 
  if (isOnline) { 
    $('#app').innerHTML = `<div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Buscando Rival...</h2></div>`; 
    if (window.FirebaseOnline && window.onlineUser) { 
      await window.FirebaseOnline.saveUTTeam(window.onlineUser.uid, UT.squad); 
      const opps = await window.FirebaseOnline.getRandomUTTeams(1); 
      if (opps.length > 0) { oppSquad = opps[0].squad; oppName = "Rival: " + (opps[0].uid ? opps[0].uid.substring(0,5) : 'Online'); } 
      else { window.showAlert('No hay rivales. Jugarás vs IA.'); isOnline = false; } 
    } else { window.showAlert('Logueate primero.'); isOnline = false; } 
  } 
  const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; 
  const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; 
  window.startMatchSimulation('Mi UT', oppName, myFullTeam, oppSquad, (scoreA, scoreB, motm) => { 
    let msg = ''; 
    if (scoreA > scoreB) { 
      UT.champsPts++; 
      if (UT.champsPts >= 3) { 
        UT.champsPts = 0; 
        if (UT.champsDiv > 1) { UT.champsDiv--; msg = `<p class="gold" style="font-size:1.2rem; font-weight:800;">¡ASCENSO a División ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][UT.champsDiv-1]}!</p>`; } 
        else msg = `<p class="gold">¡Campeón de División I!</p>`; 
      } else msg = `<p class="green">Ganaste. Pts: ${UT.champsPts}/3</p>`; 
    } else if (scoreA < scoreB) { UT.champsPts = Math.max(0, UT.champsPts - 1); msg = `<p class="red">Derrota. Pts: ${UT.champsPts}/3</p>`; } 
    else msg = `<p class="dim">Empate. Pts: ${UT.champsPts}/3</p>`; 
    saveUT(); 
    let rewardHtml = ''; 
    if (scoreA > scoreB && UT.champsPts === 0) { 
      let c = 0, p = 0; 
      if (UT.champsDiv === 1) { c = 500000; p = 20; } 
      else if (UT.champsDiv === 2) { c = 200000; p = 10; } 
      else if (UT.champsDiv === 3) { c = 100000; p = 5; } 
      else if (UT.champsDiv === 4) { c = 50000; p = 3; } 
      else if (UT.champsDiv <= 7) { c = 20000; p = 2; } 
      else { c = 5000; p = 1; } 
      UT.coins += c; UT.packs += p; saveUT(); 
      rewardHtml = `<p class="gold" style="font-size:1.5rem; font-weight:900;">+${c.toLocaleString()} 🪙 + ${p} Sobres</p>`; 
    } 
    window.renderMatchResult(scoreA > scoreB ? '¡VICTORIA!' : scoreA < scoreB ? 'DERROTA' : 'EMPATE', 'Mi UT', oppName, scoreA, scoreB, `${msg}${rewardHtml}`, () => screenUTChampions(), motm); 
  }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, false, false, isOnline); 
}

function screenChampsOfflineTournament() { 
  if (!UT.squad.filter(p => p).length) { window.showAlert('Necesitás 1 jugador.'); return; } 
  const divNames = ['I','II','III','IV','V','VI','VII','VIII','IX','X']; 
  const baseRating = 65 + (10 - UT.champsDiv) * 3; 
  const stages = [{ name: 'Cuartos', rating: baseRating, reward: 5000, packs: 1 }, { name: 'Semifinal', rating: baseRating + 3, reward: 10000, packs: 2 }, { name: 'Final', rating: baseRating + 6, reward: 25000, packs: 3 }]; 
  if (!window._champsTour) window._champsTour = { stage: 0 }; 
  const t = window._champsTour;

  for (let i = 0; i < 3; i++) { 
    const r = Math.random() * 100; 
    let pool; 
    if (r < 0.1) pool = DB_UT.filter(p => p.type === 'totw');

    else if (r < 32.5) pool = DB_UT.filter(p => p.type === 'gold'); 
    else if (r < 70) pool = DB_UT.filter(p => p.type === 'silver'); 
    else pool = DB_UT.filter(p => p.type === 'bronze');

  }

async function buyGlobalCard(docId) { 
  const offer = GLOBAL_MARKET.find(m => m.id === docId); 
  if (!offer) return; 
  if (UT.coins < offer.price) { window.showAlert('No tenés monedas.'); return; } 
  window.showConfirm(`Comprar ${offer.card.name} por ${offer.price.toLocaleString()}?`, async () => { 
    let success = false; 
    if (docId.startsWith('local_')) { let lm = JSON.parse(localStorage.getItem('local_market') || '[]'); lm = lm.filter(c => c.id !== docId); localStorage.setItem('local_market', JSON.stringify(lm)); success = true; } 
    else if (window.FirebaseOnline && window.FirebaseOnline.buyMarketCard) { success = await window.FirebaseOnline.buyMarketCard(docId, window.onlineUser?.uid, offer.sellerUid, offer.price, offer.card); if (!success) success = await window.FirebaseOnline.deleteMarketCard(docId); }

    else { window.showAlert('Error al comprar.'); loadGlobalMarket(); } 
  });

async function publishCard(cardId, price) {

function runTournamentMatch() { 
  if (window._tourneyCurrent >= 3) { 
    if (window._tourneyWins === 3) { UT.coins += 50000; UT.packs += 5; saveUT(); window.renderMatchResult('¡CAMPEÓN ONLINE!', 'Mi UT', 'Mundo', 3, 0, `<p class="gold">+50,000 🪙 + 5 Sobres</p>`, () => screenUT()); }

    return; 
  } 
  const opp = window._tourneyOpponents[window._tourneyCurrent]; 
  let oppName = opp.uid ? "Jugador: " + opp.uid.substring(0, 5) : "Rival " + (window._tourneyCurrent + 1); 
  const oppSquad = opp.squad || genBotTeam(85); 
  const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; 
  const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; 
  window.startMatchSimulation('Mi UT', oppName, myFullTeam, oppSquad, (scoreA, scoreB, motm) => { 
    if (scoreA > scoreB) window._tourneyWins++; 
    window._tourneyCurrent++; 
    window.renderMatchResult(scoreA > scoreB ? 'Victoria' : 'Derrota', 'Mi UT', oppName, scoreA, scoreB, `<p class="dim">Partido ${window._tourneyCurrent}/3</p>`, () => runTournamentMatch(), motm); 
  }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, false, false, true); 
}

}
function applyFormation(formName, mode) { 
  const form = FORMATIONS[formName]; if (!form) return;
  if (mode === 'draft') { 
    if (!window.DRAFT) return; 
    const newSquad = Array(11).fill(null); 
    window.DRAFT.squad.filter(p => p).forEach(card => { const cardPos = card.pos.split('/'); let idx = newSquad.findIndex((s, i) => !s && cardPos.includes(form.slots[i].role)); if (idx === -1) idx = newSquad.findIndex((s, i) => { if (s) return false; return cardPos.some(p => getZone(p) === getZone(form.slots[i].role)); }); if (idx === -1) idx = newSquad.findIndex(s => !s); if (idx !== -1) newSquad[idx] = card; }); 
    window.DRAFT.squad = newSquad; window.DRAFT.formation = formName; 
    document.getElementById('modal-root').innerHTML = ''; 
    screenUTDraft(); return; 
  }
  if (mode === 'ut') { 
    const newSquad = Array(11).fill(null); 
    UT.squad.filter(p => p).forEach(card => { const cardPos = card.pos.split('/'); let idx = newSquad.findIndex((s, i) => !s && cardPos.includes(form.slots[i].role)); if (idx === -1) idx = newSquad.findIndex((s, i) => { if (s) return false; return cardPos.some(p => getZone(p) === getZone(form.slots[i].role)); }); if (idx === -1) idx = newSquad.findIndex(s => !s); if (idx !== -1) newSquad[idx] = card; });

    MGR.startingXI = newSquad; MGR.formation = formName; saveMGR(); 
  }
  document.getElementById('modal-root').innerHTML = ''; 
  if (mode === 'ut') screenUTSquad(); 
  else if (mode === 'mgr') screenManager(); 
}

let tooltipTimeout = null;
window.showPitchTooltip = (e, player, chem) => { const el = document.getElementById('tooltip'); if(!chem) el.innerHTML = `<strong style="color:var(--gold)">${player.name}</strong><br>${player.pos}`; else el.innerHTML = `<strong style="color:var(--gold)">${player.name}</strong><br>Química: ${chem.total}/10`; clearTimeout(tooltipTimeout); tooltipTimeout = setTimeout(() => { el.style.left = e.pageX + 'px'; el.style.top = e.pageY + 'px'; el.style.opacity = 1; }, 400); };
window.hideTooltip = () => { clearTimeout(tooltipTimeout); document.getElementById('tooltip').style.opacity = 0; };
let draggedItem = null;
window.dragStart = (e, context, type, indexOrId) => { let player = null, index = null; if (context === 'draft') { if (type === 'pitch') { player = window.DRAFT.squad[indexOrId]; index = indexOrId; } } else if (context === 'ut') { if (type === 'pitch') { player = UT.squad[indexOrId]; index = indexOrId; } else if (type === 'bench') { player = UT.bench[indexOrId]; if(!player) player = UT.cards.find(c => c.id === indexOrId); index = indexOrId; } } else if (context === 'mgr') { if (type === 'pitch') { player = MGR.startingXI[indexOrId]; index = indexOrId; } else if (type === 'bench') { player = MGR.bench[indexOrId]; index = indexOrId; } } if (!player) { e.preventDefault(); return; } draggedItem = { context, type, index, player }; e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); };
window.dragEnd = (e) => { e.target.classList.remove('dragging'); };
window.dragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.dragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };
window.drop = (e, context, targetType, targetIndex) => { 
  e.preventDefault(); e.currentTarget.classList.remove('drag-over'); 
  if (!draggedItem || draggedItem.context !== context) return;
  if (context === 'draft' && targetType === 'pitch') { const t = window.DRAFT.squad[targetIndex]; window.DRAFT.squad[targetIndex] = window.DRAFT.squad[draggedItem.index]; window.DRAFT.squad[draggedItem.index] = t; screenUTDraft(); draggedItem = null; return; }
  if (context === 'ut') { if (targetType === 'pitch') { if (draggedItem.type === 'pitch') { const t = UT.squad[targetIndex]; UT.squad[targetIndex] = UT.squad[draggedItem.index]; UT.squad[draggedItem.index] = t; } else if (draggedItem.type === 'bench') { const newB = UT.bench[draggedItem.index]; if (newB) UT.bench[draggedItem.index] = UT.squad[targetIndex]; else UT.cards = UT.cards.filter(c => c.id !== draggedItem.player.id); UT.squad[targetIndex] = draggedItem.player; } } saveUT(); screenUTSquad(); }
  else if (context === 'mgr') { if (targetType === 'pitch') { const t = MGR.startingXI[targetIndex]; MGR.startingXI[targetIndex] = MGR.startingXI[draggedItem.index]; MGR.startingXI[draggedItem.index] = t; } saveMGR(); screenManager(); }
  draggedItem = null; 
};
function renderPitch(squad, mode, formation, chemData = {}) { 
  const form = formation || FORMATIONS['4-3-3']; 
  let html = `<div class="pitch">`; 
  for (let i = 0; i < 11; i++) { 
    const p = squad[i]; const slot = form.slots[i]; if (!slot) continue; const role = slot.role; 
    if (p) { 
      const penalty = getPenalty(p.pos, role); const eff = p.rating - penalty; const isOut = penalty > 0; const color = isOut ? 'var(--red)' : 'inherit'; 
      let chemHTML = '', chemBadges = '', chemJSON = 'null'; 
      if (chemData && chemData[p.id]) { const c = chemData[p.id].total; const chemColor = c >= 8 ? '#4ade80' : c >= 5 ? '#facc15' : '#ef4444'; chemHTML = `<div class="chem-dot" style="background:${chemColor}"></div>`; if (p.nation !== 'Icon') chemBadges = `<div class="chem-badges"><span>${getNationBadge(p.nation)}</span></div>`; chemJSON = JSON.stringify(chemData[p.id]).replace(/"/g, '&quot;'); } 
      const pJSON = JSON.stringify(p).replace(/"/g, '&quot;'); 
      html += `<div class="spot ${p.type || ''} ${isOut ? 'out-of-position' : ''}" style="left:${slot.x}%; top:${slot.y}%;" draggable="true" ondragstart="dragStart(event, '${mode}', 'pitch', ${i})" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'pitch', ${i})" onmouseenter="showPitchTooltip(event, ${pJSON}, ${chemJSON})" onmouseleave="hideTooltip()" onclick="showPlayerStats('${p.id}')">${chemHTML}<div class="spot-rating" style="color:${color};">${eff}</div><div class="spot-pos">${role}</div><div class="spot-name">${p.name.split(' ')[0]}</div>${chemBadges}</div>`; 
    } else html += `<div class="spot empty" style="left:${slot.x}%; top:${slot.y}%;" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'pitch', ${i})"><div class="spot-pos">${role}</div></div>`; 
  } 
  html += `</div>`; 
  return html; 
}
function renderBench(bench, mode) { 
  let html = `<div class="bench-container">`; 
  const max = mode === 'ut' ? 7 : 5; 
  for (let i = 0; i < max; i++) { 
    const p = bench[i]; 
    if (p) html += `<div class="bench-spot filled ${p.type || ''}" draggable="true" ondragstart="dragStart(event, '${mode}', 'bench', ${i})" ondragend="dragEnd(event)" onclick="showPlayerStats('${p.id}')"><div class="spot-rating">${p.rating}</div><div class="spot-pos">${p.pos}</div><div class="spot-name">${p.name.split(' ')[0]}</div></div>`; 
    else html += `<div class="bench-spot" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'bench', ${i})"><div class="spot-pos dim">Banca</div></div>`; 
  } 
  html += `</div>`; 
  return html; 
}
</script>

function getStats() { try { return JSON.parse(localStorage.getItem('mfc_stats')) || {}; } catch(e) { return {}; } }

function unlockAchievement(id) {
  const ach = ACHIEVEMENTS.find(a => a.id === id);

  if (unlocked[id]) return false;
  unlocked[id] = Date.now();
  saveAchievements(unlocked);
  UT.coins += ach.coins; saveUT();
  addReputation(15);

}

}

function getTodayMissions() {
  const today = new Date().toDateString();
  try {
    const stored = JSON.parse(localStorage.getItem('mfc_missions'));
    if (stored && stored.date === today) return stored;
  } catch(e) {}
  const pool = [...MISSIONS_POOL].sort(() => 0.5 - Math.random()).slice(0, 3);
  const missions = { date: today, list: pool.map(m => ({ ...m, progress: 0, completed: false })) };
  localStorage.setItem('mfc_missions', JSON.stringify(missions));
  return missions;
}
function updateMissionProgress(missionId, increment) {
  const missions = getTodayMissions();
  const m = missions.list.find(x => x.id === missionId);
  if (!m || m.completed) return false;
  m.progress = Math.min(m.target, m.progress + increment);
  if (m.progress >= m.target) {
    m.completed = true;
    UT.coins += m.coins; saveUT();
    addReputation(10);
    setTimeout(() => window.showAlert(`¡Misión completada!<br>${m.desc}<br><br><strong class="gold">+${m.coins} 🪙</strong>`, '🎯 ¡MISIÓN COMPLETADA!'), 500);
  }
  localStorage.setItem('mfc_missions', JSON.stringify(missions));
  return m.completed;
}

      const stats = getStats();
      stats.totalMatches = (stats.totalMatches || 0) + 1;
      stats.totalGoals = (stats.totalGoals || 0) + a;
      if (a > b) {
        stats.totalWins = (stats.totalWins || 0) + 1;
        if (stats.totalWins === 1) unlockAchievement('first_win');
        if (stats.totalWins >= 10) unlockAchievement('ten_wins');
        if (stats.totalWins >= 50) unlockAchievement('fifty_wins');
        if (stats.totalWins >= 100) unlockAchievement('hundred_wins');
        if (b === 0) unlockAchievement('clean_sheet');
        if (a - b >= 5) unlockAchievement('big_win');
        updateMissionProgress('win_1', 1);
        if (a - b >= 3) updateMissionProgress('big_win', 1);
      }
      if (b === 0) updateMissionProgress('clean_sheet', 1);
      if (a >= 3) stats.hatTricks = (stats.hatTricks || 0) + 1;
      if (a >= 1) unlockAchievement('first_goal');
      if (a >= 3) unlockAchievement('hat_trick');
      if (a >= 5) unlockAchievement('goal_rain');
      if (motm && motm.goals) stats.totalGoalsScoredByPlayer = (stats.totalGoalsScoredByPlayer || 0) + motm.goals;
      if (UT.coins >= 100000) unlockAchievement('rich_100k');
      if (UT.coins >= 1000000) unlockAchievement('rich_1m');
      saveStats(stats);
      updateMissionProgress('play_2', 1);
      updateMissionProgress('score_5', a);
      myOnFinish(a, b, motm);
    };
    return orig.apply(this, args);
  };

document.addEventListener('keydown', (e) => { keySequence.push(e.key.toUpperCase()); if (keySequence.length > 7) keySequence.shift(); const k = keySequence.join(''); if (k === 'MFC' && !localStorage.getItem('unlocked_arcade')) { keySequence = []; localStorage.setItem('unlocked_arcade', 'true'); window.showAlert('¡Modo Arcade!', '¡SECRETO 2!'); screenInicio(); } if (k === 'FUEGO' && !localStorage.getItem('unlocked_fire')) { keySequence = []; localStorage.setItem('unlocked_fire', 'true'); window.showAlert('¡Modo Fuego!', '¡SECRETO 3!'); screenInicio(); } if (k === 'POTRO' && !localStorage.getItem('unlocked_potro')) { keySequence = []; localStorage.setItem('unlocked_potro', 'true'); window.showAlert('¡Modo Potro!', '¡SECRETO 4!'); screenInicio(); } if (k === 'D10S' && !localStorage.getItem('unlocked_dios')) { keySequence = []; localStorage.setItem('unlocked_dios', 'true'); window.showAlert('¡Modo Dios!', '¡SECRETO 5!'); screenInicio(); } if (k === 'GOAT' && !localStorage.getItem('unlocked_goat')) { keySequence = []; localStorage.setItem('unlocked_goat', 'true'); window.showAlert('¡Modo GOAT!', '¡SECRETO 6!'); screenInicio(); } if (k === 'RETRO') { keySequence = []; document.body.classList.toggle('retro-mode'); } });
const MENU_CONFIG = { 'ut': { icon: '⚽', color: 'var(--blue)' }, 'tourn': { icon: '🏆', color: 'var(--gold)' }, 'mgr': { icon: '💼', color: 'var(--purple)' }, 'mgr_real': { icon: '🌍', color: 'var(--green)' }, 'pcareer': { icon: '🏃', color: 'var(--green)' }, 'coop': { icon: '🤝', color: 'var(--orange)' }, 'offline': { icon: '🎮', color: 'var(--text-2)' }, 'rain': { icon: '🌧️', color: '#60a5fa' }, 'survival': { icon: '☠️', color: '#ef4444' }, 'fk': { icon: '🎯', color: '#facc15' }, 'quick': { icon: '⚡', color: '#60a5fa' }, 'volta': { icon: '🛹', color: 'var(--gold)' }, 'arcade': { icon: '👾', color: 'var(--blue)' }, 'potro': { icon: '🐎', color: '#FFD700' }, 'dios': { icon: '🌟', color: '#fff' }, 'goat': { icon: '🐐', color: '#d4af37' } };
function renderMenuContent(mode) { currentMenuMode = mode; document.querySelectorAll('.fc-btn').forEach(btn => btn.classList.remove('active')); const ab = document.getElementById('nav-'+mode); if (ab) ab.classList.add('active'); const t = TRANSLATIONS[currentLang]; const cfg = MENU_CONFIG[mode]; document.getElementById('fc-content').innerHTML = `<div class="content-anim"><div class="fc-title" style="color:${cfg.color}; text-shadow: 0 10px 30px ${cfg.color}44;">${cfg.icon} ${t[mode]}</div><div class="fc-desc">${t['desc_'+mode]}</div><button class="fc-play-btn" onclick="playMenuMode('${mode}')">${t.play} ➔</button></div>`; }
function playMenuMode(mode) { const app = document.getElementById('app'); app.classList.add('page-transition-out'); setTimeout(() => { app.classList.remove('page-transition-out'); window.showLoadingScreen(() => { if (mode === 'ut') screenUT(); else if (mode === 'mgr') loadManager(false); else if (mode === 'mgr_real') loadManager(true); else if (mode === 'pcareer') screenCreacion(); else if (mode === 'coop') window.CoperoUI.startOnline(); else if (mode === 'offline') { if (!PC && !loadPC()) screenPCSetup(); else screenPCLobby(); } else if (mode === 'tourn') screenUTTournament(); else if (mode === 'volta') screenVolta(); else if (mode === 'arcade') screenArcade(); else if (mode === 'potro') screenPotro(); else if (mode === 'dios') screenDios(); else if (mode === 'rain') screenRain(); else if (mode === 'survival') screenSurvival(); else if (mode === 'fk') screenFreeKick(); else if (mode === 'quick') screenQuickMatch(); else if (mode === 'goat') screenGoat(); }); }, 300); }

function screenInicio() {
  window._inCoopFlow = false;
  const hasBarrio = !!getBarrio();
  if (hasBarrio) { const lr = localStorage.getItem('last_daily_reward'); const now = Date.now(); if (!lr || now - parseInt(lr) > 86400000) { localStorage.setItem('last_daily_reward', now); UT.coins += 5000; UT.packs += 1; saveUT(); setTimeout(() => window.showAlert('¡Recompensa Diaria!<br>+5,000 🪙 y +1 Sobre.', '¡Bienvenido!'), 1000); } }
  const app = document.getElementById('app'); app.classList.remove('page-transition-out'); app.classList.add('page-transition'); setTimeout(() => app.classList.remove('page-transition'), 500);
  const t = TRANSLATIONS[currentLang];
  let extraBtns = '';
  if (localStorage.getItem('unlocked_volta')) extraBtns += `<button class="fc-btn" id="nav-volta" onmouseenter="renderMenuContent('volta')" onclick="playMenuMode('volta')" style="color:var(--gold);">${MENU_CONFIG['volta'].icon} ${t.volta}</button>`;
  if (localStorage.getItem('unlocked_arcade')) extraBtns += `<button class="fc-btn" id="nav-arcade" onmouseenter="renderMenuContent('arcade')" onclick="playMenuMode('arcade')" style="color:var(--blue);">${MENU_CONFIG['arcade'].icon} ${t.arcade}</button>`;
  if (localStorage.getItem('unlocked_potro')) extraBtns += `<button class="fc-btn" id="nav-potro" onmouseenter="renderMenuContent('potro')" onclick="playMenuMode('potro')" style="color:#FFD700;">${MENU_CONFIG['potro'].icon} ${t.potro}</button>`;
  if (localStorage.getItem('unlocked_dios')) extraBtns += `<button class="fc-btn" id="nav-dios" onmouseenter="renderMenuContent('dios')" onclick="playMenuMode('dios')" style="color:#fff;">${MENU_CONFIG['dios'].icon} ${t.dios}</button>`;
  if (localStorage.getItem('unlocked_goat')) extraBtns += `<button class="fc-btn" id="nav-goat" onmouseenter="renderMenuContent('goat')" onclick="playMenuMode('goat')" style="color:#d4af37;">${MENU_CONFIG['goat'].icon} ${t.goat}</button>`;
  const museoBtn = hasBarrio ? `<button class="fc-btn" id="nav-museo" onclick="screenMuseo()" style="color:var(--gold);">🏛️ Museo</button>` : '';
  const progresoBtn = `<button class="fc-btn" id="nav-progreso" onclick="screenProgress()" style="color:var(--gold);">🏅 Progreso</button>`;
  $('#app').innerHTML = `<div class="fc-menu-container"><div class="fc-sidebar">${hasBarrio ? renderBarrioCard() : ''}<div class="fc-logo-area" onclick="window.handleLogoClick(event)"><div class="fc-logo-icon">⚽</div><span class="fc-logo-text">MFC 2027</span></div>${hasBarrio ? renderTanoTip() : ''}<div class="fc-nav"><button class="fc-btn active" id="nav-ut" onmouseenter="renderMenuContent('ut')" onclick="playMenuMode('ut')">${MENU_CONFIG['ut'].icon} ${t.ut}</button><button class="fc-btn" id="nav-tourn" onmouseenter="renderMenuContent('tourn')" onclick="playMenuMode('tourn')">${MENU_CONFIG['tourn'].icon} ${t.tourn}</button><button class="fc-btn" id="nav-mgr" onmouseenter="renderMenuContent('mgr')" onclick="playMenuMode('mgr')">${MENU_CONFIG['mgr'].icon} ${t.mgr}</button><button class="fc-btn" id="nav-mgr_real" onmouseenter="renderMenuContent('mgr_real')" onclick="playMenuMode('mgr_real')">${MENU_CONFIG['mgr_real'].icon} ${t.mgr_real}</button><button class="fc-btn" id="nav-pcareer" onmouseenter="renderMenuContent('pcareer')" onclick="playMenuMode('pcareer')">${MENU_CONFIG['pcareer'].icon} ${t.pcareer}</button><button class="fc-btn" id="nav-coop" onmouseenter="renderMenuContent('coop')" onclick="playMenuMode('coop')">${MENU_CONFIG['coop'].icon} ${t.coop}</button><button class="fc-btn" id="nav-offline" onmouseenter="renderMenuContent('offline')" onclick="playMenuMode('offline')">${MENU_CONFIG['offline'].icon} ${t.offline}</button><button class="fc-btn" id="nav-quick" onmouseenter="renderMenuContent('quick')" onclick="playMenuMode('quick')">${MENU_CONFIG['quick'].icon} ${t.quick}</button><button class="fc-btn" id="nav-fk" onmouseenter="renderMenuContent('fk')" onclick="playMenuMode('fk')">${MENU_CONFIG['fk'].icon} ${t.fk}</button><button class="fc-btn" id="nav-rain" onmouseenter="renderMenuContent('rain')" onclick="playMenuMode('rain')">${MENU_CONFIG['rain'].icon} ${t.rain}</button><button class="fc-btn" id="nav-survival" onmouseenter="renderMenuContent('survival')" onclick="playMenuMode('survival')">${MENU_CONFIG['survival'].icon} ${t.survival}</button><button class="fc-btn" id="nav-tactics" onclick="screenTactics()" style="color:var(--purple);">⚙️ Tácticas</button>${extraBtns}${museoBtn}${progresoBtn}<button class="fc-btn" id="nav-leaderboard" onclick="screenLeaderboard()" style="color:var(--gold);">📊 Ranking</button></div><button class="fc-settings-btn" onclick="screenSettings()">⚙️ ${t.settings}</button></div><div class="fc-content-area" id="fc-content"></div></div>`;
  renderMenuContent('ut');
  if (!hasBarrio) askBarrioName();
}

function screenSettings() { const t = TRANSLATIONS[currentLang]; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content" style="max-width: 500px;"><div class="modal-header"><h2>⚙️ ${t.settings}</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><div class="tabs"><button class="tab active" onclick="window.switchSettingsTab('lang', this)">${t.set_lang}</button><button class="tab" onclick="window.switchSettingsTab('secrets', this)">${t.set_secrets}</button><button class="tab" onclick="window.switchSettingsTab('general', this)">${t.set_general}</button></div><div id="settings-lang" class="settings-tab"><div class="field"><label>Idioma</label><select onchange="window.changeLanguage(this.value)"><option value="es" ${currentLang === 'es' ? 'selected' : ''}>🇦🇷 Español</option><option value="en" ${currentLang === 'en' ? 'selected' : ''}>🇺🇸 English</option><option value="pt" ${currentLang === 'pt' ? 'selected' : ''}>🇧🇷 Português</option></select></div></div><div id="settings-secrets" class="settings-tab" style="display:none;"><p class="dim mb">${t.set_sec_desc}</p><div class="stat-row"><span class="lbl">Volta</span><label class="switch"><input type="checkbox" ${localStorage.getItem('unlocked_volta') ? 'checked' : ''} onchange="window.toggleSecret('volta', this.checked)"><span class="slider"></span></label></div><div class="stat-row"><span class="lbl">Arcade</span><label class="switch"><input type="checkbox" ${localStorage.getItem('unlocked_arcade') ? 'checked' : ''} onchange="window.toggleSecret('arcade', this.checked)"><span class="slider"></span></label></div><div class="stat-row"><span class="lbl">Fuego</span><label class="switch"><input type="checkbox" ${localStorage.getItem('unlocked_fire') ? 'checked' : ''} onchange="window.toggleSecret('fire', this.checked)"><span class="slider"></span></label></div><div class="stat-row"><span class="lbl">Potro</span><label class="switch"><input type="checkbox" ${localStorage.getItem('unlocked_potro') ? 'checked' : ''} onchange="window.toggleSecret('potro', this.checked)"><span class="slider"></span></label></div><div class="stat-row"><span class="lbl">D10S</span><label class="switch"><input type="checkbox" ${localStorage.getItem('unlocked_dios') ? 'checked' : ''} onchange="window.toggleSecret('dios', this.checked)"><span class="slider"></span></label></div><div class="stat-row"><span class="lbl">GOAT</span><label class="switch"><input type="checkbox" ${localStorage.getItem('unlocked_goat') ? 'checked' : ''} onchange="window.toggleSecret('goat', this.checked)"><span class="slider"></span></label></div></div><div id="settings-general" class="settings-tab" style="display:none;"><div class="stat-row"><span class="lbl">${t.set_sound}</span><label class="switch"><input type="checkbox" ${soundEnabled ? 'checked' : ''} onchange="window.toggleSound(this.checked)"><span class="slider"></span></label></div><div class="stat-row"><span class="lbl">🎵 Música</span><label class="switch"><input type="checkbox" ${localStorage.getItem('mfc_music') !== 'false' ? 'checked' : ''} onchange="window.toggleMusic(this.checked)"><span class="slider"></span></label></div><div class="stat-row mt"><div><span class="lbl red">${t.set_reset}</span><p class="dim">${t.set_reset_desc}</p></div><button class="btn btn-red btn-sm" onclick="window.resetGame()">${t.set_reset}</button></div></div><button class="btn btn-gold btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">OK</button></div></div>`; }
window.switchSettingsTab = (tab, btn) => { document.querySelectorAll('.settings-tab').forEach(el => el.style.display = 'none'); document.querySelectorAll('.tabs .tab').forEach(el => el.classList.remove('active')); document.getElementById('settings-' + tab).style.display = 'block'; btn.classList.add('active'); };
window.changeLanguage = (lang) => { currentLang = lang; localStorage.setItem('mfc_lang', lang); document.getElementById('modal-root').innerHTML = ''; screenInicio(); };
window.toggleSecret = (secret, c) => { if (c) localStorage.setItem('unlocked_' + secret, 'true'); else localStorage.removeItem('unlocked_' + secret); screenInicio(); };
window.toggleSound = (c) => { soundEnabled = c; localStorage.setItem('mfc_sound', c); };
window.toggleMusic = (on) => { localStorage.setItem('mfc_music', on); window.MFCMusic._menuEnabled = on; if (!on) window.MFCMusic.stopMenu(); else if (window.MFCMusic._menuPlaying) window.MFCMusic.playMenu(); };
window.resetGame = () => { window.showConfirm('¿Borrar TODO?', () => { localStorage.clear(); location.reload(); }); };
</script>

<!-- ═══════════════════════════════════════════════════════════════
     PARTE 4C: MODOS ESPECIALES + TIRO LIBRE + CARRERA
     ═══════════════════════════════════════════════════════════════ -->
<script>
function screenVolta() { const bots = genBotTeam(85); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales Callejeros', myFullTeam, bots, (a, b, motm) => { if (a > b) { UT.coins += 25000; saveUT(); window.renderMatchResult('¡DOMINIO CALLEJERO!', 'Mi Equipo', 'Rivales', a, b, `<p class="gold">+25,000 🪙</p>`, () => screenInicio(), motm); } else window.renderMatchResult('Derrota', 'Mi Equipo', 'Rivales', a, b, '', () => screenInicio(), motm); }, true, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); }
function screenArcade() { const bots = genBotTeam(85); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales Arcade', myFullTeam, bots, (a, b, motm) => { if (a > b) { UT.coins += 50000; saveUT(); window.renderMatchResult('¡LOCURA!', 'Mi Equipo', 'Rivales', a, b, `<p class="blue">+50,000 🪙</p>`, () => screenInicio(), motm); } else window.renderMatchResult('Derrota', 'Mi Equipo', 'Rivales', a, b, '', () => screenInicio(), motm); }, false, true, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); }
function screenPotro() { const bots = genBotTeam(85); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales Potro', myFullTeam, bots, (a, b, motm) => { if (a > b) { UT.coins += 30000; saveUT(); window.renderMatchResult('¡POTRO GANADO!', 'Mi Equipo', 'Rivales', a, b, `<p style="color:#FFD700;">+30,000 🪙</p>`, () => screenInicio(), motm); } else window.renderMatchResult('Derrota', 'Mi Equipo', 'Rivales', a, b, '', () => screenInicio(), motm); }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), true); }
function screenDios() { const bots = genBotTeam(99); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales Celestiales', myFullTeam, bots, (a, b, motm) => { if (a > b) { UT.coins += 500000; saveUT(); unlockAchievement('dios_mode'); window.renderMatchResult('¡MODO DIOS!', 'Mi Equipo', 'Rivales', a, b, `<p style="color:#fff;">+500,000 🪙</p>`, () => screenInicio(), motm); } else window.renderMatchResult('Derrota', 'Mi Equipo', 'Rivales', a, b, '', () => screenInicio(), motm); }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, true); }
function screenGoat() { const bots = genBotTeam(99); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales GOAT', myFullTeam, bots, (a, b, motm) => { if (a > b) { UT.coins += 150000; saveUT(); unlockAchievement('goat_mode'); window.renderMatchResult('¡GOAT!', 'Mi Equipo', 'Rivales', a, b, `<p style="color:#d4af37;">+150,000 🪙</p>`, () => screenInicio(), motm); } else window.renderMatchResult('Derrota', 'Mi Equipo', 'Rivales', a, b, '', () => screenInicio(), motm); }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, false, false, false, false, false, true); }
function screenRain() { const bots = genBotTeam(80); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales Mojados', myFullTeam, bots, (a, b, motm) => { if (a > b) { UT.coins += 20000; saveUT(); window.renderMatchResult('¡Bajo la lluvia!', 'Mi Equipo', 'Rivales', a, b, `<p class="blue">+20,000 🪙</p>`, () => screenInicio(), motm); } else window.renderMatchResult('Derrota', 'Mi Equipo', 'Rivales', a, b, '', () => screenInicio(), motm); }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, false, true); }

function screenFreeKick() { window._fk = { shot: 0, goals: 0 }; window.fkRenderAim(); }
window.fkRenderAim = function() { const st = window._fk; if (st.shot >= 5) { window.fkRenderResult(); return; } $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window._fk=null;screenInicio()">← Salir</button><div class="card card-gold center"><h2>🎯 Tiro Libre</h2><p class="muted">Tiro ${st.shot + 1}/5 · Goles: ${st.goals}</p></div><div class="card center"><h3>Elegí dónde patear</h3><div class="grid-3" style="margin: 20px 0;"><button class="btn btn-outline" style="padding: 30px;" onclick="window.fkShoot('left')">◀</button><button class="btn btn-outline" style="padding: 30px;" onclick="window.fkShoot('center')">▲</button><button class="btn btn-outline" style="padding: 30px;" onclick="window.fkShoot('right')">▶</button></div></div></div>`; };
window.fkShoot = function(zone) { document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>💪 Potencia</h2><div class="train-container"><div class="train-target" style="left: 30%; width: 40%;"></div><div class="train-cursor" id="fk-cursor" style="left: 0%;"></div></div><button class="btn btn-gold btn-block" id="fk-shoot" style="padding: 14px;">¡AHORA!</button></div></div>`; let p = 0, d = 1, active = true; const iv = setInterval(() => { if (!active) return; p += d * 5; if (p >= 100) { p = 100; d = -1; } if (p <= 0) { p = 0; d = 1; } const c = document.getElementById('fk-cursor'); if (c) c.style.left = p + '%'; }, 16); document.getElementById('fk-shoot').onclick = () => { active = false; clearInterval(iv); const goalie = ['left', 'center', 'right'][Math.floor(Math.random() * 3)]; let isGoal = false, msg = ''; if (p < 30) msg = 'Muy suave.'; else if (p > 85) msg = '¡Por arriba!'; else if (zone === goalie) msg = '¡Atajó!'; else { isGoal = true; msg = '¡GOLAZO!'; } if (isGoal) window._fk.goals++; window._fk.shot++; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem;">${isGoal ? '⚽' : '❌'}</div><h2 style="color:${isGoal ? 'var(--green)' : 'var(--red)'};">${isGoal ? '¡GOL!' : 'FALLÓ'}</h2><p class="muted mb">${msg}</p><button class="btn btn-gold btn-block" onclick="document.getElementById('modal-root').innerHTML='';window.fkRenderAim()">${window._fk.shot >= 5 ? 'Ver resultado' : 'Siguiente'}</button></div></div>`; }; };
window.fkRenderResult = function() { const st = window._fk; const coins = st.goals * 3000; let extra = ''; if (st.goals === 5) { UT.packs += 1; extra = `<p class="gold">+1 Sobre Bonus 🔥</p>`; } if (coins > 0) { UT.coins += coins; saveUT(); } const title = st.goals === 5 ? '¡PERFECTO!' : st.goals >= 3 ? '¡GRAN ACTUACIÓN!' : st.goals >= 1 ? 'No estuvo mal' : 'Para olvidar'; window.renderMatchResult(title, 'Tiros Libres', 'Resultado', st.goals, 5 - st.goals, `<p class="gold" style="font-size:1.4rem;">+${coins.toLocaleString()} 🪙</p>${extra}`, () => { window._fk = null; screenInicio(); }); };

function screenSurvival() { let lives = parseInt(localStorage.getItem('sv_lives') || '10'); let streak = parseInt(localStorage.getItem('sv_streak') || '0'); if (lives <= 0) { lives = 10; streak = 0; localStorage.setItem('sv_lives', 10); localStorage.setItem('sv_streak', 0); } const opponentRating = 75 + (streak * 2); $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold center" style="border-color:var(--red);"><h2 style="color:var(--red);">☠️ Supervivencia</h2><p>Racha: <strong class="gold">${streak}</strong></p><div class="grid-2 mb"><div class="card"><div class="grl-big green">${lives}</div><div class="dim">Vidas</div></div><div class="card"><div class="grl-big orange">${opponentRating}</div><div class="dim">Rival</div></div></div></div><div class="card center"><p>Si ganás: +1 Vida, +10,000 🪙<br>Si perdés: -3 Vidas</p><button class="btn btn-red btn-block" onclick="playSurvivalMatch()">⚔️ Jugar</button></div></div>`; }
function playSurvivalMatch() { let lives = parseInt(localStorage.getItem('sv_lives') || '10'); let streak = parseInt(localStorage.getItem('sv_streak') || '0'); const bots = genBotTeam(75 + (streak * 2)); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales de la Muerte', myFullTeam, bots, (a, b, motm) => { if (a > b) { lives++; streak++; UT.coins += 10000; saveUT(); if (streak >= 10) unlockAchievement('survival_10'); window.renderMatchResult('¡SOBREVIVISTE!', 'Mi Equipo', 'Rivales', a, b, `<p class="gold">+1 Vida | +10,000 🪙 | Racha: ${streak}</p>`, () => { localStorage.setItem('sv_lives', lives); localStorage.setItem('sv_streak', streak); screenSurvival(); }, motm); } else { lives -= 3; streak = 0; localStorage.setItem('sv_lives', lives); localStorage.setItem('sv_streak', streak); window.renderMatchResult('DERROTA', 'Mi Equipo', 'Rivales', a, b, `<p class="red">-3 Vidas | Racha 0</p>`, () => { if (lives <= 0) window.showAlert('GAME OVER. Reiniciando con 10 vidas.'); screenSurvival(); }, motm); } }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); }

'selected':''}>Park the bus</option><option value="press" ${t.style==='press'?'selected':''}>Presión alta</option></select></div></div></div>`; }
