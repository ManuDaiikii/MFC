<script>
function generatePlayer(tier, isYouth = false) { const firstNames = ['Juan', 'Luis', 'Carlos', 'Pedro', 'Diego', 'Matías', 'Franco', 'Nico', 'Lautaro', 'Julián', 'Enzo', 'Alexis', 'Rodrigo', 'Facundo', 'Gonzalo']; const lastNames = ['Gómez', 'Pérez', 'Rodríguez', 'Fernández', 'López', 'Martínez', 'Díaz', 'Sánchez', 'Romero', 'Sosa', 'Torres', 'Álvarez', 'Benítez', 'Acosta', 'Medina']; const positions = ['GK', 'CB', 'LB', 'RB', 'CM', 'CDM', 'CAM', 'LM', 'RM', 'ST', 'LW', 'RW']; const name = (isYouth ? "Canterano " : "") + randItem(firstNames) + ' ' + randItem(lastNames); const pos = randItem(positions); let rating = isYouth ? rand(50, 60) : (tier === 'bronze' ? rand(55, 64) : tier === 'silver' ? rand(65, 74) : tier === 'gold' ? rand(75, 84) : rand(85, 92)); let potential = isYouth ? rand(85, 94) : rating + rand(1, 5); let price = rating * rating * 50; return { id: 'gen_' + Date.now() + Math.random().toString(36).slice(2, 6), name, pos, rating, potential, tier: isYouth ? 'silver' : tier, price, salary: Math.round(price * 0.02), morale: rand(60, 90), contractWeeks: 25, isInjured: false, injuryMatches: 0, pendingOffer: null, nation: randItem(['Argentina', 'Brasil', 'Francia', 'España', 'Inglaterra', 'Alemania', 'Italia']), league: randItem(['La Liga', 'Premier League', 'Serie A', 'Bundesliga', 'Ligue 1']), club: randItem(['Real Madrid', 'Barcelona', 'Man City', 'Liverpool', 'Inter']) }; }
const FAKE_CLUBS = [{ name: 'Deportivo Morón', rating: 65, color: '#e30613' }, { name: 'Atlético Barrio', rating: 68, color: '#004d98' }, { name: 'Club Social Sur', rating: 70, color: '#C8102E' }, { name: 'FC Los Pibes', rating: 72, color: '#6CABDD' }, { name: 'Racing de Villa', rating: 74, color: '#ffffff' }, { name: 'Independiente Norte', rating: 76, color: '#DC052D' }, { name: 'Sportivo Central', rating: 78, color: '#004170' }, { name: 'Estrella del Oeste', rating: 80, color: '#0068A8' }, { name: 'Unión Pacífico', rating: 82, color: '#EF0107' }, { name: 'Real Ficticio', rating: 85, color: '#000000' }];
const REAL_MGR_CLUBS = [{ name: 'Real Madrid', rating: 90, color: '#ffffff' }, { name: 'Barcelona', rating: 88, color: '#004d98' }, { name: 'Man City', rating: 89, color: '#6CABDD' }, { name: 'Liverpool', rating: 87, color: '#C8102E' }, { name: 'Bayern Múnich', rating: 88, color: '#DC052D' }, { name: 'PSG', rating: 86, color: '#004170' }, { name: 'Inter', rating: 85, color: '#0068A8' }, { name: 'Arsenal', rating: 85, color: '#EF0107' }, { name: 'Atlético Madrid', rating: 84, color: '#cb3524' }, { name: 'AC Milan', rating: 83, color: '#FB090B' }];
function generateFixtures(teams) { let fixtures = []; let tempTeams = [...teams]; if (tempTeams.length % 2 !== 0) tempTeams.push('BYE'); const numRounds = tempTeams.length - 1; const halfSize = tempTeams.length / 2; for (let round = 0; round < numRounds; round++) { let roundMatches = []; for (let i = 0; i < halfSize; i++) { if (tempTeams[i] !== 'BYE' && tempTeams[tempTeams.length - 1 - i] !== 'BYE') roundMatches.push({ home: tempTeams[i], away: tempTeams[tempTeams.length - 1 - i], played: false, homeGoals: 0, awayGoals: 0 }); } fixtures.push(roundMatches); tempTeams.splice(1, 0, tempTeams.pop()); } return fixtures; }
let MGR = null;
function loadManager(isReal) { const key = isReal ? 'mgr_real_v9' : 'mgr_fake_v9'; let saved = null; try { saved = JSON.parse(localStorage.getItem(key)); } catch(e) {} if (saved && saved.isReal === isReal && saved.startingXI && saved.startingXI.length === 11) { MGR = saved; if (!MGR.leagueTable) MGR.leagueTable = []; if (!MGR.fixtures) MGR.fixtures = []; if (!MGR.youthAcademy) MGR.youthAcademy = []; if (!MGR.news) MGR.news = []; screenManager(); } else { MGR = null; if (isReal) screenSelectRealTeam(); else initManager(false); } }
function saveMGR() { if (!MGR) return; const key = MGR.isReal ? 'mgr_real_v9' : 'mgr_fake_v9'; try { localStorage.setItem(key, JSON.stringify(MGR)); } catch(e) {} }
function getRealTeamPlayers(teamName) { for (const league in REAL_TEAMS) { if (REAL_TEAMS[league][teamName]) { const teamData = REAL_TEAMS[league][teamName]; const posMap = ['GK', 'RB', 'CB', 'CB', 'LB', 'CDM', 'CM', 'CAM', 'RW', 'ST', 'LW']; return teamData.players.map((name, i) => ({ id: 'real_' + name.replace(/\s/g, '') + Math.random(), name, pos: posMap[i] || 'CM', rating: teamData.rating + rand(-2, 2), morale: 80, contractWeeks: 25, salary: Math.round((teamData.rating * teamData.rating * 50) * 0.02), isInjured: false, injuryMatches: 0, pendingOffer: null, tier: 'special', nation: 'Real', league, club: teamName })); } } return null; }
function initManager(isReal, selectedTeam = null) { if (isReal && !selectedTeam) { screenSelectRealTeam(); return; } try { const form = FORMATIONS['4-3-3']; let startingXI = []; let pool = isReal ? REAL_MGR_CLUBS : FAKE_CLUBS; let myName = isReal ? selectedTeam.name : 'Deportivo Morón'; if (isReal) { startingXI = getRealTeamPlayers(myName); if (!startingXI) for (let i = 0; i < 11; i++) { const bp = generatePlayer('bronze'); bp.pos = form.slots[i].role; startingXI.push(bp); } } else for (let i = 0; i < 11; i++) { const bp = generatePlayer('bronze'); bp.pos = form.slots[i].role; startingXI.push(bp); } const otherClubs = pool.filter(c => c.name !== myName); const allTeams = [myName, ...otherClubs.map(c => c.name)]; const leagueTable = allTeams.map(name => ({ name, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, pts: 0 })); MGR = { teamName: myName, isReal, budget: isReal ? 50000000 : 150000, startingXI, bench: [null, null, null, null, null], youthAcademy: [], matchDay: 0, points: 0, season: 1, matchesPlayed: 0, formation: '4-3-3', news: ["Bienvenido al club."], leagueClubs: otherClubs, leagueTable, fixtures: generateFixtures(allTeams), cupActive: false, cupStage: 0 }; saveMGR(); screenManager(); } catch (e) { window.showAlert(`Error: ${e.message}`); } }
function screenSelectRealTeam() { $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold center"><h2>🌍 Elegí tu Club</h2></div><div class="grid-2">${REAL_MGR_CLUBS.map(t => `<div class="card center" onclick='initManager(true, ${JSON.stringify(t).replace(/'/g, "&#39;")})' style="cursor:pointer;"><img src="${CLUB_IMAGES[t.name] || 'https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-500.png'}" style="height:60px; object-fit:contain;"><h3>${t.name}</h3><p class="dim">Nivel: ${t.rating}</p></div>`).join('')}</div></div>`; }
function playManagerMatch() { const form = FORMATIONS[MGR.formation] || FORMATIONS['4-3-3']; let rivalName, rivalData; if (MGR.cupActive) { rivalData = MGR.cupOpponent; rivalName = rivalData.name; } else { const currentRound = MGR.fixtures[MGR.matchDay]; if (!currentRound) { window.showAlert('Temporada terminada.'); return; } const myMatch = currentRound.find(m => m.home === MGR.teamName || m.away === MGR.teamName); if (!myMatch) { window.showAlert('Sin partido.'); return; } rivalName = myMatch.home === MGR.teamName ? myMatch.away : myMatch.home; rivalData = MGR.leagueClubs.find(c => c.name === rivalName) || { rating: 70 }; } let teamForSim = MGR.startingXI.map((p, i) => { if (p && !p.isInjured) return { ...p }; return { name: `Bot ${i+1}`, rating: 60, pos: form.slots[i].role, dorsal: i+1 }; }); const bench = MGR.bench.filter(p => p && !p.isInjured).map(p => ({ ...p })); teamForSim = [...teamForSim, ...bench]; let bots = MGR.isReal ? (getRealTeamPlayers(rivalName) || genBotTeam(rivalData.rating)) : genBotTeam(rivalData.rating); window.startMatchSimulation(MGR.teamName, rivalName, teamForSim, bots, (scoreA, scoreB, motm) => { if (!MGR.cupActive) { const cr = MGR.fixtures[MGR.matchDay]; const mm = cr.find(m => m.home === MGR.teamName || m.away === MGR.teamName); mm.played = true; mm.homeGoals = scoreA; mm.awayGoals = scoreB; cr.forEach(m => { if (m.played || m.home === 'BYE' || m.away === 'BYE') return; const rH = MGR.leagueClubs.find(c => c.name === m.home)?.rating || 70; const rA = MGR.leagueClubs.find(c => c.name === m.away)?.rating || 70; m.played = true; m.homeGoals = rand(0, 3) + Math.floor(rH / 40); m.awayGoals = rand(0, 3) + Math.floor(rA / 40); }); cr.forEach(m => { if (m.home === 'BYE' || m.away === 'BYE') return; const h = MGR.leagueTable.find(t => t.name === m.home); const a = MGR.leagueTable.find(t => t.name === m.away); if (!h || !a) return; h.pj++; a.pj++; h.gf += m.homeGoals; h.gc += m.awayGoals; a.gf += m.awayGoals; a.gc += m.homeGoals; if (m.homeGoals > m.awayGoals) { h.pg++; a.pp++; h.pts += 3; } else if (m.homeGoals < m.awayGoals) { a.pg++; h.pp++; a.pts += 3; } else { h.pe++; a.pe++; h.pts += 1; a.pts += 1; } }); MGR.leagueTable.sort((a, b) => b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc)); MGR.matchDay++; } else { if (scoreA > scoreB) { MGR.cupStage++; if (MGR.cupStage >= 3) { MGR.budget += 50000000; MGR.news.unshift(`🏆 ¡COPA GANADA! +$50M`); MGR.cupActive = false; unlockAchievement('mgr_cup'); addTrophy('cup', 'Copa Manager', MGR.teamName); } else { MGR.cupOpponent = randItem(MGR.leagueClubs); MGR.news.unshift(`✅ Avanzó. Rival: ${MGR.cupOpponent.name}`); } } else { MGR.cupActive = false; MGR.news.unshift(`❌ Eliminado de la Copa.`); } } MGR.matchesPlayed++; if (scoreA > scoreB) unlockAchievement('mgr_first_win'); let totalSalary = 0; const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)]; allP.forEach(p => { totalSalary += p.salary; p.contractWeeks--; if (p.isInjured) { p.injuryMatches--; if (p.injuryMatches <= 0) p.isInjured = false; } }); MGR.budget -= totalSalary; MGR.startingXI.forEach(p => { if (!p) return; if (scoreA > scoreB) p.morale = clamp(p.morale + 10, 0, 100); else if (scoreA < scoreB) p.morale = clamp(p.morale - 10, 0, 100); }); const news = []; if (MGR.matchesPlayed % 5 === 0) { const youth = generatePlayer('bronze', true); MGR.youthAcademy.push(youth); news.push(`🌟 Canterano: ${youth.name} (Pot ${youth.potential})`); } const chk = (arr) => { for (let i = 0; i < arr.length; i++) { if (arr[i] && arr[i].contractWeeks <= 0) { news.push(`🚨 ${arr[i].name} se fue libre.`); arr[i] = null; } } }; chk(MGR.startingXI); chk(MGR.bench); if (news.length) MGR.news.unshift(...news); saveMGR(); window.renderMatchResult(scoreA > scoreB ? '¡VICTORIA!' : scoreA < scoreB ? 'DERROTA' : 'EMPATE', MGR.teamName, rivalName, scoreA, scoreB, `<div class="stat-row"><span class="lbl">Salarios</span><span class="val red">-${fmtMoney(totalSalary)}</span></div>`, () => screenManager(), motm); }, false, false, false, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); }
function screenManager() { if (!MGR) { screenInicio(); return; } if (!MGR.startingXI || !Array.isArray(MGR.startingXI) || MGR.startingXI.length === 0) { if (MGR.isReal) screenSelectRealTeam(); else initManager(false); return; } const form = FORMATIONS[MGR.formation] || FORMATIONS['4-3-3']; let totalOvr = 0; for (let i = 0; i < 11; i++) if (MGR.startingXI[i]) totalOvr += (MGR.startingXI[i].rating - getPenalty(MGR.startingXI[i].pos, form.slots[i].role)); const ovr = Math.round(totalOvr / 11); const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)]; const avgMorale = allP.length > 0 ? Math.round(allP.reduce((s,p)=>s+p.morale,0)/allP.length) : 50; let playBtnHTML = ''; if (MGR.cupActive) playBtnHTML = `<button class="btn btn-red btn-block" onclick="playManagerMatch()" style="padding:20px; font-size:1.5rem;">🔥 JUGAR COPA vs ${MGR.cupOpponent.name}</button>`; else { const cr = MGR.fixtures[MGR.matchDay]; const mm = cr ? cr.find(m => m.home === MGR.teamName || m.away === MGR.teamName) : null; if (mm) { const rival = mm.home === MGR.teamName ? mm.away : mm.home; playBtnHTML = `<button class="btn btn-green btn-block" onclick="playManagerMatch()" style="padding:20px; font-size:1.5rem;">⚽ JUGAR vs ${rival}</button>`; } else playBtnHTML = `<div class="card center card-gold mb"><h3>Temporada Finalizada</h3></div>`; } $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold"><div style="display:flex; justify-content:space-between; align-items:center;"><h2 style="margin:0;">${MGR.teamName}</h2><span class="pill pill-gold">J${MGR.matchDay + 1}</span></div><div class="grid-3 mt"><div class="center"><div class="dim">Presupuesto</div><div class="green" style="font-weight:800;">${fmtMoney(MGR.budget)}</div></div><div class="center"><div class="dim">Media</div><div class="gold" style="font-size:1.5rem; font-weight:900;">${ovr}</div></div><div class="center"><div class="dim">Moral</div><div style="font-weight:800; color:${avgMorale > 70 ? 'var(--green)' : 'var(--orange)'};">${avgMorale}%</div></div></div></div>${playBtnHTML}<div class="card"><div class="grid-3 mb"><button class="btn btn-blue" onclick="screenLeagueTable()">📊 Tabla</button><button class="btn btn-purple" onclick="screenFixtures()">📅 Calendario</button><button class="btn btn-gold" onclick="screenMGRYouth()">🌱 Cantera</button></div><div class="grid-3 mb"><button class="btn btn-gold" onclick="screenMGRTraining()">🏋️ Entrenar</button><button class="btn btn-outline" onclick="screenSearchPlayers()">🔍 Mercado</button><button class="btn btn-outline" onclick="screenMGRContracts()">📝 Ofertas</button></div>${!MGR.cupActive && MGR.matchDay > 0 && MGR.matchDay % 3 === 0 ? `<button class="btn btn-red btn-block mt" onclick="startCup()">🏆 INICIAR COPA</button>` : ''}</div><div class="card" style="background:var(--bg-2); padding: 10px; display:flex; flex-direction:column; gap:10px;"><div style="text-align:center;"><button class="btn btn-gold btn-sm" onclick="openFormationPicker('mgr')">⚙️ Cambiar Formación</button></div>${renderPitch(MGR.startingXI, 'mgr', form, {})}</div><div class="card"><h3>Banca</h3>${renderBench(MGR.bench, 'mgr')}</div><div class="card"><h3>Noticias</h3><div style="max-height:150px; overflow-y:auto; font-size:0.85rem;">${MGR.news.map(n => `<div style="border-bottom:1px solid var(--border); padding:8px 0;">🔹 ${n}</div>`).join('')}</div></div><div class="card center"><button class="btn btn-outline btn-block mt" onclick="window.showConfirm('¿Reiniciar?', () => { localStorage.removeItem(MGR.isReal ? 'mgr_real_v9' : 'mgr_fake_v9'); MGR=null; screenInicio(); }, null, 'Reiniciar')" style="color:var(--red);">Reiniciar Carrera</button></div></div>`; }
function startCup() { MGR.cupActive = true; MGR.cupStage = 0; MGR.cupOpponent = randItem(MGR.leagueClubs); MGR.news.unshift(`🏆 Comienza la Copa. Rival: ${MGR.cupOpponent.name}`); saveMGR(); screenManager(); }

function screenMGRContracts() { const allP = [...MGR.startingXI.filter(p=>p), ...MGR.bench.filter(p=>p)]; const offers = allP.filter(p => p.pendingOffer); let offerHtml = offers.length > 0 ? `<div class="card card-gold"><h3 class="gold">💰 Ofertas</h3>${offers.map(p => `<div class="stat-row"><div><div style="font-weight:800;">${p.name} (${p.rating})</div><div class="dim">De: ${p.pendingOffer.buyer}</div><div class="dim">Monto: ${fmtMoney(p.pendingOffer.amount)}</div></div><div style="display:flex; flex-direction:column; gap:5px;"><button class="btn btn-sm btn-green" onclick="acceptOffer('${p.id}')">Aceptar</button><button class="btn btn-sm btn-red" onclick="rejectOffer('${p.id}')">Rechazar</button></div></div>`).join('')}</div>` : ''; $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenManager()">← Volver</button><div class="card card-gold"><h2>📝 Ofertas</h2><p class="muted">Presupuesto: ${fmtMoney(MGR.budget)}</p></div>${offerHtml}<div class="card center"><p class="dim">Las ofertas aparecen después de partidos.</p></div></div>`; }
function acceptOffer(id) { const p = [...MGR.startingXI, ...MGR.bench].filter(x=>x).find(x => x.id === id); if (!p || !p.pendingOffer) return; window.showConfirm(`¿Vender ${p.name}?`, () => { MGR.budget += p.pendingOffer.amount; const si = MGR.startingXI.indexOf(p); if (si !== -1) MGR.startingXI[si] = null; const bi = MGR.bench.indexOf(p); if (bi !== -1) MGR.bench[bi] = null; MGR.news.unshift(`💸 Vendiste ${p.name} por ${fmtMoney(p.pendingOffer.amount)}`); saveMGR(); screenMGRContracts(); }); }
function rejectOffer(id) { const p = [...MGR.startingXI, ...MGR.bench].filter(x=>x).find(x => x.id === id); if (!p || !p.pendingOffer) return; if (p.pendingOffer.interest.includes('Muy')) { p.morale = clamp(p.morale - 30, 0, 100); MGR.news.unshift(`😡 ${p.name} furioso`); } p.pendingOffer = null; saveMGR(); screenMGRContracts(); }

function doMGRTraining(id) { const p = [...MGR.startingXI, ...MGR.bench].filter(x=>x).find(x => x.id === id); if (!p) return; window.startTrainingGame(() => { p.rating = Math.min(99, p.rating + 1); p.morale = clamp(p.morale + 15, 0, 100); saveMGR(); updateMissionProgress('train_1', 1); window.showAlert(`${p.name} +1 GRL`); screenMGRTraining(); }, () => { p.morale = clamp(p.morale - 10, 0, 100); saveMGR(); window.showAlert(`${p.name} falló`); screenMGRTraining(); }); }
function screenSearchPlayers() { let market = []; if (MGR.isReal) { let allReal = []; for (const league in REAL_TEAMS) { for (const tName in REAL_TEAMS[league]) { if (tName === MGR.teamName) continue; const teamData = REAL_TEAMS[league][tName]; const posMap = ['GK', 'RB', 'CB', 'CB', 'LB', 'CDM', 'CM', 'CAM', 'RW', 'ST', 'LW']; teamData.players.forEach((name, i) => { allReal.push({ id: 'real_' + name.replace(/\s/g, '') + Math.random(), name, pos: posMap[i] || 'CM', rating: teamData.rating + rand(-2, 2), price: Math.floor((teamData.rating * teamData.rating) * 150), salary: Math.round(((teamData.rating * teamData.rating) * 150) * 0.02), tier: 'gold', nation: 'Real', league, club: tName }); }); } } allReal.sort(() => 0.5 - Math.random()); market = allReal.slice(0, 15).sort((a,b) => b.rating - a.rating); } else { for(let i=0; i<4; i++) market.push(generatePlayer('bronze')); for(let i=0; i<3; i++) market.push(generatePlayer('silver')); for(let i=0; i<2; i++) market.push(generatePlayer('gold')); for(let i=0; i<1; i++) market.push(generatePlayer('special')); market.sort((a,b) => b.rating - a.rating); } $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenManager()">← Volver</button><div class="card card-gold"><h2>🔍 Mercado</h2><p class="muted">Presupuesto: ${fmtMoney(MGR.budget)}</p></div><div class="card">${market.map(p => `<div class="stat-row"><div><div style="font-weight:800;">${p.name} <span class="pill" style="font-size:0.6rem;">${p.tier.toUpperCase()}</span></div><div class="dim">${p.pos} · Valor: ${fmtMoney(p.price)}</div></div><div style="text-align:right;"><div style="font-weight:900; font-size:1.2rem; color:var(--gold);">${p.rating}</div><button class="btn btn-sm btn-gold" onclick='openManagerNegotiation(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Negociar</button></div></div>`).join('')}</div></div>`; }
let mgrNeg = null;
function openManagerNegotiation(player) { if (MGR.budget < player.price * 0.5) { window.showAlert('Sin presupuesto.'); return; } mgrNeg = { player, offer: Math.round(player.price * 0.6), pacienciaClub: 100, pacienciaPlayer: 100, salary: Math.round(player.price * 0.05) }; renderMGRNegotiation(); }
function renderMGRNegotiation() { const n = mgrNeg; const p = n.player; const canAfford = MGR.budget >= n.offer; const minOffer = Math.round(p.price * 0.5); const maxOffer = Math.round(p.price * 1.5); if (n.offer < minOffer) n.offer = minOffer; if (n.offer > maxOffer) n.offer = maxOffer; const minSalary = Math.max(1000, Math.round(p.price * 0.02)); const maxSalary = Math.max(minSalary + 5000, Math.round(p.price * 0.1)); if (n.salary < minSalary) n.salary = minSalary; if (n.salary > maxSalary) n.salary = maxSalary; $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenSearchPlayers()">← Volver</button><div class="card card-gold"><h2>Negociación</h2><div><div style="font-weight:800;">${p.name}</div><div class="dim">${p.pos} · ${p.rating} GRL</div></div></div><div class="card"><h3>Puja</h3><div class="dim" style="display:flex; justify-content:space-between;"><span>Oferta: <strong id="offer-val">${fmtMoney(n.offer)}</strong></span><span>Valor: ${fmtMoney(p.price)}</span></div><input type="range" min="${minOffer}" max="${maxOffer}" step="1000" value="${n.offer}" oninput="mgrNeg.offer=+this.value; document.getElementById('offer-val').textContent=fmtMoney(mgrNeg.offer);"><h3 class="mt">Sueldo</h3><div class="dim">Sueldo: <strong id="salary-val">${fmtMoney(n.salary)}</strong></div><input type="range" min="${minSalary}" max="${maxSalary}" step="100" value="${n.salary}" oninput="mgrNeg.salary=+this.value; document.getElementById('salary-val').textContent=fmtMoney(mgrNeg.salary);"><button class="btn btn-gold btn-block mt" ${!canAfford?'disabled':''} onclick="submitMGRNegotiation()">Enviar Oferta</button></div></div>`; }
function submitMGRNegotiation() { const n = mgrNeg; const p = n.player; const offerPct = n.offer / p.price; const salaryPct = n.salary / (p.price * 0.1); n.pacienciaClub = clamp(n.pacienciaClub - Math.round(offerPct < 0.8 ? (0.8 - offerPct) * 150 : 0), 0, 100); n.pacienciaPlayer = clamp(n.pacienciaPlayer - Math.round(salaryPct < 0.8 ? (0.8 - salaryPct) * 150 : 0), 0, 100); if (n.pacienciaClub <= 0 || n.pacienciaPlayer <= 0) { window.showAlert('Negociación rota.'); screenSearchPlayers(); return; } const clubOK = Math.random() < (offerPct >= 0.9 ? 0.9 : offerPct >= 0.75 ? 0.5 : 0.1); const playerOK = Math.random() < (salaryPct >= 0.9 ? 0.9 : salaryPct >= 0.75 ? 0.5 : 0.1); if (clubOK && playerOK) { MGR.budget -= n.offer; p.salary = n.salary; p.contractWeeks = 25; p.morale = 80; const emptyIdx = MGR.bench.findIndex(s => s === null); if (emptyIdx !== -1) MGR.bench[emptyIdx] = p; saveMGR(); window.showAlert(`¡Fichaje exitoso! ${p.name}`); screenManager(); } else { window.showAlert('Oferta rechazada.'); renderMGRNegotiation(); } }

}

  const nation = document.getElementById('pc-nation').value;
  const dorsal = parseInt(document.getElementById('pc-dorsal-c').value) || 10;
  PLAYER = { player: { name, pos, nation, dorsal, rating: 60, xp: 0 }, club: { name: clubName, league, rating }, stats: { matches: 0, goals: 0, assists: 0, mvps: 0, wins: 0, draws: 0, losses: 0 }, offers: [], national: { called: false, caps: 0, goals: 0 }, createdAt: Date.now() };
  savePlayerCareer();
  screenCareerHub();
  setTimeout(() => window.showAlert(`¡Bienvenido ${name}!<br><br>Debutás en <strong>${clubName}</strong> (${league}).`, '¡CARRERA INICIADA!'), 300);
};
function screenCareerHub() { if (!PLAYER) { screenCreacion(); return; } const p = PLAYER.player; const nextRating = Math.min(99, p.rating + 1); const xpNeeded = Math.max(1, xpForRating(nextRating) - xpForRating(p.rating)); const xpProgress = Math.max(0, p.xp - xpForRating(p.rating)); const xpPct = Math.max(0, Math.min(100, Math.round((xpProgress / xpNeeded) * 100))); const club = PLAYER.club; const hasOffer = PLAYER.offers && PLAYER.offers.length > 0; const canJoinNational = PLAYER.player.rating >= 85 && !PLAYER.national.called; $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold"><div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;"><div style="width:70px; height:70px; border-radius:50%; background:linear-gradient(135deg, var(--gold), #b8860b); display:flex; align-items:center; justify-content:center; font-size:2rem; border:3px solid #fff;">${p.pos === 'GK' ? '🧤' : p.pos === 'CB' ? '🛡️' : p.pos === 'CM' ? '🎯' : '⚽'}</div><div style="flex:1; min-width:120px;"><h2 style="margin:0;">${p.name}</h2><div class="dim">${p.nation} · ${p.pos} · #${p.dorsal}</div></div><div style="text-align:center;"><div class="grl-big">${p.rating}</div><div class="grl-label">GRL</div></div></div></div><div class="card"><h3>Progreso</h3><div style="display:flex; justify-content:space-between; font-size:0.85rem;" class="mb"><span>GRL ${p.rating} → ${nextRating}</span><span class="dim">${xpProgress} / ${xpNeeded} XP</span></div><div class="progress"><div class="progress-fill" style="width:${xpPct}%;"></div></div></div><div class="card"><h3>Club</h3><div style="display:flex; justify-content:space-between;"><div><div style="font-weight:800;">${club.name}</div><div class="dim">${club.league}</div></div><div style="text-align:right;"><div class="grl-big green" style="font-size:2rem;">${club.rating}</div><div class="grl-label">Nivel</div></div></div></div><div class="card"><h3>Stats</h3><div class="grid-3"><div class="center"><div class="grl-big" style="font-size:1.8rem;">${PLAYER.stats.goals}</div><div class="dim">Goles</div></div><div class="center"><div class="grl-big" style="font-size:1.8rem; color:var(--blue);">${PLAYER.stats.assists}</div><div class="dim">Asist</div></div><div class="center"><div class="grl-big" style="font-size:1.8rem; color:var(--green);">${PLAYER.stats.mvps}</div><div class="dim">MVP</div></div></div><div class="dim center mt">${PLAYER.stats.matches} PJ · ${PLAYER.stats.wins}G ${PLAYER.stats.draws}E ${PLAYER.stats.losses}P</div></div>${canJoinNational ? `<div class="card" style="border-color:var(--blue); background:linear-gradient(135deg,rgba(96,165,250,0.15),rgba(20,32,25,0.95));"><h3 style="color:var(--blue);">🌍 ¡Convocatoria a la Selección!</h3><p class="muted mb">El seleccionador te llamó. Podés jugar con tu país.</p><button class="btn btn-blue btn-block" onclick="window.joinNationalTeam()">🏆 Aceptar convocatoria</button></div>` : ''}${PLAYER.national.called ? `<div class="card"><h3>🌍 Selección Nacional</h3><div class="grid-3"><div class="center"><div class="grl-big" style="color:var(--blue); font-size:1.8rem;">${PLAYER.national.caps}</div><div class="dim">Partidos</div></div><div class="center"><div class="grl-big" style="color:var(--green); font-size:1.8rem;">${PLAYER.national.goals}</div><div class="dim">Goles</div></div><div class="center"><div class="grl-big" style="color:var(--gold); font-size:1.8rem;">${p.nation === 'Argentina' ? '🇦🇷' : p.nation === 'Brasil' ? '🇧🇷' : p.nation === 'Francia' ? '🇫🇷' : p.nation === 'España' ? '🇪🇸' : '🇺🇾'}</div><div class="dim">${p.nation}</div></div></div><button class="btn btn-purple btn-block mt" onclick="window.playNationalMatch()" style="padding:14px;">🌍 Jugar con la Selección</button></div>` : ''}${hasOffer ? `<div class="card card-gold" style="border-color:var(--green);"><h3 style="color:var(--green);">📬 Oferta</h3>${PLAYER.offers.map(o => `<div class="stat-row"><div><div style="font-weight:800;">${o.club}</div><div class="dim">Nivel: ${o.rating}</div></div><button class="btn btn-sm btn-green" onclick="window.acceptCareerOffer('${o.club}')">Aceptar</button></div>`).join('')}</div>` : ''}<div class="card"><h3>Acciones</h3><div class="grid-2"><button class="btn btn-green" onclick="window.playCareerMatch()" style="padding:14px;">⚽ Jugar</button><button class="btn btn-blue" onclick="window.careerTraining()" style="padding:14px;">🏋️ Entrenar</button></div></div><div class="card center"><button class="btn btn-outline btn-block" onclick="if(confirm('¿Reiniciar?')){localStorage.removeItem('player_career_v1');PLAYER=null;screenCreacion();}" style="color:var(--red);">Reiniciar</button></div></div>`; }
window.playCareerMatch = function() { if (!PLAYER) return; const p = PLAYER.player; const club = PLAYER.club; const rivalRating = club.rating + rand(-3, 5); const rivalName = randItem(['Rival FC', 'Atlético Local', 'Deportivo Rival']); const myPlayerObj = { name: p.name, pos: p.pos, rating: p.rating, dorsal: p.dorsal }; const myTeam = [myPlayerObj]; const fillPositions = ['GK','RB','CB','CB','LB','CDM','CM','CAM','RW','ST','LW'].filter(pos => pos !== p.pos).slice(0, 10); fillPositions.forEach((role, i) => myTeam.push({ name: 'Compañero ' + (i + 1), pos: role, rating: club.rating + rand(-5, 3), dorsal: i + 2 })); const bots = genBotTeam(rivalRating); const form = FORMATIONS['4-3-3']; window.startMatchSimulation(club.name, rivalName, myTeam, bots, (a, b, motm) => { PLAYER.stats.matches++; let xpGain = 20; if (a > b) { PLAYER.stats.wins++; xpGain += 15; } else if (a === b) { PLAYER.stats.draws++; xpGain += 5; } else { PLAYER.stats.losses++; xpGain = 10; } if (motm && motm.name === p.name) { PLAYER.stats.mvps++; xpGain += 25; PLAYER.stats.goals += motm.goals || 0; PLAYER.stats.assists += motm.assists || 0; } PLAYER.player.xp += xpGain; while (PLAYER.player.xp >= xpForRating(PLAYER.player.rating + 1) && PLAYER.player.rating < 99) PLAYER.player.rating++; const nextClub = CAREER_CLUBS.find(c => c.minRating > PLAYER.club.rating && PLAYER.player.rating >= c.minRating); if (nextClub && !PLAYER.offers.find(o => o.club === nextClub.name)) PLAYER.offers.push({ club: nextClub.name, league: nextClub.league, rating: nextClub.rating, salary: nextClub.rating * 500 }); savePlayerCareer(); if (PLAYER.player.rating >= 80) unlockAchievement('career_80'); if (PLAYER.player.rating >= 99) unlockAchievement('career_99'); let extra = `<div class="stat-row"><span class="lbl">XP</span><span class="val green">+${xpGain}</span></div>`; if (PLAYER.offers.length > 0) extra += `<p class="gold mt">📬 ¡Oferta nueva!</p>`; window.renderMatchResult(a > b ? '¡VICTORIA!' : a < b ? 'DERROTA' : 'EMPATE', club.name, rivalName, a, b, extra, () => screenCareerHub(), motm); }, false, false, false, form.slots.map(s => ({ role: s.role, tx: s.x / 100, ty: s.y / 100 }))); };
window.careerTraining = function() { if (!PLAYER) return; window.startTrainingGame(() => { PLAYER.player.xp += 30; while (PLAYER.player.xp >= xpForRating(PLAYER.player.rating + 1) && PLAYER.player.rating < 99) PLAYER.player.rating++; savePlayerCareer(); window.showAlert('¡Entrenamiento superado!<br>+30 XP', '¡BUEN TRABAJO!'); screenCareerHub(); }, () => { PLAYER.player.xp += 10; savePlayerCareer(); window.showAlert('Fallaste.<br>+10 XP.', 'A SEGUIR'); screenCareerHub(); }); };
window.acceptCareerOffer = function(clubName) { const offer = PLAYER.offers.find(o => o.club === clubName); if (!offer) return; PLAYER.club = { name: offer.club, league: offer.league, rating: offer.rating }; PLAYER.offers = PLAYER.offers.filter(o => o.club !== clubName); savePlayerCareer(); window.showAlert(`¡Fichaste por ${offer.club}!`, '¡TRANSFERENCIA!'); screenCareerHub(); };
window.joinNationalTeam = function() { PLAYER.national.called = true; savePlayerCareer(); addTrophy('national', 'Convocatoria Nacional', `Llegaste a la selección de ${PLAYER.player.nation}`); unlockAchievement('career_80'); window.showAlert('¡Jugás para tu selección!', '¡CONVOCATORIA!'); screenCareerHub(); };
window.playNationalMatch = function() { if (!PLAYER || !PLAYER.national.called) return; const rivalName = 'Selección Rival'; const myPlayer = { name: PLAYER.player.name, pos: PLAYER.player.pos, rating: PLAYER.player.rating + 3, dorsal: PLAYER.player.dorsal }; const team = [myPlayer]; const positions = ['GK','RB','CB','CB','LB','CDM','CM','CAM','RW','ST','LW'].filter(p => p !== PLAYER.player.pos).slice(0, 10); positions.forEach((role, i) => team.push({ name: `Compañero ${i+1}`, pos: role, rating: PLAYER.player.rating, dorsal: i+2 })); const bots = genBotTeam(PLAYER.player.rating + 3); window.startMatchSimulation(PLAYER.player.nation, rivalName, team, bots, (a, b, motm) => { PLAYER.national.caps++; if (motm && motm.name === PLAYER.player.name) PLAYER.national.goals += motm.goals || 0; savePlayerCareer(); window.renderMatchResult(a > b ? '¡VICTORIA INTERNACIONAL!' : a < b ? 'DERROTA' : 'EMPATE', PLAYER.player.nation, rivalName, a, b, `<p class="blue">Caps: ${PLAYER.national.caps} · Goles: ${PLAYER.national.goals}</p>`, () => screenCareerHub(), motm); }, false, false, false, null); };

// Barrio
const BARRIO_LEVELS = [{ min: 0, name: 'Barrio Chico', icon: '🏚️' }, { min: 100, name: 'Barrio Prometedor', icon: '🏘️' }, { min: 300, name: 'Barrio Respetado', icon: '🏙️' }, { min: 700, name: 'Barrio de Leyendas', icon: '🌆' }, { min: 1500, name: 'Cuna de Cracks', icon: '👑' }];
const TANO_TIPS = ["Papá, acá no se viene a pasear. Se viene a ganar.", "El fútbol es simple: la pelota entra y el barrio se prende fuego.", "Yo vi pasar cracks por este barrio. Vos podés ser uno.", "No hay química sin barrio. Armá un equipo que se sienta tuyo.", "¿Sabés qué diferencia a un crack? Que no se olvida de dónde salió.", "La hinchada perdona todo menos que no dejes el alma en la cancha.", "Un partido se gana con los pies, pero se recuerda con el corazón.", "Los secretos están ahí... escribí 'MFC', 'POTRO', 'D10S'... pero yo no dije nada.", "Probá las tácticas. Un equipo bien parado gana partidos antes de jugarlos."];
function getBarrio() { try { return JSON.parse(localStorage.getItem('mfc_barrio')) || null; } catch(e) { return null; } }
function saveBarrio(b) { try { localStorage.setItem('mfc_barrio', JSON.stringify(b)); } catch(e) {} }
function getBarrioLevel(rep) { let lvl = BARRIO_LEVELS[0]; for (const L of BARRIO_LEVELS) if (rep >= L.min) lvl = L; return lvl; }
function getMomentos() { try { return JSON.parse(localStorage.getItem('mfc_momentos')) || []; } catch(e) { return []; } }
function saveMomentos(m) { try { localStorage.setItem('mfc_momentos', JSON.stringify(m)); } catch(e) {} }
function addReputation(amount) { const b = getBarrio(); if (!b) return null; const before = b.reputation || 0; b.reputation = before + amount; const oldLvl = getBarrioLevel(before); const newLvl = getBarrioLevel(b.reputation); saveBarrio(b); if (newLvl.min > oldLvl.min) return `🏘️ ¡Subiste a <strong>${newLvl.name}</strong>!`; return null; }
window.addReputation = addReputation;
function addMomento(tipo, titulo, detalle, coins) { const m = getMomentos(); m.unshift({ tipo, titulo, detalle, coins: coins || 0, fecha: Date.now() }); if (m.length > 40) m.length = 40; saveMomentos(m); if (coins > 0) { UT.coins += coins; saveUT(); } return `🎬 ${titulo} · <strong class="green">+${coins.toLocaleString()} 🪙</strong>`; }
function announcePostMatch(events) { if (!events.length) return; setTimeout(() => window.showAlert(events.join('<br><br>'), '🎙️ ¡EL TANO RELATA!'), 1600); }
(function() { const orig = window.startMatchSimulation; window.startMatchSimulation = function(teamAName, teamBName, teamAPlayers, teamBPlayers, onFinish) { const args = Array.prototype.slice.call(arguments); const wrapped = function(scoreA, scoreB, motm) { const events = []; try { const win = scoreA > scoreB, draw = scoreA === scoreB; const diff = Math.abs(scoreA - scoreB), total = scoreA + scoreB; const rep = addReputation(win ? 10 : draw ? 3 : 1); if (rep) events.push(rep); let m = null; if (win && scoreA >= 6) m = addMomento('goleada', '🔥 GOLEADA', `${teamAName} ${scoreA} - ${scoreB}`, 5000); else if (win && scoreA >= 4 && diff >= 3) m = addMomento('paliza', '💥 PALIZA', `${teamAName} ${scoreA} - ${scoreB}`, 2000); else if (win && diff === 1 && scoreA >= 3 && scoreB >= 2) m = addMomento('agónico', '⚡ AGÓNICA', `${teamAName} ${scoreA} - ${scoreB}`, 1500); else if (total >= 9) m = addMomento('loca', '🎢 LOCOS', `${teamAName} ${scoreA} - ${scoreB}`, 1000); if (m) events.push(m); } catch(e) {} announcePostMatch(events); try { if (window.FirebaseSocial && window.onlineUser) { const barrio = getBarrio(); window.FirebaseSocial.saveStats({ coins: UT.coins, champsDiv: UT.champsDiv, barrio: (barrio && barrio.reputation) || 0, barrioName: (barrio && barrio.name) || 'Sin Barrio', lastMatch: `${teamAName} ${scoreA}-${scoreB} ${teamBName}`, lastResult: scoreA > scoreB ? 'W' : scoreA < scoreB ? 'L' : 'D' }); } } catch(e) {} if (typeof onFinish === 'function') onFinish(scoreA, scoreB, motm); }; args[4] = wrapped; return orig.apply(this, args); }; })();
window.askBarrioName = function() { if (getBarrio()) return; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 480px;"><div style="font-size:3.5rem; margin-bottom:8px;">🏘️</div><h2 class="gold mb">Bienvenido a MFC 2027</h2><p class="muted mb">Ponele nombre a tu barrio.</p><input id="barrio-name" type="text" maxlength="24" placeholder="Ej: Villa Fútbol" style="text-align:center; font-size:1.15rem; font-weight:700;"><button class="btn btn-gold btn-block mt" onclick="window.confirmBarrioName()">Fundar mi barrio</button></div></div>`; };
window.confirmBarrioName = function() { const input = document.getElementById('barrio-name'); const name = (input ? input.value.trim() : '') || 'Villa Fútbol'; saveBarrio({ name, reputation: 0, createdAt: Date.now() }); document.getElementById('modal-root').innerHTML = ''; screenInicio(); setTimeout(() => window.showAlert(`Bienvenido a <strong style="color:var(--gold);">${name}</strong>.`, '¡BARRIO FUNDADO!'), 400); };
function renderBarrioCard() { const b = getBarrio(); if (!b) return ''; const lvl = getBarrioLevel(b.reputation || 0); const next = BARRIO_LEVELS.find(L => L.min > (b.reputation || 0)); return `<div class="fc-barrio-card"><div class="fc-barrio-icon">${lvl.icon}</div><div class="fc-barrio-info"><div class="fc-barrio-name">${b.name}</div><div class="fc-barrio-level">${lvl.name}</div><div class="fc-barrio-rep"><strong>${b.reputation}</strong> rep${next ? ` · Faltan ${next.min - b.reputation}` : ' · ¡Máximo!'}</div></div></div>`; }
function renderTanoTip() { return `<div class="fc-tano-tip">${TANO_TIPS[Math.floor(Math.random() * TANO_TIPS.length)]}</div>`; }
function screenMuseo() { const b = getBarrio(); const lvl = b ? getBarrioLevel(b.reputation || 0) : BARRIO_LEVELS[0]; const momentos = getMomentos(); const totalCoins = momentos.reduce((s, m) => s + (m.coins || 0), 0); const dateStr = (ts) => new Date(ts).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }); $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold center"><div style="font-size:3rem;">🏛️</div><h2>Museo del Barrio</h2><p class="muted">${b ? b.name : 'Tu barrio'} · ${lvl.icon} ${lvl.name}</p></div><div class="grid-2 mb"><div class="card center"><div class="grl-big">${momentos.length}</div><div class="dim">Momentos</div></div><div class="card center"><div class="grl-big green">${totalCoins.toLocaleString()}</div><div class="dim">🪙 en momentos</div></div></div><div class="card"><h3>📜 Momentos</h3>${momentos.length === 0 ? `<p class="dim center" style="padding:20px;">Todavía no hay historias.</p>` : momentos.map(m => `<div class="museo-row"><div class="museo-icon">${m.tipo === 'goleada' ? '🔥' : m.tipo === 'paliza' ? '💥' : m.tipo === 'agónico' ? '⚡' : '🎢'}</div><div class="museo-body"><div class="museo-title">${m.titulo}</div><div class="museo-detail">${m.detalle} · ${dateStr(m.fecha)}</div></div>${m.coins > 0 ? `<div class="museo-coins">+${m.coins.toLocaleString()}</div>` : ''}</div>`).join('')}</div></div>`; }
window.showPlayerStats = function(id) { let card = (UT.cards || []).find(c => c.id === id) || (UT.squad || []).find(c => c && c.id === id) || (UT.bench || []).find(c => c && c.id === id) || (DB_UT || []).find(c => c.id === id); if (!card) return; const stats = getPlayerStats(card); const typeColor = { gold: '#b8860b', toty: '#0074D9', tots: '#FF4136', icon: '#85144b', totw: '#333', silver: '#7f8c8d', bronze: '#8b4513' }[card.type] || '#333'; const typeLabel = { gold: 'ORO', toty: 'TOTY', tots: 'TOTS', icon: 'ÍCONO', totw: 'TOTW', silver: 'PLATA', bronze: 'BRONCE' }[card.type] || 'COMÚN'; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) document.getElementById('modal-root').innerHTML=''"><div class="modal-content" style="max-width: 420px; padding: 0; overflow: hidden;"><div style="background: linear-gradient(135deg, ${typeColor}, #111); padding: 24px 20px; text-align: center; position: relative;"><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''" style="position:absolute; top:10px; right:12px; color:#fff;">×</button><div style="font-size:0.7rem; color:#fff; opacity:0.8;">${typeLabel}</div><div style="font-size:3rem; font-weight:900; color:#fff;">${card.rating}</div><div style="color:#fff; font-weight:800;">${card.pos}</div><div style="font-size:1.3rem; font-weight:900; color:#fff;">${card.name}</div></div><div style="padding: 18px 20px;"><h3>Stats</h3>${[['RIT','sho'],['PAS','pas'],['REG','dri'],['DEF','def'],['FIS','phy']].map(([lbl, key]) => `<div class="stat-bar-container"><div class="stat-bar-label">${lbl}</div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${stats[key]}%;"></div></div><div class="stat-bar-val">${stats[key]}</div></div>`).join('')}<button class="btn btn-gold btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">Cerrar</button></div></div></div>`; };

window.CoperoUI = { screenInicio, startOnline: () => { window._inCoopFlow = true; const app = document.getElementById('app'); app.innerHTML = `<div id="app-inner" class="page-transition"><div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Conectando...</h2></div></div>`; let attempts = 0; const checkFirebase = setInterval(() => { attempts++; if (window.FirebaseOnline) { clearInterval(checkFirebase); window.FirebaseOnline.openOnlinePortal(); } else if (attempts > 12) { clearInterval(checkFirebase); window.showAlert('No se pudo conectar a Firebase.'); window._inCoopFlow = false; screenInicio(); } }, 500); } };

if (localStorage.getItem('proClubs_v1')) loadPC();

// ═══ BOOT CON INTRO ═══
(function bootIntro() {
  if (window.MFCMusic) window.MFCMusic.init();
  const intro = document.getElementById('intro-screen');
  const logo = document.getElementById('intro-logo');
  const click = document.getElementById('intro-click');
  setTimeout(() => { if (logo) { logo.style.opacity = '1'; logo.style.transform = 'scale(1)'; } }, 200);
  setTimeout(() => { if (click) click.style.opacity = '1'; }, 1500);
  const startGame = () => {
    if (window.MFCMusic && localStorage.getItem('mfc_music') !== 'false') window.MFCMusic.playMenu();
    if (intro) { intro.style.opacity = '0'; setTimeout(() => { intro.remove(); screenInicio(); }, 800); }
    else screenInicio();
  };
  setTimeout(() => {
    if (intro) intro.addEventListener('click', startGame, { once: true });
    document.addEventListener('keydown', startGame, { once: true });
  }, 500);
})();
</script>
