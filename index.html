<script>

window.showTrainResult = (success, onSuccess, onFail, extraMsg = '') => { const icon = success ? '🎉' : '😔'; const color = success ? 'var(--green)' : 'var(--red)'; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem; margin-bottom:10px;">${icon}</div><h2 style="color:${color}; font-size:1.8rem;">${success ? '¡Superado!' : 'Fallaste.'}</h2>${extraMsg ? `<p class="dim mt">${extraMsg}</p>` : ''}<button class="btn btn-gold btn-block mt" id="train-done" style="padding:14px;">Continuar</button></div></div>`; document.getElementById('train-done').onclick = () => { document.getElementById('modal-root').innerHTML = ''; if (success) onSuccess(); else onFail(); }; };
function trainBar(onSuccess, onFail) { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>🎯 Precisión</h2><p class="mb">Frená la barra en la zona verde.</p><div class="train-container"><div class="train-target" style="left:40%; width:20%;"></div><div class="train-cursor" id="train-cursor" style="left:0%;"></div></div><button class="btn btn-gold btn-block" id="train-btn" style="padding:14px;">¡AHORA!</button></div></div>`; let cursorPos = 0, direction = 1, gameActive = true; window._trainInterval = setInterval(() => { if (!gameActive) return; cursorPos += direction * 4; if (cursorPos >= 100) { cursorPos = 100; direction = -1; } if (cursorPos <= 0) { cursorPos = 0; direction = 1; } const cursor = document.getElementById('train-cursor'); if (cursor) cursor.style.left = cursorPos + '%'; }, 16); document.getElementById('train-btn').onclick = () => { gameActive = false; clearInterval(window._trainInterval); window.showTrainResult(cursorPos >= 40 && cursorPos <= 60, onSuccess, onFail); }; }
function trainReaction(onSuccess, onFail) { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>⚡ Reflejos</h2><p class="mb">Clic SOLO cuando se ponga verde.</p><button id="react-btn" class="btn btn-outline btn-block" style="height:120px; font-size:1.8rem; pointer-events:none; border-radius:16px;">ESPERA...</button></div></div>`; setTimeout(() => { const btn = document.getElementById('react-btn'); if (!btn) return; btn.textContent = "¡AHORA!"; btn.style.background = "var(--green)"; btn.style.color = "#000"; btn.style.pointerEvents = "auto"; const startTime = Date.now(); btn.onclick = () => window.showTrainResult(Date.now() - startTime < 600, onSuccess, onFail, `Reaccionaste en ${Date.now() - startTime}ms`); }, 1500 + Math.random() * 2000); }
window.renderPenaltyGame = () => { const ps = window._penState; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>⚽ Penales</h2><p class="mb">Anota 2 de 3.</p><p>Anotados: <strong class="gold" style="font-size:1.5rem;">${ps.goals}</strong> / 3</p><div style="display:flex; justify-content:space-around; margin:24px 0;"><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('left')">←</button><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('center')">↑</button><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('right')">→</button></div></div></div>`; };
window.kickPenalty = (dir) => { const ps = window._penState; const goalieDir = ['left', 'center', 'right'][Math.floor(Math.random()*3)]; if (dir !== goalieDir) ps.goals++; ps.round++; if (ps.round >= 3) window.showTrainResult(ps.goals >= 2, ps.onSuccess, ps.onFail, `Anotaste ${ps.goals}/3`); else window.renderPenaltyGame(); };
window.startTrainingGame = (onSuccess, onFail) => { const game = Math.random(); if (game < 0.33) trainBar(onSuccess, onFail); else if (game < 0.66) trainReaction(onSuccess, onFail); else { window._penState = { round: 0, goals: 0, onSuccess, onFail }; window.renderPenaltyGame(); } };

function genBotTeam(baseRating = 70) { const roles = ['GK', 'LB', 'CB', 'CB', 'RB', 'CM', 'CM', 'CM', 'LW', 'ST', 'RW']; return roles.map((r, i) => ({ name: `Bot ${i+1}`, rating: baseRating + rand(-5, 5), position: r, dorsal: r === 'GK' ? 1 : rand(2, 30) })); }

const TIPS = ["El logo de MFC 2027 reacciona si lo tocás mucho...", "Escribí 'MFC' para el secreto Arcade...", "Escribí 'FUEGO' para el secreto Fuego...", "Escribí 'POTRO' para el secreto Potro...", "Escribí 'D10S' para el 5to secreto...", "Escribí 'GOAT' para el 6to secreto...", "En la plantilla UT: arrastrá o tocá una carta y luego el destino para moverla.", "Ganá FUT Champions para subir el Battle Pass (+100 XP por victoria)."];
window.showLoadingScreen = (nextCallback) => { const overlay = document.getElementById('loading-screen'); document.getElementById('loading-tip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)]; overlay.classList.add('active'); setTimeout(() => { nextCallback(); overlay.classList.remove('active'); }, 1200); };

const FORMATION_5 = [{ role: 'GK', tx: 0.05, ty: 0.50 }, { role: 'DF', tx: 0.25, ty: 0.30 }, { role: 'DF', tx: 0.25, ty: 0.70 }, { role: 'FW', tx: 0.65, ty: 0.30 }, { role: 'FW', tx: 0.65, ty: 0.70 }];
const FORMATION_4 = [{ role: 'GK', tx: 0.05, ty: 0.50 }, { role: 'DF', tx: 0.25, ty: 0.30 }, { role: 'DF', tx: 0.25, ty: 0.70 }, { role: 'FW', tx: 0.65, ty: 0.50 }];

window.startMatchSimulation = (teamAName, teamBName, teamAPlayers, teamBPlayers, onFinish, secretMode = false, arcadeMode = false, isUT = false, customFormation = null, potroMode = false, diosMode = false, forceRain = false, isOnline = false, futsalMode = false, rushMode = false, goatMode = false) => {
  teamAName = String(teamAName || 'Equipo A'); teamBName = String(teamBName || 'Equipo B');
  $('#app').innerHTML = `<div class="page-transition" style="display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px 16px; align-items: flex-start; justify-content: center; flex-wrap: wrap;"><div style="flex: 1; min-width: 0; position: relative; max-width: 1050px;"><canvas id="sim-canvas" class="ended"></canvas></div><div style="width: 340px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0;"><div class="card" style="margin:0; padding: 16px;"><h3 style="margin-bottom: 12px; color: var(--gold);">📊 Estadísticas</h3><div class="stat-row"><span style="font-size:0.8rem;">Posesión</span><span style="font-size:0.9rem;"><span id="stat-pos-red" style="color:var(--red); font-weight:800;">50%</span> - <span id="stat-pos-blue" style="color:var(--blue); font-weight:800;">50%</span></span></div><div class="stat-row"><span style="font-size:0.8rem;">Tiros</span><span style="font-size:0.9rem;"><span id="stat-shots-red">0</span> - <span id="stat-shots-blue">0</span></span></div><div class="stat-row"><span style="font-size:0.8rem;">Al Arco</span><span style="font-size:0.9rem;"><span id="stat-on-target-red">0</span> - <span id="stat-on-target-blue">0</span></span></div><div class="stat-row"><span style="font-size:0.8rem;">Goles</span><span style="font-size:0.9rem; color:var(--gold); font-weight:900;"><span id="stat-goals-red">0</span> - <span id="stat-goals-blue">0</span></span></div></div></div></div>`;
  const canvas = document.getElementById('sim-canvas'); const ctx = canvas.getContext('2d'); const W = 1000, H = 660; canvas.width = W; canvas.height = H;
  let F = { x: 50, y: 52, w: 900, h: 556 }; F.r = F.x + F.w; F.b = F.y + F.h; F.cx = F.x + F.w / 2; F.cy = F.y + F.h / 2;
  const GOAL_HALF = 48; const BALL_R = 5.6; const rnd = (a, b) => a + Math.random() * (b - a);
  let TIME_MULTIPLIER = 0.5;

  let particles = [];
  function spawnParticles(x, y, color, count = 20, type = 'spark') { for (let i = 0; i < count; i++) { const ang = Math.random() * Math.PI * 2; const spd = 30 + Math.random() * 150; particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1, color, size: 2 + Math.random() * 4, type, gravity: type === 'confetti' ? 80 : 40 }); } }
  function updateParticles(dt) { particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.gravity * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt * 1.4; }); particles = particles.filter(p => p.life > 0); }

  let subtitle = { text: '', timer: 0 };
  function narrate(text, seconds = 3) { subtitle = { text, timer: seconds }; }

  let formationToUse = [{ role: 'GK', tx: 0.05, ty: 0.50 }, { role: 'DF', tx: 0.20, ty: 0.20 }, { role: 'DF', tx: 0.20, ty: 0.40 }, { role: 'DF', tx: 0.20, ty: 0.60 }, { role: 'DF', tx: 0.20, ty: 0.80 }, { role: 'MF', tx: 0.45, ty: 0.20 }, { role: 'MF', tx: 0.45, ty: 0.40 }, { role: 'MF', tx: 0.45, ty: 0.60 }, { role: 'MF', tx: 0.45, ty: 0.80 }, { role: 'FW', tx: 0.70, ty: 0.40 }, { role: 'FW', tx: 0.70, ty: 0.60 }];
  if (futsalMode) formationToUse = FORMATION_5;
  else if (rushMode) formationToUse = FORMATION_4;
  else if (customFormation) formationToUse = customFormation.map(s => ({ role: s.role, tx: Math.min(0.98, Math.max(0.02, 1 - s.ty)), ty: Math.min(0.95, Math.max(0.05, s.tx)) }));

  function generalRole(role) { if (role === 'GK') return 'GK'; if (['LB','RB','CB','LWB','RWB'].includes(role)) return 'DF'; if (['CM','CDM','CAM','LM','RM'].includes(role)) return 'MF'; if (['LW','RW','ST','CF'].includes(role)) return 'FW'; return 'MF'; }

  const ROLE = { GK: { speed: 62 }, DF: { speed: 70 }, MF: { speed: 76 }, FW: { speed: 80 } };
  const TEAM_COLOR = { red: '#e63946', blue: '#2b7fe0' };
  const GK_COLOR = { red: '#fbbf24', blue: '#22c55e' };
  function getBodyColor(p) { return p.isGK ? GK_COLOR[p.team] : TEAM_COLOR[p.team]; }

  let players = []; let ball = {}; let score = { red: 0, blue: 0 }; let state = 'play'; let gameTime = 0; let extraTime = 0; let globalT = 0; let celebration = {}; let stoppage = null;
  let matchStats = { red: { possession: 0, shots: 0, onTarget: 0, fouls: 0 }, blue: { possession: 0, shots: 0, onTarget: 0, fouls: 0 } };
  let lastUIUpdate = 0; let isPaused = false; let matchEnded = false; let hasClickedEnd = false;

  const clamp2 = (v, a, b) => v < a ? a : (v > b ? b : v);
  function toX(tx, team) { return F.x + (team === 'red' ? tx : 1 - tx) * F.w; }
  function toY(ty) { return F.y + ty * F.h; }
  function distToSeg(px, py, x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; const L2 = dx * dx + dy * dy; if (L2 < 1e-6) return Math.hypot(px - x1, py - y1); let t = ((px - x1) * dx + (py - y1) * dy) / L2; t = clamp2(t, 0, 1); return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t)); }

  function init() {
    players = []; matchEnded = false; hasClickedEnd = false;
    const setupTeam = (teamPlayers, teamId) => {
      const form = formationToUse;
      const sorted = (isUT || customFormation) ? teamPlayers.slice(0, 11).concat(Array(Math.max(0, 11 - teamPlayers.length)).fill(null)) : teamPlayers.slice(0, 11);
      sorted.forEach((pData, i) => {
        const f = form[i]; if(!f) return; const genRole = generalRole(f.role); const r = ROLE[genRole];
        let finalRating = pData ? (pData.rating || 60) : 60;
        if (diosMode || goatMode) finalRating = 99;
        let speedMultiplier = 0.8 + (finalRating / 100) * 0.45;
        if (arcadeMode) speedMultiplier *= 1.4; if (potroMode) speedMultiplier *= 1.8;
        players.push({ team: teamId, num: (pData && pData.dorsal) || i + 1, role: genRole, name: pData ? String(pData.name) : 'Vacío', rating: finalRating, baseTx: f.tx, baseTy: f.ty, speed: r.speed * speedMultiplier, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, decideTimer: 0, isGK: genRole === 'GK', goals: 0, assists: 0, sentOff: false });
      });
    };
    setupTeam(teamAPlayers, 'red'); setupTeam(teamBPlayers, 'blue');
    ball = { x: F.cx, y: F.cy, vx: 0, vy: 0, owner: null, lastTouch: null, ignore: null, ignoreTimer: 0 };
    score = { red: 0, blue: 0 }; gameTime = 0; extraTime = 2 + Math.floor(Math.random() * 3); stoppage = null; subtitle = { text: '', timer: 0 }; canvas.classList.remove('ended'); resetPositions('red');
  }

  function updateMatchUI() {
    const totalPoss = matchStats.red.possession + matchStats.blue.possession; const redPos = totalPoss > 0 ? Math.round((matchStats.red.possession / totalPoss) * 100) : 50; const el = document.getElementById('stat-pos-red');
    if (el) {
      el.textContent = `${redPos}%`; document.getElementById('stat-pos-blue').textContent = `${100 - redPos}%`; document.getElementById('stat-shots-red').textContent = matchStats.red.shots; document.getElementById('stat-shots-blue').textContent = matchStats.blue.shots; document.getElementById('stat-on-target-red').textContent = matchStats.red.onTarget; document.getElementById('stat-on-target-blue').textContent = matchStats.blue.onTarget; document.getElementById('stat-goals-red').textContent = score.red; document.getElementById('stat-goals-blue').textContent = score.blue;

const BP_MAX_LEVEL = 60;

function isBPVIP() { return parseInt(localStorage.getItem('mfc_bp_vip') || '0') > Date.now(); }
function getBPVIPDays() { const t = parseInt(localStorage.getItem('mfc_bp_vip') || '0'); return t > Date.now() ? Math.ceil((t - Date.now()) / 86400000) : 0; }

function getBPReward(level, track) {
  if (level === BP_MAX_LEVEL) {
    if (track === 'vip') return { coins: 500000, packs: 20, specialCard: 'icon', specialName: 'Carta ICON Épica' };
    return { coins: 50000, packs: 5, specialCard: null };
  }
  if (track === 'free') {
    const coins = 500 + level * 150;
    const packs = level % 5 === 0 ? 1 : 0;
    return { coins, packs, specialCard: null };
  }
  const coins = 2000 + level * 500;
  const packs = 2;
  let specialCard = null, specialName = null;
  if (level % 20 === 0) { specialCard = 'icon'; specialName = 'Carta ICON'; }
  else if (level % 10 === 0) { specialCard = 'toty'; specialName = 'Carta TOTY'; }
  else if (level % 5 === 0) { specialCard = 'totw'; specialName = 'Carta TOTW'; }
  return { coins, packs, specialCard, specialName };
}

function deliverBPReward(reward) {
  if (reward.coins) UT.coins += reward.coins;
  if (reward.packs) UT.packs += reward.packs;
  if (reward.specialCard) {
    const pool = DB_UT.filter(p => p.type === reward.specialCard);
    if (pool.length > 0) {
      const card = randItem(pool);
      UT.cards.push({ ...card, id: card.id + '_bp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) });
    }
  }
  saveUT();
}

window.addBPXP = function(amount) {
  if (BP.level >= BP_MAX_LEVEL) return;
  BP.xp += amount;
  let levelsGained = 0;
  while (BP.xp >= BP_XP_PER_LEVEL && BP.level < BP_MAX_LEVEL) {
    BP.xp -= BP_XP_PER_LEVEL;
    BP.level++;
    levelsGained++;
    deliverBPReward(getBPReward(BP.level, 'free'));
    BP.lastFreeClaimed = BP.level;
    if (isBPVIP()) {
      deliverBPReward(getBPReward(BP.level, 'vip'));
      BP.lastVIPClaimed = BP.level;
    }
  }
  saveBP();
  if (levelsGained > 0) {
    setTimeout(() => {
      window.showAlert(
        `¡SUBISTE ${levelsGained} NIVEL${levelsGained > 1 ? 'ES' : ''}!<br><br>Nivel actual: <strong style="color:var(--gold); font-size:1.3rem;">${BP.level}/${BP_MAX_LEVEL}</strong><br>${isBPVIP() ? '🎁 Recibiste recompensas FREE + VIP' : '🎁 Recibiste recompensas FREE'}<br><br>${!isBPVIP() ? '<span class="dim">💡 Comprá el Pase VIP para desbloquear recompensas premium</span>' : ''}`,
        '🏆 BATTLE PASS'
      );
    }, 800);
  }
};

window.activateBPVIP = function(durationDays = 30) {
  const current = parseInt(localStorage.getItem('mfc_bp_vip') || '0');
  const base = Math.max(current, Date.now());
  const newTs = base + durationDays * 86400000;
  localStorage.setItem('mfc_bp_vip', newTs);
  if (BP.lastVIPClaimed < BP.level) {
    for (let l = BP.lastVIPClaimed + 1; l <= BP.level; l++) deliverBPReward(getBPReward(l, 'vip'));
    BP.lastVIPClaimed = BP.level;
    saveBP();
  }
};

function renderBPRewardHTML(r) {
  const parts = [];
  if (r.coins) parts.push(`🪙 ${r.coins.toLocaleString()}`);

  if (r.specialCard) parts.push(`⭐ ${r.specialName || r.specialCard.toUpperCase()}`);
  return parts.join('<br>');
}

function deliverItem(item) {

  }
  if (item.vip) { localStorage.setItem('mfc_vip', Date.now() + 30 * 86400000); UT.coins += 100000; }

function calculateChemistry(squad, formationName) {
  const form = FORMATIONS[formationName] || FORMATIONS['4-3-3'];
  let totalChem = 0; const playerChems = {};
  squad.forEach((p, i) => {
    if (!p) return; let chem = 0;
    if (p.nation === 'Icon') { playerChems[p.id] = { total: 10 }; totalChem += 10; return; }
    const slotRole = form.slots[i].role;
    if (p.pos.split('/').includes(slotRole)) chem += 5;
    else { const pz = p.pos.split('/').map(getZone); const sz = getZone(slotRole); if (pz.includes(sz)) chem += 3; else chem += 1; }
    squad.forEach((other) => { if (other && other.id !== p.id) { if (other.nation === p.nation) chem += 1; if (other.league === p.league) chem += 1; } });
    chem = Math.min(10, chem);
    playerChems[p.id] = { total: chem }; totalChem += chem;
  });
  return { playerChems, teamChem: squad.filter(p=>p).length > 0 ? Math.round(totalChem / squad.filter(p=>p).length * 10) : 0 };
}

// UT — DRAG & DROP + CLICK-TO-MOVE
// ═══════════════════════════════════════════════════════════════
let draggedItem = null;
let selectedCard = null;
let pointerDrag = null;
let tooltipTimeout = null;
let longPressTimer = null;

function getCard(source, index) {
  if (source === 'pitch') return UT.squad[index];
  if (source === 'bench') return UT.bench[index];
  if (source === 'collection') return UT.cards.find(c => c.id === index);
  return null;
}

function performMove(srcType, srcIndex, dstType, dstIndex) {
  if (srcType === dstType && srcIndex === dstIndex) return false;
  const srcCard = getCard(srcType, srcIndex);
  if (!srcCard) return false;
  if (dstType === 'pitch') {
    const dstCard = UT.squad[dstIndex];
    UT.squad[dstIndex] = srcCard;
    if (srcType === 'pitch') UT.squad[srcIndex] = dstCard;
    else if (srcType === 'bench') UT.bench[srcIndex] = dstCard;
  } else if (dstType === 'bench') {
    const dstCard = UT.bench[dstIndex];
    UT.bench[dstIndex] = srcCard;
    if (srcType === 'pitch') UT.squad[srcIndex] = dstCard;
    else if (srcType === 'bench') UT.bench[srcIndex] = dstCard;
  }
  saveUT();
  screenUTSquad();
  return true;
}

window.removeFromSquad = (source, index, event) => {
  if (event) event.stopPropagation();
  if (source === 'pitch') UT.squad[index] = null;
  else if (source === 'bench') UT.bench[index] = null;
  saveUT();
  screenUTSquad();
};

window.dragStart = (e, context, source, index) => {
  if (context !== 'ut') return;
  const card = getCard(source, index);
  if (!card) { e.preventDefault(); return; }
  draggedItem = { context, source, index, card };
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'x'); } catch(err) {}
  setTimeout(() => { if (e.target && e.target.classList) e.target.classList.add('dragging'); }, 0);
};
window.dragEnd = (e) => { if (e.target && e.target.classList) e.target.classList.remove('dragging'); };
window.dragOver = (e) => { e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch(err) {} if (e.currentTarget) e.currentTarget.classList.add('drag-active'); };
window.dragLeave = (e) => { if (e.currentTarget) e.currentTarget.classList.remove('drag-active'); };
window.drop = (e, context, targetType, targetIndex) => {
  e.preventDefault();
  if (e.currentTarget) e.currentTarget.classList.remove('drag-active');
  if (!draggedItem || draggedItem.context !== context) return;
  performMove(draggedItem.source, draggedItem.index, targetType, targetIndex);
  draggedItem = null;
};

window.cardPointerDown = (e, context, source, index) => {
  if (context !== 'ut') return;
  if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
  const card = getCard(source, index);
  if (!card) return;
  pointerDrag = { source, index, cardId: card.id, startX: e.clientX, startY: e.clientY, element: e.currentTarget, dragging: false, context };
  longPressTimer = setTimeout(() => {
    if (pointerDrag && !pointerDrag.dragging) {
      window.showPlayerStats(pointerDrag.cardId);
      pointerDrag = null;
    }
  }, 600);
};

window.cardPointerMove = (e) => {
  if (!pointerDrag) return;
  const dx = e.clientX - pointerDrag.startX;
  const dy = e.clientY - pointerDrag.startY;
  if (Math.hypot(dx, dy) > 8) {
    clearTimeout(longPressTimer);
    pointerDrag.dragging = true;
    if (pointerDrag.element) pointerDrag.element.style.opacity = '0.4';
    document.querySelectorAll('.spot, .bench-spot').forEach(el => el.classList.add('drag-active'));
  }
};

window.cardPointerUp = (e) => {
  clearTimeout(longPressTimer);
  if (!pointerDrag) return;
  const pd = pointerDrag;
  pointerDrag = null;
  if (pd.element) pd.element.style.opacity = '';
  document.querySelectorAll('.drag-active').forEach(el => el.classList.remove('drag-active'));
  if (pd.dragging) {
    const elem = document.elementFromPoint(e.clientX, e.clientY);
    const target = elem && elem.closest('[data-drop-type]');
    if (target) performMove(pd.source, pd.index, target.dataset.dropType, parseInt(target.dataset.dropIndex));
  } else {
    handleSelectCard(pd.source, pd.index);
  }
};

window.handleSelectCard = function(source, index) {
  const card = getCard(source, index);
  if (!card) return;
  if (selectedCard && selectedCard.source === source && selectedCard.index === index) {
    selectedCard = null;
  } else if (selectedCard) {
    performMove(selectedCard.source, selectedCard.index, source, index);
    selectedCard = null;
    return;
  } else {
    selectedCard = { source, index, cardId: card.id };
  }
  screenUTSquad();
};

function openPack() {
  if (UT.packs <= 0) { window.showAlert('No tienes sobres.'); return; }
  UT.packs--;
  const pulled = [];
  for (let i = 0; i < 3; i++) {
    const r = Math.random() * 100;
    let pool;
    if (r < 0.1) pool = DB_UT.filter(p => p.type === 'totw');
    else if (r < 0.5) pool = DB_UT.filter(p => p.type === 'icon');
    else if (r < 2.5) pool = DB_UT.filter(p => p.type === 'toty' || p.type === 'tots');
    else pool = DB_UT.filter(p => p.type === 'gold');
    if (!pool || pool.length === 0) pool = DB_UT;
    const card = randItem(pool);
    if (card) pulled.push({ ...card, id: card.id + '_' + Date.now() + '_' + i });
  }
  UT.cards.push(...pulled);
  saveUT();
  if (window.unlockAchievement) window.unlockAchievement('first_pack');
  const hasRare = pulled.some(p => ['icon', 'toty', 'tots', 'totw'].includes(p.type));

    container.innerHTML = pulled.map((p, i) => `<div class="ut-card ${p.type} card-flip" style="animation-delay: ${i * 0.6}s; opacity: 0;" onclick="showPlayerStats('${p.id}')"><div class="rating">${p.rating}</div><div class="pos">${p.pos}</div><div class="name">${p.name}</div></div>`).join('');

function renderPitchUT(squad, form, chemData) {

      const chem = chemData && chemData[p.id]; const chemColor = chem ? (chem.total >= 8 ? '#4ade80' : chem.total >= 5 ? '#facc15' : '#ef4444') : '#666';
      html += `<div class="spot ${p.type || ''} ${isOut ? 'out-of-position' : ''} ${isSelected ? 'selected' : ''}" style="left:${slot.x}%; top:${slot.y}%;" data-drop-type="pitch" data-drop-index="${i}" draggable="true" ondragstart="dragStart(event, 'ut', 'pitch', ${i})" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'ut', 'pitch', ${i})" onpointerdown="cardPointerDown(event, 'ut', 'pitch', ${i})" onpointermove="cardPointerMove(event)" onpointerup="cardPointerUp(event)"><div class="chem-dot" style="background:${chemColor};"></div><div class="spot-remove" onclick="removeFromSquad('pitch', ${i}, event)" title="Quitar">×</div><div class="spot-rating" style="color:${isOut ? 'var(--red)' : 'inherit'};">${eff}</div><div class="spot-pos">${role}</div><div class="spot-name">${p.name.split(' ')[0]}</div></div>`;
    } else {

  }

function renderBenchUT(bench) {

function sellCard(cardId, price) {
  window.showConfirm(`¿Vender por ${price.toLocaleString()} 🪙?`, () => {
    for (let i = UT.cards.length - 1; i >= 0; i--) { if (UT.cards[i].id === cardId) { UT.cards.splice(i, 1); break; } }
    UT.coins += price; saveUT(); screenUTMarket();
  });
}

async function buyMarketCard(docId) {
  const offer = marketTab === 'global' ? GLOBAL_MARKET.find(m => m.id === docId) : UT_MARKET.find(m => m.id === docId);
  if (!offer) return;
  const card = marketTab === 'global' ? offer.card : offer;
  const price = offer.price;
  if (UT.coins < price) { window.showAlert('No tenés monedas.'); return; }
  UT.coins -= price;
  const newCard = { ...card, id: card.id + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6) };
  UT.cards.push(newCard); saveUT();
  if (marketTab === 'local') { const idx = UT_MARKET.indexOf(offer); if (idx > -1) UT_MARKET.splice(idx, 1); }
  window.showAlert('¡Compra exitosa!');
  if (marketTab === 'global') loadGlobalMarket(); else screenUTMarket();
}

function renderPitchDraft(squad, form) { let html = `<div class="pitch">`; for (let i = 0; i < 11; i++) { const p = squad[i]; const slot = form.slots[i]; if (!slot) continue; if (p) html += `<div class="spot ${p.type}" style="left:${slot.x}%; top:${slot.y}%;"><div class="spot-rating">${p.rating}</div><div class="spot-pos">${slot.role}</div><div class="spot-name">${p.name.split(' ')[0]}</div></div>`; else html += `<div class="spot empty" style="left:${slot.x}%; top:${slot.y}%;"><div class="spot-pos">${slot.role}</div></div>`; } html += `</div>`; return html; }
function generateDraftOptions() { const form = FORMATIONS[window.DRAFT.formation]; const slot = form.slots[window.DRAFT.currentPick]; const reqZone = getZone(slot.role); let pool = DB_UT.filter(p => p.pos.split('/').some(pos => getZone(pos) === reqZone || pos === slot.role)); if (pool.length === 0) pool = DB_UT; window.DRAFT.options = []; const used = new Set(window.DRAFT.squad.filter(p=>p).map(p=>p.id)); let safety = 0; while (window.DRAFT.options.length < 3 && pool.length > 0 && safety < 100) { safety++; const p = randItem(pool); if (!used.has(p.id) && !window.DRAFT.options.find(o=>o.id===p.id)) window.DRAFT.options.push({ ...p }); } }

async function playChampsMatch(isOnline) {
  if (!UT.squad.some(p=>p)) { window.showAlert('Necesitás jugadores en tu plantilla.'); return; }
  let oppName = "Bot Champions"; let oppSquad = genBotTeam(65 + (10 - UT.champsDiv) * 3);
  if (isOnline) { $('#app').innerHTML = `<div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Buscando Rival...</h2></div>`; if (window.FirebaseOnline && window.onlineUser) { await window.FirebaseOnline.saveUTTeam(window.onlineUser.uid, UT.squad); const opps = await window.FirebaseOnline.getRandomUTTeams(1); if (opps.length > 0 && opps[0].squad) { oppSquad = opps[0].squad; oppName = "Rival Online"; } else { window.showAlert('Jugarás vs IA.'); isOnline = false; } } else { window.showAlert('Logueate primero.'); isOnline = false; } }
  const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3'];
  const myTeam = [...UT.squad.filter(p=>p), ...UT.bench.filter(p => p)];
  window.startMatchSimulation('Mi UT', oppName, myTeam, oppSquad, (a, b, motm) => {
    let msg = '';
    if (a > b) { window.addBPXP(BP_XP_PER_CHAMPS_WIN); UT.champsPts++; if (UT.champsPts >= 3) { UT.champsPts = 0; if (UT.champsDiv > 1) { UT.champsDiv--; msg = `<p class="gold">¡ASCENSO a Div ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][UT.champsDiv-1]}!</p>`; } else msg = `<p class="gold">¡Campeón!</p>`; } else msg = `<p class="green">Pts: ${UT.champsPts}/3</p>`; msg += `<p class="gold">+${BP_XP_PER_CHAMPS_WIN} XP Battle Pass</p>`; }
    else if (a < b) { UT.champsPts = Math.max(0, UT.champsPts - 1); msg = `<p class="red">Pts: ${UT.champsPts}/3</p>`; }
    saveUT();
    window.renderMatchResult(a > b ? '¡VICTORIA!' : a < b ? 'DERROTA' : 'EMPATE', 'Mi UT', oppName, a, b, msg, () => screenUTChampions(), motm);

}

function screenFreeKick() { window._fk = { shot: 0, goals: 0 }; window.fkRenderAim(); }
window.fkRenderAim = function() { const st = window._fk; if (st.shot >= 5) { window.fkRenderResult(); return; } $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window._fk=null;screenInicio()">← Salir</button><div class="card card-gold center"><h2>🎯 Tiro Libre</h2><p class="muted">Tiro ${st.shot + 1}/5 · Goles: ${st.goals}</p></div><div class="card center"><h3>Elegí dónde patear</h3><div class="grid-3" style="margin: 20px 0;"><button class="btn btn-outline" style="padding: 30px;" onclick="window.fkShoot('left')">◀</button><button class="btn btn-outline" style="padding: 30px;" onclick="window.fkShoot('center')">▲</button><button class="btn btn-outline" style="padding: 30px;" onclick="window.fkShoot('right')">▶</button></div></div></div>`; };
window.fkShoot = function(zone) { document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>💪 Potencia</h2><div class="train-container"><div class="train-target" style="left: 30%; width: 40%;"></div><div class="train-cursor" id="fk-cursor" style="left: 0%;"></div></div><button class="btn btn-gold btn-block" id="fk-shoot" style="padding: 14px;">¡AHORA!</button></div></div>`; let p = 0, d = 1, active = true; const iv = setInterval(() => { if (!active) return; p += d * 5; if (p >= 100) { p = 100; d = -1; } if (p <= 0) { p = 0; d = 1; } const c = document.getElementById('fk-cursor'); if (c) c.style.left = p + '%'; }, 16); document.getElementById('fk-shoot').onclick = () => { active = false; clearInterval(iv); const goalie = ['left', 'center', 'right'][Math.floor(Math.random() * 3)]; let isGoal = false, msg = ''; if (p < 30) msg = 'Muy suave.'; else if (p > 85) msg = '¡Por arriba!'; else if (zone === goalie) msg = '¡Atajó!'; else { isGoal = true; msg = '¡GOLAZO!'; } if (isGoal) window._fk.goals++; window._fk.shot++; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem;">${isGoal ? '⚽' : '❌'}</div><h2 style="color:${isGoal ? 'var(--green)' : 'var(--red)'};">${isGoal ? '¡GOL!' : 'FALLÓ'}</h2><p class="muted mb">${msg}</p><button class="btn btn-gold btn-block" onclick="document.getElementById('modal-root').innerHTML='';window.fkRenderAim()">${window._fk.shot >= 5 ? 'Ver resultado' : 'Siguiente'}</button></div></div>`; }; };
window.fkRenderResult = function() { const st = window._fk; const coins = st.goals * 3000; let extra = ''; if (st.goals === 5) { UT.packs += 1; extra = `<p class="gold">+1 Sobre Bonus 🔥</p>`; } if (coins > 0) { UT.coins += coins; saveUT(); } const title = st.goals === 5 ? '¡PERFECTO!' : st.goals >= 3 ? '¡GRAN ACTUACIÓN!' : st.goals >= 1 ? 'No estuvo mal' : 'Para olvidar'; window.renderMatchResult(title, 'Tiros Libres', 'Resultado', st.goals, 5 - st.goals, `<p class="gold" style="font-size:1.4rem;">+${coins.toLocaleString()} 🪙</p>${extra}`, () => { window._fk = null; screenInicio(); }); };

function screenSurvival() { let lives = parseInt(localStorage.getItem('sv_lives') || '10'); let streak = parseInt(localStorage.getItem('sv_streak') || '0'); if (lives <= 0) { lives = 10; streak = 0; localStorage.setItem('sv_lives', 10); localStorage.setItem('sv_streak', 0); } const oppRating = 75 + (streak * 2); $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold center" style="border-color:var(--red);"><h2 style="color:var(--red);">☠️ Supervivencia</h2><p>Racha: <strong class="gold">${streak}</strong></p><div class="grid-2 mb"><div class="card"><div class="grl-big green">${lives}</div><div class="dim">Vidas</div></div><div class="card"><div class="grl-big orange">${oppRating}</div><div class="dim">Rival</div></div></div></div><div class="card center"><p>Ganás: +1 Vida, +10,000 🪙<br>Perdés: -3 Vidas</p><button class="btn btn-red btn-block" onclick="playSurvivalMatch()">⚔️ Jugar</button></div></div>`; }
function playSurvivalMatch() { let lives = parseInt(localStorage.getItem('sv_lives') || '10'); let streak = parseInt(localStorage.getItem('sv_streak') || '0'); const bots = genBotTeam(75 + (streak * 2)); const form = FORMATIONS[UT.formation]; const myTeam = [...UT.squad.filter(p=>p), ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi Equipo', 'Rivales', myTeam, bots, (a, b, motm) => { if (a > b) { lives++; streak++; UT.coins += 10000; saveUT(); if (streak >= 10 && window.unlockAchievement) unlockAchievement('survival_10'); window.renderMatchResult('¡SOBREVIVISTE!', 'Mi Equipo', 'Rivales', a, b, `<p class="gold">+1 Vida · +10,000 🪙 · Racha: ${streak}</p>`, () => { localStorage.setItem('sv_lives', lives); localStorage.setItem('sv_streak', streak); screenSurvival(); }, motm); } else { lives -= 3; streak = 0; localStorage.setItem('sv_lives', lives); localStorage.setItem('sv_streak', streak); window.renderMatchResult('DERROTA', 'Mi Equipo', 'Rivales', a, b, `<p class="red">-3 Vidas · Racha 0</p>`, () => { if (lives <= 0) window.showAlert('GAME OVER. Reiniciando con 10 vidas.'); screenSurvival(); }, motm); } }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); }

function playQuickMatch(mode) { const tA = window._qmTeamA; const tB = window._qmTeamB; const gen = (td, m) => { const count = m === 'rush' ? 4 : m === 'futsal' ? 5 : 11; const pos = m === 'rush' ? ['GK', 'DF', 'DF', 'FW'] : m === 'futsal' ? ['GK', 'DF', 'DF', 'FW', 'FW'] : ['GK', 'RB', 'CB', 'CB', 'LB', 'CDM', 'CM', 'CAM', 'RW', 'ST', 'LW']; return td.players.slice(0, count).map((name, i) => ({ name, rating: td.rating + rand(-3, 3), pos: pos[i] || 'CM', dorsal: i + 1 })); }; const pA = gen(tA.data, mode); const pB = gen(tB.data, mode); window.startMatchSimulation(tA.name, tB.name, pA, pB, (a, b, motm) => { window.renderMatchResult('FIN', tA.name, tB.name, a, b, '', () => { window._qmTeamA=null; window._qmTeamB=null; screenInicio(); }, motm); }, false, false, false, null, false, false, false, false, mode === 'futsal', mode === 'rush'); }

function getStats() { try { return JSON.parse(localStorage.getItem('mfc_stats')) || {}; } catch(e) { return {}; } }
function saveStats(s) { try { localStorage.setItem('mfc_stats', JSON.stringify(s)); } catch(e) {} }
function getAchievements() { try { return JSON.parse(localStorage.getItem('mfc_achievements')) || {}; } catch(e) { return {}; } }
function saveAchievements(a) { try { localStorage.setItem('mfc_achievements', JSON.stringify(a)); } catch(e) {} }

window.unlockAchievement = function(id) {
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (!ach) return false;
  const unlocked = getAchievements();
  if (unlocked[id]) return false;
  unlocked[id] = Date.now(); saveAchievements(unlocked);
  UT.coins += ach.coins; saveUT();
  showAchievementToast(ach);
  return true;
};

function showAchievementToast(ach) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed; top:80px; right:20px; background:linear-gradient(135deg,#e0b93e,#b8860b); color:#000; padding:14px 20px; border-radius:12px; font-weight:800; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.6); animation:slideInRight 0.4s; max-width:320px;';
  toast.innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><div style="font-size:2rem;">${ach.icon}</div><div><div style="font-size:0.7rem; opacity:0.7;">LOGRO DESBLOQUEADO</div><div style="font-size:1rem;">${ach.name}</div><div style="font-size:0.8rem;">+${ach.coins} 🪙</div></div></div>`;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3500);
}

(function() {
  const orig = window.startMatchSimulation;
  window.startMatchSimulation = function(...args) {
    const myOnFinish = args[4];
    args[4] = function(a, b, motm) {
      const stats = getStats();
      stats.totalMatches = (stats.totalMatches || 0) + 1;
      stats.totalGoals = (stats.totalGoals || 0) + a;
      if (a > b) {
        stats.totalWins = (stats.totalWins || 0) + 1;
        if (stats.totalWins === 1) window.unlockAchievement('first_win');
        if (stats.totalWins >= 10) window.unlockAchievement('ten_wins');
        if (b === 0) window.unlockAchievement('clean_sheet');
        if (a - b >= 5) window.unlockAchievement('big_win');
      }
      if (a >= 1) window.unlockAchievement('first_goal');
      if (a >= 3) window.unlockAchievement('hat_trick');
      if (UT.coins >= 100000) window.unlockAchievement('rich_100k');
      saveStats(stats);
      myOnFinish(a, b, motm);
    };
    return orig.apply(this, args);
  };
})();

const BARRIO_LEVELS = [{ min: 0, name: 'Barrio Chico', icon: '🏚️' }, { min: 100, name: 'Barrio Prometedor', icon: '🏘️' }, { min: 300, name: 'Barrio Respetado', icon: '🏙️' }, { min: 700, name: 'Barrio de Leyendas', icon: '🌆' }, { min: 1500, name: 'Cuna de Cracks', icon: '👑' }];
const TANO_TIPS = ["Papá, acá no se viene a pasear. Se viene a ganar.", "El fútbol es simple: la pelota entra y el barrio se prende fuego.", "Yo vi pasar cracks por este barrio. Vos podés ser uno.", "Los secretos están ahí... escribí 'MFC', 'POTRO', 'D10S'... pero yo no dije nada."];
function getBarrio() { try { return JSON.parse(localStorage.getItem('mfc_barrio')) || null; } catch(e) { return null; } }
function saveBarrio(b) { try { localStorage.setItem('mfc_barrio', JSON.stringify(b)); } catch(e) {} }
function getBarrioLevel(rep) { let lvl = BARRIO_LEVELS[0]; for (const L of BARRIO_LEVELS) if (rep >= L.min) lvl = L; return lvl; }
window.askBarrioName = function() { if (getBarrio()) return; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 480px;"><div style="font-size:3.5rem; margin-bottom:8px;">🏘️</div><h2 class="gold mb">Bienvenido a MFC 2027</h2><p class="muted mb">Ponele nombre a tu barrio.</p><input id="barrio-name" type="text" maxlength="24" placeholder="Ej: Villa Fútbol" style="text-align:center; font-size:1.15rem; font-weight:700;"><button class="btn btn-gold btn-block mt" onclick="window.confirmBarrioName()">Fundar mi barrio</button></div></div>`; };
window.confirmBarrioName = function() { const input = document.getElementById('barrio-name'); const name = (input ? input.value.trim() : '') || 'Villa Fútbol'; saveBarrio({ name, reputation: 0, createdAt: Date.now() }); document.getElementById('modal-root').innerHTML = ''; screenInicio(); setTimeout(() => window.showAlert(`Bienvenido a <strong style="color:var(--gold);">${name}</strong>.`, '¡BARRIO FUNDADO!'), 400); };
function renderBarrioCard() { const b = getBarrio(); if (!b) return ''; const lvl = getBarrioLevel(b.reputation || 0); return `<div class="fc-barrio-card"><div class="fc-barrio-icon">${lvl.icon}</div><div class="fc-barrio-info"><div class="fc-barrio-name">${b.name}</div><div class="fc-barrio-level">${lvl.name}</div><div class="fc-barrio-rep"><strong>${b.reputation}</strong> rep</div></div></div>`; }
function renderTanoTip() { return `<div class="fc-tano-tip">${TANO_TIPS[Math.floor(Math.random() * TANO_TIPS.length)]}</div>`; }

document.addEventListener('keydown', (e) => { keySequence.push(e.key.toUpperCase()); if (keySequence.length > 7) keySequence.shift(); const k = keySequence.join(''); if (k === 'MFC' && !localStorage.getItem('unlocked_arcade')) { keySequence = []; localStorage.setItem('unlocked_arcade', 'true'); window.showAlert('¡Modo Arcade!', '¡SECRETO 2!'); screenInicio(); } if (k === 'FUEGO' && !localStorage.getItem('unlocked_fire')) { keySequence = []; localStorage.setItem('unlocked_fire', 'true'); window.showAlert('¡Modo Fuego!', '¡SECRETO 3!'); screenInicio(); } if (k === 'POTRO' && !localStorage.getItem('unlocked_potro')) { keySequence = []; localStorage.setItem('unlocked_potro', 'true'); window.showAlert('¡Modo Potro!', '¡SECRETO 4!'); screenInicio(); } if (k === 'D10S' && !localStorage.getItem('unlocked_dios')) { keySequence = []; localStorage.setItem('unlocked_dios', 'true'); window.showAlert('¡Modo Dios!', '¡SECRETO 5!'); screenInicio(); } if (k === 'GOAT' && !localStorage.getItem('unlocked_goat')) { keySequence = []; localStorage.setItem('unlocked_goat', 'true'); window.showAlert('¡Modo GOAT!', '¡SECRETO 6!'); screenInicio(); } });

const MENU_CONFIG = {
  'ut': { icon: '⚽', color: 'var(--blue)' },
  'tourn': { icon: '🏆', color: 'var(--gold)' },
  'coop': { icon: '🤝', color: 'var(--orange)' },
  'quick': { icon: '⚡', color: '#60a5fa' },
  'fk': { icon: '🎯', color: '#facc15' },
  'rain': { icon: '🌧️', color: '#60a5fa' },
  'survival': { icon: '☠️', color: '#ef4444' },
  'volta': { icon: '🛹', color: 'var(--gold)' },
  'arcade': { icon: '👾', color: 'var(--blue)' },
  'potro': { icon: '🐎', color: '#FFD700' },
  'dios': { icon: '🌟', color: '#fff' },
  'goat': { icon: '🐐', color: '#d4af37' }
};

function renderMenuContent(mode) {
  currentMenuMode = mode;
  document.querySelectorAll('.fc-btn').forEach(btn => btn.classList.remove('active'));
  const ab = document.getElementById('nav-'+mode); if (ab) ab.classList.add('active');
  const t = TRANSLATIONS[currentLang]; const cfg = MENU_CONFIG[mode];
  document.getElementById('fc-content').innerHTML = `<div><div class="fc-title" style="color:${cfg.color}; text-shadow: 0 10px 30px ${cfg.color}44;">${cfg.icon} ${t[mode] || mode}</div><div class="fc-desc">${t['desc_'+mode] || ''}</div><button class="fc-play-btn" onclick="playMenuMode('${mode}')">${t.play} ➔</button></div>`;
}

function playMenuMode(mode) {
  const app = document.getElementById('app');
  app.classList.add('page-transition-out');
  setTimeout(() => {
    app.classList.remove('page-transition-out');
    window.showLoadingScreen(() => {
      if (mode === 'ut') screenUT();
      else if (mode === 'tourn') screenUTTournament();
      else if (mode === 'coop') window.CoperoUI.startOnline();
      else if (mode === 'quick') screenQuickMatch();
      else if (mode === 'fk') screenFreeKick();
      else if (mode === 'rain') screenRain();
      else if (mode === 'survival') screenSurvival();
      else if (mode === 'volta') screenVolta();
      else if (mode === 'arcade') screenArcade();
      else if (mode === 'potro') screenPotro();
      else if (mode === 'dios') screenDios();
      else if (mode === 'goat') screenGoat();
    });
  }, 250);
}

function screenInicio() {
  window._inCoopFlow = false;
  const hasBarrio = !!getBarrio();
  if (hasBarrio) { const lr = localStorage.getItem('last_daily_reward'); const now = Date.now(); if (!lr || now - parseInt(lr) > 86400000) { localStorage.setItem('last_daily_reward', now); UT.coins += 5000; UT.packs += 1; saveUT(); setTimeout(() => window.showAlert('¡Recompensa Diaria!<br>+5,000 🪙 y +1 Sobre.', '¡Bienvenido!'), 1000); } }
  const app = document.getElementById('app'); app.classList.remove('page-transition-out'); app.classList.add('page-transition'); setTimeout(() => app.classList.remove('page-transition'), 500);
  const t = TRANSLATIONS[currentLang];
  const hasVip = parseInt(localStorage.getItem('mfc_vip') || '0') > Date.now();
  const bpVipActive = isBPVIP();
  let extraBtns = '';
  if (localStorage.getItem('unlocked_volta')) extraBtns += `<button class="fc-btn" id="nav-volta" onmouseenter="renderMenuContent('volta')" onclick="playMenuMode('volta')" style="color:var(--gold);">${MENU_CONFIG['volta'].icon} ${t.volta}</button>`;
  if (localStorage.getItem('unlocked_arcade')) extraBtns += `<button class="fc-btn" id="nav-arcade" onmouseenter="renderMenuContent('arcade')" onclick="playMenuMode('arcade')" style="color:var(--blue);">${MENU_CONFIG['arcade'].icon} ${t.arcade}</button>`;
  if (localStorage.getItem('unlocked_potro')) extraBtns += `<button class="fc-btn" id="nav-potro" onmouseenter="renderMenuContent('potro')" onclick="playMenuMode('potro')" style="color:#FFD700;">${MENU_CONFIG['potro'].icon} ${t.potro}</button>`;
  if (localStorage.getItem('unlocked_dios')) extraBtns += `<button class="fc-btn" id="nav-dios" onmouseenter="renderMenuContent('dios')" onclick="playMenuMode('dios')" style="color:#fff;">${MENU_CONFIG['dios'].icon} ${t.dios}</button>`;
  if (localStorage.getItem('unlocked_goat')) extraBtns += `<button class="fc-btn" id="nav-goat" onmouseenter="renderMenuContent('goat')" onclick="playMenuMode('goat')" style="color:#d4af37;">${MENU_CONFIG['goat'].icon} ${t.goat}</button>`;
  $('#app').innerHTML = `<div class="fc-menu-container">
    <div class="fc-sidebar">
      ${hasBarrio ? renderBarrioCard() : ''}
      <div class="fc-logo-area" onclick="window.handleLogoClick(event)">
        <div class="fc-logo-icon">⚽</div>
        <span class="fc-logo-text">MFC 2027</span>
        ${hasVip ? '<span style="font-size:0.7rem; color:var(--gold); margin-left:6px; font-weight:900;">🏆VIP</span>' : ''}
        ${bpVipActive ? '<span style="font-size:0.7rem; color:#a78bfa; margin-left:6px; font-weight:900;">👑BP</span>' : ''}
      </div>
      ${hasBarrio ? renderTanoTip() : ''}
      <div class="fc-nav">
        <button class="fc-btn active" id="nav-ut" onmouseenter="renderMenuContent('ut')" onclick="playMenuMode('ut')">⚽ ${t.ut}</button>
        <button class="fc-btn" id="nav-bp" onclick="screenBP()" style="color:var(--gold);">🏆 Pase de Batalla</button>
        <button class="fc-btn" id="nav-tourn" onmouseenter="renderMenuContent('tourn')" onclick="playMenuMode('tourn')">🏆 ${t.tourn}</button>
        <button class="fc-btn" id="nav-coop" onmouseenter="renderMenuContent('coop')" onclick="playMenuMode('coop')">🤝 ${t.coop}</button>
        <button class="fc-btn" id="nav-quick" onmouseenter="renderMenuContent('quick')" onclick="playMenuMode('quick')">⚡ ${t.quick}</button>
        <button class="fc-btn" id="nav-fk" onmouseenter="renderMenuContent('fk')" onclick="playMenuMode('fk')">🎯 ${t.fk}</button>
        <button class="fc-btn" id="nav-rain" onmouseenter="renderMenuContent('rain')" onclick="playMenuMode('rain')">🌧️ ${t.rain}</button>
        <button class="fc-btn" id="nav-survival" onmouseenter="renderMenuContent('survival')" onclick="playMenuMode('survival')">☠️ ${t.survival}</button>
        <button class="fc-btn" id="nav-tactics" onclick="screenTactics()" style="color:var(--purple);">⚙️ Tácticas</button>
        ${extraBtns}
        <button class="fc-btn" id="nav-progreso" onclick="screenProgress()" style="color:var(--gold);">🏅 Progreso</button>
      </div>
      <button class="fc-settings-btn" onclick="screenStore()" style="background:linear-gradient(135deg, var(--gold), #b8860b); color:#1a1200; border-color:var(--gold); font-weight:900;">🛒 TIENDA</button>
      <button class="fc-settings-btn" onclick="screenSettings()">⚙️ ${t.settings}</button>
    </div>
    <div class="fc-content-area" id="fc-content"></div>
  </div>`;
  renderMenuContent('ut');
  if (!hasBarrio) window.askBarrioName();
}

function screenSettings() { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content" style="max-width: 500px;"><div class="modal-header"><h2>⚙️ Ajustes</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><div class="stat-row"><span>🔊 Sonido</span><label class="switch"><input type="checkbox" ${soundEnabled ? 'checked' : ''} onchange="window.toggleSound(this.checked)"><span class="slider"></span></label></div><div class="stat-row mt"><div><span class="red">Reiniciar Juego</span><p class="dim">Borra TODO</p></div><button class="btn btn-red btn-sm" onclick="window.resetGame()">Reset</button></div><button class="btn btn-gold btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">OK</button></div></div>`; }
window.toggleSound = (c) => { soundEnabled = c; localStorage.setItem('mfc_sound', c); };
window.resetGame = () => { window.showConfirm('¿Borrar TODO?', () => { localStorage.clear(); location.reload(); }); };

window.CoperoUI = { screenInicio, startOnline: () => { window._inCoopFlow = true; document.getElementById('app').innerHTML = `<div id="app-inner" class="page-transition"><div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Conectando...</h2></div></div>`; let a = 0; const iv = setInterval(() => { a++; if (window.FirebaseOnline) { clearInterval(iv); window.FirebaseOnline.openOnlinePortal(); } else if (a > 12) { clearInterval(iv); window.showAlert('Sin conexión a Firebase.'); window._inCoopFlow = false; screenInicio(); } }, 500); } };

// ═══ BOOT ═══
(function boot() {
  const intro = document.getElementById('intro-screen');
  const logo = document.getElementById('intro-logo');
  const click = document.getElementById('intro-click');
  setTimeout(() => { if (logo) { logo.style.opacity = '1'; logo.style.transform = 'scale(1)'; } }, 200);
  setTimeout(() => { if (click) click.style.opacity = '1'; }, 1500);
  const startGame = () => {
    if (intro) { intro.style.opacity = '0'; setTimeout(() => { intro.remove(); screenInicio(); }, 800); } else screenInicio();
  };
  setTimeout(() => { if (intro) intro.addEventListener('click', startGame, { once: true }); document.addEventListener('keydown', startGame, { once: true }); }, 500);
})();
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, serverTimestamp, query, where, getDocs } from "firebase/firestore";

const firebaseConfig = { apiKey: "AIzaSyBxAz4QGPmp8TFHNefsVlND2YFV_I3Ju6Q", authDomain: "potro-55a5b.firebaseapp.com", projectId: "potro-55a5b", storageBucket: "potro-55a5b.firebasestorage.app", messagingSenderId: "179726326235", appId: "1:179726326235:web:6a0e9a2d0770c0c4d9effe" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

let onlineUser = null, onlineProfile = null, myClub = null, myClubId = null;
const $g = (s) => document.querySelector(s);
const rndPick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const AI_NAMES = ["ElMatador99","Lucas10","xX_FifaKing_Xx","Bryan_Fut","ElProfe22","Tomi_Gol","ElTano","Crack_De_Barrio"];
const SHIELDS = ['🦁','🐯','🦅','🐺','🦊','🦄','🐉','⚡','🔥','⭐','👑','💎'];
const CLUB_COLORS = ['#e30613','#004d98','#0d6b3a','#f5c518','#6CABDD','#DC052D','#004170'];

function generateInviteCode() { let c = ''; const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)]; return c; }
function genAIFillers(n) { const roles = ['CB', 'CM', 'ST']; const res = []; for (let i = 0; i < (5 - n); i++) res.push({ uid: 'ai_' + Math.random().toString(36).slice(2, 9), name: rndPick(AI_NAMES), position: roles[i % 3], rating: 60, isAI: true, dorsal: Math.floor(Math.random() * 90) + 2 }); return res; }
function genBotTeamFB() { return ['GK', 'CB', 'CB', 'ST', 'ST'].map(r => ({ uid: 'bot_' + Math.random().toString(36).slice(2), name: rndPick(AI_NAMES), position: r, rating: 68, isAI: true, dorsal: Math.floor(Math.random() * 90) + 2 })); }
async function loadProfile(uid) { const s = await getDoc(doc(db, 'users', uid)); return s.exists() ? s.data() : null; }
async function saveProfile(uid, data) { await setDoc(doc(db, 'users', uid), { ...data, uid, updatedAt: serverTimestamp() }, { merge: true }); }

function screenAuthMenu() { $g('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window._inCoopFlow=false;screenInicio()">← Volver</button><div class="card card-gold center"><div style="font-size:3rem;">🤝</div><h2>Pro Clubs Online</h2></div><div class="card"><div style="display:flex; gap:10px; margin-bottom:20px;"><button class="btn btn-gold" style="flex:1;" onclick="window.FirebaseOnline.showLoginForm()">Login</button><button class="btn btn-green" style="flex:1;" onclick="window.FirebaseOnline.showRegisterForm()">Registro</button></div><div id="auth-form-container"><p class="dim center">Elegí una opción.</p></div></div></div>`; }
function showLoginForm() { $g('#auth-form-container').innerHTML = `<h3 class="gold center mb">Login</h3><div class="field"><label>Email</label><input id="login-email" type="email"></div><div class="field"><label>Pass</label><input id="login-pass" type="password"></div><div id="login-error" class="red center mb" style="display:none;"></div><button class="btn btn-gold btn-block" onclick="window.FirebaseOnline.loginUser()">Entrar</button>`; }
async function loginUser() { try { await signInWithEmailAndPassword(auth, $g('#login-email').value.trim(), $g('#login-pass').value.trim()); } catch (e) { $g('#login-error').textContent = 'Datos incorrectos.'; $g('#login-error').style.display = 'block'; } }
function showRegisterForm() { $g('#auth-form-container').innerHTML = `<h3 class="green center mb">Crear Cuenta</h3><div class="field"><label>Gamertag</label><input id="reg-name" type="text" maxlength="20"></div><div class="field"><label>Email</label><input id="reg-email" type="email"></div><div class="field"><label>Pass (min 6)</label><input id="reg-pass" type="password"></div><div class="field"><label>Repetir</label><input id="reg-pass2" type="password"></div><div id="reg-error" class="red center mb" style="display:none;"></div><button class="btn btn-green btn-block" onclick="window.FirebaseOnline.registerUser()">Crear</button>`; }
async function registerUser() { const n = $g('#reg-name').value.trim(), e = $g('#reg-email').value.trim(), p = $g('#reg-pass').value.trim(), p2 = $g('#reg-pass2').value.trim(); if (!n) { $g('#reg-error').textContent = 'Falta gamertag.'; $g('#reg-error').style.display = 'block'; return; } if (p !== p2) { $g('#reg-error').textContent = 'Pass distintas.'; $g('#reg-error').style.display = 'block'; return; } try { const q = query(collection(db, 'users'), where('gamertag', '==', n)); const snap = await getDocs(q); if (!snap.empty) { $g('#reg-error').textContent = 'Gamertag en uso.'; $g('#reg-error').style.display = 'block'; return; } } catch(e) {} try { const cred = await createUserWithEmailAndPassword(auth, e, p); await saveProfile(cred.user.uid, { gamertag: n, email: e }); } catch (err) { $g('#reg-error').textContent = err.message; $g('#reg-error').style.display = 'block'; } }
async function logoutUser() { await signOut(auth); window._inCoopFlow = false; if (window.CoperoUI) screenInicio(); }

window._inCoopFlow = false;
onAuthStateChanged(auth, async (user) => {
  if (user) { onlineUser = user; window.onlineUser = user; onlineProfile = await loadProfile(user.uid); window.onlineProfile = onlineProfile; if (window._inCoopFlow) { if (!onlineProfile || !onlineProfile.clubId) screenCreateClubScreen(); else { await loadMyClub(); screenClubHub(); } } }
  else { onlineUser = null; window.onlineUser = null; onlineProfile = null; window.onlineProfile = null; myClub = null; if (window._inCoopFlow && $g('#app').innerHTML.includes('Pro Clubs')) screenAuthMenu(); }
});

function screenCreateClubScreen() { let selShield = SHIELDS[0], selColor = CLUB_COLORS[0]; $g('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window._inCoopFlow=false;screenInicio()">← Volver</button><div class="card card-gold center" style="background:linear-gradient(135deg, ${selColor}33, rgba(20,32,25,0.95));" id="club-preview-card"><div style="font-size:4rem;" id="club-preview-shield">${selShield}</div><h2 style="margin:8px 0;" id="club-preview-name">Mi Club FC</h2></div><div class="card"><h3>🎨 Identidad</h3><div class="field"><label>Nombre</label><input id="cc-name" type="text" maxlength="24" value="Mi Club FC" oninput="document.getElementById('club-preview-name').textContent=this.value||'Mi Club FC'"></div><div class="field"><label>Escudo</label><div style="display:flex; flex-wrap:wrap; gap:8px;" id="shield-picker">${SHIELDS.map((s, i) => `<button class="btn btn-outline" style="padding:8px 14px; font-size:1.5rem; ${i === 0 ? 'border-color: var(--gold);' : ''}" onclick="window._pickShield('${s}', this)">${s}</button>`).join('')}</div></div><div class="field"><label>Color</label><div style="display:flex; flex-wrap:wrap; gap:8px;" id="color-picker">${CLUB_COLORS.map((c, i) => `<button onclick="window._pickColor('${c}', this)" style="width:44px; height:44px; border-radius:50%; background:${c}; border:${i === 0 ? '3px solid var(--gold)' : '2px solid rgba(255,255,255,0.3)'}; cursor:pointer;"></button>`).join('')}</div></div></div><div class="card"><h3>👤 Tu Jugador</h3><div class="field"><label>Posición</label><select id="cc-pos"><option value="ST">Delantero</option><option value="CM">Medio</option><option value="CB">Defensor</option><option value="GK">Arquero</option></select></div><div class="field"><label>Dorsal</label><input id="cc-dorsal" type="number" min="1" max="99" value="10"></div><button class="btn btn-gold btn-block" style="padding:16px;" onclick="window.FirebaseOnline.createClubFull('${selShield}', '${selColor}')">🏆 Fundar Club</button></div><div class="card center"><button class="btn btn-outline btn-block" onclick="window.FirebaseOnline.showJoinByCode()">🔑 Unirse con código</button></div></div>`; window._pickShield = (s, btn) => { selShield = s; document.querySelectorAll('#shield-picker button').forEach(b => b.style.borderColor = 'var(--border-2)'); btn.style.borderColor = 'var(--gold)'; document.getElementById('club-preview-shield').textContent = s; }; window._pickColor = (c, btn) => { selColor = c; document.querySelectorAll('#color-picker button').forEach(b => b.style.border = '2px solid rgba(255,255,255,0.3)'); btn.style.border = '3px solid var(--gold)'; document.getElementById('club-preview-card').style.background = `linear-gradient(135deg, ${c}33, rgba(20,32,25,0.95))`; }; }

async function createClubFull(shield, color) { try { const clubName = $g('#cc-name').value.trim() || 'Mi Club FC'; const pos = $g('#cc-pos').value; const dorsal = parseInt($g('#cc-dorsal').value) || 10; const inviteCode = generateInviteCode(); const playerMember = { uid: onlineUser.uid, name: onlineProfile.gamertag, position: pos, rating: 50, goals: 0, assists: 0, isAI: false, dorsal }; const members = [playerMember, ...genAIFillers(1)]; const clubRef = doc(collection(db, 'clubs')); await setDoc(clubRef, { name: clubName, shield, color, ownerUid: onlineUser.uid, ownerName: onlineProfile.gamertag, inviteCode, members, stats: { wins: 0, draws: 0, losses: 0 }, createdAt: serverTimestamp() }); await saveProfile(onlineUser.uid, { position: pos, dorsal, clubId: clubRef.id }); onlineProfile = await loadProfile(onlineUser.uid); window.onlineProfile = onlineProfile; myClubId = clubRef.id; await loadMyClub(); screenClubHub(); setTimeout(() => window.showAlert(`¡${clubName} fundado!<br>Código: <strong style="color:var(--gold); font-size:1.3rem;">${inviteCode}</strong>`, '¡CLUB CREADO!'), 500); } catch (e) { window.showAlert('Error: ' + e.message); } }

async function loadMyClub() { if (!onlineProfile?.clubId) { myClub = null; return; } myClubId = onlineProfile.clubId; const snap = await getDoc(doc(db, 'clubs', myClubId)); if (!snap.exists()) { myClub = null; await saveProfile(onlineUser.uid, { clubId: null }); return; } myClub = { id: snap.id, ...snap.data() }; if (!myClub.members.find(m => m.uid === onlineUser.uid)) { myClub = null; await saveProfile(onlineUser.uid, { clubId: null }); } }

async function screenClubHub() { if (!onlineUser) { screenAuthMenu(); return; } if (!myClub) { screenCreateClubScreen(); return; } const humans = myClub.members.filter(m => !m.isAI); const isOwner = myClub.ownerUid === onlineUser.uid; const stats = myClub.stats || { wins: 0, draws: 0, losses: 0 }; $g('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window._inCoopFlow=false;screenInicio()">← Volver</button><div class="card" style="background:linear-gradient(135deg, ${myClub.color}44, rgba(20,32,25,0.95));"><div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;"><div style="width:80px; height:80px; border-radius:20px; background:${myClub.color}33; border:3px solid ${myClub.color}; display:flex; align-items:center; justify-content:center; font-size:2.8rem;">${myClub.shield || '🛡️'}</div><div style="flex:1;"><h2 style="margin:0;">${myClub.name}</h2>${isOwner ? '<div class="pill pill-gold mt">👑 Dueño</div>' : ''}</div><div style="text-align:right;"><div class="dim">CÓDIGO</div><div style="font-family:monospace; font-size:1.3rem; font-weight:900; color:var(--gold);">${myClub.inviteCode || '------'}</div></div></div></div><div class="grid-3 mb"><div class="card center" style="margin:0;"><div style="font-size:1.8rem; font-weight:900; color:var(--green);">${stats.wins}</div><div class="dim">Victorias</div></div><div class="card center" style="margin:0;"><div style="font-size:1.8rem; font-weight:900; color:var(--gold);">${stats.draws}</div><div class="dim">Empates</div></div><div class="card center" style="margin:0;"><div style="font-size:1.8rem; font-weight:900; color:var(--red);">${stats.losses}</div><div class="dim">Derrotas</div></div></div><div class="card"><h3>👥 Plantilla (${humans.length})</h3>${humans.map(m => `<div class="stat-row"><div><strong>${m.name} #${m.dorsal || 10}</strong> <span class="dim">${m.position} · ${m.rating} GRL</span></div></div>`).join('')}</div><button class="btn btn-green btn-block" style="padding:16px;" onclick="window.FirebaseOnline.startClubMatch()">⚽ Jugar vs Bots</button></div>`; }

function showJoinByCode() { $g('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>🔑 Unirse</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><input id="join-code-input" type="text" maxlength="6" style="text-transform:uppercase; font-size:1.8rem; text-align:center; font-family:monospace; letter-spacing:4px;" placeholder="ABC123"><button class="btn btn-gold btn-block mt" onclick="window.FirebaseOnline.joinByCode()">Unirse</button></div></div>`; }
async function joinByCode() { const code = $g('#join-code-input').value.trim().toUpperCase(); if (code.length !== 6) { window.showAlert('Código inválido.'); return; } $g('#modal-root').innerHTML = ''; try { const q = query(collection(db, 'clubs'), where('inviteCode', '==', code)); const snap = await getDocs(q); if (snap.empty) { window.showAlert('No existe.'); screenCreateClubScreen(); return; } const clubDoc = snap.docs[0]; const club = clubDoc.data(); if (club.members.find(m => m.uid === onlineUser.uid)) { await saveProfile(onlineUser.uid, { clubId: clubDoc.id }); onlineProfile = await loadProfile(onlineUser.uid); myClubId = clubDoc.id; await loadMyClub(); screenClubHub(); return; } const humans = club.members.filter(m => !m.isAI); if (humans.length >= 5) { window.showAlert('Club lleno.'); return; } const newMember = { uid: onlineUser.uid, name: onlineProfile.gamertag, position: onlineProfile.position || 'CM', rating: 50, goals: 0, assists: 0, isAI: false, dorsal: onlineProfile.dorsal || 10 }; const newMembers = [...club.members, newMember]; await updateDoc(doc(db, 'clubs', clubDoc.id), { members: newMembers }); await saveProfile(onlineUser.uid, { clubId: clubDoc.id }); onlineProfile = await loadProfile(onlineUser.uid); myClubId = clubDoc.id; await loadMyClub(); screenClubHub(); window.showAlert(`¡Bienvenido a ${club.name}!`, '¡UNIDO!'); } catch (e) { window.showAlert('Error: ' + e.message); } }

async function startClubMatch() { if (!myClub) return; const humans = myClub.members.filter(m => !m.isAI); const fillers = humans.length < 5 ? genAIFillers(humans.length) : []; const team = [...humans, ...fillers]; const bots = genBotTeamFB(); window.startMatchSimulation(myClub.name, 'Bots', team, bots, async (a, b, motm) => { try { const st = { ...(myClub.stats || { wins: 0, draws: 0, losses: 0 }) }; if (a > b) st.wins++; else if (a < b) st.losses++; else st.draws++; await updateDoc(doc(db, 'clubs', myClubId), { stats: st }); await loadMyClub(); } catch(e) {} window.renderMatchResult(a > b ? '¡GANAMOS!' : a < b ? 'PERDIMOS' : 'EMPATE', myClub.name, 'Bots', a, b, '', () => screenClubHub(), motm); }); }

function openOnlinePortal() { window._inCoopFlow = true; if (onlineUser) { if (!onlineProfile || !onlineProfile.clubId) screenCreateClubScreen(); else { loadMyClub().then(() => screenClubHub()); } } else { screenAuthMenu(); } }

window.FirebaseOnline = {
  openOnlinePortal, showLoginForm, loginUser, showRegisterForm, registerUser, logoutUser,
  createClubFull, showJoinByCode, joinByCode, startClubMatch,
  saveUTTeam: async (uid, squad) => { try { await setDoc(doc(db, 'ut_teams', uid), { squad, updatedAt: serverTimestamp() }); return true; } catch (e) { return false; } },
  getRandomUTTeams: async (count) => { try { const snap = await getDocs(collection(db, 'ut_teams')); const teams = []; snap.forEach(d => teams.push({ uid: d.id, ...d.data() })); const av = teams.filter(t => onlineUser ? t.uid !== onlineUser.uid : true); return av.sort(() => 0.5 - Math.random()).slice(0, count); } catch (e) { return []; } },
  getMarketCards: async () => { let cards = []; try { const snap = await getDocs(collection(db, 'market_cards')); snap.forEach(d => cards.push({ id: d.id, ...d.data() })); } catch (e) {} try { const local = JSON.parse(localStorage.getItem('local_market') || '[]'); cards = [...cards, ...local]; } catch(e) {} return cards; },
  deleteMarketCard: async (docId) => { try { await deleteDoc(doc(db, 'market_cards', docId)); return true; } catch (e) { return false; } }
};
window.FirebaseOnline._ready = true;
</script>
