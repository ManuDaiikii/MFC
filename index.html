<script>
const $ = (s) => document.querySelector(s);
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const randItem = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtMoney = (n) => { if (n >= 1_000_000) return `$${(n/1_000_000).toFixed(1)}M`; if (n >= 1_000) return `$${(n/1_000).toFixed(0)}k`; return `$${n}`; };

window.showAlert = (msg, title = "Aviso") => { document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 400px;"><h2 class="gold mb">${title}</h2><p class="mb" style="color:var(--text-2);">${msg}</p><button class="btn btn-gold btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">Aceptar</button></div></div>`; };
window.showConfirm = (msg, onConfirm, onCancel = null, title = "Confirmar") => { window._confirmCallback = onConfirm; window._cancelCallback = onCancel; document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 400px;"><h2 class="gold mb">${title}</h2><p class="mb" style="color:var(--text-2);">${msg}</p><div class="grid-2 mt"><button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''; if(window._cancelCallback) window._cancelCallback();">Cancelar</button><button class="btn btn-green" onclick="document.getElementById('modal-root').innerHTML=''; if(window._confirmCallback) window._confirmCallback();">Aceptar</button></div></div></div>`; };
window.renderMatchResult = (title, teamA, teamB, scoreA, scoreB, extraHTML, onContinue, motm = null) => { document.getElementById('app').innerHTML = `<div id="app-inner" class="page-transition"><div class="card card-gold center" style="max-width: 500px; margin: 40px auto; padding: 40px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);"><div style="font-size: 5rem; margin-bottom: 10px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));">${scoreA > scoreB ? '🏆' : scoreA < scoreB ? '😔' : '🤝'}</div><h2 style="color:${scoreA > scoreB ? 'var(--green)' : scoreA < scoreB ? 'var(--red)' : 'var(--gold)'}; font-size: 2rem; margin-bottom: 24px;">${title}</h2><div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:24px;"><div style="font-size:1.1rem; font-weight:800; flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${teamA}</div><div style="font-size:3rem; font-weight:900; color:var(--gold); background:rgba(0,0,0,0.4); padding:8px 20px; border-radius:16px; border:2px solid var(--border-2); flex-shrink:0; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);">${scoreA} - ${scoreB}</div><div style="font-size:1.1rem; font-weight:800; flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${teamB}</div></div>${motm ? `<div class="pill pill-gold mb" style="font-size:0.9rem;">⭐ MVP: ${motm.name} (${motm.goals} Goles, ${motm.assists} Asist.)</div>` : ''}${extraHTML ? `<div style="margin-bottom:24px;">${extraHTML}</div>` : ''}<button class="btn btn-gold btn-block mt" style="margin-top:20px; padding:16px; font-size:1.2rem;" id="result-continue">Continuar</button></div></div>`; document.getElementById('result-continue').onclick = onContinue; };

window.showTrainResult = (success, onSuccess, onFail, extraMsg = '') => { const icon = success ? '🎉' : '😔'; const text = success ? '¡Entrenamiento Superado!' : 'Fallaste.'; const color = success ? 'var(--green)' : 'var(--red)'; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">${icon}</div><h2 style="color:${color}; font-size:1.8rem;">${text}</h2>${extraMsg ? `<p class="dim mt">${extraMsg}</p>` : ''}<button class="btn btn-gold btn-block mt" id="train-done" style="padding:14px; font-size:1.1rem;">Continuar</button></div></div>`; document.getElementById('train-done').onclick = () => { document.getElementById('modal-root').innerHTML = ''; if (success) onSuccess(); else onFail(); }; };
function trainBar(onSuccess, onFail) { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>🎯 Precisión</h2><p class="mb">Frená la barra en la zona verde.</p><div class="train-container"><div class="train-target" style="left:40%; width:20%;"></div><div class="train-cursor" id="train-cursor" style="left:0%;"></div></div><button class="btn btn-gold btn-block" id="train-btn" style="padding:14px; font-size:1.1rem;">¡AHORA!</button></div></div>`; let cursorPos = 0, direction = 1, gameActive = true; window._trainInterval = setInterval(() => { if (!gameActive) return; cursorPos += direction * 4; if (cursorPos >= 100) { cursorPos = 100; direction = -1; } if (cursorPos <= 0) { cursorPos = 0; direction = 1; } const cursor = document.getElementById('train-cursor'); if (cursor) cursor.style.left = cursorPos + '%'; }, 16); document.getElementById('train-btn').onclick = () => { gameActive = false; clearInterval(window._trainInterval); window.showTrainResult(cursorPos >= 40 && cursorPos <= 60, onSuccess, onFail); }; }
function trainReaction(onSuccess, onFail) { $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>⚡ Reflejos</h2><p class="mb">Clic SOLO cuando se ponga verde.</p><button id="react-btn" class="btn btn-outline btn-block" style="height:120px; font-size:1.8rem; pointer-events:none; border-radius:16px;">ESPERA...</button></div></div>`; let clicked = false, startTime = 0; setTimeout(() => { if (clicked) return; const btn = document.getElementById('react-btn'); if (!btn) return; btn.textContent = "¡AHORA!"; btn.style.background = "var(--green)"; btn.style.color = "#000"; btn.style.pointerEvents = "auto"; btn.style.boxShadow = "0 0 30px var(--green)"; startTime = Date.now(); btn.onclick = () => window.showTrainResult(Date.now() - startTime < 600, onSuccess, onFail, `Reaccionaste en ${Date.now() - startTime}ms`); }, 1500 + Math.random() * 2000); }
window.renderPenaltyGame = () => { const ps = window._penState; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>⚽ Penales</h2><p class="mb">Anota 2 de 3.</p><p>Anotados: <strong class="gold" style="font-size:1.5rem;">${ps.goals}</strong> / 3</p><div style="display:flex; justify-content:space-around; margin:24px 0;"><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('left')">← Izq</button><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('center')">↑ Centro</button><button class="btn btn-outline" style="padding:20px; font-size:1.2rem;" onclick="window.kickPenalty('right')">Der →</button></div></div></div>`; };

  p.atk = p._origAtk; p.def = p._origDef;
  const mShift = tactic.mentality === 'offensive' ? 0.10 : tactic.mentality === 'defensive' ? -0.10 : 0;
  p.baseTx += mShift;
  if (p.role === 'DF') p.baseTx += tactic.line === 'high' ? 0.15 : tactic.line === 'deep' ? -0.15 : 0;
  if (tactic.style === 'park') { if (p.role === 'DF') p.baseTx -= 0.10; if (p.role === 'FW') p.baseTx -= 0.15; p.def += 0.02; }
  if (tactic.style === 'counter') { if (p.role === 'DF') p.baseTx -= 0.10; if (p.role === 'FW') p.atk += 0.06; }
  if (tactic.style === 'tiki') { p.atk += 0.03; p.def += 0.01; }
  if (tactic.style === 'press') { p.atk += 0.02; }
};
window.randomBotTactics = function() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  return { style: pick(['balanced','tiki','counter','park','press']), mentality: pick(['defensive','balanced','offensive']), pressure: pick(['low','medium','high']), line: pick(['deep','medium','high']), marking: pick(['zonal','man']) };
};
</script>

async function loadMyClub() { if (!onlineProfile?.clubId) return; myClubId = onlineProfile.clubId; const snap = await getDoc(doc(db, 'clubs', myClubId)); if (snap.exists()) myClub = { id: snap.id, ...snap.data() }; }

function screenOnlineLobby() { 
  const me = myClub.members.find(m => m.uid === onlineUser.uid); 
  $g('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold"><div style="display:flex; align-items:center; gap:14px;"><div style="width:64px; height:64px; border-radius:16px; background:${myClub.color}; display:flex; align-items:center; justify-content:center; font-size:1.8rem; border:3px solid var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.5);">🛡️</div><div style="flex:1;"><h2 style="margin:0;">${me.name} <span style="font-size:1rem;color:var(--gold);">#${me.dorsal || 10}</span></h2><div class="dim">${me.position} · ${onlineUser.email}</div></div><div style="text-align:right;"><div class="grl-big" style="color:var(--gold-2);">${me.rating}</div><div class="grl-label">TU GRL</div></div></div></div>

}
function openTraining() { window.startTrainingGame(async () => { try { myClub.members = myClub.members.map(m => m.uid === onlineUser.uid ? { ...m, rating: Math.min(99, m.rating + 1) } : m); await updateDoc(doc(db, 'clubs', myClubId), { members: myClub.members }); await loadMyClub(); } catch (e) { console.warn(e); } screenOnlineLobby(); }, () => { screenOnlineLobby(); }); }
function showCreateRoom() { $g('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>➕ Crear Sala Co-Op (5v5)</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><div class="modal-body"><p class="mb">Se generará un código para que tus amigos se unan.</p></div><div class="modal-actions"><button class="btn btn-gold" onclick="window.FirebaseOnline.createRoom()">Generar Código</button></div></div></div>`; }
async function createRoom() { $g('#modal-root').innerHTML = ''; $g('#app').innerHTML = `<div class="card card-gold center" style="padding:40px;"><div class="spinner"></div><h2>Creando sala...</h2></div>`; try { let code = '', exists = true; while (exists) { code = Math.random().toString(36).substring(2, 8).toUpperCase(); if (!(await getDoc(doc(db, 'rooms', code))).exists()) exists = false; } currentRoomCode = code; const hostPlayer = myClub.members.find(m => m.uid === onlineUser.uid); await setDoc(doc(db, 'rooms', code), { code, hostUid: onlineUser.uid, hostName: onlineProfile.gamertag, players: [hostPlayer], status: 'waiting', createdAt: serverTimestamp() }); listenRoom(code); } catch (e) { $g('#app').innerHTML = `<div class="card center"><h2>❌ Error</h2><p>${e.message}</p><button class="btn btn-outline mt" onclick="screenOnlineLobby()">Volver</button></div>`; } }
function showJoinRoom() { $g('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>🔑 Unirse a Sala</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><div class="modal-body"><label>Código</label><input id="join-code" type="text" maxlength="6" style="text-transform:uppercase; font-size:1.5rem; text-align:center;"></div><div class="modal-actions"><button class="btn btn-gold" onclick="window.FirebaseOnline.joinRoom()">Entrar</button></div></div></div>`; }
async function joinRoom() { const code = $g('#join-code').value.trim().toUpperCase(); if (code.length !== 6) { window.showAlert('Código inválido'); return; } $g('#modal-root').innerHTML = ''; $g('#app').innerHTML = `<div class="card center" style="padding:40px;"><div class="spinner"></div></div>`; try { const roomRef = doc(db, 'rooms', code); const snap = await getDoc(roomRef); if (!snap.exists() || snap.data().status !== 'waiting') { window.showAlert('Sala llena o ya iniciada.'); screenOnlineLobby(); return; } if (snap.data().players.length >= 5) { window.showAlert('Sala llena (máx 5).'); screenOnlineLobby(); return; } const myPlayer = myClub.members.find(m => m.uid === onlineUser.uid); await updateDoc(roomRef, { players: [...snap.data().players, myPlayer] }); currentRoomCode = code; listenRoom(code); } catch (e) { $g('#app').innerHTML = `<div class="card center"><h2>❌ Error</h2><p>${e.message}</p><button class="btn btn-outline mt" onclick="screenOnlineLobby()">Volver</button></div>`; } }

async function startRoomMatch(code) { try { const roomRef = doc(db, 'rooms', code); const room = (await getDoc(roomRef)).data(); const matchRef = doc(collection(db, 'matches')); const humans = room.players; const teamMembers = [...humans, ...genAIFillers(humans.length)]; const bots = genBotTeamFB(); await runTransaction(db, async (tx) => { tx.set(matchRef, { status: 'playing', mode: 'clasico', clubA: { name: 'Mi Equipo Co-Op', color: '#0a2a5e', members: teamMembers, ownerUid: room.hostUid }, clubB: { name: 'Bots United', color: '#e30613', members: bots, ownerUid: 'bot' }, createdAt: serverTimestamp() }); tx.update(roomRef, { status: 'playing', matchId: matchRef.id }); }); } catch (e) { window.showAlert('Error: ' + e.message); } }
async function leaveRoom() { if (unsubRoom) { unsubRoom(); unsubRoom = null; } if (currentRoomCode) { try { const snap = await getDoc(doc(db, 'rooms', currentRoomCode)); if (snap.exists()) { const room = snap.data(); if (room.hostUid === onlineUser.uid) await deleteDoc(doc(db, 'rooms', currentRoomCode)); else await updateDoc(doc(db, 'rooms', currentRoomCode), { players: room.players.filter(p => p.uid !== onlineUser.uid) }); } } catch(e){} currentRoomCode = null; } screenOnlineLobby(); }

    const me = myClub.members.find(m => m.uid === onlineUser.uid);

        if (motm && motm.name === me.name) {
            me.goals = (me.goals || 0) + motm.goals;
            me.assists = (me.assists || 0) + motm.assists;
            if (motm.goals > 0) me.mvps = (me.mvps || 0) + 1;
            try { await updateDoc(doc(db, 'clubs', myClubId), { members: myClub.members }); await loadMyClub(); } catch(e){}
        }
        window.renderMatchResult(res, 'Mi Equipo', 'Bots United', scoreA, scoreB, '', () => window.FirebaseOnline.backToLobby(), motm); 
    }); 
}
function watchMatch(matchId) { if (unsubMatch) unsubMatch(); currentMatchId = matchId; unsubMatch = onSnapshot(doc(db, 'matches', matchId), (s) => { if (!s.exists()) return; const d = s.data(); if (!window._matchRunning) { window._matchRunning = true; window.startMatchSimulation(d.clubA.name, d.clubB.name, d.clubA.members, d.clubB.members, (scoreA, scoreB, motm) => { window._matchRunning = false; if (unsubMatch) unsubMatch(); const res = scoreA > scoreB ? '¡GANAMOS!' : scoreA < scoreB ? 'PERDIMOS' : 'EMPATE'; window.renderMatchResult(res, d.clubA.name, d.clubB.name, scoreA, scoreB, '', () => window.FirebaseOnline.backToLobby(), motm); currentMatchId = null; currentRoomCode = null; }, false, false, false, null, false, false, false, true); } }); }
function backToLobby() { if (unsubRoom) { unsubRoom(); unsubRoom = null; } loadMyClub().then(screenOnlineLobby); }
function openOnlinePortal() { if (onlineUser) { if (!onlineProfile || !onlineProfile.clubId) screenOnlineSetup(); else { loadMyClub().then(screenOnlineLobby); } } else { screenAuthMenu(); } }

window.FirebaseOnline = { 
    openOnlinePortal, showLoginForm, loginUser, showRegisterForm, registerUser, logoutUser, createClub, showCreateRoom, createRoom, showJoinRoom, joinRoom, startRoomMatch, leaveRoom, startSoloBot, backToLobby, openTraining, isReady: () => true, 
    saveUTTeam: async (uid, squad) => { try { await setDoc(doc(db, 'ut_teams', uid), { squad, updatedAt: serverTimestamp() }); return true; } catch (e) { return false; } }, 
    getRandomUTTeams: async (count) => { try { const snap = await getDocs(collection(db, 'ut_teams')); const teams = []; snap.forEach(doc => { teams.push({ uid: doc.id, ...doc.data() }); }); const available = teams.filter(t => onlineUser ? t.uid !== onlineUser.uid : true); const shuffled = available.sort(() => 0.5 - Math.random()); return shuffled.slice(0, count); } catch (e) { return []; } }, 
    getMarketCards: async () => { let cards = []; try { const snap = await getDocs(collection(db, 'market_cards')); snap.forEach(doc => { cards.push({ id: doc.id, ...doc.data() }); }); } catch (e) { console.warn(e); } try { const local = JSON.parse(localStorage.getItem('local_market') || '[]'); cards = [...cards, ...local]; } catch(e) {} return cards.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); }, 
    postMarketCard: async (card, price, seller) => { try { await addDoc(collection(db, 'market_cards'), { card, price, seller, createdAt: serverTimestamp() }); return true; } catch (e) { console.warn(e); try { let localMarket = JSON.parse(localStorage.getItem('local_market') || '[]'); localMarket.push({ id: 'local_' + Date.now(), card, price, seller: seller + " (Local)", createdAt: { seconds: Math.floor(Date.now()/1000) } }); localStorage.setItem('local_market', JSON.stringify(localMarket)); return 'local'; } catch(err) { return false; } } }, 
    deleteMarketCard: async (docId) => { try { await deleteDoc(doc(db, 'market_cards', docId)); return true; } catch (e) { return false; } }, 
    resetGRL: async () => { 
        window.showConfirm('¿Estás seguro de que quieres reiniciar tu GRL a 50?', async () => { 
            try { 
                myClub.members = myClub.members.map(m => m.uid === onlineUser.uid ? { ...m, rating: 50 } : m); 
                await updateDoc(doc(db, 'clubs', myClubId), { members: myClub.members }); 
                await loadMyClub(); 
                window.showAlert('Tu GRL fue reiniciado a 50 exitosamente.'); 
                screenOnlineLobby(); 
            } catch (e) { 
                window.showAlert('Error al reiniciar: ' + e.message); 
            } 
        }); 
    } 
};

window.FirebaseSocial = {
  saveStats: async (stats) => {
    if (!onlineUser) return false;
    try {
      await setDoc(doc(db, 'leaderboard', onlineUser.uid), { ...stats, uid: onlineUser.uid, name: (onlineProfile && onlineProfile.gamertag) || 'Anónimo', updatedAt: serverTimestamp() });
      return true;
    } catch(e) { return false; }
  },
  getTop: async (field = 'coins', limit = 30) => {
    try {
      const snap = await getDocs(collection(db, 'leaderboard'));
      const arr = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      return arr.slice(0, limit);

  },
  getRivals: async (uids) => {
    if (!uids.length) return [];
    try {
      const out = [];
      for (const uid of uids) { const s = await getDoc(doc(db, 'leaderboard', uid)); if (s.exists()) out.push({ id: s.id, ...s.data() }); }
      return out;
    } catch(e) { return []; }
  }
};

window.FirebaseOnline._ready = true;
</script>

<script>
function screenUT() { $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold"><div style="display:flex; justify-content:space-between; align-items:center;"><h2 style="margin:0;">Ultimate Team</h2><div style="font-size:1.2rem; font-weight:800; color:var(--gold);">🪙 ${UT.coins.toLocaleString()}</div></div></div><div class="grid-2 mb"><div class="card center" onclick="openPack()" style="cursor:pointer;"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">🎁</div><h3 style="color:var(--gold); margin:0;">Abrir Sobre</h3><p class="dim">Sobres: ${UT.packs}</p></div><div class="card center" onclick="buyPack()" style="cursor:pointer;"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">🛒</div><h3 style="color:var(--green); margin:0;">Comprar Sobre</h3><p class="dim">Costo: 5000 🪙</p></div></div><div class="grid-2 mb"><div class="card center" onclick="screenUTSquad()" style="cursor:pointer;"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">⚽</div><h3 style="color:var(--blue); margin:0;">Mi Plantilla</h3><p class="dim">Arma tu equipo</p></div><div class="card center" onclick="screenUTDraft()" style="cursor:pointer;"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">📝</div><h3 style="color:var(--purple); margin:0;">Modo Draft</h3><p class="dim">Arma un equipo soñado</p></div></div><div class="grid-2 mb"><div class="card center" onclick="screenUTMarket()" style="cursor:pointer;"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">💱</div><h3 style="color:var(--green); margin:0;">Mercado</h3><p class="dim">Compra y vende cartas</p></div><div class="card center" onclick="screenUTTournamentOnline()" style="cursor:pointer;"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">🏆</div><h3 style="color:var(--gold); margin:0;">Torneo Online</h3><p class="dim">Enfréntate a otros usuarios</p></div></div><div class="card center" onclick="screenUTChampions()" style="cursor:pointer; border-color: #d4af37; background: linear-gradient(180deg, rgba(212,175,55,0.2) 0%, rgba(20,32,25,0.95) 100%);"><div style="font-size:2.5rem; margin-bottom:10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));">👑</div><h3 style="color:#d4af37; margin:0; font-size:1.2rem;">FUT Champions</h3><p class="dim">División ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][UT.champsDiv-1]} · ${UT.champsPts} Puntos</p></div></div>`; }
function screenUTChampions() { const divNames = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X']; const divIndex = UT.champsDiv - 1; const ptsForNext = UT.champsDiv === 1 ? 'MAX' : Math.max(0, 3 - UT.champsPts); let rewards = ''; if (UT.champsDiv === 1) rewards = '500,000 🪙 + 20 Sobres TOTW'; else if (UT.champsDiv === 2) rewards = '200,000 🪙 + 10 Sobres TOTW'; else if (UT.champsDiv === 3) rewards = '100,000 🪙 + 5 Sobres TOTW'; else if (UT.champsDiv === 4) rewards = '50,000 🪙 + 3 Sobres TOTW'; else if (UT.champsDiv <= 7) rewards = '20,000 🪙 + 2 Sobres'; else rewards = '5,000 🪙 + 1 Sobre'; $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenUT()">← Volver</button><div class="card card-gold" style="border-color:#d4af37;"><div style="display:flex; justify-content:space-between; align-items:center;"><div><h2 style="margin:0; color:#d4af37;">👑 FUT Champions</h2><p class="muted" style="margin:0;">Demuestra que eres el mejor.</p></div><div style="text-align:center;"><div style="font-size:2rem; font-weight:900; color:#d4af37; text-shadow: 0 0 10px rgba(212,175,55,0.5);">DIV ${divNames[divIndex]}</div><div class="dim">${UT.champsPts} / 3 Pts</div></div></div></div><div class="card"><h3>Recompensas de la División ${divNames[divIndex]}</h3><div class="stat-row"><span class="lbl">Premio actual:</span><span class="val gold">${rewards}</span></div><p class="dim mt">Necesitas ${ptsForNext} victorias para ascender a la División ${UT.champsDiv > 1 ? divNames[divIndex - 1] : 'máxima'}.</p></div><div class="card center" style="display:flex; flex-direction:column; gap:10px;"><button class="btn btn-gold btn-block" onclick="playChampsMatch(false)">⚽ Jugar contra Bot (Rápido)</button><button class="btn btn-blue btn-block" onclick="playChampsMatch(true)">🌐 Buscar Rival (Online)</button></div></div>`; }
async function playChampsMatch(isOnline) { if (!UT.squad.filter(p=>p).length) { window.showAlert('Necesitas al menos 1 jugador en tu plantilla.'); return; } let oppName = "Bot Champions"; let oppSquad = genBotTeam(65 + (10 - UT.champsDiv) * 3); if (isOnline) { $('#app').innerHTML = `<div id="app-inner" class="page-transition"><div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Buscando Rival...</h2><p class="dim">Conectando al servidor</p></div></div>`; if (window.FirebaseOnline && window.onlineUser) { await window.FirebaseOnline.saveUTTeam(window.onlineUser.uid, UT.squad); const opps = await window.FirebaseOnline.getRandomUTTeams(1); if (opps.length > 0) { oppSquad = opps[0].squad; oppName = "Rival: " + (opps[0].uid ? opps[0].uid.substring(0,5) : 'Online'); } else { window.showAlert('No se encontraron rivales reales. Jugarás contra la IA.'); isOnline = false; } } else { window.showAlert('No estás logueado online. Jugarás contra la IA.'); isOnline = false; } } const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi UT', oppName, myFullTeam, oppSquad, (scoreA, scoreB, motm) => { let msg = ''; if (scoreA > scoreB) { UT.champsPts++; if (UT.champsPts >= 3) { UT.champsPts = 0; if (UT.champsDiv > 1) { UT.champsDiv--; msg = `<p class="gold mt" style="font-size:1.2rem; font-weight:800;">¡ASCENSO! Ahora estás en la División ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][UT.champsDiv-1]}</p>`; } else { msg = `<p class="gold mt" style="font-size:1.2rem; font-weight:800;">¡Eres el Campeón de División I!</p>`; } } else { msg = `<p class="green mt" style="font-size:1.2rem; font-weight:800;">Has ganado. Puntos: ${UT.champsPts}/3</p>`; } } else if (scoreA < scoreB) { UT.champsPts = Math.max(0, UT.champsPts - 1); msg = `<p class="red mt" style="font-size:1.2rem; font-weight:800;">Derrota. Puntos: ${UT.champsPts}/3</p>`; } else { msg = `<p class="dim mt" style="font-size:1.2rem; font-weight:800;">Empate. Puntos: ${UT.champsPts}/3</p>`; } saveUT(); let rewardHtml = ''; if (scoreA > scoreB && UT.champsPts === 0) { let coinsReward = 0, packsReward = 0; if (UT.champsDiv === 1) { coinsReward = 500000; packsReward = 20; } else if (UT.champsDiv === 2) { coinsReward = 200000; packsReward = 10; } else if (UT.champsDiv === 3) { coinsReward = 100000; packsReward = 5; } else if (UT.champsDiv === 4) { coinsReward = 50000; packsReward = 3; } else if (UT.champsDiv <= 7) { coinsReward = 20000; packsReward = 2; } else { coinsReward = 5000; packsReward = 1; } UT.coins += coinsReward; UT.packs += packsReward; saveUT(); rewardHtml = `<p class="gold" style="font-size:1.5rem; font-weight:900; margin-top:10px;">+${coinsReward.toLocaleString()} 🪙 + ${packsReward} Sobres</p>`; } window.renderMatchResult(scoreA > scoreB ? '¡VICTORIA!' : scoreA < scoreB ? 'DERROTA' : 'EMPATE', 'Mi UT', oppName, scoreA, scoreB, `${msg}${rewardHtml}`, () => screenUTChampions(), motm); }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, false, false, isOnline); }
function buyPack() { if (UT.coins >= 5000) { UT.coins -= 5000; UT.packs += 1; saveUT(); window.showAlert('¡Sobre comprado!'); screenUT(); } else window.showAlert('No tienes suficientes monedas.'); }
function showRareAnimation(card, callback) { const overlay = document.getElementById('rare-overlay'); overlay.classList.remove('hidden'); setTimeout(() => { overlay.classList.add('hidden'); callback(); }, 2500); }
function openPack() { if (UT.packs <= 0) { window.showAlert('No tienes sobres.'); return; } UT.packs--; const pulled = []; for (let i = 0; i < 3; i++) { const r = Math.random() * 100; let pool; if (r < 0.1) pool = DB_UT.filter(p => p.type === 'totw'); else if (r < 0.5) pool = DB_UT.filter(p => p.type === 'icon'); else if (r < 2.5) pool = DB_UT.filter(p => p.type === 'toty' || p.type === 'tots'); else if (r < 32.5) pool = DB_UT.filter(p => p.type === 'gold'); else if (r < 70) pool = DB_UT.filter(p => p.type === 'silver'); else pool = DB_UT.filter(p => p.type === 'bronze'); pulled.push({ ...randItem(pool) }); } UT.cards.push(...pulled); saveUT(); const hasRare = pulled.some(p => ['icon', 'toty', 'tots', 'totw'].includes(p.type)); const showCards = () => { const container = document.getElementById('pack-cards-container'); container.innerHTML = pulled.map((p, i) => `<div class="ut-card ${p.type} card-flip" style="animation-delay: ${i * 0.8}s; opacity: 0;" onclick="showPlayerStats('${p.id}')"><div class="rating">${p.rating}</div><div class="pos">${p.pos}</div><div class="name">${p.name}</div></div>`).join(''); document.getElementById('pack-continue-btn').style.display = 'block'; }; $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center" style="max-width: 500px;"><h2>Abriendo Sobre...</h2><div class="card-pack" id="pack-cards-container" style="min-height: 160px;"></div><button class="btn btn-gold btn-block mt" id="pack-continue-btn" style="display:none; padding:14px; font-size:1.1rem;" onclick="document.getElementById('modal-root').innerHTML=''; screenUT();">Continuar</button></div></div>`; if (hasRare) showRareAnimation(pulled.find(p => ['icon', 'toty', 'tots', 'totw'].includes(p.type)), showCards); else setTimeout(showCards, 500); }
function screenUTSquad() { const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const chemData = calculateChemistry(UT.squad, UT.formation); const inSquadIds = new Set(UT.squad.filter(p => p).map(p => p.id)); const inBenchIds = new Set(UT.bench.filter(p => p).map(p => p.id)); const benchCards = UT.cards.filter(c => !inSquadIds.has(c.id) && !inBenchIds.has(c.id)); const benchHtml = benchCards.map(p => `<div class="ut-card ${p.type}" draggable="true" ondragstart="dragStart(event, 'ut', 'bench', '${p.id}')" ondragend="dragEnd(event)" onclick="showPlayerStats('${p.id}')"><div class="rating">${p.rating}</div><div class="pos">${p.pos}</div><div class="name">${p.name}</div></div>`).join(''); $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenUT()">← Volver</button><div class="card card-gold"><div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;"><div><h2 style="margin:0;">Mi Plantilla</h2><p class="dim" style="margin:0;">Formación: <strong class="gold">${form.name}</strong></p></div><div style="text-align:right;"><div style="font-size:0.75rem; color:var(--text-2); font-weight:700; text-transform:uppercase;">Química de Equipo</div><div style="font-size:1.8rem; font-weight:900; color:${chemData.teamChem >= 80 ? 'var(--green)' : chemData.teamChem >= 50 ? 'var(--gold)' : 'var(--red)'};">${chemData.teamChem} / 100</div></div><button class="btn btn-gold btn-sm" onclick="openFormationPicker('ut')">⚙️ Cambiar Formación</button></div></div><div class="card" style="background:var(--bg-2); padding: 10px; display:flex; justify-content:center;">${renderPitch(UT.squad, 'ut', form, chemData.playerChems)}</div><div class="card"><h3>Banca (Suplentes)</h3>${renderBench(UT.bench, 'ut')}<p class="dim center mt" style="font-size:0.75rem;">Arrastra jugadores aquí para guardarlos y usarlos en partidos.</p></div><div class="card" style="min-height: 160px;" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'ut', 'bench', null)"><h3>Colección de Cartas (${benchCards.length})</h3><div style="display:flex; flex-wrap:wrap; gap:10px; max-height:300px; overflow-y:auto; padding: 5px;">${benchHtml || '<p class="dim">No tienes más cartas. Abrí sobres o comprá en el mercado.</p>'}</div></div></div>`; }
let UT_MARKET = []; let GLOBAL_MARKET = []; let marketFilter = { zone: 'ALL', type: 'ALL', minRating: 0 }; let marketTab = 'global';
function generateMarket() { UT_MARKET = []; for (let i = 0; i < 15; i++) { const r = Math.random(); const pool = r < 0.02 ? DB_UT.filter(p => p.type === 'totw') : r < 0.05 ? DB_UT.filter(p => p.type === 'icon') : r < 0.18 ? DB_UT.filter(p => p.type === 'toty' || p.type === 'tots') : r < 0.6 ? DB_UT.filter(p => p.type === 'gold') : r < 0.85 ? DB_UT.filter(p => p.type === 'silver') : DB_UT.filter(p => p.type === 'bronze'); const card = randItem(pool); if (!card) continue; let base; if (card.type === 'totw') base = card.rating * card.rating * 500; else if (card.type === 'icon') base = card.rating * card.rating * 350; else if (card.type === 'toty' || card.type === 'tots') base = card.rating * card.rating * 200; else if (card.type === 'gold') base = card.rating * card.rating * 80; else if (card.type === 'silver') base = card.rating * card.rating * 30; else base = card.rating * card.rating * 15; const price = Math.round(base * (0.85 + Math.random() * 0.35)); UT_MARKET.push({ ...card, marketId: 'mk_' + i + '_' + Date.now() + Math.random(), price, seller: 'Bot_' + rand(1, 999) }); } UT_MARKET.sort((a, b) => b.rating - a.rating); }
generateMarket();
async function loadGlobalMarket() { $('#app').innerHTML = `<div id="app-inner" class="page-transition"><div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Cargando Mercado Global...</h2></div></div>`; GLOBAL_MARKET = await window.FirebaseOnline.getMarketCards(); screenUTMarket(); }
function screenUTMarket() { const currentMarket = marketTab === 'global' ? GLOBAL_MARKET : UT_MARKET; const filtered = currentMarket.filter(c => { const cardData = marketTab === 'global' ? c.card : c; if (marketFilter.type !== 'ALL' && cardData.type !== marketFilter.type) return false; if (marketFilter.zone !== 'ALL') { const zones = cardData.pos.split('/').map(getZone); if (!zones.includes(marketFilter.zone)) return false; } if (cardData.rating < marketFilter.minRating) return false; return true; }); $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenUT()">← Volver a UT</button><div class="card card-gold"><div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;"><h2 style="margin:0;">💱 Mercado</h2><div style="font-size:1.2rem; font-weight:800; color:var(--gold);">🪙 ${UT.coins.toLocaleString()}</div></div><div class="tabs mt"><button class="tab ${marketTab==='global'?'active':''}" onclick="marketTab='global';loadGlobalMarket()">🌍 Global (Reales)</button><button class="tab ${marketTab==='sell'?'active':''}" onclick="marketTab='sell';screenUTMarket()">💼 Mis Publicaciones</button></div></div>${marketTab === 'global' ? `<div class="card"><div class="filter-row"><div><label>Zona</label><select id="f-zone" onchange="marketFilter.zone=this.value;screenUTMarket()"><option value="ALL"${marketFilter.zone==='ALL'?' selected':''}>Todas</option><option value="GK"${marketFilter.zone==='GK'?' selected':''}>Arqueros</option><option value="DEF"${marketFilter.zone==='DEF'?' selected':''}>Defensores</option><option value="MID"${marketFilter.zone==='MID'?' selected':''}>Medios</option><option value="ATT"${marketFilter.zone==='ATT'?' selected':''}>Atacantes</option></select></div><div><label>Tipo</label><select id="f-type" onchange="marketFilter.type=this.value;screenUTMarket()"><option value="ALL"${marketFilter.type==='ALL'?' selected':''}>Todos</option><option value="gold"${marketFilter.type==='gold'?' selected':''}>Oro</option><option value="silver"${marketFilter.type==='silver'?' selected':''}>Plata</option><option value="bronze"${marketFilter.type==='bronze'?' selected':''}>Bronce</option><option value="tots"${marketFilter.type==='tots'?' selected':''}>TOTS</option><option value="toty"${marketFilter.type==='toty'?' selected':''}>TOTY</option><option value="totw"${marketFilter.type==='totw'?' selected':''}>TOTW</option><option value="icon"${marketFilter.type==='icon'?' selected':''}>Ícono</option></select></div><div><label>Rating min</label><input type="number" id="f-min" min="50" max="99" value="${marketFilter.minRating}" onchange="marketFilter.minRating=+this.value;screenUTMarket()"></div><button class="btn btn-gold" onclick="loadGlobalMarket()">🔄 Refrescar</button></div><div style="margin-top:12px; font-size:0.82rem; color:var(--text-3); margin-bottom:8px;">Mostrando ${filtered.length} ofertas globales</div>${filtered.length === 0 ? '<p class="dim center" style="padding:20px;">No hay publicaciones de otros jugadores ahora mismo.</p>' : filtered.map(m => { const c = m.card; return `<div class="market-row" onclick="showPlayerStats('${c.id}')" style="cursor:pointer;"><div class="grl-badge ${c.type}">${c.rating}</div><div><div style="font-weight:800;">${c.name}</div><div class="dim">${c.pos}</div></div><div class="dim" style="text-align:center;">${c.pos.split('/')[0]}</div><div class="seller dim" style="text-align:center;">${m.seller}</div><div style="display:flex; justify-content:flex-end; align-items:center; gap:8px;"><span class="gold" style="font-weight:800;">🪙 ${m.price.toLocaleString()}</span><button class="btn btn-sm btn-green" onclick="event.stopPropagation(); buyGlobalCard('${m.id}')">Comprar</button></div></div>`; }).join('')}</div>` : ''}${marketTab === 'sell' ? `<div class="card"><h3>Vender cartas duplicadas o sin usar</h3><p class="dim mb">Publica tus cartas para que otros jugadores las compren.</p>${Object.values(UT.cards.reduce((acc, c) => { acc[c.id] = acc[c.id] || { card: c, count: 0 }; acc[c.id].count++; return acc; }, {})).map(s => { const squadIds = new Set(UT.squad.filter(p => p).map(p => p.id)); const benchIds = new Set(UT.bench.filter(p => p).map(p => p.id)); const inUse = squadIds.has(s.card.id) || benchIds.has(s.card.id); if (inUse && s.count <= 1) return ''; const count = inUse ? s.count - 1 : s.count; if (count <= 0) return ''; const base = s.card.rating * s.card.rating * (s.card.type === 'totw' ? 500 : s.card.type === 'icon' ? 350 : s.card.type === 'tots' || s.card.type === 'toty' ? 200 : s.card.type === 'gold' ? 80 : s.card.type === 'silver' ? 30 : 15); const sellPrice = Math.round(base * 0.65); return `<div class="market-row"><div class="grl-badge ${s.card.type}">${s.card.rating}</div><div><div style="font-weight:800;">${s.card.name} ${count > 1 ? `<span class="pill" style="font-size:0.6rem;">x${count}</span>` : ''}</div><div class="dim">${s.card.pos}</div></div><div class="dim" style="text-align:center;">${s.card.pos.split('/')[0]}</div><div class="dim" style="text-align:center;"></div><div style="display:flex; justify-content:flex-end; align-items:center; gap:8px;"><span class="green" style="font-weight:800;">Recibes: +🪙 ${sellPrice.toLocaleString()}</span><button class="btn btn-sm btn-blue" onclick="publishCard('${s.card.id}', ${sellPrice})">Publicar</button></div></div>`; }).join('') || '<p class="dim center" style="padding:20px;">No tienes cartas disponibles para vender.</p>'}</div>` : ''}</div>`; }
async function buyGlobalCard(docId) { const offer = GLOBAL_MARKET.find(m => m.id === docId); if (!offer) return; if (UT.coins < offer.price) { window.showAlert('No tienes suficientes monedas.'); return; } window.showConfirm(`Comprar a ${offer.card.name} (${offer.card.rating} GRL) por ${offer.price.toLocaleString()} monedas?`, async () => { let success = false; if (docId.startsWith('local_')) { let localMarket = JSON.parse(localStorage.getItem('local_market') || '[]'); localMarket = localMarket.filter(c => c.id !== docId); localStorage.setItem('local_market', JSON.stringify(localMarket)); success = true; } else { success = await window.FirebaseOnline.deleteMarketCard(docId); } if (success) { UT.coins -= offer.price; const newCard = { ...offer.card, id: 'c_' + Date.now() + Math.random().toString(36).slice(2, 6) }; UT.cards.push(newCard); saveUT(); window.showAlert('¡Compra exitosa! La carta está en tu colección.'); loadGlobalMarket(); } else { window.showAlert('Error: La carta ya fue comprada por otro usuario.'); loadGlobalMarket(); } }); }
async function publishCard(cardId, price) { const squadIds = new Set(UT.squad.filter(p => p).map(p => p.id)); const benchIds = new Set(UT.bench.filter(p => p).map(p => p.id)); const inUse = squadIds.has(cardId) || benchIds.has(cardId); const cards = UT.cards.filter(c => c.id === cardId); if (inUse && cards.length <= 1) { window.showAlert('Esta carta está en tu once inicial o banca. Cambiala primero.'); return; } const card = cards[0]; if (!card) return; window.showConfirm(`Publicar a ${card.name} en el Mercado Global por 🪙 ${price.toLocaleString()}?`, async () => { let sellerName = 'Anónimo'; if (window.onlineProfile && window.onlineProfile.gamertag) sellerName = window.onlineProfile.gamertag; const result = await window.FirebaseOnline.postMarketCard({name: card.name, rating: card.rating, pos: card.pos, type: card.type, nation: card.nation, league: card.league, club: card.club}, price, sellerName); if (result) { for (let i = UT.cards.length - 1; i >= 0; i--) { if (UT.cards[i].id === cardId) { UT.cards.splice(i, 1); break; } } saveUT(); if (result === 'local') window.showAlert('¡Carta publicada en el mercado local (Modo offline)!'); else window.showAlert('¡Carta publicada en el mercado global!'); screenUTMarket(); } else window.showAlert('Error grave al publicar.'); }); }
window.DRAFT = null;
function screenUTDraft() { if (!window.DRAFT) { window.DRAFT = { currentPick: 0, options: [], squad: Array(11).fill(null), formation: '4-3-3' }; generateDraftOptions(); } const form = FORMATIONS[window.DRAFT.formation]; if (window.DRAFT.currentPick >= 11) { $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window.DRAFT=null;screenUT()">← Cancelar</button><div class="card card-gold center"><h2>¡Equipo Draft Listo!</h2><p class="muted mb">Ahora demuestra de qué estás hecho.</p></div><div class="card" style="background:var(--bg-2);">${renderPitch(window.DRAFT.squad, 'ut', form, {})}</div><div class="card center"><button class="btn btn-green btn-block" onclick="playDraftMatch()">⚽ Jugar Partido de Draft</button></div></div>`; return; } if (window.DRAFT.options.length === 0) generateDraftOptions(); const currentSlot = form.slots[window.DRAFT.currentPick]; $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="window.DRAFT=null;screenUT()">← Cancelar</button><div class="card card-gold center"><h2>Modo Draft: Selección ${window.DRAFT.currentPick + 1} / 11</h2><p class="muted">Posición requerida: <strong class="gold">${currentSlot.role}</strong></p></div><div class="card" style="background:var(--bg-2); padding: 10px; display:flex; justify-content:center;">${renderPitch(window.DRAFT.squad, 'ut', form, {})}</div><div class="card"><h3>Elige a tu jugador para la posición ${currentSlot.role}</h3><div class="card-pack">${window.DRAFT.options.map((p, i) => `<div class="ut-card ${p.type}" onclick="window.pickDraftPlayer(${i})"><div class="rating">${p.rating}</div><div class="pos">${p.pos}</div><div class="name">${p.name}</div></div>`).join('')}</div></div></div>`; }
function generateDraftOptions() { const form = FORMATIONS[window.DRAFT.formation]; const slot = form.slots[window.DRAFT.currentPick]; const reqZone = getZone(slot.role); let pool = DB_UT.filter(p => p.pos.split('/').some(pos => getZone(pos) === reqZone || pos === slot.role)); if (pool.length === 0) pool = DB_UT; window.DRAFT.options = []; const used = new Set(window.DRAFT.squad.filter(p=>p).map(p=>p.id)); let safety = 0; while (window.DRAFT.options.length < 3 && pool.length > 0 && safety < 100) { safety++; const p = randItem(pool); if (!used.has(p.id) && !window.DRAFT.options.find(o=>o.id===p.id)) window.DRAFT.options.push({ ...p }); } }
window.pickDraftPlayer = function(idx) { if (idx === undefined || !window.DRAFT || !window.DRAFT.options[idx]) return; window.DRAFT.squad[window.DRAFT.currentPick] = window.DRAFT.options[idx]; window.DRAFT.currentPick++; if (window.DRAFT.currentPick < 11) generateDraftOptions(); screenUTDraft(); };
function playDraftMatch() { const bots = genBotTeam(85); window.startMatchSimulation('Mi Draft', 'Rival Draft', window.DRAFT.squad, bots, (scoreA, scoreB, motm) => { if (scoreA > scoreB) { UT.coins += 15000; UT.packs += 2; saveUT(); window.renderMatchResult('¡DRAFT GANADO!', 'Mi Draft', 'Rival Draft', scoreA, scoreB, `<p class="gold" style="font-size:1.5rem; font-weight:800;">+15,000 🪙 + 2 Sobres</p>`, () => { window.DRAFT = null; screenUT(); }, motm); } else { window.renderMatchResult('Draft Fallido', 'Mi Draft', 'Rival Draft', scoreA, scoreB, `<p class="dim">Sigue practicando.</p>`, () => { window.DRAFT = null; screenUT(); }, motm); } }, false, false, false, FORMATIONS['4-3-3'].slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 }))); }
async function screenUTTournamentOnline() { if (!UT.squad.filter(p=>p).length) { window.showAlert('Necesitas al menos 1 jugador en tu plantilla.'); return; } $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenUT()">← Volver</button><div class="card card-gold center"><h2>🏆 Torneo Online de UT</h2><p class="muted">Enfréntate a los equipos de otros jugadores reales.</p></div><div class="card center" style="padding:40px;"><div class="spinner"></div><h2>Buscando rivales...</h2><p class="dim">Subiendo tu equipo a los servidores</p></div></div>`; let myUid = 'invitado_' + rand(1000,9999); if (window.FirebaseOnline && window.onlineUser) { await window.FirebaseOnline.saveUTTeam(window.onlineUser.uid, UT.squad); myUid = window.onlineUser.uid; } const opponents = await window.FirebaseOnline.getRandomUTTeams(3); if (opponents.length < 2) { window.showAlert('No hay suficientes usuarios online. Se usarán equipos generados por IA.'); opponents.push({ squad: genBotTeam(85) }, { squad: genBotTeam(88) }); } window._tourneyOpponents = opponents.slice(0, 3); window._tourneyWins = 0; window._tourneyCurrent = 0; runTournamentMatch(); }
function runTournamentMatch() { if (window._tourneyCurrent >= 3) { if (window._tourneyWins === 3) { UT.coins += 50000; UT.packs += 5; saveUT(); window.renderMatchResult('¡CAMPEÓN ONLINE!', 'Mi UT', 'Mundo', 3, 0, `<p class="gold" style="font-size:1.5rem; font-weight:800;">+50,000 🪙 + 5 Sobres</p>`, () => screenUT()); } else window.renderMatchResult('Torneo Finalizado', 'Mi UT', 'Mundo', window._tourneyWins, 3 - window._tourneyWins, `<p class="dim">Ganaste ${window._tourneyWins} de 3 partidos.</p>`, () => screenUT()); return; } const opp = window._tourneyOpponents[window._tourneyCurrent]; let oppName = "Rival " + (window._tourneyCurrent + 1); if (opp.uid) oppName = "Jugador: " + opp.uid.substring(0, 5); const oppSquad = opp.squad || genBotTeam(85); const form = FORMATIONS[UT.formation] || FORMATIONS['4-3-3']; const myFullTeam = [...UT.squad, ...UT.bench.filter(p => p)]; window.startMatchSimulation('Mi UT', oppName, myFullTeam, oppSquad, (scoreA, scoreB, motm) => { if (scoreA > scoreB) window._tourneyWins++; window._tourneyCurrent++; window.renderMatchResult(scoreA > scoreB ? 'Victoria' : 'Derrota', 'Mi UT', oppName, scoreA, scoreB, `<p class="dim">Partido ${window._tourneyCurrent} de 3</p>`, () => runTournamentMatch(), motm); }, false, false, true, form.slots.map(s => ({ role: s.role, tx: s.x/100, ty: s.y/100 })), false, false, false, true); }
function openFormationPicker(mode) { const current = mode === 'ut' ? UT.formation : (mode === 'mgr' ? MGR.formation : '4-3-3'); $('#modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>⚙️ Elegir Formación</h2><button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">×</button></div><p class="dim mb">Los jugadores se acomodarán automáticamente.</p><div style="display:grid; gap:8px;">${Object.keys(FORMATIONS).map(k => `<button class="btn ${current===k?'btn-gold':'btn-outline'} btn-block" onclick="applyFormation('${k}', '${mode}')">${FORMATIONS[k].name}</button>`).join('')}</div></div></div>`; }
function applyFormation(formName, mode) { const form = FORMATIONS[formName]; if (!form) return; if (mode === 'ut') { const currentPlayers = UT.squad.filter(p => p); const newSquad = Array(11).fill(null); const unassigned = []; currentPlayers.forEach(card => { const cardPos = card.pos.split('/'); let idx = newSquad.findIndex((s, i) => !s && cardPos.includes(form.slots[i].role)); if (idx === -1) idx = newSquad.findIndex((s, i) => { if (s) return false; return cardPos.some(p => getZone(p) === getZone(form.slots[i].role)); }); if (idx === -1) idx = newSquad.findIndex(s => !s); if (idx !== -1) newSquad[idx] = card; else unassigned.push(card); }); UT.squad = newSquad; UT.formation = formName; saveUT(); } else if (mode === 'mgr') { const currentPlayers = MGR.startingXI.filter(p => p); const newSquad = Array(11).fill(null); const unassigned = []; currentPlayers.forEach(card => { const cardPos = card.pos.split('/'); let idx = newSquad.findIndex((s, i) => !s && cardPos.includes(form.slots[i].role)); if (idx === -1) idx = newSquad.findIndex((s, i) => { if (s) return false; return cardPos.some(p => getZone(p) === getZone(form.slots[i].role)); }); if (idx !== -1) newSquad[idx] = card; else unassigned.push(card); }); const newBench = [...MGR.bench]; newSquad.forEach((s, i) => { if (s) return; const role = form.slots[i].role; const bIdx = newBench.findIndex(b => b && b.pos.split('/').includes(role)); if (bIdx !== -1) { newSquad[i] = newBench[bIdx]; newBench[bIdx] = null; } }); newSquad.forEach((s, i) => { if (s) return; const bIdx = newBench.findIndex(b => b); if (bIdx !== -1) { newSquad[i] = newBench[bIdx]; newBench[bIdx] = null; } }); unassigned.forEach(p => { const e = newBench.findIndex(b => !b); if (e !== -1) newBench[e] = p; }); MGR.startingXI = newSquad; MGR.bench = newBench; MGR.formation = formName; saveMGR(); } document.getElementById('modal-root').innerHTML = ''; if (mode === 'ut') screenUTSquad(); else if (mode === 'mgr') screenManager(); }
let tooltipTimeout = null;
window.showPitchTooltip = (e, player, chem) => { const el = document.getElementById('tooltip'); if(!chem) { el.innerHTML = `<strong style="color:var(--gold)">${player.name}</strong><br>Posiciones: ${player.pos}`; } else { el.innerHTML = `<strong style="color:var(--gold)">${player.name}</strong><br>Química: <strong style="color:${chem.total >= 8 ? '#4ade80' : chem.total >= 5 ? '#facc15' : '#ef4444'}">${chem.total}/10</strong><br><span style="font-size:0.75rem; line-height:1.4;">${chem.pos > 0 ? `+${chem.pos} Posición<br>` : ''}${chem.nation > 0 ? `+${chem.nation} Nación<br>` : ''}${chem.league > 0 ? `+${chem.league} Liga<br>` : ''}${chem.club > 0 ? `+${chem.club} Club<br>` : ''}${chem.total === 0 ? 'Sin enlaces' : ''}</span>`; } clearTimeout(tooltipTimeout); tooltipTimeout = setTimeout(() => { el.style.left = e.pageX + 'px'; el.style.top = e.pageY + 'px'; el.style.opacity = 1; }, 400); };
window.hideTooltip = () => { clearTimeout(tooltipTimeout); document.getElementById('tooltip').style.opacity = 0; };
let draggedItem = null;
window.dragStart = (e, context, type, indexOrId) => { let player = null, index = null; if (context === 'ut') { if (type === 'pitch') { player = UT.squad[indexOrId]; index = indexOrId; } else if (type === 'bench') { player = UT.bench[indexOrId]; if(!player) player = UT.cards.find(c => c.id === indexOrId); index = indexOrId; } } else if (context === 'mgr') { if (type === 'pitch') { player = MGR.startingXI[indexOrId]; index = indexOrId; } else if (type === 'bench') { player = MGR.bench[indexOrId]; index = indexOrId; } } if (!player) { e.preventDefault(); return; } draggedItem = { context, type, index, player }; e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); };
window.dragEnd = (e) => { e.target.classList.remove('dragging'); document.querySelectorAll('.spot, .bench-spot').forEach(s => s.classList.remove('drag-over')); };
window.dragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.dragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };
window.drop = (e, context, targetType, targetIndex) => { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); if (!draggedItem || draggedItem.context !== context) return; if (context === 'ut') { if (targetType === 'pitch') { if (draggedItem.type === 'pitch') { const t = UT.squad[targetIndex]; UT.squad[targetIndex] = UT.squad[draggedItem.index]; UT.squad[draggedItem.index] = t; } else if (draggedItem.type === 'bench') { const newB = UT.bench[draggedItem.index]; if (newB) UT.bench[draggedItem.index] = UT.squad[targetIndex]; else UT.cards = UT.cards.filter(c => c.id !== draggedItem.player.id); UT.squad[targetIndex] = draggedItem.player; } } else if (targetType === 'bench') { if (targetIndex === null) { if (draggedItem.type === 'pitch') UT.squad[draggedItem.index] = null; else if (draggedItem.type === 'bench') UT.bench[draggedItem.index] = null; } else { if (draggedItem.type === 'pitch') { const t = UT.bench[targetIndex]; UT.bench[targetIndex] = UT.squad[draggedItem.index]; UT.squad[draggedItem.index] = t; } else if (draggedItem.type === 'bench') { const t = UT.bench[targetIndex]; UT.bench[targetIndex] = UT.bench[draggedItem.index]; UT.bench[draggedItem.index] = t; } else { UT.bench[targetIndex] = draggedItem.player; } } } saveUT(); screenUTSquad(); } else if (context === 'mgr') { if (targetType === 'pitch') { if (draggedItem.type === 'pitch') { const t = MGR.startingXI[targetIndex]; MGR.startingXI[targetIndex] = MGR.startingXI[draggedItem.index]; MGR.startingXI[draggedItem.index] = t; } else if (draggedItem.type === 'bench') { const t = MGR.startingXI[targetIndex]; MGR.startingXI[targetIndex] = MGR.bench[draggedItem.index]; MGR.bench[draggedItem.index] = t; } } else if (targetType === 'bench') { if (draggedItem.type === 'pitch') { const t = MGR.bench[targetIndex]; MGR.bench[targetIndex] = MGR.startingXI[draggedItem.index]; MGR.startingXI[draggedItem.index] = t; } else if (draggedItem.type === 'bench') { const t = MGR.bench[targetIndex]; MGR.bench[targetIndex] = MGR.bench[draggedItem.index]; MGR.bench[draggedItem.index] = t; } } saveMGR(); screenManager(); } draggedItem = null; };
function renderPitch(squad, mode, formation, chemData = {}) { const form = formation || FORMATIONS['4-3-3']; let html = `<div class="pitch">`; for (let i = 0; i < 11; i++) { const p = squad[i]; const slot = form.slots[i]; if (!slot) continue; const role = slot.role; if (p) { const penalty = getPenalty(p.pos, role); const eff = p.rating - penalty; const isOut = penalty > 0; const color = isOut ? 'var(--red)' : 'inherit'; let chemHTML = ''; let chemBadges = ''; let chemJSON = 'null'; if (chemData && chemData[p.id]) { const c = chemData[p.id].total; const chemColor = c >= 8 ? '#4ade80' : c >= 5 ? '#facc15' : '#ef4444'; chemHTML = `<div class="chem-dot" style="background:${chemColor}"></div>`; if (p.nation !== 'Icon') { chemBadges = `<div class="chem-badges"><span>${getNationBadge(p.nation)}</span><span>${getLeagueBadge(p.league)}</span><span>${getClubBadge(p.club)}</span></div>`; } chemJSON = JSON.stringify(chemData[p.id]).replace(/"/g, '&quot;'); } const pJSON = JSON.stringify(p).replace(/"/g, '&quot;'); html += `<div class="spot ${p.type || ''} ${isOut ? 'out-of-position' : ''} ${p.isInjured ? 'cross-injury' : ''}" style="left:${slot.x}%; top:${slot.y}%;" draggable="true" ondragstart="dragStart(event, '${mode}', 'pitch', ${i})" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'pitch', ${i})" onmouseenter="showPitchTooltip(event, ${pJSON}, ${chemJSON})" onmouseleave="hideTooltip()" onclick="showPlayerStats('${p.id}')">${chemHTML}<div class="spot-rating" style="color:${color};">${eff}</div><div class="spot-pos">${role}</div><div class="spot-name">${p.name.split(' ')[0]}</div>${chemBadges}</div>`; } else { html += `<div class="spot empty" style="left:${slot.x}%; top:${slot.y}%;" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'pitch', ${i})"><div class="spot-pos">${role}</div></div>`; } } html += `</div>`; return html; }
function renderBench(bench, mode) { let html = `<div class="bench-container">`; const max = mode === 'ut' ? 7 : 5; for (let i = 0; i < max; i++) { const p = bench[i]; if (p) html += `<div class="bench-spot filled ${p.type || ''} ${p.isInjured ? 'cross-injury' : ''}" draggable="true" ondragstart="dragStart(event, '${mode}', 'bench', ${i})" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'bench', ${i})" onmouseenter="showPitchTooltip(event, ${JSON.stringify(p).replace(/"/g, '&quot;')}, null)" onmouseleave="hideTooltip()" onclick="showPlayerStats('${p.id}')"><div class="spot-rating">${p.rating}</div><div class="spot-pos">${p.pos}</div><div class="spot-name">${p.name.split(' ')[0]}</div></div>`; else html += `<div class="bench-spot" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${mode}', 'bench', ${i})"><div class="spot-pos dim">Banca</div></div>`; } html += `</div>`; return html; }
</script>

<script>
let currentMenuMode = 'ut'; let secretClicks = 0; let keySequence = [];
window.handleLogoClick = function(e) { if(e) e.stopPropagation(); secretClicks++; const logoArea = document.querySelector('.fc-logo-area'); if(logoArea) { logoArea.style.transform = 'scale(0.9) rotate(10deg)'; setTimeout(() => logoArea.style.transform = 'scale(1) rotate(0deg)', 150); } if (secretClicks >= 5) { secretClicks = 0; if (!localStorage.getItem('unlocked_volta')) { localStorage.setItem('unlocked_volta', 'true'); window.showAlert('¡Has desbloqueado el MODO CALLEJERO (Volta)!', '¡SECRETO 1 DESBLOQUEADO!'); screenInicio(); } else window.showAlert('Ya desbloqueaste el Modo Volta.', 'MFC 2027'); } };
document.addEventListener('keydown', (e) => { keySequence.push(e.key.toUpperCase()); if (keySequence.length > 7) keySequence.shift(); if (keySequence.join('') === 'MFC') { keySequence = []; if (!localStorage.getItem('unlocked_arcade')) { localStorage.setItem('unlocked_arcade', 'true'); window.showAlert('¡Has desbloqueado el MODO ARCADE! Prepárate para la locura.', '¡SECRETO 2 DESBLOQUEADO!'); screenInicio(); } } if (keySequence.join('') === 'FUEGO') { keySequence = []; if (!localStorage.getItem('unlocked_fire')) { localStorage.setItem('unlocked_fire', 'true'); window.showAlert('¡Has desbloqueado el MODO PELOTA DE FUEGO! Ahora los partidos se jugarán con fuego.', '¡SECRETO 3 DESBLOQUEADO!'); screenInicio(); } } if (keySequence.join('') === 'POTRO') { keySequence = []; if (!localStorage.getItem('unlocked_potro')) { localStorage.setItem('unlocked_potro', 'true'); window.showAlert('¡Has desbloqueado el MODO POTRO! Jugadores ultra rápidos, balón dorado y sin cansancio.', '¡SECRETO 4 DESBLOQUEADO!'); screenInicio(); } } if (keySequence.join('') === 'D10S') { keySequence = []; if (!localStorage.getItem('unlocked_dios')) { localStorage.setItem('unlocked_dios', 'true'); window.showAlert('¡Has desbloqueado el MODO DIOS! Todos los jugadores tienen 99 GRL, no se cansan y la pelota brilla.', '¡5TO SECRETO DESBLOQUEADO!'); screenInicio(); } } if (keySequence.join('') === 'GOAT') { keySequence = []; if (!localStorage.getItem('unlocked_goat')) { localStorage.setItem('unlocked_goat', 'true'); window.showAlert('¡Has desbloqueado el MODO GOAT! El campo es de oro puro, los jugadores levitan y la pelota es un sol.', '¡6TO SECRETO DESBLOQUEADO!'); screenInicio(); } } 
    if (keySequence.join('') === 'RETRO') { keySequence = []; document.body.classList.toggle('retro-mode'); if (document.body.classList.contains('retro-mode')) { window.showAlert('¡Has activado el FILTRO RETRO! Escribelo de nuevo para quitarlo.', '¡7MO SECRETO DESBLOQUEADO!'); } }
});
const MENU_CONFIG = { 'ut': { icon: '⚽', color: 'var(--blue)' }, 'tourn': { icon: '🏆', color: 'var(--gold)' }, 'mgr': { icon: '💼', color: 'var(--purple)' }, 'mgr_real': { icon: '🌍', color: 'var(--green)' }, 'pcareer': { icon: '🏃', color: 'var(--green)' }, 'coop': { icon: '🤝', color: 'var(--orange)' }, 'offline': { icon: '🎮', color: 'var(--text-2)' }, 'rain': { icon: '🌧️', color: '#60a5fa' }, 'survival': { icon: '☠️', color: '#ef4444' }, 'fk': { icon: '🎯', color: '#facc15' }, 'quick': { icon: '⚡', color: '#60a5fa' }, 'volta': { icon: '🛹', color: 'var(--gold)' }, 'arcade': { icon: '👾', color: 'var(--blue)' }, 'potro': { icon: '🐎', color: '#FFD700' }, 'dios': { icon: '🌟', color: '#fff' }, 'goat': { icon: '🐐', color: '#d4af37' } };
function renderMenuContent(mode) { currentMenuMode = mode; document.querySelectorAll('.fc-btn').forEach(btn => btn.classList.remove('active')); const ab = document.getElementById('nav-'+mode); if (ab) ab.classList.add('active'); const t = TRANSLATIONS[currentLang]; const cfg = MENU_CONFIG[mode]; document.getElementById('fc-content').innerHTML = `<div class="content-anim"><div class="fc-title" style="color:${cfg.color}; text-shadow: 0 10px 30px ${cfg.color}44;">${cfg.icon} ${t[mode]}</div><div class="fc-desc">${t['desc_'+mode]}</div><button class="fc-play-btn" onclick="playMenuMode('${mode}')">${t.play} ➔</button></div>`; }
function playMenuMode(mode) { const app = document.getElementById('app'); app.classList.add('page-transition-out'); setTimeout(() => { app.classList.remove('page-transition-out'); window.showLoadingScreen(() => { if (mode === 'ut') screenUT(); else if (mode === 'mgr') loadManager(false); else if (mode === 'mgr_real') loadManager(true); else if (mode === 'pcareer') screenCreacion(); else if (mode === 'coop') window.CoperoUI.startOnline(); else if (mode === 'offline') { if (!PC && !loadPC()) screenPCSetup(); else screenPCLobby(); } else if (mode === 'tourn') screenUTTournament(); else if (mode === 'volta') screenVolta(); else if (mode === 'arcade') screenArcade(); else if (mode === 'potro') screenPotro(); else if (mode === 'dios') screenDios(); else if (mode === 'rain') screenRain(); else if (mode === 'survival') screenSurvival(); else if (mode === 'fk') screenFreeKick(); else if (mode === 'quick') screenQuickMatch(); else if (mode === 'goat') screenGoat(); }); }, 300); }

function screenInicio() {
  const hasBarrio = !!getBarrio();
  if (hasBarrio) {
    const lastReward = localStorage.getItem('last_daily_reward');
    const now = Date.now();
    if (!lastReward || now - parseInt(lastReward) > 86400000) {
      localStorage.setItem('last_daily_reward', now);
      UT.coins += 5000; UT.packs += 1; saveUT();
      setTimeout(() => window.showAlert('¡Recompensa Diaria!<br>+5,000 🪙 y +1 Sobre.', '¡Bienvenido de nuevo!'), 1000);
    }
  }
  const app = document.getElementById('app'); app.classList.remove('page-transition-out'); app.classList.add('page-transition'); setTimeout(() => app.classList.remove('page-transition'), 500);
  const t = TRANSLATIONS[currentLang];
  let extraBtns = '';

function generatePlayer(tier, isYouth = false) { const firstNames = ['Juan', 'Luis', 'Carlos', 'Pedro', 'Diego', 'Matías', 'Franco', 'Nico', 'Lautaro', 'Julián', 'Enzo', 'Alexis', 'Rodrigo', 'Facundo', 'Gonzalo']; const lastNames = ['Gómez', 'Pérez', 'Rodríguez', 'Fernández', 'López', 'Martínez', 'Díaz', 'Sánchez', 'Romero', 'Sosa', 'Torres', 'Álvarez', 'Benítez', 'Acosta', 'Medina']; const positions = ['GK', 'CB', 'LB', 'RB', 'CM', 'CDM', 'CAM', 'LM', 'RM', 'ST', 'LW', 'RW']; const name = (isYouth ? "Canterano " : "") + randItem(firstNames) + ' ' + randItem(lastNames); const pos = randItem(positions); let rating = isYouth ? rand(50, 60) : (tier === 'bronze' ? rand(55, 64) : tier === 'silver' ? rand(65, 74) : tier === 'gold' ? rand(75, 84) : rand(85, 92)); let potential = isYouth ? rand(85, 94) : rating + rand(1, 5); let price = rating * rating * 50; return { id: 'gen_' + Date.now() + Math.random().toString(36).slice(2, 6), name: name, pos: pos, rating: rating, potential: potential, tier: isYouth ? 'silver' : tier, price: price, salary: Math.round(price * 0.02), morale: rand(60, 90), contractWeeks: 25, isInjured: false, injuryMatches: 0, pendingOffer: null, nation: randItem(['Argentina', 'Brasil', 'Francia', 'España', 'Inglaterra', 'Alemania', 'Italia']), league: randItem(['La Liga', 'Premier League', 'Serie A', 'Bundesliga', 'Ligue 1']), club: randItem(['Real Madrid', 'Barcelona', 'Man City', 'Liverpool', 'Inter']) }; }

function generateFixtures(teams) { let fixtures = []; let tempTeams = [...teams]; if (tempTeams.length % 2 !== 0) tempTeams.push('BYE'); const numRounds = tempTeams.length - 1; const halfSize = tempTeams.length / 2; for (let round = 0; round < numRounds; round++) { let roundMatches = []; for (let i = 0; i < halfSize; i++) { if (tempTeams[i] !== 'BYE' && tempTeams[tempTeams.length - 1 - i] !== 'BYE') { roundMatches.push({ home: tempTeams[i], away: tempTeams[tempTeams.length - 1 - i], played: false, homeGoals: 0, awayGoals: 0 }); } } fixtures.push(roundMatches); tempTeams.splice(1, 0, tempTeams.pop()); } return fixtures; }

function initManager(isReal, selectedTeam = null) {
    if (isReal && !selectedTeam) { screenSelectRealTeam(); return; }
    try {
        const form = FORMATIONS['4-3-3']; 
        let startingXI = [];
        let pool = isReal ? REAL_MGR_CLUBS : FAKE_CLUBS;
        let myName = isReal ? selectedTeam.name : 'Deportivo Morón';
        if (isReal) {
            startingXI = getRealTeamPlayers(myName);
            if (!startingXI) { for (let i = 0; i < 11; i++) { const bp = generatePlayer('bronze'); bp.pos = form.slots[i].role; startingXI.push(bp); } }
        } else {
            for (let i = 0; i < 11; i++) { const bp = generatePlayer('bronze'); bp.pos = form.slots[i].role; startingXI.push(bp); }
        }
        const otherClubs = pool.filter(c => c.name !== myName);
        const allTeams = [myName, ...otherClubs.map(c => c.name)];
        const leagueTable = allTeams.map(name => ({ name, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, pts: 0 }));
        MGR = { teamName: myName, isReal: isReal, budget: isReal ? 50000000 : 150000, startingXI: startingXI, bench: [null, null, null, null, null], youthAcademy: [], matchDay: 0, points: 0, season: 1, matchesPlayed: 0, formation: '4-3-3', news: ["Bienvenido al club. La directiva espera buenos resultados."], leagueClubs: otherClubs, leagueTable: leagueTable, fixtures: generateFixtures(allTeams), cupActive: false, cupStage: 0 };

function submitMGRNegotiation() { const n = mgrNeg; const p = n.player; const offerPct = n.offer / p.price; const salaryPct = n.salary / (p.price * 0.1); n.pacienciaClub = clamp(n.pacienciaClub - Math.round(offerPct < 0.8 ? (0.8 - offerPct) * 150 : 0), 0, 100); n.pacienciaPlayer = clamp(n.pacienciaPlayer - Math.round(salaryPct < 0.8 ? (0.8 - salaryPct) * 150 : 0), 0, 100); if (n.pacienciaClub <= 0) { window.showAlert('El club rompió la negociación.'); screenSearchPlayers(); return; } if (n.pacienciaPlayer <= 0) { window.showAlert('El jugador se ofendió.'); screenSearchPlayers(); return; } const clubOK = Math.random() < (offerPct >= 0.9 ? 0.9 : offerPct >= 0.75 ? 0.5 : 0.1); const playerOK = Math.random() < (salaryPct >= 0.9 ? 0.9 : salaryPct >= 0.75 ? 0.5 : 0.1); if (clubOK && playerOK) { MGR.budget -= n.offer; p.salary = n.salary; p.contractWeeks = 25; p.morale = 80; const emptyIdx = MGR.bench.findIndex(s => s === null); if (emptyIdx !== -1) MGR.bench[emptyIdx] = p; else { let w = 0, wr = 999; MGR.bench.forEach((b, i) => { if (b && b.rating < wr) { wr = b.rating; w = i; } }); MGR.bench[w] = p; } saveMGR(); window.showAlert(`¡Fichaje exitoso! ${p.name} se une al club.`); screenManager(); } else { window.showAlert('Oferta rechazada.'); renderMGRNegotiation(); } }

function getBarrio() { try { return JSON.parse(localStorage.getItem('mfc_barrio')) || null; } catch(e) { return null; } }
function saveBarrio(b) { try { localStorage.setItem('mfc_barrio', JSON.stringify(b)); } catch(e) {} }
function getBarrioLevel(rep) { let lvl = BARRIO_LEVELS[0]; for (const L of BARRIO_LEVELS) if (rep >= L.min) lvl = L; return lvl; }
function getMomentos() { try { return JSON.parse(localStorage.getItem('mfc_momentos')) || []; } catch(e) { return []; } }
function saveMomentos(m) { try { localStorage.setItem('mfc_momentos', JSON.stringify(m)); } catch(e) {} }
function addReputation(amount) {
  const b = getBarrio(); if (!b) return null;
  const before = b.reputation || 0;
  b.reputation = before + amount;
  const oldLvl = getBarrioLevel(before);
  const newLvl = getBarrioLevel(b.reputation);
  saveBarrio(b);
  if (newLvl.min > oldLvl.min) return `🏘️ ¡Subiste a <strong>${newLvl.name}</strong>! (${b.reputation} reputación)`;
  return null;
}
function addMomento(tipo, titulo, detalle, coins) {
  const m = getMomentos();
  m.unshift({ tipo, titulo, detalle, coins: coins || 0, fecha: Date.now() });
  if (m.length > 40) m.length = 40;
  saveMomentos(m);
  if (coins > 0) { UT.coins += coins; saveUT(); }
  return `🎬 ${titulo} · <strong class="green">+${coins.toLocaleString()} 🪙</strong>`;
}
function announcePostMatch(events) { if (!events.length) return; setTimeout(() => window.showAlert(events.join('<br><br>'), '🎙️ ¡EL TANO RELATA!'), 1600); }

(function() {
  const orig = window.startMatchSimulation;
  window.startMatchSimulation = function(teamAName, teamBName, teamAPlayers, teamBPlayers, onFinish) {
    const args = Array.prototype.slice.call(arguments);
    const wrapped = function(scoreA, scoreB, motm) {
      const events = [];
      try {
        const win = scoreA > scoreB, draw = scoreA === scoreB;
        const diff = Math.abs(scoreA - scoreB), total = scoreA + scoreB;
        const rep = addReputation(win ? 10 : draw ? 3 : 1);
        if (rep) events.push(rep);
        let m = null;
        if (win && scoreA >= 6)      m = addMomento('goleada', '🔥 GOLEADA HISTÓRICA', `${teamAName} ${scoreA} - ${scoreB} ${teamBName}`, 5000);
        else if (win && scoreA >= 4 && diff >= 3) m = addMomento('paliza', '💥 PALIZA EN EL BARRIO', `${teamAName} ${scoreA} - ${scoreB} ${teamBName}`, 2000);
        else if (win && diff === 1 && scoreA >= 3 && scoreB >= 2) m = addMomento('agónico', '⚡ VICTORIA AGÓNICA', `${teamAName} ${scoreA} - ${scoreB} ${teamBName}`, 1500);
        else if (total >= 9) m = addMomento('loca', '🎢 PARTIDO DE LOCOS', `${teamAName} ${scoreA} - ${scoreB} ${teamBName}`, 1000);
        if (m) events.push(m);
      } catch(e) {}
      announcePostMatch(events);
      try {
        if (window.FirebaseSocial && window.onlineUser) {
          const barrio = getBarrio();
          window.FirebaseSocial.saveStats({
            coins: UT.coins,
            champsDiv: UT.champsDiv,
            barrio: (barrio && barrio.reputation) || 0,
            barrioName: (barrio && barrio.name) || 'Sin Barrio',
            lastMatch: `${teamAName} ${scoreA}-${scoreB} ${teamBName}`,
            lastResult: scoreA > scoreB ? 'W' : scoreA < scoreB ? 'L' : 'D'
          });
        }
      } catch(e) {}
      if (typeof onFinish === 'function') onFinish(scoreA, scoreB, motm);
    };
    args[4] = wrapped;
    return orig.apply(this, args);
  };
})();

function renderBarrioCard() {

window.fkShoot = function(zone) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><h2>💪 Potencia</h2><p class="mb">Frená en la zona verde</p><div class="train-container"><div class="train-target" style="left: 30%; width: 40%;"></div><div class="train-cursor" id="fk-cursor" style="left: 0%;"></div></div><button class="btn btn-gold btn-block" id="fk-shoot" style="padding: 14px; font-size: 1.1rem;">¡AHORA!</button></div></div>`;
  let p = 0, d = 1, active = true;
  const iv = setInterval(() => { if (!active) return; p += d * 5; if (p >= 100) { p = 100; d = -1; } if (p <= 0) { p = 0; d = 1; } const c = document.getElementById('fk-cursor'); if (c) c.style.left = p + '%'; }, 16);
  document.getElementById('fk-shoot').onclick = () => {
    active = false; clearInterval(iv);
    const goalie = ['left', 'center', 'right'][Math.floor(Math.random() * 3)];
    let isGoal = false, msg = '';
    if (p < 30) msg = 'Pateaste muy suave. Ataja el arquero.';
    else if (p > 85) msg = '¡Se fue por arriba!';
    else if (zone === goalie) msg = '¡Atajó el arquero! Adivinó el palo.';
    else { isGoal = true; msg = '¡GOLAZO! La clavaste en el ángulo.'; }
    if (isGoal) window._fk.goals++;

    document.getElementById('modal-root').innerHTML = `<div class="modal-overlay"><div class="modal-content center"><div style="font-size:4rem;">${isGoal ? '⚽' : '❌'}</div><h2 style="color:${isGoal ? 'var(--green)' : 'var(--red)'};">${isGoal ? '¡GOL!' : 'FALLÓ'}</h2><p class="muted mb">${msg}</p><button class="btn btn-gold btn-block" onclick="document.getElementById('modal-root').innerHTML='';window.fkRenderAim()">${window._fk.shot >= 5 ? 'Ver resultado' : 'Siguiente tiro'}</button></div></div>`;
  };

window.fkRenderResult = function() {
