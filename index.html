window.playCareerMatch = function() {
  if (!PLAYER) return;
  const p = PLAYER.player;
  const club = PLAYER.club;
  const rivalRating = club.rating + rand(-3, 5);
  const rivalName = randItem(['Rival FC', 'Atlético Local', 'Deportivo Rival', 'Sportivo Sur']);
  const myPlayerObj = { name: p.name, pos: p.pos, rating: p.rating, dorsal: p.dorsal, nation: p.nation };
  const myTeam = [myPlayerObj];
  const fillPositions = ['GK','RB','CB','CB','LB','CDM','CM','CAM','RW','ST','LW'].filter(pos => pos !== p.pos).slice(0, 10);
  fillPositions.forEach((role, i) => myTeam.push({ name: 'Compañero ' + (i + 1), pos: role, rating: club.rating + rand(-5, 3), dorsal: i + 2 }));
  const bots = genBotTeam(rivalRating);
  const form = FORMATIONS['4-3-3'];
  window.startMatchSimulation(club.name, rivalName, myTeam, bots, (a, b, motm) => {
    PLAYER.stats.matches++;
    let xpGain = 20;
    if (a > b) { PLAYER.stats.wins++; xpGain += 15; }
    else if (a === b) { PLAYER.stats.draws++; xpGain += 5; }
    else { PLAYER.stats.losses++; xpGain = 10; }
    if (motm && motm.name === p.name) { PLAYER.stats.mvps++; xpGain += 25; PLAYER.stats.goals += motm.goals || 0; PLAYER.stats.assists += motm.assists || 0; }
    PLAYER.player.xp += xpGain;
    while (PLAYER.player.xp >= xpForRating(PLAYER.player.rating + 1) && PLAYER.player.rating < 99) PLAYER.player.rating++;
    const nextClub = CAREER_CLUBS.find(c => c.minRating > PLAYER.club.rating && PLAYER.player.rating >= c.minRating);
    if (nextClub && !PLAYER.offers.find(o => o.club === nextClub.name)) PLAYER.offers.push({ club: nextClub.name, league: nextClub.league, rating: nextClub.rating, salary: nextClub.rating * 500 });
    savePlayerCareer();
    let extra = `<div class="stat-row"><span class="lbl">XP ganada</span><span class="val green">+${xpGain}</span></div>`;
    if (PLAYER.offers.length > 0) extra += `<p class="gold mt">📬 ¡Tenés una oferta nueva!</p>`;
    window.renderMatchResult(a > b ? '¡VICTORIA!' : a < b ? 'DERROTA' : 'EMPATE', club.name, rivalName, a, b, extra, () => screenCareerHub(), motm);
  }, false, false, false, form.slots.map(s => ({ role: s.role, tx: s.x / 100, ty: s.y / 100 })));
};
window.careerTraining = function() {
  if (!PLAYER) return;
  window.startTrainingGame(() => {
    PLAYER.player.xp += 30;
    while (PLAYER.player.xp >= xpForRating(PLAYER.player.rating + 1) && PLAYER.player.rating < 99) PLAYER.player.rating++;
    savePlayerCareer();
    window.showAlert('¡Entrenamiento superado!<br>+30 XP', '¡BUEN TRABAJO!');
    screenCareerHub();
  }, () => {
    PLAYER.player.xp += 10; savePlayerCareer();
    window.showAlert('Fallaste el entrenamiento.<br>+10 XP de consuelo.', 'A SEGUIR INTENTANDO');
    screenCareerHub();
  });
};
window.acceptCareerOffer = function(clubName) {
  const offer = PLAYER.offers.find(o => o.club === clubName);
  if (!offer) return;
  PLAYER.club = { name: offer.club, league: offer.league, rating: offer.rating };
  PLAYER.offers = PLAYER.offers.filter(o => o.club !== clubName);
  savePlayerCareer();
  window.showAlert(`¡Fichaste por ${offer.club}!<br>Nuevo nivel de club: ${offer.rating}`, '¡TRANSFERENCIA!');
  screenCareerHub();
};

// TÁCTICAS
function screenTactics() {
  const t = window.TACTICS;
  $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button>
    <div class="card card-gold center"><h2>⚙️ Tácticas</h2><p class="muted">Cómo juega tu equipo en todos los modos</p></div>
    <div class="card">
      <div class="field"><label>Mentalidad</label><select onchange="window.TACTICS.mentality=this.value;saveTactics()"><option value="defensive" ${t.mentality==='defensive'?'selected':''}>🛡️ Defensiva</option><option value="balanced" ${t.mentality==='balanced'?'selected':''}>⚖️ Equilibrada</option><option value="offensive" ${t.mentality==='offensive'?'selected':''}>⚔️ Ofensiva</option></select></div>
      <div class="field"><label>Presión</label><select onchange="window.TACTICS.pressure=this.value;saveTactics()"><option value="low" ${t.pressure==='low'?'selected':''}>Baja (1 presionador)</option><option value="medium" ${t.pressure==='medium'?'selected':''}>Media (2 presionadores)</option><option value="high" ${t.pressure==='high'?'selected':''}>Alta (3 presionadores)</option></select></div>
      <div class="field"><label>Línea defensiva</label><select onchange="window.TACTICS.line=this.value;saveTactics()"><option value="deep" ${t.line==='deep'?'selected':''}>Atrás</option><option value="medium" ${t.line==='medium'?'selected':''}>Media</option><option value="high" ${t.line==='high'?'selected':''}>Adelantada</option></select></div>
      <div class="field"><label>Marcaje</label><select onchange="window.TACTICS.marking=this.value;saveTactics()"><option value="man" ${t.marking==='man'?'selected':''}>Al hombre</option><option value="zonal" ${t.marking==='zonal'?'selected':''}>Zonal</option></select></div>
      <div class="field"><label>Estilo de juego</label><select onchange="window.TACTICS.style=this.value;saveTactics()"><option value="balanced" ${t.style==='balanced'?'selected':''}>Equilibrado</option><option value="tiki" ${t.style==='tiki'?'selected':''}>Tiki-taka (posesión)</option><option value="counter" ${t.style==='counter'?'selected':''}>Contraataque</option><option value="park" ${t.style==='park'?'selected':''}>Park the bus (defensivo)</option><option value="press" ${t.style==='press'?'selected':''}>Presión alta</option></select></div>
    </div>
    <div class="card"><h3>💡 Tip</h3><p class="dim">Los bots eligen un estilo aleatorio en cada partido. Adaptate.</p></div>
  </div>`;
}

// RANKING Y CLÁSICOS
async function screenLeaderboard() {
  $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold center"><h2>📊 Ranking Global</h2></div><div class="card center" style="padding:40px;"><div class="spinner"></div><h3>Cargando...</h3></div></div>`;
  if (!window.onlineUser) {
    $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button><div class="card card-gold center"><h2>📊 Ranking Global</h2></div><div class="card center"><p class="mb">Necesitás iniciar sesión en Pro Clubs Online para ver el ranking.</p><button class="btn btn-gold" onclick="playMenuMode('coop')">Ir a Pro Clubs</button></div></div>`;
    return;
  }
  const top = await window.FirebaseSocial.getTop('coins', 30);
  const medals = ['🥇','🥈','🥉'];
  const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button>
    <div class="card card-gold center"><h2>📊 Ranking Global</h2><p class="muted">Top 30 por monedas</p></div>
    <div class="card" style="padding:10px; overflow-x:auto;">
      ${top.length === 0 ? '<p class="dim center" style="padding:20px;">Sin datos aún. Jugá un partido para aparecer.</p>' : top.map((u, i) => `<div class="stat-row" style="padding:10px 8px;"><div style="display:flex; align-items:center; gap:10px; flex:1;"><div style="width:32px; text-align:center; font-size:1.2rem;">${medals[i] || `#${i+1}`}</div><div style="flex:1;"><div style="font-weight:800; ${u.uid === window.onlineUser.uid ? 'color:var(--gold);' : ''}">${u.name}${u.uid === window.onlineUser.uid ? ' (vos)' : ''}</div><div class="dim" style="font-size:0.75rem;">${u.barrioName || ''} ${u.champsDiv ? `· Div ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][u.champsDiv-1]}` : ''}</div></div></div><div style="text-align:right; margin-right:8px;"><div class="gold" style="font-weight:800;">🪙 ${(u.coins||0).toLocaleString()}</div><div class="dim" style="font-size:0.75rem;">${u.lastMatch || ''}</div></div>${u.uid !== window.onlineUser.uid ? `<button class="btn btn-sm btn-outline" onclick="addRival('${esc(u.uid)}', '${esc(u.name)}'); this.textContent='✓'; this.disabled=true;">+ Clásico</button>` : ''}</div>`).join('')}
    </div></div>`;
}
function getRivals() { try { return JSON.parse(localStorage.getItem('mfc_rivals') || '[]'); } catch(e) { return []; } }
function saveRivals(r) { try { localStorage.setItem('mfc_rivals', JSON.stringify(r)); } catch(e) {} }
function addRival(uid, name) {
  if (!uid || uid === window.onlineUser?.uid) return;
  const r = getRivals();
  if (!r.find(x => x.uid === uid)) { r.push({ uid, name, addedAt: Date.now() }); saveRivals(r); }
}
async function screenRivals() {
  const rivals = getRivals();
  $('#app').innerHTML = `<div id="app-inner" class="page-transition"><button class="top-back-btn" onclick="screenInicio()">← Volver</button>
    <div class="card card-gold center"><h2>⚔️ Clásicos</h2><p class="muted">Tus rivales favoritos guardados</p></div>
    <div class="card center" style="padding:40px;" id="rivals-content"><div class="spinner"></div></div>
  </div>`;
  if (!window.onlineUser) {
    document.getElementById('rivals-content').innerHTML = `<p class="mb">Necesitás iniciar sesión para tener clásicos guardados.</p><button class="btn btn-gold" onclick="playMenuMode('coop')">Ir a Pro Clubs</button>`;
    return;
  }
  if (!rivals.length) {
    document.getElementById('rivals-content').innerHTML = `<p class="dim">Todavía no tenés clásicos guardados.<br>Desde el Ranking podés agregar rivales.</p>`;
    return;
  }
  const data = await window.FirebaseSocial.getRivals(rivals.map(r => r.uid));
  document.getElementById('rivals-content').innerHTML = `<h3>Clásicos guardados (${data.length})</h3>${data.length === 0 ? '<p class="dim">Ningún rival disponible.</p>' : data.map(u => `<div class="stat-row"><div><div style="font-weight:800;">${u.name}</div><div class="dim">🪙 ${(u.coins||0).toLocaleString()} · ${u.barrioName || ''}</div></div><button class="btn btn-sm btn-red" onclick="removeRival('${u.uid}');screenRivals()">Quitar</button></div>`).join('')}`;
}
function removeRival(uid) { saveRivals(getRivals().filter(r => r.uid !== uid)); }

if (localStorage.getItem('proClubs_v1')) loadPC();

screenInicio();
</script>
